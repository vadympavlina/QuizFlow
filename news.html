<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%232d5be3'/><stop offset='1' stop-color='%231a3ab8'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><rect x='7' y='9' width='12' height='2.5' rx='1.25' fill='white'/><rect x='7' y='14.75' width='18' height='2.5' rx='1.25' fill='white'/><rect x='7' y='20.5' width='9' height='2.5' rx='1.25' fill='white'/><circle cx='24' cy='22' r='5' fill='none' stroke='white' stroke-width='2.2'/><line x1='27.5' y1='25.5' x2='29.5' y2='27.5' stroke='white' stroke-width='2.2' stroke-linecap='round'/></svg>">
<title>QuizFlow — Новини</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=22">
<link rel="modulepreload" href="shared/app.js?v=22">
<link rel="modulepreload" href="shared/features.js?v=30">

<style>
#sec-news{
  --ink-900:#0B1437; --ink-700:#24335A; --ink-500:#5B6A8F; --ink-400:#8691AC; --ink-300:#A8B2C9;
  --line:#E3E8F2; --line-strong:#CDD6E8; --nav-600:#1E3A8A; --nav-accent:#3B82F6;
  font-family:"Manrope",system-ui,sans-serif; -webkit-font-smoothing:antialiased; color:var(--ink-900);
}
/* Шапка */
#sec-news .nw-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}
#sec-news .nw-head h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
#sec-news .nw-head p{margin:4px 0 0;color:var(--ink-500);font-size:13.5px}
#sec-news .nw-head p b{color:var(--nav-accent);font-weight:700}
#sec-news .nw-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;font-weight:700;color:var(--ink-700);cursor:pointer;white-space:nowrap}
#sec-news .nw-btn:hover{border-color:var(--line-strong);color:var(--ink-900)}
#sec-news .nw-btn[hidden]{display:none}

/* Дві панелі: список | читання */
#sec-news .nw-wrap{display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:18px;align-items:start}
#sec-news .nw-side{position:sticky;top:16px;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;max-height:calc(100vh - 32px)}
#sec-news .nw-side-h{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
#sec-news .nw-row1{display:flex;gap:8px;align-items:center}
#sec-news .nw-tabs{display:inline-flex;background:#F4F6FB;border-radius:10px;padding:3px;gap:2px;flex:0 0 auto}
#sec-news .nw-tabs button{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-500);padding:6px 10px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
#sec-news .nw-tabs button.on{background:#fff;color:var(--ink-900);box-shadow:0 1px 3px rgba(11,20,55,.1)}
#sec-news .nw-tabs b{font-family:"Geist Mono",monospace;font-size:10.5px;background:var(--nav-accent);color:#fff;padding:0 6px;border-radius:999px}
#sec-news .nw-tabs b:empty{display:none}
#sec-news .nw-search{flex:1;min-width:0;position:relative;display:flex;align-items:center}
#sec-news .nw-search svg{position:absolute;left:10px;color:var(--ink-400)}
#sec-news .nw-search input{width:100%;height:34px;box-sizing:border-box;padding:0 10px 0 30px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13px;background:#fff;outline:none;color:var(--ink-900)}
#sec-news .nw-search input:focus{border-color:var(--nav-accent);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
#sec-news .nw-cats{display:flex;gap:6px;flex-wrap:wrap}
#sec-news .nw-cats[hidden]{display:none}
#sec-news .nw-cf{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-size:11.5px;font-weight:700;color:var(--ink-700);cursor:pointer}
#sec-news .nw-cf i{width:7px;height:7px;border-radius:50%;background:var(--c)}
#sec-news .nw-cf small{font-family:"Geist Mono",monospace;font-size:10.5px;color:var(--ink-400)}
#sec-news .nw-cf:hover{border-color:var(--line-strong)}
#sec-news .nw-cf.on{background:var(--cb);border-color:var(--c);color:var(--c)}
#sec-news .nw-cf.on small{color:inherit}
#sec-news .nw-list{overflow-y:auto;padding:6px;flex:1;min-height:120px}
#sec-news .nw-li{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;font:inherit;color:inherit;border:0;background:none;cursor:pointer;
  padding:11px 12px 11px 14px;border-radius:12px;position:relative;transition:background .12s}
#sec-news .nw-li + .nw-li{margin-top:2px}
#sec-news .nw-li::before{content:"";position:absolute;left:4px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--c,var(--line-strong));opacity:.35}
#sec-news .nw-li:hover{background:#F6F8FC}
#sec-news .nw-li.sel{background:#EEF3FF}
#sec-news .nw-li.sel::before{opacity:1}
#sec-news .nw-li:focus-visible{outline:2px solid var(--nav-accent);outline-offset:-2px}
#sec-news .nw-li-top{display:flex;align-items:center;gap:6px;font-size:11px}
#sec-news .nw-li-cat{font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--c,var(--ink-500));font-size:10.5px}
#sec-news .nw-li-pin{display:inline-grid;color:#B45309}
#sec-news .nw-li-d{margin-left:auto;font-family:"Geist Mono",monospace;color:var(--ink-400)}
#sec-news .nw-li-t{font-size:14px;font-weight:700;line-height:1.35;color:var(--ink-900);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#sec-news .nw-li.unread .nw-li-t{font-weight:800}
#sec-news .nw-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--nav-accent);margin:0 7px 2px 0;vertical-align:middle}
#sec-news .nw-li-x{font-size:12.5px;color:var(--ink-500);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#sec-news mark{background:#FEF08A;color:inherit;border-radius:3px;padding:0 1px}
#sec-news .nw-list-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:36px 16px;text-align:center;color:var(--ink-500);font-size:13px}
#sec-news .nw-list-empty .ei{width:44px;height:44px;border-radius:13px;background:#EEF2FB;color:var(--nav-600);display:grid;place-items:center}
#sec-news .nw-list-empty b{font-size:14px;color:var(--ink-900)}
#sec-news .nw-link{background:none;border:0;padding:0;font:inherit;color:var(--nav-accent);font-weight:700;cursor:pointer;text-decoration:underline}

/* Читання */
#sec-news .nw-reader{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:calc(100vh - 140px);position:relative;scroll-margin-top:16px;display:flex;flex-direction:column}
#sec-news .nw-reader::before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--c,var(--nav-accent)),color-mix(in srgb,var(--c,var(--nav-accent)) 40%,#fff))}
#sec-news .nw-art{padding:34px 48px 12px;max-width:820px;box-sizing:border-box}
#sec-news .nw-art-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#sec-news .nw-cat{display:inline-flex;align-items:center;gap:4px}
#sec-news .nw-art-d{font-size:12.5px;color:var(--ink-400);font-family:"Geist Mono",monospace}
#sec-news .nw-art-copy{margin-left:auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink-500);display:grid;place-items:center;cursor:pointer}
#sec-news .nw-art-copy:hover{border-color:var(--line-strong);color:var(--ink-900)}
#sec-news .nw-art-t{margin:16px 0 18px;font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
#sec-news .nw-art-body{font-size:16px;line-height:1.75}
#sec-news .nw-art-body p{margin:0 0 14px}
#sec-news .nw-art-nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:18px 48px 30px;max-width:820px;margin-top:auto;box-sizing:border-box;width:100%}
#sec-news .nw-step{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#FAFBFE;font:inherit;cursor:pointer;min-width:0}
#sec-news .nw-step:hover{border-color:var(--line-strong);background:#fff}
#sec-news .nw-step.next{text-align:right;grid-column:2}
#sec-news .nw-step small{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-400)}
#sec-news .nw-step.next small{justify-content:flex-end}
#sec-news .nw-step span{font-size:13.5px;font-weight:700;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sec-news .nw-blank{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:380px;padding:24px;color:var(--ink-500);font-size:13.5px}
#sec-news .nw-blank .ei{width:56px;height:56px;border-radius:15px;background:#EEF2FB;color:var(--nav-600);display:grid;place-items:center;margin-bottom:6px}
#sec-news .nw-blank b{font-size:17px;color:var(--ink-900)}
#sec-news .nw-blank span:last-child{max-width:380px;line-height:1.55}
#sec-news .nw-wrap.empty{grid-template-columns:1fr}
#sec-news .nw-wrap.empty .nw-side{display:none}
@media (max-width:1100px){#sec-news .nw-art{padding:26px 28px 8px}#sec-news .nw-art-nav{padding:14px 28px 24px}}
</style>
</head>
<body>

<!-- MOBILE OVERLAY -->
<div id="mobile-overlay" style="display:none;position:fixed;inset:0;background:linear-gradient(160deg,#1a2b5e 0%,#0d1340 100%);z-index:9999;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:40px 24px">
  <div style="width:80px;height:80px;background:linear-gradient(135deg,#2d5be3,#4d78ff);border-radius:22px;display:flex;align-items:center;justify-content:center;margin-bottom:28px;box-shadow:0 20px 50px rgba(45,91,227,.4)">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="3"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="17" x2="12" y2="17"/></svg>
  </div>
  <div style="font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;margin-bottom:12px;max-width:320px;line-height:1.3">Мобільна версія недоступна</div>
  <div style="font-size:15px;opacity:.75;max-width:340px;line-height:1.5;margin-bottom:28px">Панель викладача оптимізована для планшетів та комп'ютерів. Відкрийте з ширшого екрану</div>
  <div style="display:inline-flex;gap:8px;background:rgba(255,255,255,.08);padding:10px 18px;border-radius:14px;backdrop-filter:blur(10px);font-size:13px;opacity:.65">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    Мінімальна ширина: 1024px
  </div>
</div>

<!-- Initial loader -->
<div id="app-loader" style="position:fixed;inset:0;background:#f0f3fa;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .25s ease">
  <div style="width:44px;height:44px;border:3.5px solid rgba(45,91,227,.15);border-top-color:#2d5be3;border-radius:50%;animation:appSpin .8s linear infinite"></div>
  <div style="font-size:13px;color:#6b7280;margin-top:12px;font-family:'Manrope',sans-serif">Завантаження...</div>
</div>
<style>@keyframes appSpin{to{transform:rotate(360deg)}}</style>

<script src="shared/nav.js?v=17"></script>
<main class="main">

  <div class="sec on" id="sec-news">
    <div class="nw-head">
      <div>
        <h1>Новини QuizFlow</h1>
        <p id="nw-sub">Оновлення платформи, нові функції та поради</p>
      </div>
      <button type="button" class="nw-btn" id="nw-mark-all" onclick="markAllNewsRead()" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Прочитати всі
      </button>
    </div>

    <div class="nw-wrap" id="nw-wrap">
      <aside class="nw-side">
        <div class="nw-side-h">
          <div class="nw-row1">
            <div class="nw-tabs" id="nw-filter" role="tablist">
              <button type="button" data-f="all" class="on" role="tab">Усі</button>
              <button type="button" data-f="unread" role="tab">Нові <b id="nw-f-unread"></b></button>
            </div>
            <label class="nw-search">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input type="search" id="nw-q" placeholder="Пошук…" autocomplete="off" aria-label="Пошук у новинах">
            </label>
          </div>
          <div class="nw-cats" id="nw-cats" hidden></div>
        </div>
        <div class="nw-list" id="news-teacher-list"></div>
      </aside>
      <section class="nw-reader" id="nw-reader" aria-live="polite">
        <div class="nw-blank"><b>Завантаження…</b></div>
      </section>
    </div>
  </div>

</main>

<div id="modals-root"></div>

<script type="module">
const { initApp } = await import("./shared/app.js?v=22");
const featuresP = import("./shared/features.js?v=30");

window.showSec = function(name){
  if (name === "news") {
    document.querySelectorAll(".sec").forEach(s=>s.classList.remove("on"));
    document.getElementById("sec-news")?.classList.add("on");
    return;
  }
  const sec = document.getElementById("sec-"+name);
  if (sec) {
    document.querySelectorAll(".sec").forEach(s=>s.classList.remove("on"));
    sec.classList.add("on");
    return;
  }
  const pageMap = {
      dashboard:"./", tests:"tests", attempts:"attempts",
      links:"links", analytics:"analytics", gradebook:"gradebook",
      students:"students", notifications:"notifications",
      suspicious:"suspicious", online:"online", news:"news"
    };
  if (pageMap[name]) location.href = pageMap[name];
};

await initApp("news");
await featuresP;
await window.initFeatures();

if (window.renderAll) window.renderAll();
if (window.renderNews) try { window.renderNews(); } catch {}

requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    if (window.appReady) window.appReady();
  });
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    document.querySelectorAll(".mo.on").forEach(m => {
      m.classList.remove("on");
      setTimeout(()=>{ if(!m.classList.contains("on")) m.style.display="none"; }, 200);
    });
  }
});
</script>
</body>
</html>
