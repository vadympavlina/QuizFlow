<!DOCTYPE html>

<head>

<title>QuizFlow — Новини</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>

<style>
#sec-news{
  --ink-900:#0B1437; --ink-700:#24335A; --ink-500:#5B6A8F; --ink-400:#8691AC; --ink-300:#A8B2C9;
  --line:#E3E8F2; --line-strong:#CDD6E8; --nav-600:#1E3A8A; --nav-accent:#3B82F6;
  font-family:"Manrope",system-ui,sans-serif; -webkit-font-smoothing:antialiased; color:var(--ink-900);
}
/* Шапка */
#sec-news .nw-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}
#sec-news .nw-head h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
#sec-news .nw-head p{margin:4px 0 0;color:var(--ink-500);font-size:13.5px}
#sec-news .nw-head p b{color:var(--nav-accent);font-weight:700}
#sec-news .nw-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;font-weight:700;color:var(--ink-700);cursor:pointer;white-space:nowrap}
#sec-news .nw-btn:hover{border-color:var(--line-strong);color:var(--ink-900)}
#sec-news .nw-btn[hidden]{display:none}

/* Стрічка оновлень: дати зліва, картки на лінії, бокова панель праворуч */
#sec-news .nwa-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:32px;align-items:start}
#sec-news .nwa-feed{display:flex;flex-direction:column;min-width:0}
#sec-news .nwa-item{display:grid;grid-template-columns:78px minmax(0,1fr);gap:26px;position:relative;padding-bottom:22px}
#sec-news .nwa-item::before{content:"";position:absolute;left:90px;top:14px;bottom:-4px;width:2px;background:var(--line)}
#sec-news .nwa-item:last-child::before{display:none}
#sec-news .nwa-date{text-align:right;padding-top:14px}
#sec-news .nwa-date b{display:block;font-size:24px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#sec-news .nwa-date span{display:block;margin-top:4px;font-size:11.5px;color:var(--ink-400);font-family:"Geist Mono",monospace;text-transform:lowercase}
#sec-news .nwa-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 26px 18px;transition:box-shadow .3s,border-color .3s}
#sec-news .nwa-card::before{content:"";position:absolute;left:-22px;top:15px;width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid var(--c,var(--nav-600))}
#sec-news .nwa-card.fresh{border-color:#BFD3FF}
#sec-news .nwa-card.focus{box-shadow:0 0 0 3px rgba(59,130,246,.35)}
#sec-news .nwa-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#sec-news .nw-cat{display:inline-flex;align-items:center;gap:4px}
#sec-news .nwa-new{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--nav-accent);margin-left:2px}
#sec-news .nwa-new::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--nav-accent);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
#sec-news .nwa-rt{margin-left:auto;font-size:12px;color:var(--ink-400);font-family:"Geist Mono",monospace}
#sec-news .nwa-copy{width:30px;height:30px;border-radius:9px;border:1px solid transparent;background:none;color:var(--ink-400);display:grid;place-items:center;cursor:pointer;transition:all .15s}
#sec-news .nwa-copy:hover{border-color:var(--line);color:var(--ink-900);background:#F6F8FC}
#sec-news .nwa-t{margin:10px 0 10px;font-size:21px;font-weight:800;letter-spacing:-.015em;line-height:1.3;text-wrap:balance}
#sec-news .nwa-body{font-size:15.5px;line-height:1.75;color:var(--ink-700);max-width:920px}
#sec-news .nwa-t{max-width:920px}
#sec-news .nwa-body > :last-child{margin-bottom:0}
#sec-news .nwa-card.long:not(.open) .nwa-body{max-height:230px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
#sec-news .nwa-more{margin-top:10px;display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0;font:inherit;font-size:13.5px;font-weight:800;color:var(--nav-accent);cursor:pointer}
#sec-news .nwa-more[hidden]{display:none}
#sec-news .nwa-more .c{display:none}
#sec-news .nwa-card.open .nwa-more .o{display:none}
#sec-news .nwa-card.open .nwa-more .c{display:inline}
#sec-news .nwa-card.open .nwa-more svg{transform:rotate(180deg)}
#sec-news mark{background:#FEF08A;color:inherit;border-radius:3px;padding:0 1px}
#sec-news .nwa-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:60px 20px;text-align:center;color:var(--ink-500);font-size:13.5px;background:#fff;border:1px dashed var(--line-strong);border-radius:18px}
#sec-news .nwa-empty .ei{width:52px;height:52px;border-radius:15px;background:#EEF2FB;color:var(--nav-600);display:grid;place-items:center;margin-bottom:4px}
#sec-news .nwa-empty b{font-size:16px;color:var(--ink-900)}
#sec-news .nwa-empty span:last-child{max-width:380px;line-height:1.55}
#sec-news .nw-link{background:none;border:0;padding:0;font:inherit;color:var(--nav-accent);font-weight:700;cursor:pointer;text-decoration:underline}

/* Бокова панель */
#sec-news .nwa-side{position:sticky;top:16px;display:flex;flex-direction:column;gap:12px}
#sec-news .nw-search{position:relative;display:flex;align-items:center}
#sec-news .nw-search svg{position:absolute;left:12px;color:var(--ink-400)}
#sec-news .nw-search input{width:100%;height:40px;box-sizing:border-box;padding:0 12px 0 34px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:13.5px;background:#fff;outline:none;color:var(--ink-900)}
#sec-news .nw-search input:focus{border-color:var(--nav-accent);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
#sec-news .nwa-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
#sec-news .nwa-box h4{margin:2px 6px 8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400)}
#sec-news .nwa-row{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;font:inherit;font-size:13.5px;font-weight:700;color:var(--ink-700);padding:8px 8px;border-radius:9px;cursor:pointer;text-align:left}
#sec-news .nwa-row span{display:flex;align-items:center;gap:9px}
#sec-news .nwa-row i{width:8px;height:8px;border-radius:50%}
#sec-news .nwa-row em{font-style:normal;font-family:"Geist Mono",monospace;font-size:12px;color:var(--ink-400)}
#sec-news .nwa-row:hover{background:#F6F8FC}
#sec-news .nwa-row.on{background:#EEF3FF;color:var(--nav-600)}
#sec-news .nwa-row.on em{color:var(--nav-600)}
#sec-news .nwa-sep{height:1px;background:var(--line);margin:6px 4px}
@media (max-width:1100px){#sec-news .nwa-grid{grid-template-columns:1fr}#sec-news .nwa-side{position:static;order:-1}}
</style>
</head>
<body>

<!-- MOBILE OVERLAY -->
<div id="mobile-overlay" style="display:none;position:fixed;inset:0;background:linear-gradient(160deg,#1a2b5e 0%,#0d1340 100%);z-index:9999;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:40px 24px">
  <div style="width:80px;height:80px;background:linear-gradient(135deg,#2d5be3,#4d78ff);border-radius:22px;display:flex;align-items:center;justify-content:center;margin-bottom:28px;box-shadow:0 20px 50px rgba(45,91,227,.4)">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="3"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="17" x2="12" y2="17"/></svg>
  </div>
  <div style="font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;margin-bottom:12px;max-width:320px;line-height:1.3">Мобільна версія недоступна</div>
  <div style="font-size:15px;opacity:.75;max-width:340px;line-height:1.5;margin-bottom:28px">Панель викладача оптимізована для планшетів та комп'ютерів. Відкрийте з ширшого екрану</div>
  <div style="display:inline-flex;gap:8px;background:rgba(255,255,255,.08);padding:10px 18px;border-radius:14px;backdrop-filter:blur(10px);font-size:13px;opacity:.65">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    Мінімальна ширина: 1024px
  </div>
</div>

<!-- Initial loader -->
<div id="app-loader" style="position:fixed;inset:0;background:#f0f3fa;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .25s ease">
  <div style="width:44px;height:44px;border:3.5px solid rgba(45,91,227,.15);border-top-color:#2d5be3;border-radius:50%;animation:appSpin .8s linear infinite"></div>
  <div style="font-size:13px;color:#6b7280;margin-top:12px;font-family:'Manrope',sans-serif">Завантаження...</div>
</div>
<style>@keyframes appSpin{to{transform:rotate(360deg)}}</style>

<script src="shared/nav.js?v=18"></script>
<main class="main">

  <div class="sec on" id="sec-news">
    <div class="nw-head">
      <div>
        <h1>Що нового в QuizFlow</h1>
        <p id="nw-sub">Оновлення платформи, нові функції та поради</p>
      </div>
      <button type="button" class="nw-btn" id="nw-mark-all" onclick="markAllNewsRead()" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Прочитати всі
      </button>
    </div>

    <div class="nwa-grid">
      <div class="nwa-feed" id="news-teacher-list" aria-live="polite">
        <div class="nwa-empty"><b>Завантаження…</b></div>
      </div>
      <aside class="nwa-side" id="nw-side">
        <label class="nw-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="nw-q" placeholder="Пошук у новинах" autocomplete="off" aria-label="Пошук у новинах">
        </label>
        <div class="nwa-box">
          <h4>Показати</h4>
          <div id="nw-cats"></div>
        </div>
      </aside>
    </div>
  </div>

</main>

<div id="modals-root"></div>

<script type="module">
const { initApp } = await import("./shared/app.js?v=31");
const featuresP = import("./shared/features.js?v=38");

window.showSec = function(name){
  if (name === "news") {
    document.querySelectorAll(".sec").forEach(s=>s.classList.remove("on"));
    document.getElementById("sec-news")?.classList.add("on");
    return;
  }
  const sec = document.getElementById("sec-"+name);
  if (sec) {
    document.querySelectorAll(".sec").forEach(s=>s.classList.remove("on"));
    sec.classList.add("on");
    return;
  }
  const pageMap = {
      dashboard:"./", tests:"tests", attempts:"attempts",
      links:"links", analytics:"analytics", gradebook:"gradebook",
      students:"students", notifications:"notifications",
      suspicious:"suspicious", online:"online", news:"news"
    };
  if (pageMap[name]) location.href = pageMap[name];
};

await initApp("news");
await featuresP;
await window.initFeatures();

if (window.renderAll) window.renderAll();
if (window.renderNews) try { window.renderNews(); } catch {}

requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    if (window.appReady) window.appReady();
  });
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    document.querySelectorAll(".mo.on").forEach(m => {
      m.classList.remove("on");
      setTimeout(()=>{ if(!m.classList.contains("on")) m.style.display="none"; }, 200);
    });
  }
});
</script>
</body>
</html>
