<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%232d5be3'/><stop offset='1' stop-color='%231a3ab8'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><rect x='7' y='9' width='12' height='2.5' rx='1.25' fill='white'/><rect x='7' y='14.75' width='18' height='2.5' rx='1.25' fill='white'/><rect x='7' y='20.5' width='9' height='2.5' rx='1.25' fill='white'/><circle cx='24' cy='22' r='5' fill='none' stroke='white' stroke-width='2.2'/><line x1='27.5' y1='25.5' x2='29.5' y2='27.5' stroke='white' stroke-width='2.2' stroke-linecap='round'/></svg>">
<title>QuizFlow — Новини</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css?v=22">
<link rel="modulepreload" href="shared/app.js?v=22">
<link rel="modulepreload" href="shared/features.js?v=29">

<style>
#sec-news{
  --ink-900:#0B1437; --ink-700:#24335A; --ink-500:#5B6A8F; --ink-400:#8691AC; --ink-300:#A8B2C9;
  --line:#E3E8F2; --line-strong:#CDD6E8; --nav-600:#1E3A8A; --nav-accent:#3B82F6;
  font-family:"Manrope",system-ui,sans-serif; -webkit-font-smoothing:antialiased; color:var(--ink-900);
  max-width:980px;
}
/* Шапка */
#sec-news .nw-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}
#sec-news .nw-head h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
#sec-news .nw-head p{margin:4px 0 0;color:var(--ink-500);font-size:13.5px}
#sec-news .nw-head p b{color:var(--nav-accent);font-weight:700}
#sec-news .nw-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;font-weight:700;color:var(--ink-700);cursor:pointer;white-space:nowrap}
#sec-news .nw-btn:hover{border-color:var(--line-strong);color:var(--ink-900)}
#sec-news .nw-btn[hidden]{display:none}

/* Панель: вкладки, категорії, пошук */
#sec-news .nw-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
#sec-news .nw-tabs{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
#sec-news .nw-tabs button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:700;color:var(--ink-500);padding:6px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
#sec-news .nw-tabs button:hover:not(.on){color:var(--ink-900)}
#sec-news .nw-tabs button.on{background:var(--nav-600);color:#fff}
#sec-news .nw-tabs b{font-family:"Geist Mono",monospace;font-size:11px;background:#DBEAFE;color:#1E40AF;padding:0 6px;border-radius:999px}
#sec-news .nw-tabs button.on b{background:#fff;color:var(--nav-600)}
#sec-news .nw-tabs b:empty{display:none}
#sec-news .nw-cats{display:flex;gap:6px;flex-wrap:wrap}
#sec-news .nw-cf{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-700);cursor:pointer}
#sec-news .nw-cf i{width:8px;height:8px;border-radius:50%;background:var(--c)}
#sec-news .nw-cf small{font-family:"Geist Mono",monospace;font-size:11px;color:var(--ink-400)}
#sec-news .nw-cf:hover{border-color:var(--line-strong)}
#sec-news .nw-cf.on{background:var(--cb);border-color:var(--c);color:var(--c)}
#sec-news .nw-cf.on small{color:inherit}
#sec-news .nw-search{margin-left:auto;width:240px;position:relative;display:flex;align-items:center}
#sec-news .nw-search svg{position:absolute;left:11px;color:var(--ink-400)}
#sec-news .nw-search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:13px;background:#fff;outline:none;color:var(--ink-900)}
#sec-news .nw-search input:focus{border-color:var(--nav-accent);box-shadow:0 0 0 3px rgba(59,130,246,.12)}

/* Закріплена — компактний банер з акцентом категорії */
#sec-news .nw-pin{display:flex;gap:18px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  padding:20px 22px;margin-bottom:22px;border-radius:16px;border:1px solid var(--line);background:#fff;position:relative;overflow:hidden;
  transition:box-shadow .15s,border-color .15s}
#sec-news .nw-pin::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c,var(--nav-accent))}
#sec-news .nw-pin::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--cb,#DBEAFE);opacity:.55;pointer-events:none}
#sec-news .nw-pin:hover{border-color:var(--line-strong);box-shadow:0 10px 28px -14px rgba(11,20,55,.2)}
#sec-news .nw-pin-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:var(--cb,#DBEAFE);color:var(--c,var(--nav-accent));position:relative;z-index:1}
#sec-news .nw-pin-b{flex:1;min-width:0;position:relative;z-index:1}
#sec-news .nw-pin-t{font-size:19px;font-weight:800;letter-spacing:-.015em;line-height:1.3;margin:6px 0 6px}
#sec-news .nw-pin-x{font-size:14px;line-height:1.6;color:var(--ink-700);margin:0}
#sec-news .nw-pin-go{position:relative;z-index:1;align-self:center;font-size:13px;font-weight:800;color:var(--nav-600);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}

/* Мітки */
#sec-news .nw-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-400)}
#sec-news .nw-meta .d{font-family:"Geist Mono",monospace}
#sec-news .nw-pinmark{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#92400E;background:#FEF3C7;padding:3px 8px;border-radius:999px}
#sec-news .nw-new{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--nav-accent)}
#sec-news .nw-new::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--nav-accent);box-shadow:0 0 0 3px rgba(59,130,246,.15)}

/* Список по місяцях */
#sec-news .nw-month{display:flex;align-items:center;gap:10px;margin:22px 0 8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400)}
#sec-news .nw-month:first-child{margin-top:0}
#sec-news .nw-month::after{content:"";flex:1;height:1px;background:var(--line)}
#sec-news .nw-group{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
#sec-news .nw-row{display:grid;grid-template-columns:4px 1fr auto;gap:16px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;
  border:0;border-bottom:1px solid var(--line);background:#fff;padding:14px 18px 14px 0;cursor:pointer;transition:background .12s}
#sec-news .nw-row:last-child{border-bottom:0}
#sec-news .nw-row:hover{background:#FAFBFE}
#sec-news .nw-row .bar{align-self:stretch;background:var(--c,var(--line));border-radius:0 3px 3px 0;opacity:.85}
#sec-news .nw-row .b{min-width:0;display:flex;flex-direction:column;gap:4px}
#sec-news .nw-row .t{font-size:15px;font-weight:700;letter-spacing:-.005em;line-height:1.35;color:var(--ink-900)}
#sec-news .nw-row.unread .t{font-weight:800}
#sec-news .nw-row .x{font-size:13px;color:var(--ink-500);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sec-news .nw-row .go{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink-400);transition:all .15s}
#sec-news .nw-row:hover .go{background:var(--nav-600);color:#fff}
#sec-news .nw-row:focus-visible,#sec-news .nw-pin:focus-visible{outline:2px solid var(--nav-accent);outline-offset:-2px}
#sec-news mark{background:#FEF08A;color:inherit;border-radius:3px;padding:0 1px}

/* Порожні стани */
#sec-news .nw-empty{background:#fff;border:1px dashed var(--line-strong);border-radius:16px;padding:56px 24px;text-align:center;color:var(--ink-500)}
#sec-news .nw-empty .ei{width:56px;height:56px;margin:0 auto 14px;border-radius:15px;background:#EEF2FB;display:grid;place-items:center;color:var(--nav-600)}
#sec-news .nw-empty .et{font-size:16px;font-weight:800;color:var(--ink-900);margin-bottom:6px}
#sec-news .nw-empty .es{font-size:13.5px;max-width:380px;margin:0 auto;line-height:1.5}
#sec-news .nw-link{background:none;border:0;padding:0;font:inherit;color:var(--nav-accent);font-weight:700;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>

<!-- MOBILE OVERLAY -->
<div id="mobile-overlay" style="display:none;position:fixed;inset:0;background:linear-gradient(160deg,#1a2b5e 0%,#0d1340 100%);z-index:9999;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:40px 24px">
  <div style="width:80px;height:80px;background:linear-gradient(135deg,#2d5be3,#4d78ff);border-radius:22px;display:flex;align-items:center;justify-content:center;margin-bottom:28px;box-shadow:0 20px 50px rgba(45,91,227,.4)">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="3"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="17" x2="12" y2="17"/></svg>
  </div>
  <div style="font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;margin-bottom:12px;max-width:320px;line-height:1.3">Мобільна версія недоступна</div>
  <div style="font-size:15px;opacity:.75;max-width:340px;line-height:1.5;margin-bottom:28px">Панель викладача оптимізована для планшетів та комп'ютерів. Відкрийте з ширшого екрану</div>
  <div style="display:inline-flex;gap:8px;background:rgba(255,255,255,.08);padding:10px 18px;border-radius:14px;backdrop-filter:blur(10px);font-size:13px;opacity:.65">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    Мінімальна ширина: 1024px
  </div>
</div>

<!-- Initial loader -->
<div id="app-loader" style="position:fixed;inset:0;background:#f0f3fa;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .25s ease">
  <div style="width:44px;height:44px;border:3.5px solid rgba(45,91,227,.15);border-top-color:#2d5be3;border-radius:50%;animation:appSpin .8s linear infinite"></div>
  <div style="font-size:13px;color:#6b7280;margin-top:12px;font-family:'Manrope',sans-serif">Завантаження...</div>
</div>
<style>@keyframes appSpin{to{transform:rotate(360deg)}}</style>

<script src="shared/nav.js?v=17"></script>
<main class="main">

  <div class="sec on" id="sec-news">
    <div class="nw-head">
      <div>
        <h1>Новини QuizFlow</h1>
        <p id="nw-sub">Оновлення платформи, нові функції та поради</p>
      </div>
      <button type="button" class="nw-btn" id="nw-mark-all" onclick="markAllNewsRead()" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Прочитати всі
      </button>
    </div>

    <div class="nw-toolbar">
      <div class="nw-tabs" id="nw-filter" role="tablist">
        <button type="button" data-f="all" class="on" role="tab">Усі</button>
        <button type="button" data-f="unread" role="tab">Непрочитані <b id="nw-f-unread"></b></button>
      </div>
      <div class="nw-cats" id="nw-cats"></div>
      <label class="nw-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="nw-q" placeholder="Пошук у новинах…" autocomplete="off" aria-label="Пошук у новинах">
      </label>
    </div>

    <div id="news-teacher-list">
      <div class="nw-empty"><div class="et">Завантаження…</div></div>
    </div>
  </div>

</main>

<div id="modals-root"></div>

<script type="module">
const { initApp } = await import("./shared/app.js?v=22");
const featuresP = import("./shared/features.js?v=29");

window.showSec = function(name){
  if (name === "news") {
    document.querySelectorAll(".sec").forEach(s=>s.classList.remove("on"));
    document.getElementById("sec-news")?.classList.add("on");
    return;
  }
  const sec = document.getElementById("sec-"+name);
  if (sec) {
    document.querySelectorAll(".sec").forEach(s=>s.classList.remove("on"));
    sec.classList.add("on");
    return;
  }
  const pageMap = {
      dashboard:"./", tests:"tests", attempts:"attempts",
      links:"links", analytics:"analytics", gradebook:"gradebook",
      students:"students", notifications:"notifications",
      suspicious:"suspicious", online:"online", news:"news"
    };
  if (pageMap[name]) location.href = pageMap[name];
};

await initApp("news");
await featuresP;
await window.initFeatures();

if (window.renderAll) window.renderAll();
if (window.renderNews) try { window.renderNews(); } catch {}

requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    if (window.appReady) window.appReady();
  });
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    document.querySelectorAll(".mo.on").forEach(m => {
      m.classList.remove("on");
      setTimeout(()=>{ if(!m.classList.contains("on")) m.style.display="none"; }, 200);
    });
  }
});
</script>
</body>
</html>
