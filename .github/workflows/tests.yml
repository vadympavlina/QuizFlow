name: Tests

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tests

jobs:
  e2e:
    name: Інтерфейс (Playwright + мок бази)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - name: Воркер пошти (юніт-тести)
        run: npm run worker
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Знімки впалих тестів
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/test-results
          retention-days: 7

  rules:
    name: Правила бази (емулятор Firebase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npm run rules
