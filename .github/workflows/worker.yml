name: Deploy Worker

# Після злиття змін воркера в main: юніт-тести → деплой зібраного worker/dist/worker.js у Cloudflare.
# Потрібні секрети репозиторію CLOUDFLARE_API_TOKEN (шаблон «Edit Cloudflare Workers») і CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [ main ]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Тести й деплой воркера
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Юніт-тести воркера
        working-directory: tests
        run: |
          npm ci
          npm run worker
      - name: Зібраний воркер відповідає worker/src
        working-directory: tests
        run: |
          npm run worker:bundle
          git diff --exit-code ../worker/dist/worker.js
      - name: Деплой у Cloudflare
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.20.0 deploy dist/worker.js --no-bundle 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Перевірка, що воркер відповідає
        if: steps.deploy.outputs.url != ''
        run: |
          sleep 5
          curl -fsS "${{ steps.deploy.outputs.url }}/" | tee /dev/stderr | grep -q '"ok":true'
