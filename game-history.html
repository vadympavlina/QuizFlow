<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%232d5be3'/><stop offset='1' stop-color='%231a3ab8'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><rect x='7' y='9' width='12' height='2.5' rx='1.25' fill='white'/><rect x='7' y='14.75' width='18' height='2.5' rx='1.25' fill='white'/><rect x='7' y='20.5' width='9' height='2.5' rx='1.25' fill='white'/></svg>">
<title>QuizFlow — Історія ігор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<link rel="modulepreload" href="shared/app.js?v=15">
<link rel="preload" as="fetch" href="shared/layout.html?v=15" crossorigin>
<link rel="modulepreload" href="shared/features.js?v=15">
<style>
:root{
  --ink-900:#111827;--ink-700:#374151;--ink-500:#6B7280;--ink-300:#D1D5DB;
  --line:#E5E7EB;--surface:#F9FAFB;--white:#fff;
  --accent:#2563EB;--accent-pale:#EFF6FF;
}
#sec-history{font-family:'Manrope',system-ui,sans-serif;color:var(--ink-900)}
#sec-history.on{display:flex;flex-direction:column;gap:24px}

/* Header */
#sec-history .page-title h1{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:0}
#sec-history .page-title p{margin:3px 0 0;color:var(--ink-500);font-size:13.5px}

/* Stats strip — горизонтальна смужка замість 4 карток */
#sec-history .stats-strip{
  display:flex;gap:0;background:var(--white);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;
}
#sec-history .ssl{
  flex:1;padding:16px 20px;display:flex;align-items:center;gap:12px;
  border-right:1px solid var(--line);
}
#sec-history .ssl:last-child{border-right:0}
#sec-history .ssl .ico{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  flex:0 0 auto;color:var(--ink-500);background:var(--surface);
  border:1px solid var(--line);
}
#sec-history .ssl .v{
  font-family:"Geist Mono",monospace;font-size:20px;font-weight:700;
  letter-spacing:-.02em;line-height:1;color:var(--ink-900)
}
#sec-history .ssl .l{font-size:11px;color:var(--ink-500);font-weight:600;margin-top:2px;letter-spacing:.02em}

/* Filter bar */
#sec-history .filter-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
#sec-history .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
#sec-history .seg button{
  background:transparent;border:0;padding:6px 14px;border-radius:7px;
  font:inherit;font-size:13px;font-weight:600;color:var(--ink-500);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:all .12s;
}
#sec-history .seg button.on{background:var(--white);color:var(--ink-900);box-shadow:0 1px 3px rgba(0,0,0,.06),0 0 0 1px var(--line)}
#sec-history .seg .ct{
  font-family:"Geist Mono",monospace;font-size:11px;background:#E0E7FF;color:#3730A3;
  padding:1px 6px;border-radius:999px;font-weight:700;
}
#sec-history .srch-wrap{position:relative;margin-left:auto;display:flex;align-items:center}
#sec-history .srch-wrap svg{position:absolute;left:10px;color:var(--ink-500);pointer-events:none}
#sec-history .srch-wrap input{
  padding:8px 12px 8px 32px;background:var(--white);border:1px solid var(--line);
  border-radius:9px;font-family:'Manrope',sans-serif;font-size:13px;color:var(--ink-900);
  outline:none;height:36px;width:240px;transition:border-color .12s;
}
#sec-history .srch-wrap input:focus{border-color:var(--accent)}

/* Game list */
#sec-history .games{display:flex;flex-direction:column;gap:12px}
#sec-history .game{
  background:var(--white);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;transition:box-shadow .15s;
}
#sec-history .game:hover{box-shadow:0 4px 16px rgba(0,0,0,.06)}

/* Game header bar */
#sec-history .game-top{
  display:grid;grid-template-columns:140px 1fr auto;gap:0;align-items:stretch;
}
#sec-history .thumb{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#fff;background:#1E3A8A;position:relative;overflow:hidden;gap:5px;
  padding:14px;min-height:100px;
}
#sec-history .thumb::before{
  content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:12px 12px;
}
#sec-history .thumb.b{background:#312E81}
#sec-history .thumb.g{background:#064E3B}
#sec-history .thumb.a{background:#7C2D12}
#sec-history .thumb.v{background:#5B21B6}
#sec-history .thumb .t-code{
  position:relative;z-index:1;font-family:"Geist Mono",monospace;
  font-size:10px;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:.18em;
}
#sec-history .thumb .t-name{
  position:relative;z-index:1;font-size:12px;font-weight:800;
  letter-spacing:-.01em;text-align:center;line-height:1.3;
}

/* Game body */
#sec-history .game-body{
  padding:14px 18px;display:flex;flex-direction:column;justify-content:center;gap:8px;
  border-left:1px solid var(--line);border-right:1px solid var(--line);
}
#sec-history .title-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#sec-history .title-line h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
#sec-history .pill{
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:4px;background:#D1FAE5;color:#065F46;flex-shrink:0;
}
#sec-history .gmeta{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-500);
  font-family:"Geist Mono",monospace;
}
#sec-history .gmeta .code{font-weight:600;color:var(--ink-700)}
#sec-history .gmeta .sep{color:var(--ink-300)}
#sec-history .game-kpis{display:flex;gap:18px}
#sec-history .kpi .v{font-family:"Geist Mono",monospace;font-weight:700;font-size:15px}
#sec-history .kpi .l{font-size:10px;color:var(--ink-500);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
#sec-history .game-actions{display:flex;gap:6px;margin-top:2px}
#sec-history .game-actions button{
  padding:5px 11px;font-size:12px;border-radius:7px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-700);font-family:'Manrope',sans-serif;
  font-weight:600;cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:5px;
}
#sec-history .game-actions button:hover{background:#F3F4F6;border-color:var(--ink-300)}
#sec-history .game-actions button.view-all{
  background:var(--accent-pale);color:var(--accent);border-color:#BFDBFE;
}
#sec-history .game-actions button.view-all:hover{background:#DBEAFE}
#sec-history .game-actions button.danger{background:#FEF2F2;color:#DC2626;border-color:#FECACA}
#sec-history .game-actions button.danger:hover{background:#FEE2E2}

/* Podium panel — права колонка */
#sec-history .game-podium{
  width:260px;padding:12px 14px;background:var(--surface);
  display:flex;flex-direction:column;gap:0;
}
#sec-history .pod-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;
}
#sec-history .pod-head span{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-500)}
#sec-history .pod-head strong{font-family:"Geist Mono",monospace;font-size:11px;color:var(--ink-500)}
#sec-history .pod-row{
  display:flex;align-items:center;gap:8px;padding:6px 0;
  border-bottom:1px solid var(--line);
}
#sec-history .pod-row:last-child{border-bottom:0}
#sec-history .pod-medal{width:20px;text-align:center;font-size:14px;flex-shrink:0}
#sec-history .pod-rank{
  font-family:"Geist Mono",monospace;font-weight:700;font-size:12px;
  color:var(--ink-500);width:20px;flex-shrink:0;
}
#sec-history .pod-name{flex:1;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-700)}
#sec-history .pod-pts{font-family:"Geist Mono",monospace;font-weight:700;font-size:12px;color:var(--accent);flex-shrink:0}

#sec-history .empty{text-align:center;padding:60px 20px;color:var(--ink-500)}
#sec-history .empty h3{font-size:16px;font-weight:700;color:var(--ink-900);margin:0 0 6px}
#sec-history .empty p{font-size:13px;margin:0}

/* ── Модалка результатів ── */
.res-overlay{
  position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:300;
  display:none;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(6px);
}
.res-overlay.show{display:flex}
.res-modal{
  background:var(--white);border-radius:18px;width:100%;max-width:520px;
  max-height:80vh;display:flex;flex-direction:column;
  box-shadow:0 24px 64px rgba(0,0,0,.18);overflow:hidden;
}
.res-modal-head{
  padding:18px 22px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-shrink:0;
}
.res-modal-head h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.res-modal-head p{margin:3px 0 0;font-size:12px;color:var(--ink-500)}
.res-modal-close{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;display:grid;place-items:center;
  font-size:18px;line-height:1;color:var(--ink-500);flex-shrink:0;
  font-family:sans-serif;transition:background .12s;
}
.res-modal-close:hover{background:#F3F4F6}
.res-modal-body{overflow-y:auto;padding:8px 0;flex:1}
.res-row{
  display:grid;grid-template-columns:38px 1fr auto;gap:10px;
  align-items:center;padding:9px 22px;
  border-bottom:1px solid var(--line);transition:background .1s;
}
.res-row:last-child{border-bottom:0}
.res-row:hover{background:var(--surface)}
.res-row.top1{background:#FFFBEB}.res-row.top1:hover{background:#FEF3C7}
.res-row.top2{background:#F9FAFB}.res-row.top3{background:#FFF7ED}
.res-rank{
  font-family:"Geist Mono",monospace;font-weight:700;font-size:13px;
  color:var(--ink-500);text-align:center;
}
.res-rank.gold{color:#D97706;font-size:16px}
.res-rank.silver{color:#6B7280;font-size:15px}
.res-rank.bronze{color:#92400E;font-size:15px}
.res-name{font-weight:600;font-size:13.5px;color:var(--ink-700)}
.res-pts{font-family:"Geist Mono",monospace;font-weight:700;font-size:13px;color:var(--accent)}

/* ── Модалка видалення ── */
.h-del-bg{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.h-del-bg.show{display:flex}
.h-del-modal{background:var(--white);border-radius:16px;padding:26px;max-width:340px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.15);text-align:center}
.h-del-modal h3{font-size:16px;font-weight:800;margin:0 0 8px;color:var(--ink-900)}
.h-del-modal p{font-size:13px;color:var(--ink-500);margin:0 0 18px;line-height:1.5}
.h-del-modal .d-btns{display:flex;gap:8px}
.h-del-modal .d-btn{flex:1;padding:10px;border-radius:9px;font-family:'Manrope',sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;border:none;transition:all .12s}
.h-del-modal .d-btn.cancel{background:var(--surface);color:var(--ink-500);border:1px solid var(--line)}
.h-del-modal .d-btn.cancel:hover{background:#F3F4F6}
.h-del-modal .d-btn.confirm{background:#DC2626;color:#fff}
.h-del-modal .d-btn.confirm:hover{background:#B91C1C}
</style>
</head>
<body>
<main class="main">
<div class="sec" id="sec-history">
  <div class="page-title">
    <div>
      <h1>Історія Live ігор</h1>
      <p id="history-sub">Завантаження...</p>
    </div>
  </div>

  <div class="stats-strip">
    <div class="ssl">
      <div class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/></svg></div>
      <div><div class="v" id="stat-total">—</div><div class="l">Усього ігор</div></div>
    </div>
    <div class="ssl">
      <div class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div><div class="v" id="stat-players">—</div><div class="l">Учасників всього</div></div>
    </div>
    <div class="ssl">
      <div class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 12 10 17 19 8"/></svg></div>
      <div><div class="v" id="stat-games">—</div><div class="l">Завершених ігор</div></div>
    </div>
    <div class="ssl">
      <div class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <div><div class="v" id="stat-last">—</div><div class="l">Остання гра</div></div>
    </div>
  </div>

  <div class="filter-bar">
    <div class="seg" id="tab-seg">
      <button class="on" data-tab="all">Усі <span class="ct" id="ct-all">0</span></button>
      <button data-tab="fin">З результатами <span class="ct" id="ct-fin">0</span></button>
    </div>
    <div class="srch-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search-inp" placeholder="Пошук по коду або назві…" oninput="filterGames()">
    </div>
  </div>

  <div class="games" id="games-list"></div>
</div>
</main>

<!-- Модалка: всі результати -->
<div class="res-overlay" id="res-overlay" onclick="if(event.target===this)closeResModal()">
  <div class="res-modal">
    <div class="res-modal-head">
      <div>
        <h3 id="res-title">Результати гри</h3>
        <p id="res-sub">— гравців</p>
      </div>
      <button class="res-modal-close" onclick="closeResModal()">×</button>
    </div>
    <div class="res-modal-body" id="res-body"></div>
  </div>
</div>

<!-- Модалка видалення -->
<div class="h-del-bg" id="del-bg">
  <div class="h-del-modal">
    <h3>Видалити гру?</h3>
    <p>Результати гри <b id="del-code-label"></b> будуть видалені назавжди.</p>
    <div class="d-btns">
      <button class="d-btn cancel" onclick="closeDelModal()">Скасувати</button>
      <button class="d-btn confirm" onclick="confirmDelete()">Видалити</button>
    </div>
  </div>
</div>

<script type="module">
import { getDatabase, ref, get, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const { initApp, appReady } = await import("./shared/app.js?v=15");
await initApp("history", { skipData: true });

const db = getDatabase();
const uid = window._user?.id || window._uid || "";

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function fmtDate(ts) {
  if (!ts) return "—";
  // Захист: якщо timestamp у секундах (< 10^11), переводимо в мс
  if (ts < 1e11) ts = ts * 1000;
  const d = new Date(ts);
  if (isNaN(d.getTime())) return "—";
  const now = new Date();
  const diff = (now - d) / 1000; // секунди
  const time = d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});

  // Перевіряємо чи той самий календарний день
  const isToday = d.toDateString() === now.toDateString();
  const yesterday = new Date(now); yesterday.setDate(yesterday.getDate()-1);
  const isYesterday = d.toDateString() === yesterday.toDateString();

  if (diff < 60) return "щойно";
  if (diff < 3600) return Math.floor(diff/60) + " хв тому";
  if (isToday) return `Сьогодні · ${time}`;
  if (isYesterday) return `Вчора · ${time}`;
  return d.toLocaleDateString("uk-UA",{day:"2-digit",month:"short",year:"numeric"}) + ` · ${time}`;
}

function fmtDateShort(ts) {
  if (!ts) return "—";
  if (ts < 1e11) ts = ts * 1000;
  const d = new Date(ts);
  if (isNaN(d.getTime())) return "—";
  const now = new Date();
  const diff = (now - d) / 1000;
  const time = d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
  if (diff < 60) return "щойно";
  if (diff < 3600) return Math.floor(diff/60) + " хв тому";
  if (d.toDateString() === now.toDateString()) return time;
  const yesterday = new Date(now); yesterday.setDate(yesterday.getDate()-1);
  if (d.toDateString() === yesterday.toDateString()) return `вчора ${time}`;
  return d.toLocaleDateString("uk-UA",{day:"2-digit",month:"short"}) + ` ${time}`;
}

const THUMB_CLS = ["","b","g","a","v"];
let allGames = [], currentTab = "all", delCode = "";

const snap = await get(ref(db, `teachers/${uid}/gameHistory`));
if (snap.exists()) {
  allGames = Object.entries(snap.val())
    .map(([code, g]) => ({ code, ...g }))
    .sort((a,b) => (b.playedAt||0) - (a.playedAt||0));
  updateStats();
  renderGames();
} else {
  showEmpty("Ще не проводили жодної гри");
}
appReady();

function showEmpty(msg="Нічого не знайдено") {
  document.getElementById("history-sub").textContent = msg;
  document.getElementById("games-list").innerHTML = `<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--ink-400);margin-bottom:12px"><circle cx="12" cy="12" r="9"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/></svg><h3>${msg}</h3><p>Проведіть першу Live гру — результати з'являться тут</p></div>`;
}

function updateStats() {
  const total = allGames.length;
  const players = allGames.reduce((s,g) => s+(g.playerCount||0), 0);
  const fin = allGames.filter(g => (g.results||[]).length > 0).length;
  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-players").textContent = players;
  document.getElementById("stat-games").textContent = fin;
  document.getElementById("stat-last").textContent = allGames[0]?.playedAt ? fmtDateShort(allGames[0].playedAt) : "—";
  document.getElementById("history-sub").textContent = `Усі live-сесії · ${total} ігор`;
  document.getElementById("ct-all").textContent = total;
  document.getElementById("ct-fin").textContent = fin;
}

function renderGames() {
  const search = document.getElementById("search-inp").value.toLowerCase();
  let list = allGames;
  if (currentTab === "fin") list = list.filter(g => (g.results||[]).length > 0);
  if (search) list = list.filter(g => g.code?.includes(search) || g.testTitle?.toLowerCase().includes(search));

  if (!list.length) {
    document.getElementById("games-list").innerHTML = `<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--ink-400);margin-bottom:12px"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><h3>Нічого не знайдено</h3><p>Спробуйте інший пошук або фільтр</p></div>`;
    return;
  }

  document.getElementById("games-list").innerHTML = list.map((g, i) => {
    const thumbCls = THUMB_CLS[i % THUMB_CLS.length];
    const results = g.results || [];
    const top3 = results.slice(0,3);
    const short = (g.testTitle||"—").length > 20 ? (g.testTitle||"—").slice(0,20)+"…" : (g.testTitle||"—");
    const maxScore = results.length ? Math.max(...results.map(r=>r.score||0)) : 0;
    const totalPlayers = results.length || g.playerCount || 0;

    const MEDALS = ["🥇","🥈","🥉"];
    const podHtml = top3.length
      ? top3.map((r,j) =>
          `<div class="pod-row">
            <span class="pod-medal">${MEDALS[j]}</span>
            <span class="pod-name">${esc(r.nickname || "—")}</span>
            <span class="pod-pts">${(r.score||0).toLocaleString("uk")}</span>
          </div>`).join("")
      : `<div style="font-size:12px;color:var(--ink-500);padding:8px 0;text-align:center">Немає результатів</div>`;

    const hasResults = results.length > 0;
    const moreCount = results.length - 3;

    return `<div class="game" id="game-${g.code}">
      <div class="game-top">
        <div class="thumb ${thumbCls}">
          <div class="t-code">${g.code}</div>
          <div class="t-name">${esc(short)}</div>
        </div>
        <div class="game-body">
          <div class="title-line">
            <h3>${esc(g.testTitle||"—")}</h3>
            <span class="pill fin">Завершено</span>
          </div>
          <div class="gmeta">
            <span class="code">${g.code}</span>
            <span class="sep">·</span>
            <span>${fmtDate(g.playedAt)}</span>
          </div>
          <div class="game-kpis">
            <div class="kpi">
              <div class="v">${totalPlayers}</div>
              <div class="l">Гравців</div>
            </div>
            <div class="kpi">
              <div class="v">${maxScore ? maxScore.toLocaleString("uk") : "—"}</div>
              <div class="l">Макс. бал</div>
            </div>
          </div>
          <div class="game-actions">
            ${hasResults ? `<button class="view-all" onclick="openResModal('${g.code}')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
              Всі результати (${results.length})
            </button>` : ""}
            ${hasResults ? `<button class="view-all" onclick="window.open('live/podium.html?code=${g.code}','_blank')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><path d="M4 22h16"/><path d="M10 14v-4a2 2 0 0 1 2-2v0a2 2 0 0 1 2 2v4"/><path d="M6 22V13a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v9"/><path d="M14 22v-6a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v6"/></svg>
              Відкрити подіум
            </button>` : ""}
            <button class="danger" onclick="openDelModal('${g.code}')">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
              Видалити
            </button>
          </div>
        </div>
        <div class="game-podium">
          <div class="pod-head">
            <span>Топ гравці</span>
            ${moreCount > 0 ? `<strong>+${moreCount} ще</strong>` : ""}
          </div>
          ${podHtml}
        </div>
      </div>
    </div>`;
  }).join("");
}

window.openResModal = code => {
  const g = allGames.find(x => x.code === code);
  if (!g) return;
  const results = [...(g.results||[])].sort((a,b) => (b.score||0)-(a.score||0));
  const MEDALS = {0:"🥇",1:"🥈",2:"🥉"};
  document.getElementById("res-title").textContent = g.testTitle || "Результати гри";
  document.getElementById("res-sub").textContent = `${results.length} гравців · ${fmtDate(g.playedAt)}`;
  document.getElementById("res-body").innerHTML = results.length
    ? results.map((r,i) => {
        const name = r.nickname || "—";
        const topCls = i===0?"top1":i===1?"top2":i===2?"top3":"";
        const rankHtml = i < 3
          ? `<span class="res-rank ${["gold","silver","bronze"][i]}">${MEDALS[i]}</span>`
          : `<span class="res-rank">${i+1}</span>`;
        return `<div class="res-row ${topCls}">
          ${rankHtml}
          <span class="res-name">${esc(name)}</span>
          <span class="res-pts">${(r.score||0).toLocaleString("uk")}</span>
        </div>`;
      }).join("")
    : `<div style="text-align:center;padding:40px;color:var(--ink-500);font-size:13px">Немає результатів</div>`;
  document.getElementById("res-overlay").classList.add("show");
};
window.closeResModal = () => document.getElementById("res-overlay").classList.remove("show");

window.filterGames = () => renderGames();

document.getElementById("tab-seg").addEventListener("click", e => {
  const btn = e.target.closest("button[data-tab]");
  if (!btn) return;
  currentTab = btn.dataset.tab;
  document.querySelectorAll("#tab-seg button").forEach(b => b.classList.toggle("on", b===btn));
  renderGames();
});

window.openDelModal = code => {
  delCode = code;
  document.getElementById("del-code-label").textContent = code;
  document.getElementById("del-bg").classList.add("show");
};
window.closeDelModal = () => document.getElementById("del-bg").classList.remove("show");
window.confirmDelete = async () => {
  await remove(ref(db, `teachers/${uid}/gameHistory/${delCode}`));
  allGames = allGames.filter(g => g.code !== delCode);
  document.getElementById(`game-${delCode}`)?.remove();
  closeDelModal();
  updateStats();
  if (!allGames.length) showEmpty("Ще не проводили жодної гри");
};
document.getElementById("del-bg").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeDelModal();
});

document.getElementById("sec-history").classList.add("on");
</script>
</body>
</html>
