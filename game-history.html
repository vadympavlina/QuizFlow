<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%232d5be3'/><stop offset='1' stop-color='%231a3ab8'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><rect x='7' y='9' width='12' height='2.5' rx='1.25' fill='white'/><rect x='7' y='14.75' width='18' height='2.5' rx='1.25' fill='white'/><rect x='7' y='20.5' width='9' height='2.5' rx='1.25' fill='white'/></svg>">
<title>QuizFlow — Історія ігор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
<link rel="modulepreload" href="shared/app.js?v=15">
<link rel="preload" as="fetch" href="shared/layout.html?v=15" crossorigin>
<link rel="modulepreload" href="shared/features.js?v=15">
<style>
#sec-history{
  --ink-900:#0B1437;--ink-700:#24335A;--ink-500:#5B6A8F;--ink-400:#8691AC;
  --line:#E3E8F2;--line-strong:#CDD6E8;--nav-600:#1E3A8A;--nav-accent:#3B82F6;
  font-family:'Manrope',system-ui,sans-serif;color:var(--ink-900);
}
#sec-history.on{display:flex;flex-direction:column;gap:20px}
#sec-history .page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
#sec-history .page-title h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0;color:var(--ink-900)}
#sec-history .page-title p{margin:4px 0 0;color:var(--ink-500);font-size:14px}
#sec-history .stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
#sec-history .ssl{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:14px}
#sec-history .ssl .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;background:linear-gradient(135deg,#A78BFA,#7C3AED);color:#fff}
#sec-history .ssl.b .ico{background:linear-gradient(135deg,#3B82F6,#1D4ED8)}
#sec-history .ssl.g .ico{background:linear-gradient(135deg,#10B981,#047857)}
#sec-history .ssl.a .ico{background:linear-gradient(135deg,#F59E0B,#B45309)}
#sec-history .ssl .v{font-family:"Geist Mono",monospace;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1}
#sec-history .ssl .l{font-size:11.5px;color:var(--ink-500);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-top:3px}
#sec-history .filter-bar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:14px;flex-wrap:wrap}
#sec-history .seg{display:inline-flex;background:#F4F6FB;border:1px solid var(--line);border-radius:10px;padding:3px}
#sec-history .seg button{background:transparent;border:0;padding:7px 13px;border-radius:8px;font:inherit;font-size:13px;font-weight:600;color:var(--ink-500);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
#sec-history .seg button.on{background:#fff;color:var(--ink-900);box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px var(--line)}
#sec-history .seg .ct{font-family:"Geist Mono",monospace;font-size:11px;background:#EDE9FE;color:#6D28D9;padding:1px 7px;border-radius:999px;font-weight:700}
#sec-history .srch-wrap{position:relative;margin-left:auto;display:flex;align-items:center}
#sec-history .srch-wrap svg{position:absolute;left:10px;color:var(--ink-400);pointer-events:none}
#sec-history .srch-wrap input{padding:8px 12px 8px 32px;background:#fff;border:1px solid var(--line);border-radius:10px;font-family:'Manrope',sans-serif;font-size:13px;color:var(--ink-900);outline:none;height:34px;width:260px}
#sec-history .srch-wrap input:focus{border-color:var(--nav-accent)}
#sec-history .games{display:grid;grid-template-columns:1fr;gap:14px}
#sec-history .game{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;grid-template-columns:170px 1fr 290px;gap:18px;align-items:center;transition:border-color .15s}
#sec-history .game:hover{border-color:var(--line-strong)}
#sec-history .thumb{aspect-ratio:16/10;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#1E3A8A,#0F1844);position:relative;overflow:hidden;gap:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
#sec-history .thumb::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:14px 14px}
#sec-history .thumb.b{background:linear-gradient(135deg,#312E81,#581C87)}
#sec-history .thumb.g{background:linear-gradient(135deg,#064E3B,#022C22)}
#sec-history .thumb.a{background:linear-gradient(135deg,#9A3412,#7C2D12)}
#sec-history .thumb.v{background:linear-gradient(135deg,#7C3AED,#4338CA)}
#sec-history .thumb .t-code{position:relative;z-index:1;font-family:"Geist Mono",monospace;font-size:11px;font-weight:800;color:rgba(255,255,255,.6);letter-spacing:.16em;text-transform:uppercase}
#sec-history .thumb .t-name{position:relative;z-index:1;font-size:13px;font-weight:800;letter-spacing:-.01em;text-align:center;padding:0 8px}
#sec-history .title-line{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
#sec-history .title-line h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
#sec-history .pill{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:5px}
#sec-history .pill.fin{background:#DCFCE7;color:#15803D}
#sec-history .gmeta{font-size:12px;color:var(--ink-500);font-family:"Geist Mono",monospace;margin-bottom:10px}
#sec-history .gmeta b{color:var(--ink-700)}
#sec-history .game-stats{display:flex;gap:20px;margin-bottom:12px}
#sec-history .game-stats .it .v{font-family:"Geist Mono",monospace;font-weight:800;font-size:15px;color:var(--ink-900)}
#sec-history .game-stats .it .l{font-size:10px;color:var(--ink-400);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
#sec-history .game-actions{display:flex;gap:6px}
#sec-history .game-actions button{padding:6px 12px;font-size:12px;border-radius:8px;border:1px solid var(--line);background:#F4F6FB;color:var(--ink-700);font-family:'Manrope',sans-serif;font-weight:700;cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:5px}
#sec-history .game-actions button:hover{background:#EEF2FB;border-color:var(--line-strong)}
#sec-history .game-actions button.danger{background:#FEE2E2;color:#B91C1C;border-color:#FCA5A5}
#sec-history .game-actions button.danger:hover{background:#FECACA}
#sec-history .game-podium{background:#FAFBFE;border:1px solid var(--line);border-radius:12px;padding:12px}
#sec-history .game-podium h4{margin:0 0 8px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#7C3AED}
#sec-history .pod-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
#sec-history .pod-row:last-child{border-bottom:0}
#sec-history .pod-rank{font-family:"Geist Mono",monospace;font-weight:800;font-size:13px;width:24px}
#sec-history .pod-rank.r1{color:#D97706}
#sec-history .pod-rank.r2{color:#6B7280}
#sec-history .pod-rank.r3{color:#9A3412}
#sec-history .pod-name{flex:1;font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sec-history .pod-pts{font-family:"Geist Mono",monospace;font-weight:800;font-size:12px;color:#7C3AED}
#sec-history .empty{text-align:center;padding:60px 20px;color:var(--ink-500)}
#sec-history .empty .e-ico{font-size:48px;margin-bottom:12px}
#sec-history .empty h3{font-size:17px;font-weight:700;color:var(--ink-900);margin:0 0 6px}
#sec-history .empty p{font-size:13px;margin:0}
.h-del-bg{position:fixed;inset:0;background:rgba(11,20,55,.35);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.h-del-bg.show{display:flex}
.h-del-modal{background:#fff;border-radius:18px;padding:28px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(11,20,55,.18);text-align:center}
.h-del-modal .d-ico{font-size:36px;margin-bottom:10px}
.h-del-modal h3{font-size:17px;font-weight:800;margin:0 0 8px;color:#0B1437}
.h-del-modal p{font-size:13px;color:#5B6A8F;margin:0 0 18px;line-height:1.5}
.h-del-modal .d-btns{display:flex;gap:10px}
.h-del-modal .d-btn{flex:1;padding:11px;border-radius:10px;font-family:'Manrope',sans-serif;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .12s}
.h-del-modal .d-btn.cancel{background:#F4F6FB;color:#5B6A8F;border:1px solid #E3E8F2}
.h-del-modal .d-btn.cancel:hover{background:#EEF2FB}
.h-del-modal .d-btn.confirm{background:#DC2626;color:#fff}
.h-del-modal .d-btn.confirm:hover{background:#B91C1C}
</style>
</head>
<body>
<div class="sec" id="sec-history">
  <div class="page-title">
    <div>
      <h1>Історія Live ігор</h1>
      <p id="history-sub">Завантаження...</p>
    </div>
  </div>

  <div class="stats-strip">
    <div class="ssl">
      <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/></svg></div>
      <div><div class="v" id="stat-total">—</div><div class="l">Усього ігор</div></div>
    </div>
    <div class="ssl b">
      <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div><div class="v" id="stat-players">—</div><div class="l">Учасників</div></div>
    </div>
    <div class="ssl g">
      <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 12 10 17 19 8"/></svg></div>
      <div><div class="v" id="stat-games">—</div><div class="l">Завершених ігор</div></div>
    </div>
    <div class="ssl a">
      <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <div><div class="v" id="stat-last">—</div><div class="l">Остання гра</div></div>
    </div>
  </div>

  <div class="filter-bar">
    <div class="seg" id="tab-seg">
      <button class="on" data-tab="all">Усі <span class="ct" id="ct-all">0</span></button>
      <button data-tab="fin">З результатами <span class="ct" id="ct-fin">0</span></button>
    </div>
    <div class="srch-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search-inp" placeholder="Пошук по коду або назві…" oninput="filterGames()">
    </div>
  </div>

  <div class="games" id="games-list"></div>
</div>

<div class="h-del-bg" id="del-bg">
  <div class="h-del-modal">
    <div class="d-ico">🗑️</div>
    <h3>Видалити гру?</h3>
    <p>Результати гри <b id="del-code-label"></b> будуть видалені назавжди.</p>
    <div class="d-btns">
      <button class="d-btn cancel" onclick="closeDelModal()">Скасувати</button>
      <button class="d-btn confirm" onclick="confirmDelete()">Видалити</button>
    </div>
  </div>
</div>

<script type="module">
import { getDatabase, ref, get, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const { initApp, appReady } = await import("./shared/app.js?v=15");
await initApp("history", { skipData: true });

const db = getDatabase();
const uid = window._currentUser?.id || "";

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtDate(ts) {
  if (!ts) return "—";
  const d = new Date(ts), now = new Date(), diff = (now - d) / 1000;
  if (diff < 3600)   return Math.floor(diff/60) + " хв тому";
  if (diff < 86400)  return "Сьогодні, " + d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
  if (diff < 172800) return "Вчора, " + d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
  return d.toLocaleDateString("uk-UA",{day:"2-digit",month:"short"}) + ", " + d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"});
}

const THUMB_CLS = ["","b","g","a","v"];
let allGames = [], currentTab = "all", delCode = "";

const snap = await get(ref(db, `teachers/${uid}/gameHistory`));
if (snap.exists()) {
  allGames = Object.entries(snap.val())
    .map(([code, g]) => ({ code, ...g }))
    .sort((a,b) => (b.playedAt||0) - (a.playedAt||0));
  updateStats();
  renderGames();
} else {
  showEmpty("Ще не проводили жодної гри");
}
appReady();

function showEmpty(msg="Нічого не знайдено") {
  document.getElementById("history-sub").textContent = msg;
  document.getElementById("games-list").innerHTML = `<div class="empty"><div class="e-ico">🎮</div><h3>${msg}</h3><p>Проведіть першу Live гру — результати з'являться тут</p></div>`;
}

function updateStats() {
  const total = allGames.length;
  const players = allGames.reduce((s,g) => s+(g.playerCount||0), 0);
  const fin = allGames.filter(g => (g.results||[]).length > 0).length;
  document.getElementById("stat-total").textContent = total;
  document.getElementById("stat-players").textContent = players;
  document.getElementById("stat-games").textContent = fin;
  document.getElementById("stat-last").textContent = allGames[0]?.playedAt ? fmtDate(allGames[0].playedAt) : "—";
  document.getElementById("history-sub").textContent = `Усі live-сесії · ${total} ігор`;
  document.getElementById("ct-all").textContent = total;
  document.getElementById("ct-fin").textContent = fin;
}

function renderGames() {
  const search = document.getElementById("search-inp").value.toLowerCase();
  let list = allGames;
  if (currentTab === "fin") list = list.filter(g => (g.results||[]).length > 0);
  if (search) list = list.filter(g => g.code?.includes(search) || g.testTitle?.toLowerCase().includes(search));

  if (!list.length) {
    document.getElementById("games-list").innerHTML = `<div class="empty"><div class="e-ico">🔍</div><h3>Нічого не знайдено</h3><p>Спробуйте інший пошук або фільтр</p></div>`;
    return;
  }

  document.getElementById("games-list").innerHTML = list.map((g, i) => {
    const thumbCls = THUMB_CLS[i % THUMB_CLS.length];
    const top3 = (g.results||[]).slice(0,3);
    const short = (g.testTitle||"—").length > 22 ? (g.testTitle||"—").slice(0,22)+"…" : (g.testTitle||"—");
    const maxScore = top3.length ? Math.max(...(g.results||[]).map(r=>r.score||0)) : 0;

    const podHtml = top3.length
      ? `<h4>🏆 Топ-3</h4>` + top3.map((r,j) =>
          `<div class="pod-row">
            <span class="pod-rank r${j+1}">#${j+1}</span>
            <span class="pod-name">${esc(((r.surname||"")+" "+(r.name||"")).trim())}</span>
            <span class="pod-pts">${(r.score||0).toLocaleString("uk")}</span>
          </div>`).join("")
      : `<div style="text-align:center;font-size:12px;color:var(--ink-500);padding:20px 0">Немає результатів</div>`;

    return `<div class="game" id="game-${g.code}">
      <div class="thumb ${thumbCls}">
        <div class="t-code">КОД · ${g.code}</div>
        <div class="t-name">${esc(short)}</div>
      </div>
      <div class="game-info">
        <div class="title-line">
          <h3>${esc(g.testTitle||"—")}</h3>
          <span class="pill fin">Завершено</span>
        </div>
        <div class="gmeta"><b>${g.code}</b> · ${fmtDate(g.playedAt)}</div>
        <div class="game-stats">
          <div class="it"><div class="v">${g.playerCount||0}</div><div class="l">Гравців</div></div>
          <div class="it"><div class="v">${maxScore ? maxScore.toLocaleString("uk") : "—"}</div><div class="l">Макс. бал</div></div>
        </div>
        <div class="game-actions">
          <button class="danger" onclick="openDelModal('${g.code}')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            Видалити
          </button>
        </div>
      </div>
      <div class="game-podium">${podHtml}</div>
    </div>`;
  }).join("");
}

window.filterGames = () => renderGames();

document.getElementById("tab-seg").addEventListener("click", e => {
  const btn = e.target.closest("button[data-tab]");
  if (!btn) return;
  currentTab = btn.dataset.tab;
  document.querySelectorAll("#tab-seg button").forEach(b => b.classList.toggle("on", b===btn));
  renderGames();
});

window.openDelModal = code => {
  delCode = code;
  document.getElementById("del-code-label").textContent = code;
  document.getElementById("del-bg").classList.add("show");
};
window.closeDelModal = () => document.getElementById("del-bg").classList.remove("show");
window.confirmDelete = async () => {
  await remove(ref(db, `teachers/${uid}/gameHistory/${delCode}`));
  allGames = allGames.filter(g => g.code !== delCode);
  document.getElementById(`game-${delCode}`)?.remove();
  closeDelModal();
  updateStats();
  if (!allGames.length) showEmpty("Ще не проводили жодної гри");
};
document.getElementById("del-bg").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeDelModal();
});

document.getElementById("sec-history").classList.add("on");
</script>
</body>
</html>
