<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%233B82F6'/><stop offset='1' stop-color='%231D4ED8'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><circle cx='10' cy='12' r='1.5' fill='white'/><circle cx='22' cy='20' r='1.5' fill='white'/><path d='M5 12h11a4 4 0 0 1 4 4v0' stroke='white' stroke-width='2.2' stroke-linecap='round' fill='none'/><path d='M22 20H11a4 4 0 0 1-4-4v0' stroke='white' stroke-width='2.2' stroke-linecap='round' fill='none'/></svg>">
<title>QuizFlow — Моніторинг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Моніторинг для проєктора: світлий, як панель викладача; великі цифри, мінімум дрібниць */
:root{
  --bg:#EEF1F8; --card:#fff; --ink:#0B1437; --ink-2:#24335A; --ink-3:#5B6A8F; --ink-4:#8691AC;
  --line:#E3E8F2; --line-2:#CDD6E8; --navy:#1E3A8A; --blue:#3B82F6;
  --good:#16A34A; --warn:#D97706; --bad:#DC2626; --game:#6D28D9;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
.mono{font-family:"Geist Mono",monospace;font-variant-numeric:tabular-nums}
svg{flex:0 0 auto}

/* Шапка — як бічна панель (темно-синя) */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:22px;padding:16px 28px;color:#fff;
  background:linear-gradient(135deg,#0D1340 0%,#15205A 60%,#1E3A8A 100%);box-shadow:0 10px 30px -18px rgba(11,20,55,.7);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#3B82F6,#1D4ED8);display:grid;place-items:center;box-shadow:0 10px 24px -10px rgba(59,130,246,.8)}
.brand b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand b em{font-style:normal;color:#93C5FD}
.brand small{display:block;font-size:12px;color:#A5B4FC;font-weight:600;margin-top:2px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:rgba(34,197,94,.16);color:#86EFAC}
.pill-live::before{content:"";width:8px;height:8px;border-radius:50%;background:#22C55E;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
.bar-test{min-width:0;flex:1}
.bar-test small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#A5B4FC}
.bar-test b{display:block;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:10px}
.stat{padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);min-width:96px}
.stat small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#A5B4FC}
.stat b{display:block;font-family:"Geist Mono",monospace;font-size:24px;font-weight:800;line-height:1.15}
.stat b sub{font-size:13px;color:#A5B4FC;vertical-align:baseline}
.stat.good b{color:#86EFAC}.stat.bad b{color:#FCA5A5}
.clock{text-align:right}
.clock b{display:block;font-family:"Geist Mono",monospace;font-size:24px;font-weight:700;letter-spacing:.02em}
.clock small{font-size:11.5px;color:#A5B4FC}
.tools{display:flex;gap:6px}
.tbtn{width:38px;height:38px;border-radius:11px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#C7D2FE;display:grid;place-items:center;cursor:pointer;transition:all .15s}
.tbtn:hover{background:rgba(255,255,255,.14);color:#fff}
.tbtn.on{background:#fff;color:var(--navy)}
.tbtn[hidden]{display:none}
.tbtn:focus-visible,.chip:focus-visible,.tc:focus-visible{outline:2px solid #93C5FD;outline-offset:2px}

/* Панель адміна */
.admin{display:none;align-items:center;gap:12px;padding:12px 28px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.admin.show{display:flex}
.seg{display:inline-flex;background:#F4F6FB;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink-3);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(11,20,55,.1)}
.srch{position:relative;width:320px}
.srch input{width:100%;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 12px 0 34px;font:inherit;font-size:13.5px;outline:none}
.srch input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-4)}
.srch-res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 36px -14px rgba(11,20,55,.3);padding:5px;max-height:320px;overflow:auto;z-index:10}
.srch-res[hidden]{display:none}
.srch-res button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;text-align:left;font-size:13.5px;font-weight:600}
.srch-res button:hover{background:#F4F6FB}
.srch-res i{width:28px;height:28px;border-radius:9px;background:#EEF2FB;color:var(--navy);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800}
.srch-none{padding:12px;color:var(--ink-4);font-size:13px}
.watching{display:none;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--game);background:#F3EEFF;padding:6px 8px 6px 12px;border-radius:999px}
.watching.show{display:inline-flex}
.watching button{border:0;background:#fff;color:var(--game);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;cursor:pointer}

/* Контент */
.wrap{padding:22px 28px 36px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.h h2{margin:0;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.h span{font-family:"Geist Mono",monospace;font-size:12px;color:var(--ink-4)}
.main{display:flex;flex-direction:column;gap:20px;min-width:0}

/* Гра наживо */
.games{display:grid;gap:12px}
.game{display:flex;align-items:center;gap:22px;padding:18px 22px;border-radius:20px;color:#fff;
  background:radial-gradient(120% 160% at 100% 0%,#A78BFA 0%,rgba(167,139,250,0) 55%),linear-gradient(135deg,#4C1D95,#6D28D9 65%,#7C3AED)}
.game-code small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.game-code b{display:block;font-family:"Geist Mono",monospace;font-size:40px;font-weight:800;letter-spacing:.1em;line-height:1.1}
.game-mid{flex:1;min-width:0}
.game-mid b{display:block;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-mid span{font-size:14px;opacity:.85}
.game-bar{height:6px;border-radius:4px;background:rgba(255,255,255,.2);margin-top:10px;overflow:hidden}
.game-bar i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .4s}
.game-ppl{text-align:right}
.game-ppl b{display:block;font-family:"Geist Mono",monospace;font-size:34px;font-weight:800;line-height:1}
.game-ppl small{font-size:12px;opacity:.8}
.game-join{font-size:13px;opacity:.9;margin-top:4px}
.game-join b{font-family:"Geist Mono",monospace}

/* Фільтр за тестом */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips[hidden]{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--ink-2);cursor:pointer}
.chip small{font-family:"Geist Mono",monospace;color:var(--ink-4);font-size:12px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.on small{color:#C7D2FE}

/* Картки студентів */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.s{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:relative;transition:opacity .3s,border-color .3s}
.s.idle{opacity:.55}
.s.warn{border-color:#FDE68A}.s.bad{border-color:#FECACA;box-shadow:0 0 0 3px #FEF2F2}
.s-top{display:flex;align-items:center;gap:10px;min-width:0}
.ava{position:relative;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:12.5px;font-weight:800;flex:0 0 auto}
.ava i{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:#CBD5E1}
.ava i.on{background:#22C55E}
.s-who{min-width:0}
.s-who b{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-who small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-prog{display:flex;align-items:baseline;justify-content:space-between}
.s-prog b{font-family:"Geist Mono",monospace;font-size:24px;font-weight:800;letter-spacing:-.02em}
.s-prog b sub{font-size:14px;color:var(--ink-4);vertical-align:baseline;font-weight:700}
.s-prog span{font-family:"Geist Mono",monospace;font-size:13px;font-weight:700;color:var(--ink-3)}
.s-bar{height:7px;border-radius:5px;background:#EEF2FB;overflow:hidden}
.s-bar i{display:block;height:100%;border-radius:5px;background:var(--blue);transition:width .5s}
.s-foot{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.s-foot .t{display:inline-flex;align-items:center;gap:4px;font-family:"Geist Mono",monospace}
.s-foot .sp{flex:1}
.fl{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;color:#B91C1C;background:#FEF2F2;border:1px solid #FECACA;padding:1px 7px;border-radius:999px}
.st{font-weight:700;font-size:11.5px}
.st.on{color:var(--good)}
.hide-flags .fl{display:none}

/* Бічна колонка */
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:96px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.panel .h{margin-bottom:10px}
.cls{display:flex;align-items:center;gap:16px}
.cls-num b{display:block;font-family:"Geist Mono",monospace;font-size:40px;font-weight:800;line-height:1;letter-spacing:-.03em}
.cls-num small{font-size:12px;color:var(--ink-3)}
.dist{flex:1;display:flex;align-items:flex-end;gap:3px;height:56px}
.dist i{flex:1;border-radius:3px 3px 0 0;background:#BFD3FF;min-height:3px}
.dist i.hi{background:var(--blue)}
.cls-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.cls-stats div{background:#F6F8FC;border-radius:10px;padding:8px 10px}
.cls-stats b{display:block;font-family:"Geist Mono",monospace;font-size:16px;font-weight:800}
.cls-stats small{font-size:11px;color:var(--ink-3)}
.lead{display:flex;flex-direction:column;gap:2px}
.lead-r{display:flex;align-items:center;gap:10px;padding:7px 4px;font-size:13.5px}
.lead-r .rk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:800 11px "Geist Mono",monospace;color:var(--ink-3);background:#F1F4FA;flex:0 0 auto}
.lead-r .rk.r1{background:linear-gradient(135deg,#FCD34D,#D97706);color:#fff}
.lead-r .rk.r2{background:linear-gradient(135deg,#E5E7EB,#9CA3AF);color:#fff}
.lead-r .rk.r3{background:linear-gradient(135deg,#FDBA74,#C2410C);color:#fff}
.lead-r b{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead-r span{font-family:"Geist Mono",monospace;font-weight:800;color:var(--navy)}
.feed{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow:auto}
.fi{display:flex;gap:10px;padding:8px 4px;font-size:13px;line-height:1.45;color:var(--ink-2)}
.fi i{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:6px;flex:0 0 auto}
.fi.good i{background:var(--good)}.fi.warn i{background:var(--warn)}
.fi small{display:block;font-size:11.5px;color:var(--ink-4)}
.muted{font-size:13px;color:var(--ink-4);padding:6px 2px}

.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:70px 24px;background:#fff;border:1px dashed var(--line-2);border-radius:20px;color:var(--ink-3)}
.empty .ic{width:60px;height:60px;border-radius:18px;background:#EEF2FB;color:var(--navy);display:grid;place-items:center;margin-bottom:6px}
.empty b{font-size:19px;color:var(--ink)}
.empty span{max-width:440px;line-height:1.55}

#loader{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink-3);font-size:13px}
#loader[hidden]{display:none}
.spin{width:40px;height:40px;border:3.5px solid rgba(45,91,227,.15);border-top-color:#2d5be3;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:1180px){.wrap{grid-template-columns:1fr}.side{position:static}.stats .stat:nth-child(n+3){display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<script src="shared/mobile-gate.js?v=1"></script>

<div id="loader"><div class="spin"></div>Завантаження…</div>

<header class="bar">
  <div class="brand">
    <div class="brand-mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11a4 4 0 0 1 4 4v1"/><path d="M20 17H9a4 4 0 0 1-4-4v-1"/><circle cx="5" cy="7" r="1.3" fill="#fff"/><circle cx="19" cy="17" r="1.3" fill="#fff"/></svg></div>
    <div><b>quiz<em>flow</em></b><small id="teacher-name">—</small></div>
  </div>
  <span class="pill-live">Наживо</span>
  <div class="bar-test"><small>Зараз</small><b id="bar-test">—</b></div>
  <div class="stats">
    <div class="stat"><small>Проходять</small><b id="st-active">0</b></div>
    <div class="stat good"><small>Завершили</small><b id="st-done">0</b></div>
    <div class="stat"><small>Сер. оцінка</small><b id="st-avg">—</b></div>
    <div class="stat bad" id="st-flags-w"><small>Підозрілі</small><b id="st-flags">0</b></div>
  </div>
  <div class="clock"><b id="clock">—:—</b><small id="date">—</small></div>
  <div class="tools">
    <button class="tbtn" id="btn-names" type="button" title="Показувати лише ім'я та першу літеру прізвища" aria-pressed="false">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </button>
    <button class="tbtn" id="btn-flags" type="button" title="Сховати позначки порушень (не показувати класу)" aria-pressed="false">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
    </button>
    <button class="tbtn" id="btn-full" type="button" title="На весь екран (F)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
    </button>
    <button class="tbtn" id="btn-admin" type="button" title="Панель адміністратора" hidden>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </button>
  </div>
</header>

<div class="admin" id="admin">
  <div class="seg"><button type="button" data-tab="mine" class="on">Мій моніторинг</button><button type="button" data-tab="others">Інші викладачі</button></div>
  <div class="srch" id="srch" hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="srch-inp" type="search" placeholder="Ім'я або логін викладача…" autocomplete="off" aria-label="Пошук викладача">
    <div class="srch-res" id="srch-res" hidden></div>
  </div>
  <span class="watching" id="watching">Дивитеся: <span id="watching-name"></span><button type="button" data-tab="mine" title="Повернутися до свого" aria-label="Повернутися до свого"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></span>
</div>

<div class="wrap">
  <main class="main">
    <section id="games-sec" hidden><div class="h"><h2>Гра наживо</h2></div><div class="games" id="games"></div></section>
    <section>
      <div class="h"><h2>Проходять тест</h2><span id="cnt">0</span></div>
      <div class="chips" id="chips" hidden></div>
      <div class="grid" id="grid" style="margin-top:12px"></div>
    </section>
  </main>
  <aside class="side">
    <div class="panel" id="cls-panel" hidden>
      <div class="h"><h2>Прогрес класу</h2></div>
      <div class="cls"><div class="cls-num"><b id="cls-pct">0%</b><small>у середньому</small></div><div class="dist" id="cls-dist"></div></div>
      <div class="cls-stats">
        <div><b id="cls-q">—</b><small>сер. питання</small></div>
        <div><b id="cls-t">—</b><small>сер. час</small></div>
        <div><b id="cls-g">—</b><small>груп</small></div>
      </div>
    </div>
    <div class="panel" id="lead-panel" hidden><div class="h"><h2>Попереду</h2><span>за прогресом</span></div><div class="lead" id="lead"></div></div>
    <div class="panel"><div class="h"><h2>Події</h2></div><div class="feed" id="feed"><div class="muted">Тут з'являться нові старти, завершення й порушення.</div></div></div>
  </aside>
</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const cfg = {apiKey:"AIzaSyDsA4IQkn5tV41LDK43vzgm0XnRnbdgvTc",authDomain:"quizflow-8a978.firebaseapp.com",databaseURL:"https://quizflow-8a978-default-rtdb.europe-west1.firebasedatabase.app",projectId:"quizflow-8a978",storageBucket:"quizflow-8a978.firebasestorage.app",messagingSenderId:"206469794166",appId:"1:206469794166:web:55cd7007b429607acd5257"};
const app = getApps().length ? getApps()[0] : initializeApp(cfg);
const db = getDatabase(app);

// ─── Вхід ────────────────────────────────────────────────────────────
const fbUser = await new Promise(res => { const un = onAuthStateChanged(getAuth(app), u => { un(); res(u); }); });
if (!fbUser){ location.href = "login?next=" + encodeURIComponent("live" + location.search); throw new Error("no auth"); }
const profSnap = await get(ref(db, `users/${fbUser.uid}`));
if (!profSnap.exists() || profSnap.val().blocked === true){ location.href = "login"; throw new Error("no profile"); }
const prof = profSnap.val();
const ME = { id: fbUser.uid, name: prof.name || prof.login || fbUser.email || "", admin: prof.role === "admin" };

// Спільне стеження за кімнатами (shared/rooms.js читає window._fb)
window._fb = { db, ref, get, onValue };
const { watchRooms, liveRooms, roomState, IN_GAME } = await import("./shared/rooms.js?v=1");

// ─── Хелпери ─────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b >= 2 && b <= 4 ? f[1] : f[2]; };
const dur = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; };
const PAL = ["#2563EB", "#7C3AED", "#0D9488", "#EA580C", "#DB2777", "#0891B2", "#4F46E5", "#16A34A"];
const colorFor = s => { let h = 0; for (const ch of String(s || "")) h = (h * 31 + ch.codePointAt(0)) >>> 0; return PAL[h % PAL.length]; };
const svg = (d, w = 12) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC = {
  swap: '<path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>',
  cam:  '<path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/>',
  clock:'<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>',
};
const susp = a => (a.tabSwitches || 0) * 2 + (a.copyAttempts || 0) * 3 + (a.screenshots || 0) * 5;
const seen = a => a.lastSeen || a.startedAt || a.createdAt || 0;
// Онлайн = in_progress і heartbeat з тесту (кожні 15 с) не старший за 10 хв — закриті вкладки не висять
const isOnline = (a, now) => a.status === "in_progress" && now - seen(a) < 10 * 60e3;

// Налаштування для проєктора — лише в цьому браузері
const pref = (k, d) => { try { const v = localStorage.getItem("qf_live_" + k); return v == null ? d : v === "1"; } catch { return d; } };
const savePref = (k, v) => { try { localStorage.setItem("qf_live_" + k, v ? "1" : "0"); } catch {} };
const S = { uid: ME.id, name: ME.name, tests: {}, attempts: {}, filter: "", shortNames: pref("short", false), hideFlags: pref("noflags", false), feed: [], seen: new Map(), unsub: null, rooms: new Map() };
const nameOf = a => {
  const n = (a.name || "").trim(), s = (a.surname || "").trim();
  if (!n && !s) return "Студент";
  return S.shortNames ? `${n || s}${n && s ? " " + s[0] + "." : ""}` : `${s} ${n}`.trim();
};
const initials = a => ((a.surname || "")[0] || "") + ((a.name || "")[0] || "") || "?";

// ─── Годинник і тікер ─────────────────────────────────────────────────
function tick(){
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit" });
  const dt = d.toLocaleDateString("uk-UA", { weekday: "long", day: "numeric", month: "long" });
  $("date").textContent = dt.charAt(0).toUpperCase() + dt.slice(1);
  const now = Date.now();
  document.querySelectorAll("[data-since]").forEach(el => { el.textContent = dur(now - Number(el.dataset.since)); });
  if (d.getSeconds() % 15 === 0) schedule();   // студент міг стати неактивним
}
tick(); setInterval(tick, 1000);

// ─── Дані викладача ───────────────────────────────────────────────────
// Лише останні 300 спроб (ключі push — хронологічні): раніше сторінка тягнула
// ВСІ спроби за весь час разом з відповідями.
async function watchTeacher(uid, name){
  S.unsub?.(); S.unsub = null;
  S.uid = uid; S.name = name; S.attempts = {}; S.filter = ""; S.feed = []; S.seen.clear();
  $("loader").hidden = false;
  $("teacher-name").textContent = name || "—";
  const other = uid !== ME.id;
  $("watching").classList.toggle("show", other);
  $("watching-name").textContent = other ? name : "";
  try { S.tests = (await get(ref(db, `teachers/${uid}/tests`))).val() || {}; } catch { S.tests = {}; }
  let first = true;
  S.unsub = onValue(query(ref(db, `teachers/${uid}/attempts`), limitToLast(300)), snap => {
    const next = snap.val() || {};
    events(next, first); first = false;
    S.attempts = next;
    $("loader").hidden = true;
    schedule();
  }, err => { console.error(err); $("loader").hidden = true; });
}

// Ігри наживо — лише свої (кімнати інших викладачів приватні)
S.rooms = watchRooms(ME.id, () => schedule());

// ─── Стрічка подій ───────────────────────────────────────────────────
function events(next, first){
  const now = Date.now();
  for (const [id, a] of Object.entries(next)){
    const p = S.seen.get(id);
    const v = { status: a.status, t: a.tabSwitches || 0, c: a.copyAttempts || 0, s: a.screenshots || 0 };
    if (!first){
      const t = S.tests[a.testId]?.title || "тест";
      if (!p && a.status === "in_progress") push(`<b>${esc(nameOf(a))}</b> почав «${esc(t)}»`, "", now);
      else if (p && p.status === "in_progress" && (a.status === "completed" || a.status === "pending_review"))
        push(`<b>${esc(nameOf(a))}</b> завершив «${esc(t)}»${a.grade12 != null ? ` · <b>${+a.grade12}/12</b>` : a.status === "pending_review" ? " · на перевірці" : ""}`, "good", now);
      else if (p && (v.t > p.t || v.c > p.c || v.s > p.s) && !S.hideFlags)
        push(`<b>${esc(nameOf(a))}</b> · ${v.s > p.s ? "спроба скріншоту" : v.c > p.c ? "спроба копіювання" : "вийшов з тесту"}`, "warn", now);
    }
    S.seen.set(id, v);
  }
}
function push(html, cls, ts){ S.feed.unshift({ html, cls, ts }); S.feed.length = Math.min(S.feed.length, 30); renderFeed(); }
function renderFeed(){
  const ago = ts => { const d = Math.floor((Date.now() - ts) / 1000); return d < 10 ? "щойно" : d < 60 ? `${d} с тому` : d < 3600 ? `${Math.floor(d / 60)} хв тому` : `${Math.floor(d / 3600)} год тому`; };
  $("feed").innerHTML = S.feed.length ? S.feed.map(f => `<div class="fi ${f.cls}"><i></i><div>${f.html}<small>${ago(f.ts)}</small></div></div>`).join("")
    : `<div class="muted">Тут з'являться нові старти, завершення й порушення.</div>`;
}
setInterval(renderFeed, 30e3);

// ─── Рендер ───────────────────────────────────────────────────────────
let raf = 0;
function schedule(){ if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }

function render(){
  const now = Date.now(), dayStart = new Date().setHours(0, 0, 0, 0);
  const all = Object.entries(S.attempts).map(([id, a]) => ({ ...a, id }));
  const online = all.filter(a => isOnline(a, now));
  const totalQ = a => a.totalQ || (S.tests[a.testId]?.questions ? Object.keys(S.tests[a.testId].questions).length : 0);
  const pct = a => totalQ(a) ? Math.min(100, Math.round((a.currentQ || 0) / totalQ(a) * 100)) : 0;

  // Чипи тестів
  const byTest = new Map(); online.forEach(a => byTest.set(a.testId, (byTest.get(a.testId) || 0) + 1));
  if (S.filter && !byTest.has(S.filter)) S.filter = "";
  $("chips").hidden = byTest.size < 2;
  $("chips").innerHTML = `<button type="button" class="chip${!S.filter ? " on" : ""}" data-f="">Усі<small>${online.length}</small></button>` +
    [...byTest].map(([t, n]) => `<button type="button" class="chip${S.filter === t ? " on" : ""}" data-f="${esc(t)}">${esc(S.tests[t]?.title || "Тест")}<small>${n}</small></button>`).join("");
  const list = (S.filter ? online.filter(a => a.testId === S.filter) : online)
    .sort((a, b) => (b.startedAt || b.createdAt || 0) - (a.startedAt || a.createdAt || 0));

  // Шапка
  const tIds = [...byTest.keys()];
  $("bar-test").textContent = S.filter ? (S.tests[S.filter]?.title || "Тест")
    : tIds.length === 1 ? (S.tests[tIds[0]]?.title || "Тест") : tIds.length ? `${tIds.length} ${plural(tIds.length, ["тест", "тести", "тестів"])} одночасно` : "Очікуємо студентів";
  const doneToday = all.filter(a => (a.status === "completed" || a.status === "pending_review") && (a.finishedAt || a.createdAt || 0) >= dayStart);
  const grades = doneToday.map(a => a.grade12).filter(g => g != null).map(Number);
  $("st-active").textContent = online.length;
  $("st-done").textContent = doneToday.length;
  $("st-avg").innerHTML = grades.length ? `${(grades.reduce((s, g) => s + g, 0) / grades.length).toFixed(1)}<sub>/12</sub>` : "—";
  $("st-flags").textContent = online.filter(a => susp(a) >= 5).length;
  $("st-flags-w").hidden = S.hideFlags;
  $("cnt").textContent = list.length;

  // Ігри
  const rooms = S.uid === ME.id ? liveRooms(S.rooms) : [];
  $("games-sec").hidden = !rooms.length;
  $("games").innerHTML = rooms.map(r => {
    const p = r.qCount ? Math.round(Math.min(r.q + (r.status === "reveal" ? 1 : 0), r.qCount) / r.qCount * 100) : 0;
    return `<div class="game">
      <div class="game-code"><small>Код гри</small><b>${esc(r.code)}</b></div>
      <div class="game-mid"><b>${esc(r.title || "Гра наживо")}</b><span>${esc(roomState(r))}</span>
        ${r.status === "lobby" ? `<div class="game-join">Приєднуйтесь: <b>${esc(location.host)}/play</b></div>` : r.qCount ? `<div class="game-bar"><i style="width:${p}%"></i></div>` : ""}</div>
      <div class="game-ppl"><b>${r.players.length}</b><small>${plural(r.players.length, ["гравець", "гравці", "гравців"])}</small></div>
    </div>`;
  }).join("");

  // Картки
  const grid = $("grid");
  grid.classList.toggle("hide-flags", S.hideFlags);
  if (!list.length){
    grid.innerHTML = `<div class="empty"><span class="ic">${svg('<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>', 26)}</span>
      <b>Зараз ніхто не проходить тест</b><span>Щойно студенти відкриють тест за посиланням, їхні картки з'являться тут. Сторінку можна залишити відкритою на проєкторі.</span></div>`;
  } else {
    grid.innerHTML = list.map(a => {
      const idle = now - seen(a) >= 60e3, sc = susp(a), who = nameOf(a), tq = totalQ(a);
      const flags = [a.tabSwitches ? `<span class="fl" title="Виходи з тесту">${svg(IC.swap, 10)}${a.tabSwitches}</span>` : "",
        a.copyAttempts ? `<span class="fl" title="Копіювання">${svg(IC.copy, 10)}${a.copyAttempts}</span>` : "",
        a.screenshots ? `<span class="fl" title="Скріншоти">${svg(IC.cam, 10)}${a.screenshots}</span>` : ""].join("");
      return `<div class="s${idle ? " idle" : ""}${!S.hideFlags && sc >= 10 ? " bad" : !S.hideFlags && sc >= 5 ? " warn" : ""}">
        <div class="s-top"><span class="ava" style="background:${colorFor(who)}">${esc(initials(a).toUpperCase())}<i class="${idle ? "" : "on"}"></i></span>
          <div class="s-who"><b>${esc(who)}</b><small>${esc(S.tests[a.testId]?.title || "Тест")}${a.group ? ` · ${esc(a.group)}` : ""}</small></div></div>
        <div class="s-prog"><b>${a.currentQ || 0}<sub>/${tq || "?"}</sub></b><span>${pct(a)}%</span></div>
        <div class="s-bar"><i style="width:${pct(a)}%"></i></div>
        <div class="s-foot"><span class="t">${svg(IC.clock, 11)}<span data-since="${a.startedAt || a.createdAt || now}">${dur(now - (a.startedAt || a.createdAt || now))}</span></span>${flags}<span class="sp"></span>
          <span class="st ${idle ? "" : "on"}">${idle ? `неактивний ${Math.round((now - seen(a)) / 60e3)} хв` : "активний"}</span></div>
      </div>`;
    }).join("");
  }

  // Бічна колонка
  $("cls-panel").hidden = !list.length;
  if (list.length){
    const ps = list.map(pct);
    $("cls-pct").textContent = Math.round(ps.reduce((s, x) => s + x, 0) / ps.length) + "%";
    const bins = Array(10).fill(0); ps.forEach(x => bins[Math.min(9, Math.floor(x / 10))]++);
    const mx = Math.max(...bins, 1);
    $("cls-dist").innerHTML = bins.map((v, i) => `<i class="${i >= 7 ? "hi" : ""}" style="height:${Math.max(4, v / mx * 100)}%" title="${i * 10}–${i * 10 + 9}%: ${v}"></i>`).join("");
    $("cls-q").textContent = (list.reduce((s, a) => s + (a.currentQ || 0), 0) / list.length).toFixed(1);
    $("cls-t").textContent = dur(list.reduce((s, a) => s + (now - (a.startedAt || a.createdAt || now)), 0) / list.length);
    $("cls-g").textContent = new Set(list.map(a => a.group).filter(Boolean)).size || "—";
  }
  $("lead-panel").hidden = list.length < 3;
  if (list.length >= 3){
    $("lead").innerHTML = [...list].sort((a, b) => pct(b) - pct(a)).slice(0, 5).map((a, i) =>
      `<div class="lead-r"><span class="rk r${i + 1}">${i + 1}</span><b>${esc(nameOf(a))}</b><span>${pct(a)}%</span></div>`).join("");
  }
}

// ─── Керування ───────────────────────────────────────────────────────
const syncTools = () => {
  $("btn-names").classList.toggle("on", S.shortNames); $("btn-names").setAttribute("aria-pressed", S.shortNames);
  $("btn-flags").classList.toggle("on", S.hideFlags); $("btn-flags").setAttribute("aria-pressed", S.hideFlags);
};
syncTools();
$("btn-names").onclick = () => { S.shortNames = !S.shortNames; savePref("short", S.shortNames); syncTools(); render(); };
$("btn-flags").onclick = () => { S.hideFlags = !S.hideFlags; savePref("noflags", S.hideFlags); syncTools(); render(); };
const full = () => { if (document.fullscreenElement) document.exitFullscreen?.(); else document.documentElement.requestFullscreen?.().catch(() => {}); };
$("btn-full").onclick = full;
document.addEventListener("keydown", e => { if ((e.key === "f" || e.key === "F") && !e.target.closest("input")) full(); });
$("chips").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (b){ S.filter = b.dataset.f; render(); } });

// Адмін: дивитися моніторинг інших викладачів
let teachers = null;
if (ME.admin){
  $("btn-admin").hidden = false;
  if (pref("admin", false)) { $("admin").classList.add("show"); $("btn-admin").classList.add("on"); }
  $("btn-admin").onclick = () => {
    const on = !$("admin").classList.contains("show");
    $("admin").classList.toggle("show", on); $("btn-admin").classList.toggle("on", on); savePref("admin", on);
    if (!on && S.uid !== ME.id) setTab("mine");
  };
}
async function setTab(tab){
  document.querySelectorAll(".seg [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("srch").hidden = tab !== "others";
  if (tab === "mine"){ if (S.uid !== ME.id) watchTeacher(ME.id, ME.name); return; }
  if (!teachers){
    try {
      const u = (await get(ref(db, "users"))).val() || {};
      teachers = Object.entries(u).map(([id, x]) => ({ id, name: x?.name || x?.login || "", role: x?.role, blocked: x?.blocked }))
        .filter(t => t.id !== ME.id && t.role !== "admin" && !t.blocked && t.name).sort((a, b) => a.name.localeCompare(b.name, "uk"));
    } catch { teachers = []; }
  }
  $("srch-inp").focus();
}
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if (t) return setTab(t.dataset.tab);
  const p = e.target.closest("[data-uid]"); if (p){ $("srch-res").hidden = true; $("srch-inp").value = p.dataset.name; return watchTeacher(p.dataset.uid, p.dataset.name); }
  if (!e.target.closest("#srch")) $("srch-res").hidden = true;
});
$("srch-inp").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase(), box = $("srch-res");
  if (!q){ box.hidden = true; return; }
  const m = (teachers || []).filter(t => t.name.toLowerCase().includes(q)).slice(0, 12);
  box.innerHTML = m.length ? m.map(t => `<button type="button" data-uid="${esc(t.id)}" data-name="${esc(t.name)}"><i>${esc(t.name.split(/\s+/).map(w => w[0] || "").join("").slice(0, 2).toUpperCase())}</i>${esc(t.name)}</button>`).join("") : `<div class="srch-none">Нікого не знайдено</div>`;
  box.hidden = false;
});

watchTeacher(ME.id, ME.name);
</script>
</body>
</html>
