<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%232d5be3'/><stop offset='1' stop-color='%231a3ab8'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><rect x='7' y='9' width='12' height='2.5' rx='1.25' fill='white'/><rect x='7' y='14.75' width='18' height='2.5' rx='1.25' fill='white'/><rect x='7' y='20.5' width='9' height='2.5' rx='1.25' fill='white'/></svg>">
<title>QuizFlow — Знайомство</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1030">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/auth.css?v=1">
</head>
<body class="ob">

<aside class="hero">
  <a class="logo" href="./" aria-label="QuizFlow — на головну">
    <span class="logo-i"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11a4 4 0 0 1 4 4v1"/><path d="M20 17H9a4 4 0 0 1-4-4v-1"/><circle cx="5" cy="7" r="1.3" fill="#fff"/><circle cx="19" cy="17" r="1.3" fill="#fff"/></svg></span>
    <span class="logo-t">quiz<em>flow</em></span>
  </a>
  <div class="hero-main">
    <div class="kicker"><i></i>Знайомство · 2 хвилини</div>
    <h1>Як працює <span>QuizFlow</span></h1>
    <p class="hero-p">Від створення тесту до оцінок у журналі — у шести кроках.</p>
    <nav class="feats ob-list" id="obList" aria-label="Кроки знайомства"></nav>
    <p class="ob-kbd">Гортайте кнопками або клавішами <kbd>←</kbd> <kbd>→</kbd></p>
  </div>
  <div class="hero-foot"><a href="./"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>До панелі</a></div>
</aside>

<main class="side">
  <div class="card" aria-live="polite">
    <div class="ob-bar"><i id="obBar"></i></div>
    <div class="ob-load" id="obLoad"><span class="spin" style="border-color:rgba(59,107,246,.2);border-top-color:var(--accent-2)"></span></div>
    <div id="obMain" hidden>
      <div class="ob-body">
        <div class="ob-top"><span class="ob-num" id="obNum"></span><button type="button" class="ob-skip" id="obSkip">Пропустити</button></div>
        <div id="obStep"></div>
      </div>
      <div class="ob-foot">
        <button type="button" class="btn ghost" id="obPrev">Назад</button>
        <div class="ob-dots" id="obDots"></div>
        <button type="button" class="btn pri" id="obNext">Далі</button>
      </div>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = getApps().length ? getApps()[0] : initializeApp({
  apiKey:"AIzaSyDsA4IQkn5tV41LDK43vzgm0XnRnbdgvTc",
  authDomain:"quizflow-8a978.firebaseapp.com",
  databaseURL:"https://quizflow-8a978-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"quizflow-8a978",
  storageBucket:"quizflow-8a978.firebasestorage.app",
  messagingSenderId:"206469794166",
  appId:"1:206469794166:web:55cd7007b429607acd5257"
});
const auth = getAuth(app), db = getDatabase(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const svg = (d, w = 16) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

const IC = {
  hand:   '<path d="M18 11V6a2 2 0 00-4 0v5M14 10V4a2 2 0 00-4 0v6M10 10.5V6a2 2 0 00-4 0v8a8 8 0 0016 0v-3a2 2 0 00-4 0"/>',
  file:   '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  link:   '<path d="M10 13a5 5 0 007.5.5l3-3a5 5 0 00-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 00-7.5-.5l-3 3a5 5 0 007 7l1.7-1.7"/>',
  chart:  '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  zap:    '<path d="M13 2L3 14h9l-1 8 10-12h-9z"/>',
  flag:   '<path d="M4 22V4M4 4h13l-2 4 2 4H4"/>',
  spark:  '<path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9z"/>',
  folder: '<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  xls:    '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/>',
  users:  '<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8"/>',
  clock:  '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  qr:     '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/>',
  eye:    '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  shield: '<path d="M12 3l8 3v6c0 4.5-3.2 8.5-8 9-4.8-.5-8-4.5-8-9V6l8-3z"/>',
  book:   '<path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>',
  play:   '<circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/>',
  trophy: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/>',
  check:  '<path d="M20 6L9 17l-5-5"/>',
  arrow:  '<path d="M5 12h14M13 5l7 7-7 7"/>',
  help:   '<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 015.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
};

let who = "";
const STEPS = [
  { key: "hi", icon: "hand", nav: "Вітання", navSub: "Що вміє платформа",
    title: () => who ? `Вітаємо, ${esc(who)}!` : "Вітаємо в QuizFlow!",
    text: "QuizFlow допомагає створювати тести, видавати їх групам і бачити результати без ручної перевірки. Ось три речі, з якими ви працюватимете найчастіше:",
    pts: [["file", "Тести", "Питання семи типів, AI-генерація й імпорт"], ["link", "Посилання", "Студенти проходять тест без реєстрації"], ["chart", "Результати", "Оцінки, розбір помилок і журнал"]] },
  { key: "tests", icon: "file", nav: "Тести", navSub: "Конструктор, AI, імпорт",
    title: () => "Створіть тест",
    text: "Розділ <b>Тести</b> — ваша бібліотека. Кожен тест відкривається в конструкторі, де все зберігається автоматично.",
    pts: [["folder", "Папки", "Групуйте тести за предметами чи групами"], ["spark", "AI-генерація", "Вкажіть тему й складність — питання з'являться за хвилину"], ["xls", "Імпорт з Excel", "Перенесіть уже готові питання одним файлом"]],
    go: ["tests", "Відкрити тести"] },
  { key: "links", icon: "link", nav: "Посилання", navSub: "Видача тесту групі",
    title: () => "Видайте тест групі",
    text: "Щоб студенти пройшли тест, створіть <b>посилання</b>. Студент відкриває його, вводить ім'я — і починає.",
    pts: [["users", "Група", "Результати одразу розкладаються за групами"], ["clock", "Розклад і ліміти", "Час відкриття й закриття, кількість спроб"], ["qr", "QR-код", "Покажіть на проєкторі — студенти скануватимуть телефоном"]],
    go: ["links", "Відкрити посилання"] },
  { key: "results", icon: "chart", nav: "Результати", navSub: "Спроби, журнал, аналітика",
    title: () => "Слідкуйте за результатами",
    text: "Усі проходження збираються в розділі <b>Спроби</b>, а оцінки — у <b>Журналі</b> за 12-бальною шкалою.",
    pts: [["eye", "Онлайн зараз", "Хто проходить тест і на якому питанні"], ["shield", "Підозрілі спроби", "Перемикання вкладок, копіювання, скріншоти"], ["book", "Журнал і аналітика", "Експорт оцінок і складні питання тесту"]],
    go: ["attempts", "Відкрити спроби"] },
  { key: "live", icon: "zap", nav: "Живі ігри", navSub: "Вікторина наживо на уроці",
    title: () => "Проведіть живу гру",
    text: "Будь-який тест можна запустити як вікторину наживо: питання на екрані, студенти відповідають з телефонів.",
    pts: [["play", "Запуск", "У меню тесту — «Live гра»"], ["qr", "Підключення", "Студенти входять за PIN-кодом або QR"], ["trophy", "Рейтинг", "Бали за швидкість і п'єдестал у кінці"]] },
  { key: "done", icon: "check", nav: "Готово", navSub: "Перший тест",
    title: () => "Усе готово!",
    text: "Почніть із першого тесту — це займе кілька хвилин. Повернутися до цього знайомства можна кнопкою <b>«Гайд»</b> унизу бічного меню." },
];

let cur = 0, maxSeen = 0, uid = null, saved = false;

function render(dir = 1){
  const s = STEPS[cur], last = cur === STEPS.length - 1;
  maxSeen = Math.max(maxSeen, cur);
  $("obBar").style.width = ((cur + 1) / STEPS.length * 100) + "%";
  $("obNum").textContent = `Крок ${cur + 1} з ${STEPS.length}`;
  $("obSkip").hidden = last;
  const pts = s.pts ? `<ul class="ob-pts">${s.pts.map(([i, b, t]) => `<li><span class="pi">${svg(IC[i])}</span><div><b>${b}</b><span>${t}</span></div></li>`).join("")}</ul>` : "";
  const go = s.go ? `<a class="ob-go" href="${s.go[0]}">${s.go[1]} ${svg(IC.arrow, 14)}</a>` : "";
  const end = last ? `<div class="ob-end">
      <a class="btn pri" href="tests?new=1" data-finish>${svg(IC.spark, 17)}<span>Створити перший тест</span></a>
      <a class="btn ghost" href="links" data-finish>Посилання</a>
      <a class="btn ghost" href="./" data-finish>На головну</a>
    </div>` : "";
  const ic = last ? `style="color:#15803D;background:linear-gradient(135deg,#E7F9EE,#CFF3DD)"` : "";
  $("obStep").innerHTML = `<div class="ob-step${dir < 0 ? " back" : ""}">
    <div class="big-ic" ${ic}>${svg(IC[s.icon], 26)}</div>
    <h2>${s.title()}</h2><p class="sub">${s.text}</p>${pts}${go}${end}</div>`;
  $("obPrev").disabled = cur === 0;
  $("obNext").hidden = last;
  $("obNext").innerHTML = `<span>${cur === STEPS.length - 2 ? "Завершити" : "Далі"}</span>${svg(IC.arrow, 16)}`;
  $("obDots").innerHTML = STEPS.map((x, i) => `<button type="button" data-i="${i}" class="${i === cur ? "on" : i <= maxSeen ? "seen" : ""}" aria-label="Крок ${i + 1}: ${x.nav}"${i === cur ? ' aria-current="step"' : ""}></button>`).join("");
  $("obList").innerHTML = STEPS.map((x, i) => `<button type="button" class="feat${i === cur ? " on" : ""}${i < cur || (i <= maxSeen && i !== cur) ? " done" : ""}" data-i="${i}"${i === cur ? ' aria-current="step"' : ""}>
      <span class="feat-i">${i < cur || (i <= maxSeen && i !== cur) ? svg(IC.check) : svg(IC[x.icon])}</span><div><b>${x.nav}</b><span>${x.navSub}</span></div></button>`).join("");
  history.replaceState(null, "", location.pathname + (cur ? `#${s.key}` : ""));
  if (last) finish();
}
function go(i){
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  if (i === cur) return;
  const dir = i > cur ? 1 : -1; cur = i; render(dir);
}

// Позначка «знайомство пройдено» — щоб головна більше не перенаправляла сюди
async function finish(){
  if (saved || !uid) return;
  saved = true;
  try { localStorage.setItem("qf_ob_seen_" + uid, "1"); } catch {}
  try { await update(ref(db, `teachers/${uid}/meta`), { onboardingDone: true, onboardingAt: Date.now() }); } catch (e) { saved = false; }
}

$("obNext").onclick = () => go(cur + 1);
$("obPrev").onclick = () => go(cur - 1);
$("obSkip").onclick = async () => { await finish(); location.href = "./"; };
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-i]");
  if (b) return go(+b.dataset.i);
  const f = e.target.closest("a[data-finish]");
  if (f && !saved){ e.preventDefault(); await finish(); location.href = f.getAttribute("href"); }
});
document.addEventListener("keydown", e => {
  if ($("obMain").hidden || e.altKey || e.ctrlKey || e.metaKey || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === "ArrowRight"){ e.preventDefault(); go(cur + 1); }
  else if (e.key === "ArrowLeft"){ e.preventDefault(); go(cur - 1); }
});

onAuthStateChanged(auth, async u => {
  if (!u){ location.replace("login?next=onboarding"); return; }
  uid = u.uid;
  try {
    const p = (await get(ref(db, `users/${uid}`))).val();
    if (!p){ location.replace("login?noprofile=1"); return; }
    if (p.blocked === true){ location.replace("login?blocked=1"); return; }
    who = (p.name || "").trim();
  } catch {}
  const at = STEPS.findIndex(s => s.key === location.hash.slice(1));
  cur = at > 0 ? at : 0;
  $("obLoad").hidden = true; $("obMain").hidden = false;
  render();
  $("obNext").focus({ preventScroll: true });
});
</script>
</body>
</html>
