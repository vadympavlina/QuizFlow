<html lang="uk">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMCIgeTE9IjAiIHgyPSIxIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjN0MzQUVEIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjNEY0NkU1Ii8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iOCIgZmlsbD0idXJsKCNnKSIvPjxjaXJjbGUgY3g9IjE2IiBjeT0iMTYiIHI9IjkiIGZpbGw9Im5vbmUiIHN0cm9rZT0id2hpdGUiIHN0cm9rZS13aWR0aD0iMiIvPjxjaXJjbGUgY3g9IjE2IiBjeT0iMTYiIHI9IjQiIGZpbGw9IndoaXRlIi8+PC9zdmc+">

<!-- QR-код для швидкого входу. Якщо CDN недоступний — лобі працює без нього. -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
<style>
  .topbar{position:sticky;top:0;z-index:10;background:rgba(246,245,251,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar .lv-head{max-width:1400px;margin:0 auto;padding:12px 28px}
  .topbar .title{min-width:0;flex:1;font-size:15px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .title b{color:var(--ink)}
  .actions{display:flex;gap:8px;align-items:center;margin-left:auto}
  .lv-btn .k{font:600 10.5px var(--mono);opacity:.7;border:1px solid currentColor;border-radius:5px;padding:0 5px}

  .page{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:22px 28px 60px}

  /* ── Як приєднатись: великим, щоб читалось з останньої парти ── */
  .hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px}
  .join{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:26px 30px}
  .step{font-size:15px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:10px}
  .step .n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 12px var(--mono)}
  .join-url{font:700 clamp(20px,2.4vw,32px) var(--mono);color:var(--ink);word-break:break-all;margin-left:34px}
  .digits{display:flex;gap:8px;flex-wrap:wrap;margin-left:34px}
  .digit{width:clamp(44px,5vw,76px);height:clamp(60px,6.8vw,98px);display:grid;place-items:center;background:var(--accent-soft);border-radius:14px;font:800 clamp(30px,3.8vw,56px) var(--mono);color:var(--accent)}
  .digit.gap{width:12px;background:none}
  .qr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px}
  .qr .box{width:clamp(150px,15vw,230px);aspect-ratio:1}
  .qr svg{width:100%;height:100%;display:block}
  .qr small{font-size:12.5px;color:var(--ink-3);font-weight:600}

  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .meta span{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;color:var(--ink-2)}
  .meta b{color:var(--ink);font-family:var(--mono)}

  .players-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:28px 0 14px}
  .players-h h2{margin:0;font-size:19px}
  .pulse{width:9px;height:9px;border-radius:50%;background:var(--good);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(47,158,98,.2)}50%{box-shadow:0 0 0 8px rgba(47,158,98,.04)}}
  .count{font:700 15px var(--mono);color:var(--accent);background:var(--card);border:1px solid var(--line);padding:4px 12px;border-radius:8px;transition:transform .2s}
  .count.bump{transform:scale(1.2)}
  .off-count{font-size:13px;color:var(--ink-3)}
  .search{margin-left:auto;width:230px;padding:9px 12px;font-size:14px}

  .players{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .player{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;transition:border-color .15s, opacity .3s}
  .player.new{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{from{transform:scale(.85);opacity:0}}
  .player:hover{border-color:var(--accent)}
  .player .av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:0 0 auto;position:relative}
  .player .av::after{content:"";position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--good);border:2.5px solid var(--card)}
  .player.off{opacity:.55}
  .player.off .av::after{background:var(--ink-3)}
  .player .nm{flex:1;min-width:0}
  .player .name{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .player .st{font-size:11.5px;color:var(--ink-3)}
  .player .x{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card-2);color:var(--ink-2);cursor:pointer;font-size:17px;line-height:1;opacity:0;transition:opacity .15s, background .15s}
  .player:hover .x,.player .x:focus-visible{opacity:1}
  .player .x:hover{background:var(--bad);border-color:var(--bad);color:#fff}
  @media (hover:none){ .player .x{opacity:.8} }
  .empty{grid-column:1/-1;text-align:center;padding:48px 20px;border:2px dashed var(--line-2);border-radius:18px;color:var(--ink-2)}
  .empty .big{font-size:40px;margin-bottom:6px}
  .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

  .toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center}
  .undo{background:var(--ink);color:#fff;border-radius:14px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);font-size:14px;animation:toastIn .2s ease-out}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px)}}
  .undo button{background:rgba(255,255,255,.14);border:0;color:#fff;padding:8px 12px;border-radius:9px;font-weight:700;cursor:pointer}

  body.fs .topbar .title,body.fs .search,body.fs .player .x{display:none}
  @media (max-width: 860px){
    .hero{grid-template-columns:1fr}
    .qr{display:none}
    .page,.topbar .lv-head{padding-left:16px;padding-right:16px}
    .topbar .title{display:none}
    .search{margin-left:0;width:100%}
    .hide-sm{display:none}
  }
</style>
</head>
<body>
<div class="topbar">
  <header class="lv-head">
    <span class="lv-brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg></span>live</span>
    <div class="title">Лобі · <b id="game-title">—</b></div>
    <div class="actions">
      <button class="lv-btn ghost danger hide-sm" id="close-btn" type="button" title="Скасувати гру і видалити кімнату">Закрити</button>
      <button class="lv-btn hide-sm" id="fs-btn" type="button" title="Повноекранний режим для проєктора">⛶ <span>На весь екран</span></button>
      <button class="lv-btn" id="copy-btn" type="button"><span>Посилання</span></button>
      <button class="lv-btn primary" id="start-btn" type="button" disabled>▶ Почати гру <span class="k hide-sm">Enter</span></button>
    </div>
  </header>
</div>

<main class="page">
  <div class="hero">
    <section class="lv-card join">
      <div class="step"><span class="n">1</span>Відкрийте на телефоні</div>
      <div class="join-url" id="join-url">—</div>
      <div class="step"><span class="n">2</span>Введіть код гри</div>
      <div class="digits" id="code-digits" aria-label="Код гри"></div>
    </section>
    <section class="lv-card qr" id="qr-card" hidden>
      <div class="box" id="qr"></div>
      <small>або скануйте камерою</small>
    </section>
  </div>
  <div class="meta">
    <span><b id="stat-q">—</b> питань</span>
    <span><b id="stat-time">—</b> с на питання</span>
    <span id="stat-scoring">—</span>
    <span id="stat-shuffle" hidden>🔀 варіанти перемішуються</span>
  </div>

  <div class="players-h">
    <span class="pulse"></span>
    <h2>Гравці</h2>
    <span class="count" id="count-lbl">0</span>
    <span class="off-count" id="off-count"></span>
    <input class="lv-input search" id="player-search" placeholder="Пошук гравця…" aria-label="Пошук гравця">
  </div>
  <div class="players" id="players-grid" aria-live="polite"></div>
</main>
<div class="toasts" id="toasts"></div>

<script type="module">
import {
  db, ref, get, update, onValue, requireTeacher, readParams, isValidCode, fatal, toast,
  esc, initialsOf, avatarColor, joinUrl, HOME_URL, serverNow, isActive, isOnline,
} from "./live-core.js";

const $ = (id) => document.getElementById(id);
const user = await requireTeacher();
const { code } = readParams("code");
if (!isValidCode(code)) fatal("Невірний код кімнати");

// Лише потрібні поля кімнати, без відповідей
const [stS, metaS] = await Promise.all([
  get(ref(db, `rooms/${code}/status`)),
  Promise.all(["hostUid", "testTitle", "questions", "timePerQ", "scoring", "options"].map(k => get(ref(db, `rooms/${code}/${k}`)).then(s => s.val()))),
]);
const status = stS.val();
const [hostUid, testTitle, questions, timePerQ, scoring, options] = metaS;
if (!status) fatal("Кімнату не знайдено — можливо, її вже закрито");
if (hostUid && hostUid !== user.uid) fatal("Це не ваша кімната");
if (["question", "paused", "reveal"].includes(status)) { location.replace(`play-teacher?code=${code}`); throw new Error("redirect"); }
if (status === "leaderboard") { location.replace(`podium?code=${code}`); throw new Error("redirect"); }
if (status === "finished") fatal("Цю гру вже завершено");

// ─── Як приєднатись ────────────────────────────────────────────────────
const url = joinUrl(code);
$("join-url").textContent = url.replace(/^https?:\/\//, "").replace(/\?.*$/, "");
$("code-digits").innerHTML = [...code].map((d, i) => (i === 4 ? `<div class="digit gap"></div>` : "") + `<div class="digit">${d}</div>`).join("");
function renderQR() {
  if (typeof window.qrcode !== "function") return false;
  try {
    const qr = window.qrcode(0, "M"); qr.addData(url); qr.make();
    $("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    $("qr-card").hidden = false;
  } catch (e) { console.warn("qr:", e); }
  return true;
}
if (!renderQR()) window.addEventListener("load", renderQR, { once: true });

$("game-title").textContent = testTitle || "—";
document.title = `Лобі ${code.slice(0, 4)} ${code.slice(4)} · QuizFlow Live`;
$("stat-q").textContent = (questions || []).length;
$("stat-time").textContent = timePerQ || 20;
$("stat-scoring").textContent = scoring === "speed" ? "⚡ бали за швидкість" : "✓ бали за правильність";
$("stat-shuffle").hidden = !options?.shuffle;

$("copy-btn").addEventListener("click", async () => {
  const lbl = $("copy-btn").querySelector("span");
  try { await navigator.clipboard.writeText(url); lbl.textContent = "Скопійовано ✓"; }
  catch { prompt("Скопіюйте посилання:", url); }
  setTimeout(() => { lbl.textContent = "Посилання"; }, 2000);
});
$("fs-btn").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => {});
});
document.addEventListener("fullscreenchange", () => {
  document.body.classList.toggle("fs", !!document.fullscreenElement);
  $("fs-btn").querySelector("span").textContent = document.fullscreenElement ? "Вийти з повного екрана" : "На весь екран";
});

// ─── Гравці: точкове оновлення DOM замість перемальовування всієї сітки ──
let players = {};
const pendingKick = {};   // pid -> timer
const cards = new Map();  // pid -> element
const grid = $("players-grid");
let firstRender = true;

function card(pid) {
  let el = cards.get(pid);
  if (!el) {
    el = document.createElement("div");
    el.className = "player" + (firstRender ? "" : " new");
    el.innerHTML = `<div class="av"></div><div class="nm"><div class="name"></div><div class="st"></div></div><button class="x" type="button" title="Видалити з гри">×</button>`;
    el.querySelector(".x").dataset.kick = pid;
    cards.set(pid, el);
  }
  return el;
}

function render() {
  const q = $("player-search").value.trim().toLowerCase();
  const list = Object.entries(players)
    .filter(([pid, p]) => isActive(p) && !pendingKick[pid])
    .sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0));
  const online = list.filter(([, p]) => isOnline(p)).length;

  const cnt = $("count-lbl");
  if (cnt.textContent !== String(online)) { cnt.textContent = online; cnt.classList.add("bump"); setTimeout(() => cnt.classList.remove("bump"), 200); }
  const off = list.length - online;
  $("off-count").textContent = off ? `+ ${off} не в мережі` : "";
  $("start-btn").disabled = false;

  // Прибираємо зайві картки
  const keep = new Set(list.map(([pid]) => pid));
  for (const [pid, el] of cards) if (!keep.has(pid)) { el.remove(); cards.delete(pid); }

  grid.querySelector(".empty")?.remove();
  let prev = null;
  list.forEach(([pid, p]) => {
    const el = card(pid);
    const nick = p.nickname || "—";
    if (el.dataset.nick !== nick) {
      el.dataset.nick = nick;
      const av = el.querySelector(".av");
      av.textContent = initialsOf(nick); av.style.background = avatarColor(nick);
      el.querySelector(".name").textContent = nick; el.querySelector(".name").title = nick;
      el.querySelector(".x").setAttribute("aria-label", `Видалити ${nick}`);
    }
    const on = isOnline(p);
    el.classList.toggle("off", !on);
    el.querySelector(".st").textContent = on ? "у грі" : "не в мережі";
    el.hidden = !!q && !nick.toLowerCase().includes(q);
    // Порядок — за часом входу; переставляємо лише якщо треба
    const want = prev ? prev.nextSibling : grid.firstChild;
    if (want !== el) grid.insertBefore(el, want);
    prev = el;
  });
  if (!list.length) grid.insertAdjacentHTML("beforeend", `<div class="empty"><div class="big">📱</div><b>Чекаємо на гравців</b>Попросіть учнів відкрити посилання та ввести код</div>`);
  else if (q && list.every(([pid]) => cards.get(pid).hidden)) grid.insertAdjacentHTML("beforeend", `<div class="empty"><b>Нікого не знайдено</b>за запитом «${esc(q)}»</div>`);
  firstRender = false;
}
$("player-search").addEventListener("input", render);

// Видалення з можливістю скасувати: картку ховаємо одразу, у базі — за 5 с
grid.addEventListener("click", (e) => {
  const pid = e.target.closest("[data-kick]")?.dataset.kick;
  if (!pid || pendingKick[pid]) return;
  const nick = players[pid]?.nickname || "гравця";
  const t = document.createElement("div");
  t.className = "undo";
  t.innerHTML = `<span>Видалено <b>${esc(nick)}</b></span><button type="button">Скасувати</button>`;
  pendingKick[pid] = setTimeout(async () => {
    t.remove();
    try { await update(ref(db, `rooms/${code}/players/${pid}`), { active: false }); }
    catch (err) { toast("Не вдалося видалити: " + err.message, "err"); }
    delete pendingKick[pid]; render();
  }, 5000);
  t.querySelector("button").addEventListener("click", () => { clearTimeout(pendingKick[pid]); delete pendingKick[pid]; t.remove(); render(); });
  $("toasts").appendChild(t);
  render();
});

onValue(ref(db, `rooms/${code}/players`), snap => { players = snap.val() || {}; render(); });

// ─── Старт / закриття ──────────────────────────────────────────────────
let leaving = false;
async function flushKicks() {
  const ids = Object.keys(pendingKick);
  if (!ids.length) return;
  const upd = {};
  ids.forEach(pid => { clearTimeout(pendingKick[pid]); delete pendingKick[pid]; upd[`rooms/${code}/players/${pid}/active`] = false; });
  document.querySelectorAll(".undo").forEach(t => t.remove());
  await update(ref(db), upd);
}

$("start-btn").addEventListener("click", async () => {
  const btn = $("start-btn");
  if (btn.disabled) return;
  const n = Object.entries(players).filter(([pid, p]) => isOnline(p) && !pendingKick[pid]).length;
  if (n === 0 && !confirm("У лобі немає жодного гравця онлайн. Почати гру попри це?")) return;
  btn.disabled = true;
  try {
    await flushKicks();
    leaving = true;
    const now = serverNow();
    await update(ref(db, `rooms/${code}`), { status: "question", currentQ: 0, questionStartedAt: now, pausedLeft: null, startLog: null, startedAt: now });
    location.href = `play-teacher?code=${code}`;
  } catch (e) {
    leaving = false; btn.disabled = false;
    toast("Не вдалося почати гру: " + e.message, "err");
  }
});

$("close-btn").addEventListener("click", async () => {
  if (!confirm("Закрити кімнату? Учні побачать, що гру скасовано.")) return;
  try {
    leaving = true;
    await update(ref(db), { [`rooms/${code}`]: null, [`teachers/${user.uid}/liveRooms/${code}`]: null });
    location.href = HOME_URL;
  } catch (e) { leaving = false; toast("Помилка: " + e.message, "err"); }
});

// Гру запустили з іншої вкладки
onValue(ref(db, `rooms/${code}/status`), snap => {
  if (!leaving && snap.val() === "question") location.href = `play-teacher?code=${code}`;
});

document.addEventListener("keydown", (e) => {
  if (e.target.closest("input,textarea,button")) return;
  if (e.key === "Enter") { e.preventDefault(); $("start-btn").click(); }
  if (e.key === "f" || e.key === "а") $("fs-btn").click();
});
</script>
</body>
</html>
