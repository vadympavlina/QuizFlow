<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1920"/>
<title>QuizFlow Live · Лобі</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMCIgeTE9IjAiIHgyPSIxIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjN0MzQUVEIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjNEY0NkU1Ii8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iOCIgZmlsbD0idXJsKCNnKSIvPjxjaXJjbGUgY3g9IjE2IiBjeT0iMTYiIHI9IjkiIGZpbGw9Im5vbmUiIHN0cm9rZT0id2hpdGUiIHN0cm9rZS13aWR0aD0iMiIvPjxjaXJjbGUgY3g9IjE2IiBjeT0iMTYiIHI9IjQiIGZpbGw9IndoaXRlIi8+PC9zdmc+">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:Manrope,system-ui,sans-serif;color:#F4F5FB;
    background:
      radial-gradient(1200px 800px at 20% 0%, rgba(124,58,237,.18), transparent 60%),
      radial-gradient(900px 600px at 100% 100%, rgba(59,130,246,.22), transparent 65%),
      linear-gradient(160deg,#0A1240 0%, #0E1648 40%, #112B7A 100%);
    min-height:100vh;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse at center, black 30%, transparent 90%);
  }
  .topbar{
    position:relative; z-index:2;
    display:grid; grid-template-columns: 220px 1fr auto;
    gap:24px; padding:20px 36px; align-items:center;
    background:linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.0));
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .code-box{
    display:flex; flex-direction:column; gap:6px;
    background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);
    border-radius:16px; padding:10px 16px; backdrop-filter: blur(8px);
  }
  .code-box .label{font-size:10px;font-weight:800;letter-spacing:.16em;color:#A78BFA;text-transform:uppercase}
  .code-box .digits{display:flex;gap:6px}
  .code-box .digit{
    width:32px;height:40px;display:grid;place-items:center;
    background:linear-gradient(180deg,#1A245C,#0F1844);
    border:1px solid rgba(167,139,250,.3);
    border-radius:8px;font-family:"Geist Mono",monospace;
    font-weight:800;font-size:20px;color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  }
  .topbar-mid{text-align:center;min-width:0}
  .live-badge{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#C4B5FD;margin-bottom:4px}
  .live-badge .dot{width:7px;height:7px;border-radius:50%;background:#A78BFA;box-shadow:0 0 0 4px rgba(167,139,250,.25);animation:pulse 1.6s infinite}
  .topbar-mid h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .actions-right{display:flex; gap:10px; justify-content:flex-end; align-items:center}
  .btn{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
    color:#fff;padding:11px 18px;border-radius:13px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;transition:background .15s;
  }
  .btn:hover{background:rgba(255,255,255,.1)}
  .btn-primary{
    background:linear-gradient(135deg,#A78BFA,#7C3AED);border:0;
    box-shadow:0 12px 30px rgba(124,58,237,.45), inset 0 1px 0 rgba(255,255,255,.25);
    padding:12px 22px;font-size:14px;font-weight:800;
  }
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

  .meta-strip{position:relative;z-index:1;display:flex;gap:10px;flex-wrap:wrap;padding:20px 36px 0}
  .meta-pill{
    display:inline-flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    border-radius:999px;padding:9px 16px 9px 14px;font-size:13px;color:#9098C2;font-weight:600;
  }
  .meta-pill b{color:#fff;font-family:"Geist Mono",monospace;font-weight:800;font-size:14.5px}

  .section-h{
    margin:32px 36px 16px;display:flex;align-items:center;gap:14px;
  }
  .section-h .pulse{
    width:10px;height:10px;border-radius:50%;background:#22C55E;
    box-shadow:0 0 0 4px rgba(34,197,94,.25);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(34,197,94,.25)}50%{box-shadow:0 0 0 8px rgba(34,197,94,.05)}}
  .section-h h2{margin:0;font-size:20px;font-weight:800}
  .section-h .count{font-family:"Geist Mono",monospace;font-size:14px;color:#A78BFA;font-weight:800;background:rgba(124,58,237,.15);border:1px solid rgba(124,58,237,.3);padding:5px 11px;border-radius:999px}
  .section-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px;color:#9098C2}
  .search-input{
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:11px;
    padding:9px 14px;color:#fff;font:inherit;font-size:13.5px;outline:none;width:200px;
    transition:border-color .15s, background .15s;
  }
  .search-input::placeholder{color:#7B85B5}
  .search-input:focus{border-color:#A78BFA;background:rgba(255,255,255,.08)}

  .players{
    display:grid;grid-template-columns:repeat(4, 1fr);gap:16px;padding:0 36px 100px;
  }
  .player{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px;position:relative;
    transition:transform .2s, border-color .15s, opacity .2s;
    animation: pop .35s ease-out backwards;
  }
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .player.removing{opacity:0;transform:scale(.85)}
  .player:hover{border-color:rgba(167,139,250,.4)}
  .player .av{
    width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;
    font-weight:800;font-size:17px;flex:0 0 auto;
  }
  .player .name{font-weight:800;font-size:17px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .player .meta{font-size:12px;color:#A6B0D6;margin-top:2px;font-family:"Geist Mono",monospace}
  .player .x{
    position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:9px;
    background:rgba(255,255,255,.08);color:#A6B0D6;border:0;cursor:pointer;
    display:grid;place-items:center;font-size:16px;line-height:1;opacity:0;transition:opacity .15s, background .15s, color .15s;
  }
  .player:hover .x, .player .x:focus-visible{opacity:1}
  .player .x:hover{background:rgba(239,68,68,.22);color:#fff}
  .empty-card{
    border:2px dashed rgba(255,255,255,.14);background:rgba(255,255,255,.02);
    border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px;color:#7B85B5;
  }
  .empty-card .av{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.05);display:grid;place-items:center;color:#525B86}
  .no-results{grid-column:1/-1;text-align:center;padding:40px;color:#7B85B5;font-size:14px}

  .undo-toast{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(0);
    background:#1A245C;border:1px solid rgba(167,139,250,.35);border-radius:16px;
    padding:14px 16px 14px 20px;display:flex;align-items:center;gap:16px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:50;font-size:14px;
    animation:toastIn .2s ease-out;
  }
  @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .undo-toast b{font-weight:800}
  .undo-toast button{
    background:rgba(167,139,250,.18);border:1px solid rgba(167,139,250,.4);color:#fff;
    padding:8px 14px;border-radius:10px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;
  }
  .undo-toast button:hover{background:rgba(167,139,250,.3)}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important} }
</style>
</head>
<body>

<div class="topbar">
  <div class="code-box">
    <div class="label">Код гри</div>
    <div class="digits" id="code-digits"></div>
  </div>
  <div class="topbar-mid">
    <div class="live-badge"><span class="dot"></span>Лобі відкрите</div>
    <h1 id="game-title">—</h1>
  </div>
  <div class="actions-right">
    <button class="btn" onclick="copyLink(this)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Скопіювати посилання
    </button>
    <button class="btn btn-primary" id="start-btn" onclick="startGame()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/></svg>
      Почати гру
    </button>
  </div>
</div>

<div class="meta-strip">
  <span class="meta-pill"><b id="stat-q">—</b> питань</span>
  <span class="meta-pill"><b id="stat-time">—</b>с на питання</span>
  <span class="meta-pill" id="stat-scoring">—</span>
</div>

<div class="section-h">
  <span class="pulse"></span>
  <h2>Гравці у лобі</h2>
  <span class="count" id="count-lbl">0</span>
  <span class="right" id="last-joined"></span>
  <input class="search-input" id="player-search" placeholder="Пошук гравця…" oninput="renderPlayers()">
</div>

<div class="players" id="players-grid"></div>

<div id="toast-slot"></div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const FC = {apiKey:"AIzaSyDsA4IQkn5tV41LDK43vzgm0XnRnbdgvTc",authDomain:"quizflow-8a978.firebaseapp.com",databaseURL:"https://quizflow-8a978-default-rtdb.europe-west1.firebasedatabase.app",projectId:"quizflow-8a978",storageBucket:"quizflow-8a978.firebasestorage.app",messagingSenderId:"206469794166",appId:"1:206469794166:web:55cd7007b429607acd5257"};
const app  = getApps().length ? getApps()[0] : initializeApp(FC);
const auth = getAuth(app);
const db   = getDatabase(app);

const fbUser = await new Promise(r => { const u = onAuthStateChanged(auth, x => { u(); r(x); }); });
if (!fbUser) { location.href = "../login.html"; throw new Error(); }

const code = new URLSearchParams(location.search).get("code");
if (!code) { location.href = "../index.html"; throw new Error(); }

// Fill code digits
const digitsEl = document.getElementById("code-digits");
code.split("").forEach(d => {
  const el = document.createElement("div");
  el.className = "digit"; el.textContent = d;
  digitsEl.appendChild(el);
});

// Load room info
const roomSnap = await get(ref(db, `rooms/${code}`));
if (!roomSnap.exists()) { alert("Кімната не знайдена"); location.href = "../index.html"; throw new Error(); }
const room = roomSnap.val();

document.getElementById("game-title").textContent = room.testTitle || "—";
document.getElementById("stat-q").textContent = (room.questions||[]).length;
document.getElementById("stat-time").innerHTML = (room.timePerQ||20);
document.getElementById("stat-scoring").textContent = room.scoring === "speed" ? "⚡ За швидкість" : "✓ За правильність";

const AV_COLORS = ["linear-gradient(135deg,#F59E0B,#B45309)","linear-gradient(135deg,#3B82F6,#1D4ED8)","linear-gradient(135deg,#10B981,#047857)","linear-gradient(135deg,#EF4444,#B91C1C)","linear-gradient(135deg,#A78BFA,#6D28D9)","linear-gradient(135deg,#EC4899,#BE185D)","linear-gradient(135deg,#06B6D4,#0E7490)","linear-gradient(135deg,#FACC15,#CA8A04)"];
function playerColor(name) { return AV_COLORS[(name||"?").charCodeAt(0) % AV_COLORS.length]; }
function initialsOf(nick) {
  const parts = String(nick||"").trim().split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0]+parts[1][0]).toUpperCase();
  return (nick||"??").slice(0,2).toUpperCase();
}

let lastPlayers = {};
const pendingKick = {}; // pid -> {timer, nickname}

// ─── Видалення з undo-можливістю: одразу ховаємо картку, реально видаляємо
// з бази лише за 4с, якщо викладач не натисне "Скасувати" ─────────────────
window.requestKick = (pid, nickname) => {
  if (pendingKick[pid]) return;
  pendingKick[pid] = {
    nickname,
    timer: setTimeout(async () => {
      delete pendingKick[pid];
      await update(ref(db, `rooms/${code}/players/${pid}`), { active: false });
    }, 4000)
  };
  renderPlayers(); // одразу приховати картку
  showUndoToast(nickname, () => {
    clearTimeout(pendingKick[pid].timer);
    delete pendingKick[pid];
    renderPlayers();
  });
};

function showUndoToast(nickname, onUndo) {
  const slot = document.getElementById("toast-slot");
  slot.innerHTML = "";
  const t = document.createElement("div");
  t.className = "undo-toast";
  t.innerHTML = `<span>Видалено <b>${nickname}</b></span><button>Скасувати</button>`;
  t.querySelector("button").addEventListener("click", () => { t.remove(); onUndo(); });
  slot.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

window.copyLink = (btn) => {
  const url = `${location.origin}/play.html?code=${code}`;
  navigator.clipboard.writeText(url).then(() => {
    const orig = btn.innerHTML;
    btn.textContent = "Скопійовано!";
    setTimeout(() => { btn.innerHTML = orig; }, 2000);
  });
};
window.startGame = async () => {
  const activeCount = Object.entries(lastPlayers).filter(([pid,p]) => p.active !== false && !pendingKick[pid]).length;
  if (activeCount === 0 && !confirm("У лобі ще немає жодного гравця. Розпочати гру попри це?")) return;
  await update(ref(db, `rooms/${code}`), {
    status: "question", currentQ: 0, questionStartedAt: Date.now()
  });
  location.href = `play-teacher.html?code=${code}`;
};

// ─── Рендер сітки гравців (викликається і з realtime-слухача, і локально
// при пошуку/undo, щоб не чекати на round-trip до Firebase) ────────────────
window.renderPlayers = () => {
  const q = (document.getElementById("player-search").value || "").trim().toLowerCase();
  const all = Object.entries(lastPlayers).filter(([,p]) => p.active !== false);
  const visible = all.filter(([pid]) => !pendingKick[pid]);
  const filtered = q ? visible.filter(([,p]) => (p.nickname||"").toLowerCase().includes(q)) : visible;

  document.getElementById("count-lbl").textContent = visible.length;
  if (visible.length > 0) {
    const last = visible[visible.length - 1][1];
    document.getElementById("last-joined").textContent = `Останній: ${last.nickname}`;
  } else {
    document.getElementById("last-joined").textContent = "";
  }

  const grid = document.getElementById("players-grid");

  if (q && filtered.length === 0) {
    grid.innerHTML = `<div class="no-results">Нікого не знайдено за запитом «${q}»</div>`;
    return;
  }

  grid.innerHTML = filtered.map(([pid, p], i) => {
    const initials = initialsOf(p.nickname);
    return `<div class="player" style="animation-delay:${Math.min(i*25,300)}ms">
      <div class="av" style="background:${playerColor(p.nickname)}">${initials}</div>
      <div style="min-width:0;flex:1">
        <div class="name">${p.nickname}</div>
        <div class="meta">підключено</div>
      </div>
      <button class="x" aria-label="Видалити ${p.nickname}" onclick="requestKick('${pid}','${String(p.nickname||"").replace(/'/g,"\\'")}')">×</button>
    </div>`;
  }).join("") + (q ? "" : Array.from({length: Math.max(0, 4 - filtered.length)}).map(() =>
    `<div class="empty-card">
      <div class="av"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div style="flex:1"><div style="font-weight:700;font-size:13px">Вільне місце</div><div style="height:8px;background:rgba(255,255,255,.06);border-radius:4px;margin-top:6px;width:70%"></div></div>
    </div>`
  ).join(""));
};

// Realtime players listener
onValue(ref(db, `rooms/${code}/players`), snap => {
  lastPlayers = snap.val() || {};
  renderPlayers();
});


// Watch for game start from another tab
onValue(ref(db, `rooms/${code}/status`), snap => {
  if (snap.val() === "question") location.href = `play-teacher.html?code=${code}`;
});
</script>
</body>
</html>
