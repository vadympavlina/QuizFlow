<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1920"/>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSdnJyB4MT0nMCcgeTE9JzAnIHgyPScxJyB5Mj0nMSc+PHN0b3Agb2Zmc2V0PScwJyBzdG9wLWNvbG9yPSclMjM3QzNBRUQnLz48c3RvcCBvZmZzZXQ9JzEnIHN0b3AtY29sb3I9JyUyMzRGNDZFNScvPjwvbGluZWFyR3JhZGllbnQ+PC9kZWZzPjxyZWN0IHdpZHRoPSczMicgaGVpZ2h0PSczMicgcng9JzgnIGZpbGw9J3VybCglMjNnKScvPjxjaXJjbGUgY3g9JzE2JyBjeT0nMTYnIHI9JzknIGZpbGw9J25vbmUnIHN0cm9rZT0nd2hpdGUnIHN0cm9rZS13aWR0aD0nMicvPjxjaXJjbGUgY3g9JzE2JyBjeT0nMTYnIHI9JzQnIGZpbGw9J3doaXRlJy8+PC9zdmc+">
<title>QuizFlow Live · Фінал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html{margin:0;padding:0}
body{margin:0;padding:0}
  body{
    font-family:Manrope,system-ui,sans-serif;color:#fff;
    background:
      radial-gradient(900px 600px at 50% 0%, rgba(252,211,77,.18), transparent 60%),
      radial-gradient(1000px 700px at 50% 100%, rgba(124,58,237,.25), transparent 70%),
      linear-gradient(160deg,#0A1240,#0F1844 50%,#1E1A6E);
    min-height:100vh;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size:64px 64px;
  }
  #theme-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .confetti i{position:absolute;width:8px;height:14px;animation:fall 6s linear infinite;top:-20px;border-radius:2px}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  .header{text-align:center;padding:36px 0 20px;position:relative;z-index:2}
  .header .meta{font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#A78BFA;margin-bottom:10px}
  .header h1{font-size:78px;font-weight:900;letter-spacing:-.04em;margin:0;line-height:1;text-shadow:0 4px 18px rgba(0,0,0,.4)}
  .header h1 span{background:linear-gradient(135deg,#FCD34D,#F59E0B);-webkit-background-clip:text;background-clip:text;color:transparent}
  .header .quiz{margin-top:8px;font-size:18px;color:#A6B0D6}

  .podium-wrap{
    position:relative;z-index:2;display:flex;gap:22px;justify-content:center;flex-wrap:wrap;
    max-width:1180px;margin:32px auto 12px;padding:0 32px;align-items:flex-end;
  }
  .pod-col{display:flex;flex-direction:column;align-items:center;width:340px;flex:0 0 auto}
  .pod-card{
    width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
    border-radius:22px;padding:24px;text-align:center;backdrop-filter:blur(8px);
  }
  .pod-card .av{
    width:84px;height:84px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center;
    color:#fff;font-weight:800;font-size:30px;
    box-shadow:0 14px 30px rgba(0,0,0,.35);
  }
  .pod-card .name{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .pod-card .score{margin-top:12px;font-family:"Geist Mono",monospace;font-size:34px;font-weight:800;letter-spacing:-.02em}
  .pod-card .extra{margin-top:6px;font-size:11.5px;color:#9098C2;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

  /* Кілька гравців на одному щаблі (нічия) */
  .tie-badge{
    display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:#FCD34D;background:rgba(252,211,77,.15);border:1px solid rgba(252,211,77,.3);
    padding:4px 11px;border-radius:999px;margin-bottom:12px;
  }
  .pod-score-shared{font-family:"Geist Mono",monospace;font-size:30px;font-weight:800;margin-bottom:14px}
  .pod-players{display:flex;flex-direction:column;gap:9px;max-height:280px;overflow-y:auto;padding-right:2px}
  .pod-player{display:flex;align-items:center;gap:10px;text-align:left}
  .pod-player .av{
    width:38px;height:38px;border-radius:11px;margin:0;display:grid;place-items:center;
    color:#fff;font-weight:800;font-size:13px;flex:0 0 auto;box-shadow:0 6px 14px rgba(0,0,0,.3);
  }
  .pod-player .info{min-width:0;flex:1}
  .pod-player .name{font-size:14.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pod-player .sub{font-size:10px;color:#9098C2;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:1px}

  .pod-step{
    width:100%;border-radius:22px 22px 0 0;display:grid;place-items:center;
    background:linear-gradient(180deg,#5B21B6,#312E81);
    color:#fff;font-family:"Geist Mono",monospace;font-size:88px;font-weight:900;line-height:1;
    border:1px solid rgba(255,255,255,.08);border-bottom:0;
    text-shadow:0 4px 12px rgba(0,0,0,.4);
  }
  .pod-1 .pod-step{height:240px;background:linear-gradient(180deg,#FCD34D,#D97706);color:#451A03}
  .pod-2 .pod-step{height:180px;background:linear-gradient(180deg,#E5E7EB,#9CA3AF);color:#111827}
  .pod-3 .pod-step{height:140px;background:linear-gradient(180deg,#FB923C,#9A3412);color:#451A03}
  .pod-1 .av{background:linear-gradient(135deg,#FCD34D,#D97706);color:#451A03;outline:4px solid #FCD34D;outline-offset:4px}
  .pod-2 .av{background:linear-gradient(135deg,#9CA3AF,#4B5563)}
  .pod-3 .av{background:linear-gradient(135deg,#FB923C,#9A3412)}
  .crown{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:48px;filter:drop-shadow(0 6px 14px rgba(252,211,77,.5))}
  .pod-1 .pod-card{background:linear-gradient(180deg, rgba(252,211,77,.18), rgba(255,255,255,.05));border-color:rgba(252,211,77,.35)}

  .standings{
    max-width:1180px;margin:48px auto 60px;padding:0 32px;position:relative;z-index:2;
  }
  .standings h2{font-size:20px;font-weight:800;margin:0 0 16px;display:flex;align-items:center;gap:10px;color:#C4B5FD}
  .standings h2 small{margin-left:auto;font-size:12px;font-weight:700;color:#9098C2;letter-spacing:.08em;text-transform:uppercase}

  .row{
    display:grid;grid-template-columns:48px 1fr 90px 120px 120px;gap:20px;align-items:center;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;
    padding:14px 20px;margin-bottom:8px;transition:background .15s;
  }
  .row:hover{background:rgba(255,255,255,.06)}
  .row .rank{font-family:"Geist Mono",monospace;font-size:18px;font-weight:800;color:#A6B0D6;text-align:center}
  .row .who{display:flex;align-items:center;gap:14px;min-width:0}
  .row .av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:0 0 auto}
  .row .name{font-weight:700;font-size:15px;letter-spacing:-.01em}
  .row .stat{font-family:"Geist Mono",monospace;font-size:14px;font-weight:700;color:#A6B0D6;text-align:center}
  .row .stat b{color:#fff}
  .row .score{font-family:"Geist Mono",monospace;font-size:18px;font-weight:800;text-align:right;color:#FCD34D}

  .footer-cta{
    text-align:center;padding-bottom:60px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;
    position:relative;z-index:2;
  }
  .btn{
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;
    padding:14px 22px;border-radius:14px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;
  }
  .btn-primary{background:linear-gradient(135deg,#A78BFA,#7C3AED);border:0;box-shadow:0 14px 30px rgba(124,58,237,.4)}
</style>
</head>
<body>
<div id="theme-overlay"></div>
<div class="confetti" id="confetti"></div>

<div class="header">
  <div class="meta">QuizFlow Live · Фінальні результати</div>
  <h1>🏆 <span id="test-title">—</span></h1>
  <div class="quiz" id="game-meta">— питань · — гравців</div>
</div>

<div class="podium-wrap" id="podium-wrap"></div>

<div class="standings">
  <h2>📊 Усі гравці <small id="total-lbl">— учасників</small></h2>
  <div id="standings-list"></div>
</div>

<div class="footer-cta">
  <button class="btn btn-primary" onclick="endGame()">↻ Завершити гру</button>
</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const FC = {apiKey:"AIzaSyDsA4IQkn5tV41LDK43vzgm0XnRnbdgvTc",authDomain:"quizflow-8a978.firebaseapp.com",databaseURL:"https://quizflow-8a978-default-rtdb.europe-west1.firebasedatabase.app",projectId:"quizflow-8a978",storageBucket:"quizflow-8a978.firebasestorage.app",messagingSenderId:"206469794166",appId:"1:206469794166:web:55cd7007b429607acd5257"};
const app  = getApps().length ? getApps()[0] : initializeApp(FC);
const auth = getAuth(app);
const db   = getDatabase(app);

const fbUser = await new Promise(r => { const u = onAuthStateChanged(auth, x => { u(); r(x); }); });
if (!fbUser) { location.href = "../login.html"; throw new Error(); }

const code = new URLSearchParams(location.search).get("code");
if (!code) { location.href = "../index.html"; throw new Error(); }

const roomSnap = await get(ref(db, `rooms/${code}`));
if (!roomSnap.exists()) { location.href = "../index.html"; throw new Error(); }
const room = roomSnap.val();

document.getElementById("test-title").textContent = room.testTitle || "—";

// Calc scores
const ansSnap = await get(ref(db, `rooms/${code}/answers`));
const allAns = ansSnap.val() || {};
const scores = {};
const correctCount = {};
Object.entries(allAns).forEach(([qi, qA]) => {
  const q = (room.questions||[])[Number(qi)];
  Object.entries(qA||{}).forEach(([pid, ans]) => {
    scores[pid] = (scores[pid]||0) + (ans.points||0);
    if (!correctCount[pid]) correctCount[pid] = 0;
    if (ans.isCorrect) correctCount[pid]++;
  });
});

const players = room.players || {};
const list = Object.entries(players)
  .filter(([,p]) => p.active !== false)
  .map(([pid, p]) => ({
    pid, nickname: p.nickname,
    score: scores[pid]||0,
    correct: correctCount[pid]||0,
    initials: initialsOf(p.nickname)
  }))
  .sort((a,b) => b.score - a.score);

// Щільне ранжування: однаковий бал = однакове місце, але наступний
// відмінний результат завжди йде на +1 місце (1,1,2,3 — а не 1,1,3,4).
// Завдяки цьому 1/2/3 місця на подіумі ніколи не "згорають" через нічию.
let _rank = 0, _prevScore = null;
list.forEach((p) => {
  if (p.score !== _prevScore) { _rank++; _prevScore = p.score; }
  p.rank = _rank;
});

const totalQ = (room.questions||[]).length;
document.getElementById("game-meta").textContent = `${totalQ} питань · ${list.length} гравців`;
document.getElementById("total-lbl").textContent = `${list.length} учасників`;

// Theme overlay
const GRAD_CSS = {
  "g-default":"linear-gradient(135deg,#1E3A8A,#0F1844)","g-night":"linear-gradient(135deg,#0A0F2C,#1F1F3F)",
  "g-forest":"linear-gradient(135deg,#064E3B,#022C22)","g-amber":"linear-gradient(135deg,#9A3412,#7C2D12)",
  "g-grape":"linear-gradient(135deg,#581C87,#312E81)","g-sun":"linear-gradient(135deg,#F59E0B,#B45309)",
  "g-ocean":"linear-gradient(135deg,#0E7490,#1E3A8A)","g-violet":"linear-gradient(135deg,#7C3AED,#4338CA)",
  "g-mint":"linear-gradient(135deg,#10B981,#047857)","g-sky":"linear-gradient(135deg,#60A5FA,#2563EB)",
  "g-jade":"linear-gradient(135deg,#34D399,#0F766E)","g-rose":"linear-gradient(135deg,#FB7185,#BE185D)",
  "g-magenta":"linear-gradient(135deg,#E879F9,#A21CAF)"
};
if (room.theme?.grad) {
  const ov = document.getElementById("theme-overlay");
  ov.style.background = GRAD_CSS[room.theme.grad] || GRAD_CSS["g-default"];
  ov.style.opacity = "0.3";
}

const AV_COLORS = [
  "linear-gradient(135deg,#3B82F6,#1D4ED8)","linear-gradient(135deg,#10B981,#047857)",
  "linear-gradient(135deg,#EF4444,#B91C1C)","linear-gradient(135deg,#A78BFA,#6D28D9)",
  "linear-gradient(135deg,#F59E0B,#B45309)","linear-gradient(135deg,#EC4899,#BE185D)",
  "linear-gradient(135deg,#06B6D4,#0E7490)","linear-gradient(135deg,#FACC15,#CA8A04)"
];
function avColor(name){ return AV_COLORS[(name||"?").charCodeAt(0)%AV_COLORS.length]; }
function initialsOf(nick){
  const parts = String(nick||"").trim().split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0]+parts[1][0]).toUpperCase();
  return (nick||"??").slice(0,2).toUpperCase();
}

// Групуємо гравців за місцем (rank), окремо топ-3 для подіуму й решта для списку
const groups = {};
list.forEach(p => { (groups[p.rank] = groups[p.rank] || []).push(p); });

const podiumRanks = Object.keys(groups).map(Number).filter(r => r <= 3).sort((a,b) => a-b);
// Класичний порядок відображення 2-1-3, коли присутні всі три місця;
// якщо через нічию якогось місця немає — просто зліва направо за зростанням.
const displayRanks = podiumRanks.length === 3 ? [podiumRanks[1], podiumRanks[0], podiumRanks[2]] : podiumRanks;

const podEl = document.getElementById("podium-wrap");
podEl.innerHTML = displayRanks.map(rank => {
  const group = groups[rank];
  const tied = group.length > 1;
  const scoreLbl = group[0].score.toLocaleString("uk");

  const body = tied
    ? `${rank===1?'<span class="crown">👑</span>':""}
       <div class="tie-badge">⚖ Нічия · ${group.length} ${group.length===2?"гравці":"гравців"}</div>
       <div class="pod-score-shared">${scoreLbl}</div>
       <div class="pod-players">
         ${group.map(p => `<div class="pod-player">
           <div class="av" style="background:${avColor(p.nickname)}">${p.initials}</div>
           <div class="info">
             <div class="name">${esc(p.nickname)}</div>
             <div class="sub">${p.correct} / ${totalQ} правильно</div>
           </div>
         </div>`).join("")}
       </div>`
    : `${rank===1?'<span class="crown">👑</span>':""}
       <div class="av" style="${rank>1?`background:${avColor(group[0].nickname)}`:""}">${group[0].initials}</div>
       <div class="name">${esc(group[0].nickname)}</div>
       <div class="score">${scoreLbl}</div>
       <div class="extra">${group[0].correct} / ${totalQ} правильно</div>`;

  return `<div class="pod-col pod-${rank}">
    <div class="pod-card" style="position:relative">${body}</div>
    <div class="pod-step">${rank}</div>
  </div>`;
}).join("");

// Standings — усі гравці за межами подіуму (rank > 3), з правильними місцями
const standingsEl = document.getElementById("standings-list");
const rest = list.filter(p => p.rank > 3);
standingsEl.innerHTML = rest.map(p =>
  `<div class="row">
    <div class="rank">#${p.rank}</div>
    <div class="who">
      <div class="av" style="background:${avColor(p.nickname)}">${p.initials}</div>
      <div>
        <div class="name">${esc(p.nickname)}</div>
      </div>
    </div>
    <div class="stat"><b>${p.correct}</b><br><span style="font-size:10px;color:#9098C2;letter-spacing:.08em;text-transform:uppercase">правильні</span></div>
    <div class="stat"><b>${totalQ-p.correct}</b><br><span style="font-size:10px;color:#9098C2;letter-spacing:.08em;text-transform:uppercase">помилки</span></div>
    <div class="score">${p.score.toLocaleString("uk")}</div>
  </div>`
).join("");

// Confetti
const colors = ["#FCD34D","#A78BFA","#34D399","#F87171","#60A5FA","#FB923C"];
const conf = document.getElementById("confetti");
for (let i=0; i<70; i++) {
  const p = document.createElement("i");
  p.style.left = (Math.random()*100)+"%";
  p.style.background = colors[Math.floor(Math.random()*colors.length)];
  p.style.animationDelay = (Math.random()*5)+"s";
  p.style.animationDuration = (4+Math.random()*4)+"s";
  p.style.transform = "rotate("+(Math.random()*360)+"deg)";
  conf.appendChild(p);
}

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

window.endGame = async () => {
  await update(ref(db, `rooms/${code}`), { status:"finished", finishedAt: Date.now() });
  location.href = "../index.html";
};
</script>
</body>
</html>
