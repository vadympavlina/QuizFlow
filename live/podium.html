<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1920"/>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSdnJyB4MT0nMCcgeTE9JzAnIHgyPScxJyB5Mj0nMSc+PHN0b3Agb2Zmc2V0PScwJyBzdG9wLWNvbG9yPSclMjM3QzNBRUQnLz48c3RvcCBvZmZzZXQ9JzEnIHN0b3AtY29sb3I9JyUyMzRGNDZFNScvPjwvbGluZWFyR3JhZGllbnQ+PC9kZWZzPjxyZWN0IHdpZHRoPSczMicgaGVpZ2h0PSczMicgcng9JzgnIGZpbGw9J3VybCglMjNnKScvPjxjaXJjbGUgY3g9JzE2JyBjeT0nMTYnIHI9JzknIGZpbGw9J25vbmUnIHN0cm9rZT0nd2hpdGUnIHN0cm9rZS13aWR0aD0nMicvPjxjaXJjbGUgY3g9JzE2JyBjeT0nMTYnIHI9JzQnIGZpbGw9J3doaXRlJy8+PC9zdmc+">
<title>QuizFlow Live · Фінал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html{margin:0;padding:0}
body{margin:0;padding:0}

  :root{
    --bg:#F6F5FB;
    --card:#FFFFFF;
    --card-line:#E2DFF3;
    --ink:#201C33;
    --ink-dim:#6B6480;
    --accent:#5B4FE8;
    --accent-ink:#FFFFFF;
    --gold:#B8860B;
    --gold-ink:#FFFFFF;
    --silver:#8A8DA0;
    --silver-ink:#FFFFFF;
    --bronze:#B0693C;
    --bronze-ink:#FFFFFF;
  }

  body{
    font-family:"Space Grotesk",system-ui,sans-serif;color:var(--ink);
    background:var(--bg);
    min-height:100vh;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.6;
    background-image:radial-gradient(rgba(32,28,51,.06) 1px, transparent 1px);
    background-size:28px 28px;
  }
  #theme-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .confetti i{position:absolute;width:6px;height:16px;animation:fall 6s linear infinite;top:-20px;border-radius:1px;opacity:.85}
  @keyframes fall{to{transform:translateY(110vh) rotate(500deg)}}

  .header{text-align:center;padding:44px 0 22px;position:relative;z-index:2}
  .header .meta{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink-dim);
    margin-bottom:16px;padding:6px 14px;border:1px solid var(--card-line);border-radius:999px;background:var(--card);
  }
  .header .meta::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .header h1{font-size:64px;font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.05;color:var(--ink)}
  .header h1 span{color:var(--accent)}
  .header .quiz{margin-top:10px;font-size:16px;color:var(--ink-dim)}

  .podium-wrap{
    position:relative;z-index:2;display:flex;gap:20px;justify-content:center;flex-wrap:wrap;
    max-width:1180px;margin:40px auto 12px;padding:0 32px;align-items:flex-end;
  }
  .pod-col{display:flex;flex-direction:column;align-items:center;width:320px;flex:0 0 auto;position:relative}
  .podium-wrap.single .pod-col{width:440px}
  .pod-card{
    width:100%;background:var(--card);border:2px solid var(--card-line);
    border-radius:10px;overflow:hidden;
    display:flex;flex-direction:column;position:relative;
    box-shadow:0 1px 2px rgba(32,28,64,.04), 0 14px 28px -12px rgba(32,28,64,.16);
  }
  .pod-1 .pod-card{border-color:var(--gold)}
  .pod-2 .pod-card{border-color:var(--silver)}
  .pod-3 .pod-card{border-color:var(--bronze)}
  .pod-body{padding:26px 22px;text-align:center;flex:1}
  .pod-1 .pod-body{padding-top:32px}
  .pod-body > .av{
    width:76px;height:76px;border-radius:10px;margin:0 auto 16px;display:grid;place-items:center;
    color:#fff;font-weight:700;font-size:26px;background:#5B4FE8;border:2px solid var(--card-line);
  }
  .pod-body .name{font-size:21px;font-weight:700;letter-spacing:-.01em}
  .pod-body .score{margin-top:10px;font-family:"JetBrains Mono",monospace;font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
  .pod-body .extra{margin-top:8px;font-size:12.5px;color:var(--ink-dim);font-weight:500}

  /* Кілька гравців на одному щаблі (нічия) */
  .tie-badge{
    display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
    color:var(--accent-ink);background:var(--accent);
    padding:4px 12px;border-radius:6px;margin-bottom:14px;
  }
  .pod-score-shared{font-family:"JetBrains Mono",monospace;font-size:28px;font-weight:700;margin-bottom:16px;color:var(--ink)}
  .pod-players{display:flex;flex-direction:column;gap:9px;max-height:240px;overflow-y:auto;padding:3px;margin:-3px;text-align:left}
  .pod-player{display:flex;align-items:center;gap:10px}
  .pod-player .av{
    width:36px;height:36px;border-radius:8px;margin:0;display:grid;place-items:center;
    color:#fff;font-weight:700;font-size:12.5px;flex:0 0 auto;border:2px solid var(--card-line);background:#5B4FE8;
  }
  .pod-player .info{min-width:0;flex:1}
  .pod-player .name{font-size:14.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .pod-player .sub{font-size:11px;color:var(--ink-dim);font-weight:500;margin-top:1px}

  /* Смуга місця — сходинка п'єдесталу */
  .pod-rank{
    display:flex;align-items:center;justify-content:center;gap:9px;
    padding:16px 20px;position:relative;
    font-family:"JetBrains Mono",monospace;font-weight:700;
    border-top:2px solid rgba(0,0,0,.06);
  }
  .pod-rank .num{font-size:26px;line-height:1}
  .pod-rank .lbl{font-size:11px;font-weight:600;opacity:.85}
  .pod-1 .pod-rank{background:var(--gold);color:var(--gold-ink);padding-top:30px;padding-bottom:30px}
  .pod-1 .pod-rank .num{font-size:36px}
  .pod-2 .pod-rank{background:var(--silver);color:var(--silver-ink);padding-top:16px;padding-bottom:16px}
  .pod-3 .pod-rank{background:var(--bronze);color:var(--bronze-ink);padding-top:10px;padding-bottom:10px}
  .pod-1 .pod-body > .av{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
  .pod-2 .pod-body > .av{background:var(--silver);color:var(--silver-ink);border-color:var(--silver)}
  .pod-3 .pod-body > .av{background:var(--bronze);color:var(--bronze-ink);border-color:var(--bronze)}
  .pod-1 .pod-player .av{border-color:var(--gold)}
  .crown{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:34px;z-index:2;filter:drop-shadow(0 4px 8px rgba(184,134,11,.35))}

  .standings{
    max-width:1180px;margin:56px auto 60px;padding:0 32px;position:relative;z-index:2;
  }
  .standings h2{font-size:18px;font-weight:700;margin:0 0 18px;display:flex;align-items:center;gap:10px;color:var(--ink);padding-bottom:14px;border-bottom:2px solid var(--card-line)}
  .standings h2 small{margin-left:auto;font-size:13px;font-weight:500;color:var(--ink-dim)}

  .row{
    display:grid;grid-template-columns:48px 1fr 90px 120px 120px;gap:20px;align-items:center;
    border-bottom:1px solid var(--card-line);
    padding:14px 6px;transition:background .12s;
  }
  .row:hover{background:rgba(91,79,232,.045)}
  .row .rank{font-family:"JetBrains Mono",monospace;font-size:16px;font-weight:700;color:var(--ink-dim);text-align:center}
  .row .who{display:flex;align-items:center;gap:14px;min-width:0}
  .row .av{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12.5px;flex:0 0 auto;border:2px solid var(--card-line);background:#5B4FE8}
  .row .name{font-weight:600;font-size:15px;letter-spacing:-.01em;color:var(--ink)}
  .row .stat{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:600;color:var(--ink-dim);text-align:center}
  .row .stat b{color:var(--ink);font-size:14px}
  .row .score{font-family:"JetBrains Mono",monospace;font-size:17px;font-weight:700;text-align:right;color:var(--accent)}

  .footer-cta{
    text-align:center;padding-bottom:60px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;
    position:relative;z-index:2;
  }
  .btn{
    background:var(--card);border:2px solid var(--card-line);color:var(--ink);
    padding:13px 22px;border-radius:8px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;
  }
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:5px 5px 0 rgba(91,79,232,.22)}
</style>
</head>
<body>
<div id="theme-overlay"></div>
<div class="confetti" id="confetti"></div>

<div class="header">
  <div class="meta">QuizFlow Live · Фінальні результати</div>
  <h1>🏆 <span id="test-title">—</span></h1>
  <div class="quiz" id="game-meta">— питань · — гравців</div>
</div>

<div class="podium-wrap" id="podium-wrap"></div>

<div class="standings">
  <h2>📊 Усі гравці <small id="total-lbl">— учасників</small></h2>
  <div id="standings-list"></div>
</div>

<div class="footer-cta">
  <button class="btn btn-primary" onclick="endGame()">↻ Завершити гру</button>
</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const FC = {apiKey:"AIzaSyDsA4IQkn5tV41LDK43vzgm0XnRnbdgvTc",authDomain:"quizflow-8a978.firebaseapp.com",databaseURL:"https://quizflow-8a978-default-rtdb.europe-west1.firebasedatabase.app",projectId:"quizflow-8a978",storageBucket:"quizflow-8a978.firebasestorage.app",messagingSenderId:"206469794166",appId:"1:206469794166:web:55cd7007b429607acd5257"};
const app  = getApps().length ? getApps()[0] : initializeApp(FC);
const auth = getAuth(app);
const db   = getDatabase(app);

const fbUser = await new Promise(r => { const u = onAuthStateChanged(auth, x => { u(); r(x); }); });
if (!fbUser) { location.href = "../login.html"; throw new Error(); }

const code = new URLSearchParams(location.search).get("code");
if (!code) { location.href = "../index.html"; throw new Error(); }

const roomSnap = await get(ref(db, `rooms/${code}`));
if (!roomSnap.exists()) { location.href = "../index.html"; throw new Error(); }
const room = roomSnap.val();

document.getElementById("test-title").textContent = room.testTitle || "—";

// Calc scores
const ansSnap = await get(ref(db, `rooms/${code}/answers`));
const allAns = ansSnap.val() || {};
const scores = {};
const correctCount = {};
Object.entries(allAns).forEach(([qi, qA]) => {
  const q = (room.questions||[])[Number(qi)];
  Object.entries(qA||{}).forEach(([pid, ans]) => {
    scores[pid] = (scores[pid]||0) + (ans.points||0);
    if (!correctCount[pid]) correctCount[pid] = 0;
    if (ans.isCorrect) correctCount[pid]++;
  });
});

const players = room.players || {};
const list = Object.entries(players)
  .filter(([,p]) => p.active !== false)
  .map(([pid, p]) => ({
    pid, nickname: p.nickname,
    score: scores[pid]||0,
    correct: correctCount[pid]||0,
    initials: initialsOf(p.nickname)
  }))
  .sort((a,b) => b.score - a.score);

// Щільне ранжування: однаковий бал = однакове місце, але наступний
// відмінний результат завжди йде на +1 місце (1,1,2,3 — а не 1,1,3,4).
// Завдяки цьому 1/2/3 місця на подіумі ніколи не "згорають" через нічию.
let _rank = 0, _prevScore = null;
list.forEach((p) => {
  if (p.score !== _prevScore) { _rank++; _prevScore = p.score; }
  p.rank = _rank;
});

const totalQ = (room.questions||[]).length;
document.getElementById("game-meta").textContent = `${totalQ} питань · ${list.length} гравців`;
document.getElementById("total-lbl").textContent = `${list.length} учасників`;

// Theme overlay
const GRAD_CSS = {
  "g-default":"linear-gradient(135deg,#1F2937,#111827)","g-night":"linear-gradient(135deg,#0B0F19,#1C1F2E)",
  "g-forest":"linear-gradient(135deg,#14532D,#052E16)","g-amber":"linear-gradient(135deg,#92400E,#5C2A06)",
  "g-grape":"linear-gradient(135deg,#4C1D95,#2E1065)","g-sun":"linear-gradient(135deg,#D97706,#92400E)",
  "g-ocean":"linear-gradient(135deg,#155E75,#1E3A5F)","g-violet":"linear-gradient(135deg,#5B21B6,#312E81)",
  "g-mint":"linear-gradient(135deg,#0F766E,#134E4A)","g-sky":"linear-gradient(135deg,#1D4ED8,#1E3A8A)",
  "g-jade":"linear-gradient(135deg,#0F766E,#064E3B)","g-rose":"linear-gradient(135deg,#9F1239,#701A29)",
  "g-magenta":"linear-gradient(135deg,#86198F,#581C87)"
};
if (room.theme?.grad) {
  const ov = document.getElementById("theme-overlay");
  ov.style.background = GRAD_CSS[room.theme.grad] || GRAD_CSS["g-default"];
  ov.style.opacity = "0.3";
}

const AV_COLORS = [
  "#3A5A6B","#4E6B4A","#8A4A3E","#6B5490",
  "#9C6B2E","#8A4266","#3E7A78","#7A6B2E"
];
function avColor(name){ return AV_COLORS[(name||"?").charCodeAt(0)%AV_COLORS.length]; }
function initialsOf(nick){
  const parts = String(nick||"").trim().split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0]+parts[1][0]).toUpperCase();
  return (nick||"??").slice(0,2).toUpperCase();
}

// Групуємо гравців за місцем (rank), окремо топ-3 для подіуму й решта для списку
const groups = {};
list.forEach(p => { (groups[p.rank] = groups[p.rank] || []).push(p); });

const podiumRanks = Object.keys(groups).map(Number).filter(r => r <= 3).sort((a,b) => a-b);
// Класичний порядок відображення 2-1-3, коли присутні всі три місця;
// якщо через нічию якогось місця немає — просто зліва направо за зростанням.
const displayRanks = podiumRanks.length === 3 ? [podiumRanks[1], podiumRanks[0], podiumRanks[2]] : podiumRanks;

const podEl = document.getElementById("podium-wrap");
podEl.classList.toggle("single", displayRanks.length === 1);
podEl.innerHTML = displayRanks.map(rank => {
  const group = groups[rank];
  const tied = group.length > 1;
  const scoreLbl = group[0].score.toLocaleString("uk");

  const body = tied
    ? `<div class="tie-badge">⚖ Нічия · ${group.length} ${group.length===2?"гравці":"гравців"}</div>
       <div class="pod-score-shared">${scoreLbl}</div>
       <div class="pod-players">
         ${group.map(p => `<div class="pod-player">
           <div class="av" style="background:${avColor(p.nickname)}">${p.initials}</div>
           <div class="info">
             <div class="name">${esc(p.nickname)}</div>
             <div class="sub">${p.correct} / ${totalQ} правильно</div>
           </div>
         </div>`).join("")}
       </div>`
    : `<div class="av" style="${rank>1?`background:${avColor(group[0].nickname)}`:""}">${group[0].initials}</div>
       <div class="name">${esc(group[0].nickname)}</div>
       <div class="score">${scoreLbl}</div>
       <div class="extra">${group[0].correct} / ${totalQ} правильно</div>`;

  return `<div class="pod-col pod-${rank}">
    ${rank===1?'<span class="crown">👑</span>':""}
    <div class="pod-card">
      <div class="pod-body">${body}</div>
      <div class="pod-rank"><span class="num">${rank}</span><span class="lbl">місце</span></div>
    </div>
  </div>`;
}).join("");

// Standings — усі гравці за межами подіуму (rank > 3), з правильними місцями
const standingsEl = document.getElementById("standings-list");
const rest = list.filter(p => p.rank > 3);
standingsEl.innerHTML = rest.map(p =>
  `<div class="row">
    <div class="rank">#${p.rank}</div>
    <div class="who">
      <div class="av" style="background:${avColor(p.nickname)}">${p.initials}</div>
      <div>
        <div class="name">${esc(p.nickname)}</div>
      </div>
    </div>
    <div class="stat"><b>${p.correct}</b><br><span style="font-size:10px;color:#9098C2;letter-spacing:.08em;text-transform:uppercase">правильні</span></div>
    <div class="stat"><b>${totalQ-p.correct}</b><br><span style="font-size:10px;color:#9098C2;letter-spacing:.08em;text-transform:uppercase">помилки</span></div>
    <div class="score">${p.score.toLocaleString("uk")}</div>
  </div>`
).join("");

// Confetti
const colors = ["#5B4FE8","#B8860B","#B0693C","#2F9E62","#8A7CF0"];
const conf = document.getElementById("confetti");
for (let i=0; i<70; i++) {
  const p = document.createElement("i");
  p.style.left = (Math.random()*100)+"%";
  p.style.background = colors[Math.floor(Math.random()*colors.length)];
  p.style.animationDelay = (Math.random()*5)+"s";
  p.style.animationDuration = (4+Math.random()*4)+"s";
  p.style.transform = "rotate("+(Math.random()*360)+"deg)";
  conf.appendChild(p);
}

function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

window.endGame = async () => {
  await update(ref(db, `rooms/${code}`), { status:"finished", finishedAt: Date.now() });
  location.href = "../index.html";
};
</script>
</body>
</html>
