<html lang="uk">
<head>

<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMCIgeTE9IjAiIHgyPSIxIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjN0MzQUVEIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjNEY0NkU1Ii8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iOCIgZmlsbD0idXJsKCNnKSIvPjxjaXJjbGUgY3g9IjE2IiBjeT0iMTYiIHI9IjkiIGZpbGw9Im5vbmUiIHN0cm9rZT0id2hpdGUiIHN0cm9rZS13aWR0aD0iMiIvPjxjaXJjbGUgY3g9IjE2IiBjeT0iMTYiIHI9IjQiIGZpbGw9IndoaXRlIi8+PC9zdmc+">
<title>QuizFlow Live · Фінал</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://quizflow-8a978-default-rtdb.europe-west1.firebasedatabase.app">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="modulepreload" href="live-core.js?v=2">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&family=Geist+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  [hidden]{display:none !important}
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  :root{
    --bg:#F6F5FB; --card:#FFFFFF; --card-2:#F0EEFB; --card-line:#E2DFF3;
    --ink:#201C33; --ink-dim:#6B6480; --accent:#5B4FE8; --accent-ink:#FFFFFF;
    --gold:#C9971A; --silver:#8A8DA0; --bronze:#B0693C; --good:#2F9E62; --bad:#D14343;
  }
  body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.6;background-image:radial-gradient(rgba(32,28,51,.06) 1px, transparent 1px);background-size:28px 28px}
  .band{position:absolute;inset:0 0 auto 0;height:340px;z-index:0;opacity:.14;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}

  .confetti{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
  .confetti i{position:absolute;width:7px;height:15px;top:-20px;border-radius:1px;opacity:.9;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  .header{text-align:center;padding:40px 20px 10px;position:relative;z-index:2}
  .header .meta{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink-dim);margin-bottom:14px;padding:6px 14px;border:1px solid var(--card-line);border-radius:999px;background:var(--card)}
  .header .meta::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .header h1{font-size:clamp(34px,5vw,60px);font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.05}
  .header h1 span{color:var(--accent)}
  .header .quiz{margin-top:10px;font-size:16px;color:var(--ink-dim)}

  .podium-wrap{position:relative;z-index:2;display:flex;gap:18px;justify-content:center;max-width:1180px;margin:44px auto 12px;padding:0 24px;align-items:flex-end}
  .pod-col{display:flex;flex-direction:column;align-items:center;width:320px;max-width:100%;position:relative;opacity:0;animation:rise .8s cubic-bezier(.22,1,.36,1) forwards}
  .pod-3{animation-delay:.3s}.pod-2{animation-delay:1.1s}.pod-1{animation-delay:1.9s}
  @keyframes rise{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
  .podium-wrap.single .pod-col{width:440px}
  .pod-card{width:100%;background:var(--card);border:2px solid var(--card-line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 14px 28px -12px rgba(32,28,64,.18)}
  .pod-1 .pod-card{border-color:var(--gold);box-shadow:0 20px 44px -14px rgba(201,151,26,.45)}
  .pod-2 .pod-card{border-color:var(--silver)}
  .pod-3 .pod-card{border-color:var(--bronze)}
  .pod-body{padding:24px 20px;text-align:center}
  .pod-1 .pod-body{padding-top:32px}
  .pod-body > .av{width:76px;height:76px;border-radius:14px;margin:0 auto 14px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:26px}
  .pod-1 .pod-body > .av{width:92px;height:92px;font-size:32px}
  .pod-body .name{font-size:21px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
  .pod-body .score{margin-top:8px;font-family:"Geist Mono",monospace;font-size:32px;font-weight:700;letter-spacing:-.02em}
  .pod-body .extra{margin-top:6px;font-size:12.5px;color:var(--ink-dim);font-weight:500}
  .tie-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--accent-ink);background:var(--accent);padding:4px 12px;border-radius:6px;margin-bottom:12px}
  .pod-score-shared{font-family:"Geist Mono",monospace;font-size:28px;font-weight:700;margin-bottom:14px}
  .pod-players{display:flex;flex-direction:column;gap:9px;max-height:220px;overflow-y:auto;text-align:left}
  .pod-player{display:flex;align-items:center;gap:10px}
  .pod-player .av{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12.5px;flex:0 0 auto}
  .pod-player .name{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pod-player .sub{font-size:11px;color:var(--ink-dim)}
  .pod-rank{display:flex;align-items:center;justify-content:center;gap:9px;padding:16px 20px;font-family:"Geist Mono",monospace;font-weight:700;color:#fff}
  .pod-rank .num{font-size:26px;line-height:1}
  .pod-rank .lbl{font-size:11px;font-weight:600;opacity:.9}
  .pod-1 .pod-rank{background:var(--gold);padding:44px 20px}
  .pod-1 .pod-rank .num{font-size:38px}
  .pod-2 .pod-rank{background:var(--silver);padding:26px 20px}
  .pod-3 .pod-rank{background:var(--bronze);padding:12px 20px}
  .crown{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:38px;z-index:2;animation:bob 2s ease-in-out infinite 2.6s}
  @keyframes bob{50%{transform:translateX(-50%) translateY(-6px) rotate(-6deg)}}

  .standings{max-width:1000px;margin:52px auto 40px;padding:0 24px;position:relative;z-index:2}
  .standings h2{font-size:18px;font-weight:700;margin:0 0 6px;display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:2px solid var(--card-line)}
  .standings h2 small{margin-left:auto;font-size:13px;font-weight:500;color:var(--ink-dim)}
  .standings[hidden]{display:none}
  .row{display:grid;grid-template-columns:48px 1fr repeat(3,80px) 110px;gap:14px;align-items:center;border-bottom:1px solid var(--card-line);padding:12px 6px}
  .row.head{font-size:11px;font-weight:600;color:var(--ink-dim);letter-spacing:.06em;text-transform:uppercase;padding-top:14px}
  .row:not(.head):hover{background:rgba(91,79,232,.045)}
  .row .rank{font-family:"Geist Mono",monospace;font-size:16px;font-weight:700;color:var(--ink-dim);text-align:center}
  .row .who{display:flex;align-items:center;gap:12px;min-width:0}
  .row .av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12.5px;flex:0 0 auto}
  .row .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .stat{font-family:"Geist Mono",monospace;font-size:14px;font-weight:700;text-align:center}
  .row .stat.g{color:var(--good)} .row .stat.r{color:var(--bad)} .row .stat.s{color:var(--ink-dim)}
  .row .score{font-family:"Geist Mono",monospace;font-size:17px;font-weight:700;text-align:right;color:var(--accent)}

  .footer-cta{text-align:center;padding:0 20px 60px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;position:relative;z-index:2}
  .btn{background:var(--card);border:2px solid var(--card-line);color:var(--ink);padding:13px 20px;border-radius:10px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
  .btn:hover{border-color:var(--accent)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:5px 5px 0 rgba(91,79,232,.22)}
  .empty{text-align:center;color:var(--ink-dim);padding:40px 20px;position:relative;z-index:2}

  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} .pod-col{opacity:1} .confetti{display:none} }
  @media (max-width: 820px){
    .podium-wrap{flex-direction:column;align-items:stretch}
    .pod-col{width:100% !important}
    .pod-1{order:1}.pod-2{order:2}.pod-3{order:3}
    .pod-rank{padding:12px 20px !important}
    .row{grid-template-columns:36px 1fr 80px;gap:10px}
    .row .stat{display:none}
  }
</style>
</head>
<body>
<div class="band" id="band"></div>
<div class="confetti" id="confetti"></div>

<div class="header">
  <div class="meta">QuizFlow Live · Фінальні результати</div>
  <h1>🏆 <span id="test-title">—</span></h1>
  <div class="quiz" id="game-meta">&nbsp;</div>
</div>

<div class="podium-wrap" id="podium-wrap"></div>

<div class="standings" id="standings">
  <h2 id="standings-h">📊 Усі гравці <small id="total-lbl"></small></h2>
  <div id="standings-list"></div>
</div>

<div class="footer-cta">
  <a class="btn" id="history-btn" href="../game-history">📚 Історія ігор</a>
  <a class="btn" id="again-btn" href="#">↻ Зіграти ще раз</a>
  <button class="btn" id="csv-btn" type="button">⬇ Результати CSV</button>
  <button class="btn btn-primary" id="end-btn">✓ Завершити гру</button>
</div>

<script type="module">
import {
  db, ref, get, update, requireTeacher, readParams, isValidCode, fatal, toast,
  esc, initialsOf, avatarColor, standings, THEMES, DEFAULT_THEME, plural, fmtNum, HOME_URL, serverNow,
} from "./live-core.js?v=2";

const $ = (id) => document.getElementById(id);
const user = await requireTeacher();
const { code } = readParams("code");
if (!isValidCode(code)) fatal("Невірний код кімнати");

const roomSnap = await get(ref(db, `rooms/${code}`));
if (!roomSnap.exists()) fatal("Кімнату не знайдено — можливо, її вже закрито");
const room = roomSnap.val();
if (room.hostUid && room.hostUid !== user.uid) fatal("Це не ваша кімната");

const totalQ = (room.questions || []).length;
const list = standings(room.players, room.answers);
const showPodium = room.options?.podium !== false;

$("test-title").textContent = room.testTitle || "Гру завершено";
document.title = `Фінал · ${room.testTitle || code} · QuizFlow Live`;
$("game-meta").textContent = `${totalQ} ${plural(totalQ, "питання", "питання", "питань")} · ${list.length} ${plural(list.length, "гравець", "гравці", "гравців")}`;
$("band").style.background = (THEMES[room.theme?.grad] || THEMES[DEFAULT_THEME.grad]).css;
if (room.testId) $("again-btn").href = `setup?testId=${encodeURIComponent(room.testId)}`;
else $("again-btn").hidden = true;

const av = (p, extra = "") => `<div class="av"${extra} style="background:${avatarColor(p.nickname)}">${esc(initialsOf(p.nickname))}</div>`;

if (!list.length) {
  $("podium-wrap").outerHTML = `<div class="empty">У грі не було учасників</div>`;
  $("standings").hidden = true;
} else if (showPodium) {
  const groups = {};
  list.forEach(p => { (groups[p.rank] ||= []).push(p); });
  const ranks = Object.keys(groups).map(Number).filter(r => r <= 3).sort((a, b) => a - b);
  // Класичний порядок 2-1-3
  const display = ranks.length === 3 ? [ranks[1], ranks[0], ranks[2]] : ranks.length === 2 ? [ranks[1], ranks[0]] : ranks;
  const pod = $("podium-wrap");
  pod.classList.toggle("single", display.length === 1);
  pod.innerHTML = display.map(rank => {
    const g = groups[rank], tied = g.length > 1;
    const body = tied
      ? `<div class="tie-badge">⚖ Нічия · ${g.length} ${plural(g.length, "гравець", "гравці", "гравців")}</div>
         <div class="pod-score-shared">${fmtNum(g[0].score)}</div>
         <div class="pod-players">${g.map(p => `<div class="pod-player">${av(p)}
           <div style="min-width:0"><div class="name">${esc(p.nickname)}</div><div class="sub">${p.correct} / ${totalQ} правильно</div></div></div>`).join("")}</div>`
      : `${av(g[0])}
         <div class="name">${esc(g[0].nickname)}</div>
         <div class="score">${fmtNum(g[0].score)}</div>
         <div class="extra">${g[0].correct} / ${totalQ} правильно</div>`;
    return `<div class="pod-col pod-${rank}">
      ${rank === 1 ? '<span class="crown">👑</span>' : ""}
      <div class="pod-card"><div class="pod-body">${body}</div>
      <div class="pod-rank"><span class="num">${rank}</span><span class="lbl">місце</span></div></div>
    </div>`;
  }).join("");
  // Медальні кольори аватарів у переможців
  pod.querySelectorAll(".pod-1 .pod-body > .av").forEach(e => e.style.background = "var(--gold)");
  pod.querySelectorAll(".pod-2 .pod-body > .av").forEach(e => e.style.background = "var(--silver)");
  pod.querySelectorAll(".pod-3 .pod-body > .av").forEach(e => e.style.background = "var(--bronze)");
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setTimeout(confetti, 2100);
} else {
  $("podium-wrap").remove();
}

// Таблиця: без подіуму — усі гравці, з подіумом — ті, хто не потрапив у топ-3
const rest = showPodium ? list.filter(p => p.rank > 3) : list;
if (list.length && !rest.length) $("standings").hidden = true;
$("total-lbl").textContent = `${list.length} ${plural(list.length, "учасник", "учасники", "учасників")}`;
if (showPodium) $("standings-h").firstChild.textContent = "📊 Інші гравці ";
$("standings-list").innerHTML = rest.length ? `<div class="row head"><div>#</div><div>Гравець</div><div class="stat">Прав.</div><div class="stat">Помил.</div><div class="stat">Пропуск</div><div style="text-align:right">Бали</div></div>` + rest.map(p =>
  `<div class="row">
    <div class="rank">${p.rank}</div>
    <div class="who">${av(p)}<div class="name">${esc(p.nickname)}</div></div>
    <div class="stat g">${p.correct}</div>
    <div class="stat r">${p.answered - p.correct}</div>
    <div class="stat s">${Math.max(0, totalQ - p.answered)}</div>
    <div class="score">${fmtNum(p.score)}</div>
  </div>`).join("") : "";

function confetti() {
  const colors = ["#5B4FE8", "#C9971A", "#B0693C", "#2F9E62", "#8A7CF0", "#EF4444"];
  const host = $("confetti");
  for (let i = 0; i < 120; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "%";
    p.style.background = colors[i % colors.length];
    p.style.animationDelay = Math.random() * 2.5 + "s";
    p.style.animationDuration = 3 + Math.random() * 3 + "s";
    p.style.transform = `rotate(${Math.random() * 360}deg)`;
    host.appendChild(p);
  }
  setTimeout(() => { host.innerHTML = ""; }, 9000);
}

// CSV для Excel: BOM + «;» (українська локаль). На відміну від історії ігор,
// тут є розбір по кожному питанню — кімната ще зберігає всі відповіді.
$("csv-btn").hidden = !list.length;
$("csv-btn").addEventListener("click", () => {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["Місце", "Учасник", "Правильно", "Помилки", "Пропущено", "Бали", ...Array.from({ length: totalQ }, (_, i) => `П${i + 1}`)];
  const rows = list.map(p => [p.rank, p.nickname, p.correct, p.answered - p.correct, Math.max(0, totalQ - p.answered), p.score,
    ...Array.from({ length: totalQ }, (_, i) => { const a = room.answers?.[i]?.[p.pid]; return !a ? "—" : a.isCorrect ? `✓ ${a.points || 0}` : "✗"; })]);
  const csv = "\ufeff" + [head, ...rows].map(r => r.map(q).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `${(room.testTitle || "Гра").replace(/[\\/:*?"<>|]+/g, " ").trim().slice(0, 60)} — ${new Date().toLocaleDateString("uk-UA")} (${code}).csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("CSV завантажено", "ok");
});

$("end-btn").addEventListener("click", async () => {
  const btn = $("end-btn"); btn.disabled = true;
  try {
    await update(ref(db, `rooms/${code}`), { status: "finished", finishedAt: serverNow() });
    location.href = HOME_URL;
  } catch (e) { btn.disabled = false; toast("Помилка: " + e.message, "err"); }
});
</script>
</body>
</html>
