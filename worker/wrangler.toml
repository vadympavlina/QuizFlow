# Cloudflare Worker QuizFlow: пошта (Resend), AI, Telegram, імпорт із Kahoot.
# Розгортається автоматично: .github/workflows/worker.yml після злиття змін у worker/ в main
# (зібраний worker/dist/worker.js). Інструкція — docs/email-setup.md.
name = "quizflow-mail"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Змінні, задані в панелі Cloudflare (Settings → Variables and Secrets), деплой не стирає.
# Значення за замовчуванням — у коді (src/index.js → DEFAULTS), тому [vars] тут навмисно немає:
# інакше кожен деплой перезаписував би те, що змінено в панелі.
keep_vars = true

# Сховище відписок і лічильників (Storage & Databases → KV → quizflow-mail-unsub)
[[kv_namespaces]]
binding = "MAIL_KV"
id = "e7cad756e9674b71868f9fe7d262e574"

# Секрети (RESEND_API_KEY, UNSUB_SECRET, GROQ_API_KEY, GEMINI_API_KEY, TELEGRAM_BOT_TOKEN,
# FIREBASE_SERVICE_ACCOUNT, CF_API_TOKEN, CF_ACCOUNT_ID) живуть лише в Cloudflare; деплой їх не чіпає.
# CF_API_TOKEN і CF_ACCOUNT_ID потрібні лише для панелі лімітів (docs/limits.md).
