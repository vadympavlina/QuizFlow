<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuizFlow Admin — Ролі</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="shared/admin-shell.css?v=8">
<style>
.field-input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-family:"Manrope",sans-serif;font-size:14px;color:var(--ink-900);outline:none;transition:border-color .15s,box-shadow .15s}
.field-input:focus{border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.12)}
textarea.field-input{resize:vertical;min-height:70px;line-height:1.45}
.field-cnt{font-size:11px;color:var(--ink-400);text-align:right;margin-top:-2px;font-family:"Geist Mono",monospace}

/* Список ролей */
.rl-new-btn{width:100%;justify-content:center}
.rl-it{--rc:#7C3AED;display:flex;align-items:center;gap:11px;width:100%;padding:10px;border-radius:12px;border:0;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:background .12s}
.rl-it:hover{background:#F7F8FC}
.rl-it.on{background:color-mix(in srgb,var(--rc) 9%,#fff);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rc) 35%,#fff)}
.rl-it:focus-visible{outline:2px solid #7C3AED;outline-offset:-2px}
.rl-ic{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;color:#fff;background:var(--rc);box-shadow:0 6px 14px -8px var(--rc)}
.rl-ic svg{width:18px;height:18px}
.rl-it-i{flex:1;min-width:0}
.rl-it-n{font-weight:800;font-size:13.5px;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl-it-m{font-size:12px;color:var(--ink-400);font-weight:600;margin-top:2px}
.rl-it-m b{color:var(--ink-500);font-family:"Geist Mono",monospace}

/* Картка ролі */
.rl-hero{--rc:#7C3AED;display:flex;gap:16px;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 9%,#fff),#fff)}
.rl-hero .rl-ic{width:60px;height:60px;border-radius:18px}
.rl-hero .rl-ic svg{width:28px;height:28px}
.rl-hi{flex:1;min-width:0}
.rl-hi h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0;overflow-wrap:anywhere}
.rl-hi p{font-size:13px;color:var(--ink-500);margin:4px 0 0;line-height:1.5}
.rl-hi p.empty{color:var(--ink-300);font-style:italic}
.rl-acts{display:flex;gap:8px;flex:0 0 auto}

/* Учасники */
.rl-add{position:relative;margin-bottom:12px}
.rl-add .search-input{display:flex;width:100%}
.rl-add .search-input .input{width:100%;padding-top:10px;padding-bottom:10px}
.rl-sug{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 22px 50px -18px rgba(15,30,71,.35);padding:6px;max-height:280px;overflow-y:auto}
.rl-sug button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;font:inherit}
.rl-sug button:hover,.rl-sug button.on{background:#F5F3FF}
.rl-sug .none{padding:14px;text-align:center;font-size:13px;color:var(--ink-400)}
.rl-sug .pl{margin-left:auto;font-size:12px;font-weight:700;color:#6D28D9;white-space:nowrap}
.mb-ava{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,#A78BFA,#7C3AED);flex:0 0 auto}
.mb-i{flex:1;min-width:0}
.mb-n{font-size:13.5px;font-weight:700;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-e{font-size:11.5px;color:var(--ink-400);font-family:"Geist Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mb-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:#fff}
.mb-row.blocked .mb-n::after{content:" · заблоковано";font-weight:600;color:#B91C1C;font-size:11px}
.mb-row a{color:inherit;text-decoration:none;display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mb-row a:hover .mb-n{color:#6D28D9}
.mb-x{width:30px;height:30px;border-radius:9px;border:1px solid transparent;background:none;color:var(--ink-400);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.mb-x:hover{background:#FEF2F2;border-color:#FECACA;color:#B91C1C}
.mb-x svg{width:14px;height:14px}
.rl-none{font-size:13px;color:var(--ink-500);padding:14px;border:1.5px dashed var(--line);border-radius:12px;text-align:center}

/* Доступ до сторінок */
.pg-sec{margin-top:14px}
.pg-sec:first-child{margin-top:0}
.pg-sec-l{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400);margin-bottom:6px}
.pg-list{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pg-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.pg-row:first-child{border-top:0}
.pg-row.on{background:color-mix(in srgb,var(--rc,#7C3AED) 6%,#fff)}
.pg-row .pg-i{flex:1;min-width:0}
.pg-row .pg-n{font-size:13.5px;font-weight:700;color:var(--ink-900)}
.pg-row .pg-s{font-size:12px;color:var(--ink-400);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pg-row .pg-s i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pg-row.off .pg-n{color:var(--ink-400)}
.pg-lock{font-size:11.5px;font-weight:700;color:var(--ink-400);white-space:nowrap}
.rl-hint{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ink-500);line-height:1.5;background:#F7F8FC;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.rl-hint svg{flex:0 0 auto;width:16px;height:16px;color:#6D28D9;margin-top:1px}

/* Порожній стан сторінки */
.rl-start{background:#fff;border:1px solid var(--line);border-radius:18px;padding:40px 28px;text-align:center}
.rl-start .ei{width:60px;height:60px;margin:0 auto 14px;border-radius:18px;background:#EDE9FE;color:#6D28D9;display:grid;place-items:center}
.rl-start h2{font-size:20px;font-weight:800;margin:0 0 6px}
.rl-start > p{font-size:13.5px;color:var(--ink-500);margin:0 auto 22px;max-width:520px;line-height:1.55}
.rl-how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:left;margin:0 auto 22px;max-width:860px}
.rl-step{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:14px;background:#FAF8FF;border:1px solid #EDE9FE}
.rl-step .n{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:12.5px;color:#fff;background:linear-gradient(135deg,#8B5CF6,#6D28D9)}
.rl-step b{display:block;font-size:13.5px;color:var(--ink-900)}
.rl-step span{font-size:12px;color:var(--ink-500);line-height:1.45}

/* Модалка ролі */
.rl-swatches{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.rl-sw{width:28px;height:28px;border-radius:9px;cursor:pointer;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .12s}
.rl-sw:hover{transform:scale(1.08)}
.rl-sw[aria-checked="true"]{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink-900)}
.rl-sw:focus-visible{outline:2px solid #7C3AED;outline-offset:3px}
.rl-custom{position:relative;width:28px;height:28px;border-radius:9px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line-strong);background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);cursor:pointer}
.rl-custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.rl-preview{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#FAFBFE;border:1px solid var(--line)}
.rl-preview .tc-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:6px;color:#fff}
.rl-preview span.l{font-size:12px;color:var(--ink-500)}

.rl-del-warn{background:#FFF7ED;border:1px solid #FDE4BC;color:#9A3412;border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.55}
.rl-del-warn ul{margin:6px 0 0;padding-left:18px}
.mod-err{background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.18);border-radius:8px;padding:9px 12px;color:#B91C1C;font-size:12.5px;font-weight:600;display:none}
.mod-err.show{display:block;animation:rlErrIn .2s ease}
@keyframes rlErrIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

@media (max-width:1280px){ .mb-list{grid-template-columns:1fr} }
@media (max-width:1023px){
  .rl-hero{padding:18px;flex-wrap:wrap}
  .rl-acts{width:100%}
  .rl-acts .tb-btn{flex:1;justify-content:center}
  .rl-how{grid-template-columns:1fr}
}

/* Toggle switch */
.toggle-sw{position:relative; display:inline-block; width:38px; height:22px; flex:0 0 auto}
.toggle-sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.toggle-sw input:focus-visible + .toggle-sl{box-shadow:0 0 0 3px rgba(124,58,237,.3)}
.toggle-sw input:disabled + .toggle-sl{opacity:.6}
.toggle-sl{
  position:absolute; inset:0; cursor:pointer;
  background:#E3E8F2; border-radius:99px; transition:background .2s;
}
.toggle-sl::before{
  content:""; position:absolute; top:2px; left:2px;
  width:18px; height:18px; border-radius:50%; background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.18); transition:transform .2s;
}
.toggle-sw input:checked + .toggle-sl{background:linear-gradient(135deg, #7C3AED, #4F46E5)}
.toggle-sw input:checked + .toggle-sl::before{transform:translateX(16px)}

</style>
<!-- Модулі вантажимо одразу, паралельно зі стилями й шрифтами, а не після розбору всієї сторінки -->

<body>

<div id="admin-loader"><div class="spin"></div></div>
<script src="shared/admin-nav.js?v=6"></script>
<div id="admin-root"></div>
<div id="admin-toast" class="toast" role="status" aria-live="polite"></div>

<!-- Модалка створення/редагування ролі -->
<div class="modal-bd" id="m-role">
  <div class="modal" style="max-width:440px">
    <div class="modal-h"><span class="mh-ico violet" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></span>
      <h3 id="role-modal-title">Нова роль</h3>
      <button class="close" type="button" onclick="closeModal('m-role')" aria-label="Закрити"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <form class="modal-b" id="role-form" autocomplete="off">
      <div class="field">
        <label class="field-l" for="role-name-inp">Назва *</label>
        <input class="field-input" id="role-name-inp" maxlength="32" placeholder="Наприклад: Куратор" autofocus>
      </div>
      <div class="field">
        <label class="field-l" for="role-desc-inp">Опис</label>
        <textarea class="field-input" id="role-desc-inp" maxlength="160" placeholder="Коротко: для кого і навіщо ця роль"></textarea>
        <div class="field-cnt" id="role-desc-cnt">0 / 160</div>
      </div>
      <div class="field">
        <div class="field-l">Колір</div>
        <div class="rl-swatches" id="role-swatches" role="radiogroup" aria-label="Колір ролі"></div>
      </div>
      <div class="rl-preview"><span class="l">Так виглядатиме у викладача:</span><span class="tc-tag" id="role-preview">Роль</span></div>
      <div class="mod-err" id="role-err"></div>
      <button type="submit" hidden></button>
    </form>
    <div class="modal-f">
      <button class="tb-btn" type="button" onclick="closeModal('m-role')">Скасувати</button>
      <button class="tb-btn primary" type="button" id="role-save-btn" onclick="saveRole()">Зберегти</button>
    </div>
  </div>
</div>

<!-- Модалка видалення ролі -->
<div class="modal-bd" id="m-del-role">
  <div class="modal" style="max-width:420px">
    <div class="modal-h"><span class="mh-ico red" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg></span>
      <h3>Видалити роль «<span id="del-role-name"></span>»?</h3>
      <button class="close" type="button" onclick="closeModal('m-del-role')" aria-label="Закрити"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-b">
      <div class="rl-del-warn" id="del-role-warn"></div>
      <div class="mod-err" id="del-err"></div>
    </div>
    <div class="modal-f">
      <button class="tb-btn" type="button" onclick="closeModal('m-del-role')">Скасувати</button>
      <button class="tb-btn danger" type="button" id="del-role-confirm-btn" onclick="confirmDeleteRole()">Видалити</button>
    </div>
  </div>
</div>

<script type="module">
import { logAction, initAdminShell, db, ref, update, dbGet, openModal, closeModal, toast, esc, hideLoader } from "./shared/admin-shell.js?v=11";

const SVG = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = {
  shield: SVG('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>'),
  edit: SVG('<path d="M17 3a2.85 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5z"/>'),
  users: SVG('<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15 20c0-2.6 2-4.8 4.5-5"/>'),
  trash: SVG('<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>'),
  lock: SVG('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>'),
  plus: SVG('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
  search: SVG('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  x: SVG('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'),
  info: SVG('<circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/>'),
  back: SVG('<polyline points="15 18 9 12 15 6"/>'),
};
const ROLE_COLORS = ["#7C3AED","#4F46E5","#2563EB","#0891B2","#059669","#65A30D","#D97706","#DC2626","#DB2777","#475569"];
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b >= 2 && b <= 4 ? f[1] : f[2]; };
const fullName = u => [u.surname, u.name].filter(Boolean).join(" ") || u.email || "—";
const initials = u => ((((u.surname || "")[0] || "") + ((u.name || "")[0] || "")) || (u.email || "?").slice(0, 2)).toUpperCase();
const norm = s => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
const sm = (svg, w = 14) => svg.replace("<svg", `<svg width="${w}" height="${w}"`);

// Стандартне меню панелі — поки адмін не зберіг власне на сторінці «Навігація»
const DEFAULT_NAV = [
  { id:"sec-main", type:"section", label:"Головне", order:0, items:[
    { id:"dashboard", label:"Дашборд", file:"./", icon:"dashboard", enabled:true, protected:true },
    { id:"tests", label:"Тести", file:"tests", icon:"files", enabled:true, badge:"nb-t" },
    { id:"attempts", label:"Спроби", file:"attempts", icon:"clock", enabled:true, badge:"nb-a" },
    { id:"links", label:"Посилання", file:"links", icon:"link", enabled:true, badge:"nb-l" },
    { id:"history", label:"Історія ігор", file:"game-history", icon:"award", enabled:true },
  ]},
  { id:"sec-analysis", type:"section", label:"Аналіз", order:1, items:[
    { id:"analytics", label:"Аналітика", file:"analytics", icon:"chart-bar", enabled:true },
    { id:"gradebook", label:"Журнал", file:"gradebook", icon:"book", enabled:true },
    { id:"students", label:"Студенти", file:"students", icon:"users", enabled:true },
  ]},
  { id:"sec-activity", type:"section", label:"Активність", order:2, items:[
    { id:"notifications", label:"Сповіщення", file:"notifications", icon:"bell", enabled:true },
    { id:"suspicious", label:"Підозрілі", file:"suspicious", icon:"shield", enabled:true },
    { id:"online", label:"Онлайн", file:"online", icon:"live", enabled:true },
    { id:"news", label:"Новини", file:"news", icon:"news", enabled:true },
  ]},
];
const asArr = v => Array.isArray(v) ? v : Object.values(v || {});

const content = `
  <div class="page-head">
    <div>
      <h1>Ролі</h1>
      <p>Групуйте викладачів і обмежуйте, які сторінки панелі їм видно</p>
    </div>
  </div>
  <div id="rl-root"><div class="tp"><aside class="tp-side"><div class="tp-items">${'<div class="tc-sk"></div>'.repeat(4)}</div></aside><section class="tp-main"><div class="tp-blank"></div></section></div></div>
`;
const topbarRight = `<button class="tb-btn primary" type="button" onclick="openRoleModal()">${sm(IC.plus)} Нова роль</button>`;

await initAdminShell({ activeId: "roles", crumbs: ["Ролі"], content, topbarRight });

// ─── Стан ─────────────────────────────────────────────────────────────────
let roles = {};    // roleId -> {name, color, description, createdAt}
let users = {};    // uid -> профіль
let nav = [];      // settings/navigation (секції з items[].roleIds)
let navFromDb = false;
let editingRoleId = null, pickedColor = ROLE_COLORS[0];
let _selId = new URLSearchParams(location.search).get("id") || "";
const mobile = () => matchMedia("(max-width:1023px)").matches;

// Той самий контракт, що й у teachers.html: customRoleIds — мапа {roleId:true},
// зі старим одиничним customRoleId для сумісності при читанні.
function getUserRoleIds(u){
  if (u.customRoleIds && typeof u.customRoleIds === "object") return Object.keys(u.customRoleIds).filter(k => u.customRoleIds[k]);
  if (u.customRoleId) return [u.customRoleId];
  return [];
}
const membersOf = id => Object.entries(users).filter(([, u]) => u && typeof u === "object" && getUserRoleIds(u).includes(id)).map(([uid, u]) => ({ uid, ...u }))
  .sort((a, b) => fullName(a).localeCompare(fullName(b), "uk"));
const pagesOf = id => {
  const out = [];
  nav.forEach(sec => asArr(sec?.items).forEach(it => { if (Array.isArray(it.roleIds) && it.roleIds.includes(id)) out.push(it.label || it.id); }));
  return out;
};
const sortedIds = () => Object.keys(roles).sort((a, b) => (roles[a].name || "").localeCompare(roles[b].name || "", "uk"));

async function load(){
  const [r, u, n] = await Promise.all([dbGet("roles"), dbGet("users"), dbGet("settings/navigation").catch(() => null)]);
  roles = r || {}; users = u || {};
  navFromDb = !!(n && asArr(n).length);
  nav = asArr(navFromDb ? n : JSON.parse(JSON.stringify(DEFAULT_NAV))).filter(Boolean).map(s => ({ ...s, items: asArr(s.items).filter(Boolean) }));
  render();
}

// ─── Рендер ───────────────────────────────────────────────────────────────
function render(){
  const root = document.getElementById("rl-root");
  const ids = sortedIds();
  if (!ids.length){
    root.innerHTML = `<div class="rl-start">
      <div class="ei">${sm(IC.shield, 28)}</div>
      <h2>Ще немає жодної ролі</h2>
      <p>Роль — це мітка для групи викладачів, наприклад «Куратор» чи «Методист». Через неї зручно шукати викладачів і показувати окремі сторінки панелі лише потрібним людям.</p>
      <div class="rl-how">
        <div class="rl-step"><span class="n">1</span><div><b>Створіть роль</b><span>Назва, опис і колір</span></div></div>
        <div class="rl-step"><span class="n">2</span><div><b>Додайте викладачів</b><span>Прямо в картці ролі або в картці викладача</span></div></div>
        <div class="rl-step"><span class="n">3</span><div><b>Оберіть сторінки</b><span>Позначені сторінки бачитимуть лише викладачі з цією роллю</span></div></div>
      </div>
      <button class="tb-btn primary" type="button" onclick="openRoleModal()">${sm(IC.plus)} Створити роль</button>
    </div>`;
    return;
  }
  if (!mobile() && (!_selId || !roles[_selId])) _selId = ids[0];
  if (!root.querySelector(".tp-side .tp-sh")){
    root.innerHTML = `<div class="tp">
      <aside class="tp-side" aria-label="Список ролей">
        <div class="tp-sh">
          <div class="search-input">${sm(IC.search)}<input class="input" id="rl-search" type="search" placeholder="Пошук ролі…" autocomplete="off" aria-label="Пошук ролі"></div>
        </div>
        <div class="tp-meta"><span>Ролі</span><b id="rl-meta"></b></div>
        <div class="tp-items" id="rl-list"></div>
        <div style="padding:10px 12px 12px;border-top:1px solid var(--line)"><button class="tb-btn rl-new-btn" type="button" onclick="openRoleModal()">${sm(IC.plus)} Нова роль</button></div>
      </aside>
      <section class="tp-main" id="rl-main" aria-live="polite"></section>
    </div>`;
    document.getElementById("rl-search").addEventListener("input", renderList);
  }
  renderList();
  renderDetail();
}

function renderList(){
  const q = norm(document.getElementById("rl-search")?.value);
  const all = sortedIds();
  const ids = q ? all.filter(id => norm(roles[id].name).includes(q) || norm(roles[id].description).includes(q)) : all;
  document.getElementById("rl-meta").textContent = `${ids.length} / ${all.length}`;
  document.getElementById("rl-list").innerHTML = ids.length ? ids.map(id => {
    const r = roles[id], m = membersOf(id).length, p = pagesOf(id).length;
    return `<button type="button" class="rl-it${id === _selId ? " on" : ""}" style="--rc:${esc(r.color || ROLE_COLORS[0])}" data-id="${esc(id)}"${id === _selId ? ' aria-current="true"' : ""}>
      <span class="rl-ic">${IC.shield}</span>
      <span class="rl-it-i"><div class="rl-it-n">${esc(r.name || "—")}</div>
        <div class="rl-it-m"><b>${m}</b> ${plural(m, ["викладач", "викладачі", "викладачів"])}${p ? ` · <b>${p}</b> ${plural(p, ["сторінка", "сторінки", "сторінок"])}` : ""}</div></span>
    </button>`;

}

  if (!r){ host.classList.remove("open"); host.innerHTML = `<div class="tp-blank"></div>`; return; }
  const color = r.color || ROLE_COLORS[0];
  const members = membersOf(_selId);
  host.innerHTML = `
    <button type="button" class="tb-btn tp-back" data-act="back">${sm(IC.back)} До списку</button>
    <article class="tp-card" style="--rc:${esc(color)}">
      <header class="rl-hero" style="--rc:${esc(color)}">
        <span class="rl-ic">${IC.shield}</span>
        <div class="rl-hi"><h2>${esc(r.name || "—")}</h2><p class="${r.description ? "" : "empty"}">${esc(r.description || "Без опису")}</p></div>
        <div class="rl-acts">
          <button type="button" class="tb-btn" data-act="edit">${sm(IC.edit)} Редагувати</button>
          <button type="button" class="tb-btn danger" data-act="delete" title="Видалити роль" aria-label="Видалити роль">${sm(IC.trash)}</button>

      </header>

      <section class="tp-sec">

        <div class="rl-add">
          <div class="search-input">${sm(IC.plus)}<input class="input" id="mb-add" type="search" placeholder="Додати викладача: ім'я або email…" autocomplete="off" aria-label="Додати викладача" aria-autocomplete="list" aria-controls="mb-sug"></div>
          <div class="rl-sug" id="mb-sug" role="listbox" hidden></div>
        </div>
        ${members.length ? `<div class="mb-list">${members.map(u => `<div class="mb-row${u.blocked ? " blocked" : ""}">
            <a href="teachers?id=${encodeURIComponent(u.uid)}" title="Відкрити картку викладача"><span class="mb-ava">${esc(initials(u))}</span><span class="mb-i"><div class="mb-n">${esc(fullName(u))}</div><div class="mb-e">${esc(u.email || "")}</div></span></a>
            <button type="button" class="mb-x" data-act="rm" data-uid="${esc(u.uid)}" title="Зняти роль" aria-label="Зняти роль з ${esc(fullName(u))}">${IC.x}</button>
          </div>`).join("")}</div>`
          : `<div class="rl-none">Поки нікому не призначена</div>`}
      </section>

      <section class="tp-sec">
        <div class="tp-sec-h"><div><h3>Доступ до сторінок панелі</h3><p>Увімкніть, щоб сторінку бачили лише викладачі з цією роллю</p></div><a href="navigation">Уся навігація</a></div>
        <div class="rl-hint">${IC.info}<span>Сторінку без жодної ролі бачать усі викладачі. Якщо на сторінці кілька ролей — її бачить кожен, у кого є хоча б одна з них. Головна сторінка доступна завжди.</span></div>
        ${nav.map((sec, si) => { const items = asArr(sec.items); if (!items.length) return ""; return `<div class="pg-sec"><div class="pg-sec-l">${esc(sec.label || "Розділ")}</div><div class="pg-list">${items.map((it, ii) => {
          const rids = (Array.isArray(it.roleIds) ? it.roleIds : []).filter(x => roles[x]);
          const on = rids.includes(_selId);
          const others = rids.filter(x => x !== _selId);
          const sub = it.protected ? "Бачать усі — цю сторінку не можна обмежити"
            : !rids.length ? "Бачать усі викладачі"
            : `Бачать лише: ${rids.map(x => `<i style="background:${esc(roles[x].color || "#7C3AED")}"></i>${esc(roles[x].name)}`).join(", ")}`;
          return `<div class="pg-row${on ? " on" : ""}${it.enabled === false ? " off" : ""}">
            <div class="pg-i"><div class="pg-n">${esc(it.label || it.id)}${it.enabled === false ? " · вимкнено в меню" : ""}</div><div class="pg-s">${sub}${others.length && on ? "" : ""}</div></div>
            ${it.protected ? `<span class="pg-lock">${sm(IC.lock, 12)} Завжди</span>` : `<label class="toggle-sw"><input type="checkbox" data-pg="${si}:${ii}" ${on ? "checked" : ""} aria-label="Лише для ролі: ${esc(it.label || it.id)}"><span class="toggle-sl"></span></label>`}
          </div>`; }).join("")}</div></div>`; }).join("")}
      </section>
    </article>`;
  if (mobile()) host.classList.add("open");
}

function select(id){
  _selId = id;
  const url = new URL(location.href); url.searchParams.set("id", id); history.replaceState(null, "", url);
  renderList(); renderDetail();
}
function closeDetail(){
  document.getElementById("rl-main")?.classList.remove("open");
  _selId = "";
  const url = new URL(location.href); url.searchParams.delete("id"); history.replaceState(null, "", url);
  renderList();
}

// ─── Учасники: додати / зняти ─────────────────────────────────────────────
function userUpd(uid, rid, on){
  const upd = { [`users/${uid}/customRoleIds/${rid}`]: on ? true : null };
  const u = users[uid];
  // Старе одиничне поле переносимо в мапу, щоб не загубити роль
  if (u?.customRoleId && !(u.customRoleIds && typeof u.customRoleIds === "object")){
    if (u.customRoleId !== rid) upd[`users/${uid}/customRoleIds/${u.customRoleId}`] = true;
    upd[`users/${uid}/customRoleId`] = null;
  }
  return upd;
}
async function setMember(uid, on){
  const rid = _selId; if (!rid) return;
  const upd = userUpd(uid, rid, on);
  try {
    await update(ref(db), upd);
    Object.entries(upd).forEach(([p, v]) => {
      const [, id, key, r2] = p.split("/"); const u = users[id]; if (!u) return;
      if (key === "customRoleId"){ delete u.customRoleId; return; }
      if (!u.customRoleIds || typeof u.customRoleIds !== "object") u.customRoleIds = {};
      v ? u.customRoleIds[r2] = true : delete u.customRoleIds[r2];
    });
    toast(on ? `${fullName(users[uid] || {})} — роль додано` : "Роль знято");
    logAction(on ? "role.member.add" : "role.member.remove", { type: "teacher", id: uid, label: fullName(users[uid] || {}) }, roles[rid]?.name || rid);
    renderList(); renderDetail();
    if (on) document.getElementById("mb-add")?.focus();
  } catch (e) { toast("Помилка: " + e.message, "err"); }
}

let _sugIdx = 0;
function renderSug(){
  const inp = document.getElementById("mb-add"), box = document.getElementById("mb-sug");
  const q = norm(inp.value);
  if (!q){ box.hidden = true; return; }
  const words = q.split(" ");
  const list = Object.entries(users).filter(([, u]) => u && typeof u === "object" && !getUserRoleIds(u).includes(_selId))
    .map(([uid, u]) => ({ uid, ...u }))
    .filter(u => { const hay = norm(fullName(u) + " " + (u.name || "") + " " + (u.email || "")); return words.every(w => hay.includes(w)); })
    .sort((a, b) => fullName(a).localeCompare(fullName(b), "uk")).slice(0, 8);
  _sugIdx = Math.min(_sugIdx, Math.max(0, list.length - 1));
  box.innerHTML = list.length ? list.map((u, i) => `<button type="button" role="option" class="${i === _sugIdx ? "on" : ""}" data-add="${esc(u.uid)}"><span class="mb-ava">${esc(initials(u))}</span><span class="mb-i"><div class="mb-n">${esc(fullName(u))}</div><div class="mb-e">${esc(u.email || "")}</div></span><span class="pl">Додати</span></button>`).join("")
    : `<div class="none">Нікого не знайдено або вже мають цю роль</div>`;
  box.hidden = false;
}

document.addEventListener("click", e => {
  const it = e.target.closest(".rl-it"); if (it) return select(it.dataset.id);
  const add = e.target.closest("[data-add]"); if (add){ document.getElementById("mb-add").value = ""; document.getElementById("mb-sug").hidden = true; return setMember(add.dataset.add, true); }
  const b = e.target.closest("#rl-main [data-act]");
  if (!e.target.closest(".rl-add")) { const s = document.getElementById("mb-sug"); if (s) s.hidden = true; }
  if (!b) return;
  if (b.dataset.act === "back") return closeDetail();
  if (b.dataset.act === "edit") return openRoleModal(_selId);
  if (b.dataset.act === "delete") return openDeleteRole(_selId);
  if (b.dataset.act === "rm") return setMember(b.dataset.uid, false);
});
document.addEventListener("input", e => { if (e.target.id === "mb-add"){ _sugIdx = 0; renderSug(); } });
document.addEventListener("keydown", e => {
  if (e.target.id === "mb-add"){
    const opts = [...document.querySelectorAll("#mb-sug [data-add]")];
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){ if (!opts.length) return; e.preventDefault(); _sugIdx = (_sugIdx + (e.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length; renderSug(); return; }
    if (e.key === "Enter"){ e.preventDefault(); opts[_sugIdx]?.click(); return; }
    if (e.key === "Escape"){ e.stopPropagation(); document.getElementById("mb-sug").hidden = true; return; }
  }
  if (e.key === "Escape" && document.getElementById("rl-main")?.classList.contains("open") && !document.querySelector(".modal-bd.on")) closeDetail();
});

// ─── Доступ до сторінок ───────────────────────────────────────────────────
document.addEventListener("change", async e => {
  const k = e.target.dataset?.pg; if (!k) return;
  const [si, ii] = k.split(":").map(Number);
  const rid = _selId, on = e.target.checked;
  const newNav = nav.map((sec, a) => ({ ...sec, items: asArr(sec.items).map((it, b) => {
    if (a !== si || b !== ii) return it;
    const set = new Set((Array.isArray(it.roleIds) ? it.roleIds : []).filter(x => roles[x]));
    on ? set.add(rid) : set.delete(rid);
    return { ...it, roleIds: [...set] };
  }) }));
  e.target.disabled = true;
  try {
    // Уся навігація одним записом + мітка часу — так само, як на сторінці «Навігація»
    await update(ref(db), { "settings/navigation": newNav, "settings/navigation_ts": Date.now() });
    nav = newNav; navFromDb = true;
    logAction(on ? "role.page.restrict" : "role.page.open", { type: "role", id: rid, label: roles[rid]?.name || rid }, asArr(nav[si]?.items)[ii]?.label || "");
    toast(on ? "Сторінку обмежено цією роллю" : "Обмеження знято");
    renderList(); renderDetail();
  } catch (err) { toast("Помилка: " + err.message, "err"); e.target.checked = !on; e.target.disabled = false; }
});

// ─── Створення / редагування ─────────────────────────────────────────────
function renderSwatches(){
  const custom = !ROLE_COLORS.includes(pickedColor);
  document.getElementById("role-swatches").innerHTML = ROLE_COLORS.map(c =>
    `<button type="button" class="rl-sw" role="radio" aria-checked="${c === pickedColor}" aria-label="Колір ${c}" data-c="${c}" style="background:${c}"></button>`).join("") +
    `<label class="rl-custom" title="Свій колір" style="${custom ? `box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink-900);background:${pickedColor}` : ""}"><input type="color" id="role-color-custom" value="${esc(pickedColor)}" aria-label="Свій колір"></label>`;
  updatePreview();
}
function updatePreview(){
  const p = document.getElementById("role-preview");
  p.textContent = document.getElementById("role-name-inp").value.trim() || "Роль";
  p.style.background = pickedColor;
}
document.getElementById("role-swatches").addEventListener("click", e => {
  const b = e.target.closest(".rl-sw"); if (!b) return;
  pickedColor = b.dataset.c; renderSwatches();
});
document.getElementById("role-swatches").addEventListener("input", e => {
  if (e.target.id !== "role-color-custom") return;
  pickedColor = e.target.value.toUpperCase(); updatePreview();
  e.target.parentElement.style.background = pickedColor;
});
document.getElementById("role-swatches").addEventListener("change", e => { if (e.target.id === "role-color-custom") renderSwatches(); });
document.getElementById("role-name-inp").addEventListener("input", () => { updatePreview(); document.getElementById("role-err").classList.remove("show"); });
document.getElementById("role-desc-inp").addEventListener("input", e => { document.getElementById("role-desc-cnt").textContent = `${e.target.value.length} / 160`; });
document.getElementById("role-form").addEventListener("submit", e => { e.preventDefault(); saveRole(); });
document.getElementById("role-desc-inp").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) saveRole(); });

window.openRoleModal = (roleId) => {
  editingRoleId = roleId || null;
  const r = roleId ? roles[roleId] : null;
  pickedColor = r?.color || ROLE_COLORS[Object.keys(roles).length % ROLE_COLORS.length];
  document.getElementById("role-modal-title").textContent = roleId ? "Редагувати роль" : "Нова роль";
  document.getElementById("role-name-inp").value = r?.name || "";
  document.getElementById("role-desc-inp").value = r?.description || "";
  document.getElementById("role-desc-cnt").textContent = `${(r?.description || "").length} / 160`;
  document.getElementById("role-err").classList.remove("show");
  document.getElementById("role-save-btn").textContent = roleId ? "Зберегти" : "Створити";
  renderSwatches();
  openModal("m-role");
  setTimeout(() => document.getElementById("role-name-inp").focus(), 60);
};

window.saveRole = async () => {
  const name = document.getElementById("role-name-inp").value.trim().replace(/\s+/g, " ");
  const description = document.getElementById("role-desc-inp").value.trim();
  const errEl = document.getElementById("role-err");
  const err = m => { errEl.textContent = m; errEl.classList.add("show"); document.getElementById("role-name-inp").focus(); };
  if (!name) return err("Введіть назву ролі");
  if (Object.entries(roles).some(([id, r]) => id !== editingRoleId && norm(r.name) === norm(name))) return err(`Роль «${name}» уже існує`);

  const btn = document.getElementById("role-save-btn");
  btn.disabled = true;
  try {
    const id = editingRoleId || ("role_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
    const data = { name, description, color: pickedColor, createdAt: roles[id]?.createdAt || Date.now(), updatedAt: Date.now() };
    await update(ref(db), { [`roles/${id}`]: data });
    logAction(editingRoleId ? "role.update" : "role.create", { type: "role", id, label: name }, description || null);
    roles[id] = data;
    closeModal("m-role");
    toast(editingRoleId ? "Роль оновлено" : "Роль створено");
    _selId = id; render();
  } catch(e) {
    err("Помилка: " + e.message);
  } finally {
    btn.disabled = false;
  }
};


// ─── Видалення ────────────────────────────────────────────────────────────
let _delRoleId = null;
function openDeleteRole(id){
  _delRoleId = id;
  const m = membersOf(id).length, pages = pagesOf(id);
  document.getElementById("del-role-name").textContent = roles[id]?.name || "—";
  document.getElementById("del-err").classList.remove("show");
  const pts = [];
  pts.push(m ? `Роль буде знято з <b>${m}</b> ${plural(m, ["викладача", "викладачів", "викладачів"])} (інші їхні ролі й дані не зміняться)` : "Роль нікому не призначена");
  if (pages.length) pts.push(`Обмеження знімуться зі сторінок: <b>${pages.map(esc).join(", ")}</b>. Якщо інших ролей на пункті немає, він стане видимим усім`);
  document.getElementById("del-role-warn").innerHTML = `Що станеться:<ul>${pts.map(p => `<li>${p}</li>`).join("")}</ul>`;
  openModal("m-del-role");
}
window.confirmDeleteRole = async () => {
  const id = _delRoleId; if (!id) return;
  const _delName = roles[id]?.name || id;
  const btn = document.getElementById("del-role-confirm-btn");
  btn.disabled = true;
  try {
    const upd = { [`roles/${id}`]: null };
    membersOf(id).forEach(u => {
      if (u.customRoleIds && typeof u.customRoleIds === "object") upd[`users/${u.uid}/customRoleIds/${id}`] = null;
      else upd[`users/${u.uid}/customRoleId`] = null;
    });
    // Прибираємо роль з пунктів навігації — інакше пункт стане невидимим для всіх
    let navChanged = false;
    const newNav = (Array.isArray(nav) ? nav : []).map(sec => ({ ...sec, items: (sec?.items || []).map(it => {
      if (!Array.isArray(it.roleIds) || !it.roleIds.includes(id)) return it;
      navChanged = true;
      return { ...it, roleIds: it.roleIds.filter(r => r !== id) };
    }) }));
    if (navChanged){ upd["settings/navigation"] = newNav; upd["settings/navigation_ts"] = Date.now(); }
    await update(ref(db), upd);   // усе одним атомарним записом
    delete roles[id];
    membersOf(id).forEach(u => { const x = users[u.uid]; if (x?.customRoleIds) delete x.customRoleIds[id]; else if (x) delete x.customRoleId; });
    if (navChanged) nav = newNav;
    closeModal("m-del-role");
    logAction("role.delete", { type: "role", id, label: _delName }, null);
    toast("Роль видалено");
    if (_selId === id) _selId = ""; render();
  } catch(e) {
    const el = document.getElementById("del-err"); el.textContent = "Помилка: " + e.message; el.classList.add("show");
  } finally {
    btn.disabled = false;
  }
};


// ─── Модалки: клік по фону та Esc (лише верхня) ──────────────────────────
document.querySelectorAll(".modal-bd").forEach(m => m.addEventListener("click", e => { if (e.target === m) closeModal(m.id); }));
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const open = [...document.querySelectorAll(".modal-bd.on")];
  if (open.length) closeModal(open[open.length - 1].id);
});

try {
  await load();
} catch(e) {
  document.getElementById("rl-root").innerHTML = `<div class="rl-start"><h2>Не вдалося завантажити ролі</h2><p>${esc(e.message || "Невідома помилка")}</p>
    <button class="tb-btn primary" type="button" onclick="location.reload()">Спробувати знову</button></div>`;
}
hideLoader();
</script>
