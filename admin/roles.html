<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%237C3AED'/><stop offset='1' stop-color='%234F46E5'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><path d='M16 8l2.5 5 5.5.8-4 3.9.9 5.5L16 20.7l-4.9 2.5.9-5.5-4-3.9 5.5-.8z' fill='white'/></svg>">
<title>QuizFlow Admin — Ролі</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/admin-shell.css?v=4">
<style>
.field-input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-family:"Manrope",sans-serif;font-size:14px;color:var(--ink-900);outline:none;transition:border-color .15s,box-shadow .15s}
.field-input:focus{border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.12)}
textarea.field-input{resize:vertical;min-height:70px;line-height:1.45}
.field-cnt{font-size:11px;color:var(--ink-400);text-align:right;margin-top:-2px;font-family:"Geist Mono",monospace}

/* Як працюють ролі */
.rl-how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:linear-gradient(135deg,#F5F3FF,#EEF2FF);border:1px solid #E0DAFE;border-radius:16px;padding:14px}
.rl-step{display:flex;gap:11px;align-items:flex-start;padding:6px 8px}
.rl-step .n{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:12.5px;color:#fff;background:linear-gradient(135deg,#8B5CF6,#6D28D9)}
.rl-step b{display:block;font-size:13.5px;color:var(--ink-900)}
.rl-step span{font-size:12px;color:var(--ink-500);line-height:1.45}
.rl-step a{color:#6D28D9;font-weight:700;text-decoration:none}
.rl-step a:hover{text-decoration:underline}

.rl-toolbar{display:flex;align-items:center;gap:10px}
.rl-toolbar .search-input{flex:1;max-width:340px}
.rl-toolbar .search-input .input{width:100%;padding-top:10px;padding-bottom:10px}
.rl-meta{margin-left:auto;font-size:12px;color:var(--ink-500);font-family:"Geist Mono",monospace}

/* Картки ролей */
.rl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.rl-card{background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;transition:border-color .15s,box-shadow .15s,transform .15s}
.rl-card:hover{border-color:var(--line-strong);box-shadow:var(--shadow);transform:translateY(-1px)}
.rl-card.hl{animation:rlHl 1.6s ease}
@keyframes rlHl{0%,40%{box-shadow:0 0 0 3px color-mix(in srgb,var(--rc) 35%,transparent)}100%{box-shadow:none}}
.rl-top{padding:16px 16px 14px;display:flex;gap:12px;align-items:flex-start;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 10%,#fff),#fff)}
.rl-badge{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;color:#fff;background:var(--rc);box-shadow:0 8px 18px -10px var(--rc)}
.rl-badge svg{width:20px;height:20px}
.rl-ti{flex:1;min-width:0}
.rl-name{font-size:15.5px;font-weight:800;letter-spacing:-.01em;color:var(--ink-900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl-desc{font-size:12.5px;color:var(--ink-500);margin-top:3px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rl-desc.empty{color:var(--ink-300);font-style:italic}
.rl-body{padding:0 16px 14px;display:flex;flex-direction:column;gap:12px;flex:1}
.rl-sec-l{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400);margin-bottom:6px}
.rl-members{display:flex;align-items:center;gap:10px}
.rl-avas{display:flex}
.rl-avas span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:-.02em;color:#fff;border:2px solid #fff;margin-left:-6px;background:var(--rc);box-shadow:0 1px 2px rgba(15,30,71,.12)}
.rl-avas span:first-child{margin-left:0}
.rl-avas span.more{background:#EEF2FB;color:var(--ink-700)}
.rl-mtext{font-size:12.5px;color:var(--ink-500)}
.rl-mtext b{color:var(--ink-900)}
.rl-chips{display:flex;flex-wrap:wrap;gap:6px}
.rl-chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#F1F4FA;color:var(--ink-700);display:inline-flex;align-items:center;gap:5px}
.rl-chip svg{width:11px;height:11px;color:var(--ink-400)}
.rl-none{font-size:12px;color:var(--ink-400)}
.rl-foot{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);background:#FCFCFE}
.rl-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-700);cursor:pointer;transition:all .15s}
.rl-btn:hover{border-color:var(--line-strong);color:var(--ink-900);background:#F7F8FC}
.rl-btn svg{width:14px;height:14px}
.rl-btn.ic{flex:0 0 34px}
.rl-btn.danger:hover{background:#FEF2F2;border-color:#FCA5A5;color:#B91C1C}
.rl-btn:focus-visible{outline:2px solid #7C3AED;outline-offset:1px}

.rl-new{border:1.5px dashed var(--line-strong);background:transparent;border-radius:16px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;font:inherit;color:var(--ink-500);transition:all .15s}
.rl-new:hover{border-color:#A78BFA;color:#6D28D9;background:#FAF8FF}
.rl-new .pl{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#EDE9FE;color:#6D28D9}
.rl-new b{font-size:14px;color:var(--ink-900)}
.rl-sk{height:220px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(90deg,#fff 0%,#F4F6FB 50%,#fff 100%);background-size:200% 100%;animation:rlSk 1.2s linear infinite}
@keyframes rlSk{to{background-position:-200% 0}}
.rl-empty{grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--ink-500);background:#fff;border:1px solid var(--line);border-radius:16px}
.rl-empty .et{font-size:15px;font-weight:700;color:var(--ink-900);margin-bottom:4px}

/* Модалка ролі */
.rl-swatches{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.rl-sw{width:28px;height:28px;border-radius:9px;cursor:pointer;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .12s}
.rl-sw:hover{transform:scale(1.08)}
.rl-sw[aria-checked="true"]{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink-900)}
.rl-sw:focus-visible{outline:2px solid #7C3AED;outline-offset:3px}
.rl-custom{position:relative;width:28px;height:28px;border-radius:9px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line-strong);background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);cursor:pointer}
.rl-custom input{position:absolute;inset:0;opacity:0;cursor:pointer}
.rl-preview{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#FAFBFE;border:1px solid var(--line)}
.rl-preview .tc-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:6px;color:#fff}
.rl-preview span.l{font-size:12px;color:var(--ink-500)}

/* Модалка учасників */
.mb-search{margin-bottom:8px}
.mb-list{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.mb-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.mb-row:last-child{border-bottom:0}
.mb-row:hover{background:#FAFBFE}
.mb-row input{width:16px;height:16px;accent-color:#7C3AED;flex:0 0 auto;cursor:pointer}
.mb-ava{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:linear-gradient(135deg,#A78BFA,#7C3AED);flex:0 0 auto}
.mb-i{flex:1;min-width:0}
.mb-n{font-size:13px;font-weight:700;color:var(--ink-900)}
.mb-e{font-size:11.5px;color:var(--ink-400);font-family:"Geist Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-row.blocked .mb-n::after{content:" · заблоковано";font-weight:600;color:#B91C1C;font-size:11px}
.mb-sum{font-size:12px;color:var(--ink-500);margin-top:8px;display:flex;justify-content:space-between;gap:10px}
.mb-sum b{color:var(--ink-900)}
.mb-sum button{background:none;border:0;font:inherit;font-size:12px;font-weight:700;color:#6D28D9;cursor:pointer;padding:0}

.rl-del-warn{background:#FFF7ED;border:1px solid #FDE4BC;color:#9A3412;border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.55}
.rl-del-warn ul{margin:6px 0 0;padding-left:18px}
.mod-err{background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.18);border-radius:8px;padding:9px 12px;color:#B91C1C;font-size:12.5px;font-weight:600;display:none}
.mod-err.show{display:block;animation:rlErrIn .2s ease}
@keyframes rlErrIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (max-width:1180px){.rl-how{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="admin-loader"><div class="spin"></div></div>
<script src="shared/admin-nav.js?v=1"></script>
<div id="admin-root"></div>
<div id="admin-toast" class="toast" role="status" aria-live="polite"></div>

<!-- Модалка створення/редагування ролі -->
<div class="modal-bd" id="m-role">
  <div class="modal" style="max-width:440px">
    <div class="modal-h">
      <h3 id="role-modal-title">Нова роль</h3>
      <button class="close" type="button" onclick="closeModal('m-role')" aria-label="Закрити"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <form class="modal-b" id="role-form" autocomplete="off">
      <div class="field">
        <label class="field-l" for="role-name-inp">Назва *</label>
        <input class="field-input" id="role-name-inp" maxlength="32" placeholder="Наприклад: Куратор" autofocus>
      </div>
      <div class="field">
        <label class="field-l" for="role-desc-inp">Опис</label>
        <textarea class="field-input" id="role-desc-inp" maxlength="160" placeholder="Коротко: для кого і навіщо ця роль"></textarea>
        <div class="field-cnt" id="role-desc-cnt">0 / 160</div>
      </div>
      <div class="field">
        <div class="field-l">Колір</div>
        <div class="rl-swatches" id="role-swatches" role="radiogroup" aria-label="Колір ролі"></div>
      </div>
      <div class="rl-preview"><span class="l">Так виглядатиме у викладача:</span><span class="tc-tag" id="role-preview">Роль</span></div>
      <div class="mod-err" id="role-err"></div>
      <button type="submit" hidden></button>
    </form>
    <div class="modal-f">
      <button class="tb-btn" type="button" onclick="closeModal('m-role')">Скасувати</button>
      <button class="tb-btn primary" type="button" id="role-save-btn" onclick="saveRole()">Зберегти</button>
    </div>
  </div>
</div>

<!-- Модалка учасників ролі -->
<div class="modal-bd" id="m-members">
  <div class="modal" style="max-width:480px">
    <div class="modal-h">
      <h3>Учасники ролі «<span id="mb-role-name"></span>»</h3>
      <button class="close" type="button" onclick="closeModal('m-members')" aria-label="Закрити"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-b">
      <div class="search-input mb-search" style="display:flex">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="mb-search" type="search" placeholder="Пошук викладача…" style="width:100%" aria-label="Пошук викладача">
      </div>
      <div class="mb-list" id="mb-list"></div>
      <div class="mb-sum"><span id="mb-sum"></span><span><button type="button" id="mb-only-sel">Лише обрані</button></span></div>
      <div class="mod-err" id="mb-err"></div>
    </div>
    <div class="modal-f">
      <button class="tb-btn" type="button" onclick="closeModal('m-members')">Скасувати</button>
      <button class="tb-btn primary" type="button" id="mb-save-btn" onclick="saveMembers()">Зберегти</button>
    </div>
  </div>
</div>

<!-- Модалка видалення ролі -->
<div class="modal-bd" id="m-del-role">
  <div class="modal" style="max-width:420px">
    <div class="modal-h">
      <h3>Видалити роль «<span id="del-role-name"></span>»?</h3>
      <button class="close" type="button" onclick="closeModal('m-del-role')" aria-label="Закрити"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-b">
      <div class="rl-del-warn" id="del-role-warn"></div>
      <div class="mod-err" id="del-err"></div>
    </div>
    <div class="modal-f">
      <button class="tb-btn" type="button" onclick="closeModal('m-del-role')">Скасувати</button>
      <button class="tb-btn danger" type="button" id="del-role-confirm-btn" onclick="confirmDeleteRole()">Видалити</button>
    </div>
  </div>
</div>

<script type="module">
import { initAdminShell, db, ref, update, dbGet, openModal, closeModal, toast, esc, hideLoader } from "./shared/admin-shell.js?v=5";

const SVG = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = {
  shield: SVG('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>'),
  edit: SVG('<path d="M17 3a2.85 2.83 0 114 4L7.5 20.5 2 22l1.5-5.5z"/>'),
  users: SVG('<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15 20c0-2.6 2-4.8 4.5-5"/>'),
  trash: SVG('<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>'),
  lock: SVG('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>'),
  plus: SVG('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
  search: SVG('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
};
const ROLE_COLORS = ["#7C3AED","#4F46E5","#2563EB","#0891B2","#059669","#65A30D","#D97706","#DC2626","#DB2777","#475569"];
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b >= 2 && b <= 4 ? f[1] : f[2]; };
const fullName = u => [u.surname, u.name].filter(Boolean).join(" ") || u.email || "—";
const initials = u => ((((u.surname || "")[0] || "") + ((u.name || "")[0] || "")) || (u.email || "?").slice(0, 2)).toUpperCase();
const norm = s => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");

const content = `
  <div class="page-head">
    <div>
      <h1>Ролі</h1>
      <p>Кастомні ролі викладачів і доступ до сторінок панелі</p>
    </div>
  </div>

  <div class="rl-how">
    <div class="rl-step"><span class="n">1</span><div><b>Створіть роль</b><span>Назва, опис і колір — наприклад «Куратор» чи «Методист»</span></div></div>
    <div class="rl-step"><span class="n">2</span><div><b>Призначте викладачам</b><span>Кнопка «Учасники» тут або на сторінці <a href="teachers">Викладачі</a></span></div></div>
    <div class="rl-step"><span class="n">3</span><div><b>Обмежте сторінки</b><span>У <a href="navigation">Навігації</a> оберіть, яким ролям видно пункт меню</span></div></div>
  </div>

  <div class="rl-toolbar">
    <div class="search-input">
      ${IC.search.replace("<svg", '<svg width="14" height="14"')}
      <input class="input" id="rl-search" type="search" placeholder="Пошук ролі…" autocomplete="off" aria-label="Пошук ролі">
    </div>
    <span class="rl-meta" id="rl-meta"></span>
  </div>

  <div class="rl-grid" id="rl-grid">${'<div class="rl-sk"></div>'.repeat(3)}</div>
`;
const topbarRight = `<button class="tb-btn primary" type="button" onclick="openRoleModal()">${IC.plus.replace("<svg", '<svg width="14" height="14"')} Нова роль</button>`;

await initAdminShell({ activeId: "roles", crumbs: ["Ролі"], content, topbarRight });

// ─── Стан ─────────────────────────────────────────────────────────────────
let roles = {};    // roleId -> {name, color, description, createdAt}
let users = {};    // uid -> профіль
let nav = [];      // settings/navigation (секції з items[].roleIds)
let editingRoleId = null, pickedColor = ROLE_COLORS[0];

// Той самий контракт, що й у teachers.html: customRoleIds — мапа {roleId:true},
// зі старим одиничним customRoleId для сумісності при читанні.
function getUserRoleIds(u){
  if (u.customRoleIds && typeof u.customRoleIds === "object") return Object.keys(u.customRoleIds).filter(k => u.customRoleIds[k]);
  if (u.customRoleId) return [u.customRoleId];
  return [];
}
const membersOf = id => Object.entries(users).filter(([, u]) => u && getUserRoleIds(u).includes(id)).map(([uid, u]) => ({ uid, ...u }));
const pagesOf = id => {
  const out = [];
  (Array.isArray(nav) ? nav : []).forEach(sec => (sec?.items || []).forEach(it => { if (Array.isArray(it.roleIds) && it.roleIds.includes(id)) out.push(it.label || it.id); }));
  return out;
};

async function load(){
  const [r, u, n] = await Promise.all([dbGet("roles"), dbGet("users"), dbGet("settings/navigation").catch(() => null)]);
  roles = r || {}; users = u || {}; nav = n || [];
  renderRoles();
}

// ─── Рендер ───────────────────────────────────────────────────────────────
function renderRoles(hlId){
  const grid = document.getElementById("rl-grid");
  const q = norm(document.getElementById("rl-search").value);
  const all = Object.keys(roles).sort((a, b) => (roles[a].name || "").localeCompare(roles[b].name || "", "uk"));
  const ids = q ? all.filter(id => norm(roles[id].name).includes(q) || norm(roles[id].description).includes(q)) : all;
  document.getElementById("rl-meta").textContent = all.length ? `${ids.length} / ${all.length}` : "";

  if (!all.length){
    grid.innerHTML = `<div class="rl-empty"><div class="ei" style="width:54px;height:54px;margin:0 auto 14px;border-radius:14px;background:#EDE9FE;color:#6D28D9;display:grid;place-items:center">${IC.shield}</div>
      <div class="et">Ще немає жодної ролі</div><div>Створіть першу, щоб призначати її викладачам і обмежувати доступ до сторінок</div>
      <button class="tb-btn primary" type="button" style="margin-top:14px" onclick="openRoleModal()">${IC.plus.replace("<svg", '<svg width="14" height="14"')} Створити роль</button></div>`;
    return;
  }
  if (!ids.length){
    grid.innerHTML = `<div class="rl-empty"><div class="et">Нічого не знайдено</div><div>Спробуйте інший запит</div></div>`;
    return;
  }
  grid.innerHTML = ids.map(id => {
    const r = roles[id], m = membersOf(id), pages = pagesOf(id);
    const avas = m.slice(0, 5).map(u => `<span title="${esc(fullName(u))}">${esc(initials(u))}</span>`).join("") + (m.length > 5 ? `<span class="more">+${m.length - 5}</span>` : "");
    return `<article class="rl-card${id === hlId ? " hl" : ""}" style="--rc:${esc(r.color || ROLE_COLORS[0])}" data-id="${esc(id)}">
      <div class="rl-top">
        <div class="rl-badge">${IC.shield}</div>
        <div class="rl-ti">
          <div class="rl-name" title="${esc(r.name || "")}">${esc(r.name || "—")}</div>
          <div class="rl-desc${r.description ? "" : " empty"}">${esc(r.description || "Без опису")}</div>
        </div>
      </div>
      <div class="rl-body">
        <div>
          <div class="rl-sec-l">Учасники</div>
          <div class="rl-members">
            ${m.length ? `<div class="rl-avas">${avas}</div>` : ""}
            <span class="rl-mtext">${m.length ? `<b>${m.length}</b> ${plural(m.length, ["викладач", "викладачі", "викладачів"])}` : "Поки нікому не призначена"}</span>
          </div>
        </div>
        <div>
          <div class="rl-sec-l">Доступ до сторінок</div>
          ${pages.length ? `<div class="rl-chips">${pages.map(p => `<span class="rl-chip">${IC.lock}${esc(p)}</span>`).join("")}</div>`
            : `<div class="rl-none">Не обмежує жодної сторінки — налаштуйте в <a href="navigation" style="color:#6D28D9;font-weight:700">Навігації</a></div>`}
        </div>
      </div>
      <div class="rl-foot">
        <button class="rl-btn" type="button" data-act="members">${IC.users} Учасники</button>
        <button class="rl-btn" type="button" data-act="edit">${IC.edit} Редагувати</button>
        <button class="rl-btn ic danger" type="button" data-act="delete" title="Видалити роль" aria-label="Видалити роль ${esc(r.name || "")}">${IC.trash}</button>
      </div>
    </article>`;
  }).join("") + (q ? "" : `<button class="rl-new" type="button" onclick="openRoleModal()"><span class="pl">${IC.plus.replace("<svg", '<svg width="20" height="20"')}</span><b>Нова роль</b><span>Додати ще одну роль</span></button>`);
}

document.getElementById("rl-grid").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.closest("[data-id]")?.dataset.id; if (!id || !roles[id]) return;
  ({ members: openMembers, edit: openRoleModal, delete: openDeleteRole })[b.dataset.act]?.(id);
});
document.getElementById("rl-search").addEventListener("input", () => renderRoles());

// ─── Створення / редагування ─────────────────────────────────────────────
function renderSwatches(){
  const custom = !ROLE_COLORS.includes(pickedColor);
  document.getElementById("role-swatches").innerHTML = ROLE_COLORS.map(c =>
    `<button type="button" class="rl-sw" role="radio" aria-checked="${c === pickedColor}" aria-label="Колір ${c}" data-c="${c}" style="background:${c}"></button>`).join("") +
    `<label class="rl-custom" title="Свій колір" style="${custom ? `box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink-900);background:${pickedColor}` : ""}"><input type="color" id="role-color-custom" value="${esc(pickedColor)}" aria-label="Свій колір"></label>`;
  updatePreview();
}
function updatePreview(){
  const p = document.getElementById("role-preview");
  p.textContent = document.getElementById("role-name-inp").value.trim() || "Роль";
  p.style.background = pickedColor;
}
document.getElementById("role-swatches").addEventListener("click", e => {
  const b = e.target.closest(".rl-sw"); if (!b) return;
  pickedColor = b.dataset.c; renderSwatches();
});
document.getElementById("role-swatches").addEventListener("input", e => {
  if (e.target.id !== "role-color-custom") return;
  pickedColor = e.target.value.toUpperCase(); updatePreview();
  e.target.parentElement.style.background = pickedColor;
});
document.getElementById("role-swatches").addEventListener("change", e => { if (e.target.id === "role-color-custom") renderSwatches(); });
document.getElementById("role-name-inp").addEventListener("input", () => { updatePreview(); document.getElementById("role-err").classList.remove("show"); });
document.getElementById("role-desc-inp").addEventListener("input", e => { document.getElementById("role-desc-cnt").textContent = `${e.target.value.length} / 160`; });
document.getElementById("role-form").addEventListener("submit", e => { e.preventDefault(); saveRole(); });
document.getElementById("role-desc-inp").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) saveRole(); });

window.openRoleModal = (roleId) => {
  editingRoleId = roleId || null;
  const r = roleId ? roles[roleId] : null;
  pickedColor = r?.color || ROLE_COLORS[Object.keys(roles).length % ROLE_COLORS.length];
  document.getElementById("role-modal-title").textContent = roleId ? "Редагувати роль" : "Нова роль";
  document.getElementById("role-name-inp").value = r?.name || "";
  document.getElementById("role-desc-inp").value = r?.description || "";
  document.getElementById("role-desc-cnt").textContent = `${(r?.description || "").length} / 160`;
  document.getElementById("role-err").classList.remove("show");
  document.getElementById("role-save-btn").textContent = roleId ? "Зберегти" : "Створити";
  renderSwatches();
  openModal("m-role");
  setTimeout(() => document.getElementById("role-name-inp").focus(), 60);
};

window.saveRole = async () => {
  const name = document.getElementById("role-name-inp").value.trim().replace(/\s+/g, " ");
  const description = document.getElementById("role-desc-inp").value.trim();
  const errEl = document.getElementById("role-err");
  const err = m => { errEl.textContent = m; errEl.classList.add("show"); document.getElementById("role-name-inp").focus(); };
  if (!name) return err("Введіть назву ролі");
  if (Object.entries(roles).some(([id, r]) => id !== editingRoleId && norm(r.name) === norm(name))) return err(`Роль «${name}» уже існує`);

  const btn = document.getElementById("role-save-btn");
  btn.disabled = true;
  try {
    const id = editingRoleId || ("role_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
    const data = { name, description, color: pickedColor, createdAt: roles[id]?.createdAt || Date.now(), updatedAt: Date.now() };
    await update(ref(db), { [`roles/${id}`]: data });
    roles[id] = data;
    closeModal("m-role");
    toast(editingRoleId ? "Роль оновлено" : "Роль створено");
    renderRoles(id);
  } catch(e) {
    err("Помилка: " + e.message);
  } finally {
    btn.disabled = false;
  }
};

// ─── Учасники ─────────────────────────────────────────────────────────────
let _mbRole = null, _mbSel = new Set(), _mbOnlySel = false;
function openMembers(id){
  _mbRole = id; _mbOnlySel = false;
  _mbSel = new Set(membersOf(id).map(u => u.uid));
  document.getElementById("mb-role-name").textContent = roles[id].name;
  document.getElementById("mb-search").value = "";
  document.getElementById("mb-err").classList.remove("show");
  renderMembers();
  openModal("m-members");
}
function renderMembers(){
  const q = norm(document.getElementById("mb-search").value);
  const list = Object.entries(users).filter(([, u]) => u && typeof u === "object")
    .map(([uid, u]) => ({ uid, ...u }))
    .filter(u => !q || norm(fullName(u)).includes(q) || norm(u.email).includes(q))
    .filter(u => !_mbOnlySel || _mbSel.has(u.uid))
    .sort((a, b) => (_mbSel.has(b.uid) - _mbSel.has(a.uid)) || fullName(a).localeCompare(fullName(b), "uk"));
  document.getElementById("mb-list").innerHTML = list.length ? list.map(u => `<label class="mb-row${u.blocked ? " blocked" : ""}">
      <input type="checkbox" value="${esc(u.uid)}" ${_mbSel.has(u.uid) ? "checked" : ""}>
      <span class="mb-ava">${esc(initials(u))}</span>
      <span class="mb-i"><div class="mb-n">${esc(fullName(u))}</div><div class="mb-e">${esc(u.email || "")}</div></span>
    </label>`).join("") : `<div style="padding:24px;text-align:center;color:var(--ink-400);font-size:13px">Нікого не знайдено</div>`;
  const before = new Set(membersOf(_mbRole).map(u => u.uid));
  const add = [..._mbSel].filter(x => !before.has(x)).length, rem = [...before].filter(x => !_mbSel.has(x)).length;
  document.getElementById("mb-sum").innerHTML = `Обрано: <b>${_mbSel.size}</b>${add || rem ? ` · <span style="color:#15803D">+${add}</span> / <span style="color:#B91C1C">−${rem}</span>` : ""}`;
  document.getElementById("mb-only-sel").textContent = _mbOnlySel ? "Показати всіх" : "Лише обрані";
}
document.getElementById("mb-list").addEventListener("change", e => {
  if (e.target.type !== "checkbox") return;
  e.target.checked ? _mbSel.add(e.target.value) : _mbSel.delete(e.target.value);
  renderMembers();
});
document.getElementById("mb-search").addEventListener("input", renderMembers);
document.getElementById("mb-only-sel").addEventListener("click", () => { _mbOnlySel = !_mbOnlySel; renderMembers(); });

window.saveMembers = async () => {
  const id = _mbRole; if (!id) return;
  const before = new Set(membersOf(id).map(u => u.uid));
  const upd = {};
  _mbSel.forEach(uid => { if (!before.has(uid)) upd[`users/${uid}/customRoleIds/${id}`] = true; });
  before.forEach(uid => { if (!_mbSel.has(uid)) upd[`users/${uid}/customRoleIds/${id}`] = null; });
  // Переносимо старе одиничне поле в мапу, щоб не загубити ролі
  Object.keys(upd).forEach(p => {
    const uid = p.split("/")[1], u = users[uid];
    if (u?.customRoleId && !(u.customRoleIds && typeof u.customRoleIds === "object")){
      if (u.customRoleId !== id) upd[`users/${uid}/customRoleIds/${u.customRoleId}`] = true;
      upd[`users/${uid}/customRoleId`] = null;
    }
  });
  if (!Object.keys(upd).length){ closeModal("m-members"); return; }
  const btn = document.getElementById("mb-save-btn");
  btn.disabled = true;
  try {
    await update(ref(db), upd);   // одним атомарним записом
    Object.entries(upd).forEach(([p, v]) => {
      const [, uid, key, rid] = p.split("/"); const u = users[uid]; if (!u) return;
      if (key === "customRoleId") { delete u.customRoleId; return; }
      if (!u.customRoleIds || typeof u.customRoleIds !== "object") u.customRoleIds = {};
      if (v) u.customRoleIds[rid] = true; else delete u.customRoleIds[rid];
    });
    closeModal("m-members");
    toast("Учасників оновлено");
    renderRoles(id);
  } catch(e) {
    const el = document.getElementById("mb-err"); el.textContent = "Помилка: " + e.message; el.classList.add("show");
  } finally {
    btn.disabled = false;
  }
};

// ─── Видалення ────────────────────────────────────────────────────────────
let _delRoleId = null;
function openDeleteRole(id){
  _delRoleId = id;
  const m = membersOf(id).length, pages = pagesOf(id);
  document.getElementById("del-role-name").textContent = roles[id]?.name || "—";
  document.getElementById("del-err").classList.remove("show");
  const pts = [];
  pts.push(m ? `Роль буде знято з <b>${m}</b> ${plural(m, ["викладача", "викладачів", "викладачів"])} (інші їхні ролі й дані не зміняться)` : "Роль нікому не призначена");
  if (pages.length) pts.push(`Обмеження знімуться зі сторінок: <b>${pages.map(esc).join(", ")}</b>. Якщо інших ролей на пункті немає, він стане видимим усім`);
  document.getElementById("del-role-warn").innerHTML = `Що станеться:<ul>${pts.map(p => `<li>${p}</li>`).join("")}</ul>`;
  openModal("m-del-role");
}
window.confirmDeleteRole = async () => {
  const id = _delRoleId; if (!id) return;
  const btn = document.getElementById("del-role-confirm-btn");
  btn.disabled = true;
  try {
    const upd = { [`roles/${id}`]: null };
    membersOf(id).forEach(u => {
      if (u.customRoleIds && typeof u.customRoleIds === "object") upd[`users/${u.uid}/customRoleIds/${id}`] = null;
      else upd[`users/${u.uid}/customRoleId`] = null;
    });
    // Прибираємо роль з пунктів навігації — інакше пункт стане невидимим для всіх
    let navChanged = false;
    const newNav = (Array.isArray(nav) ? nav : []).map(sec => ({ ...sec, items: (sec?.items || []).map(it => {
      if (!Array.isArray(it.roleIds) || !it.roleIds.includes(id)) return it;
      navChanged = true;
      return { ...it, roleIds: it.roleIds.filter(r => r !== id) };
    }) }));
    if (navChanged){ upd["settings/navigation"] = newNav; upd["settings/navigation_ts"] = Date.now(); }
    await update(ref(db), upd);   // усе одним атомарним записом
    delete roles[id];
    membersOf(id).forEach(u => { const x = users[u.uid]; if (x?.customRoleIds) delete x.customRoleIds[id]; else if (x) delete x.customRoleId; });
    if (navChanged) nav = newNav;
    closeModal("m-del-role");
    toast("Роль видалено");
    renderRoles();
  } catch(e) {
    const el = document.getElementById("del-err"); el.textContent = "Помилка: " + e.message; el.classList.add("show");
  } finally {
    btn.disabled = false;
  }
};

// ─── Модалки: клік по фону та Esc (лише верхня) ──────────────────────────
document.querySelectorAll(".modal-bd").forEach(m => m.addEventListener("click", e => { if (e.target === m) closeModal(m.id); }));
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const open = [...document.querySelectorAll(".modal-bd.on")];
  if (open.length) closeModal(open[open.length - 1].id);
});

try {
  await load();
} catch(e) {
  document.getElementById("rl-grid").innerHTML = `<div class="rl-empty"><div class="et">Не вдалося завантажити ролі</div><div>${esc(e.message || "Невідома помилка")}</div>
    <button class="tb-btn primary" type="button" style="margin-top:14px" onclick="location.reload()">Спробувати знову</button></div>`;
}
hideLoader();
</script>

</body>
</html>
