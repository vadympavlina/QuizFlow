<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PGRlZnM+PGxpbmVhckdyYWRpZW50IGlkPSJnIiB4MT0iMCIgeTE9IjAiIHgyPSIxIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjN0MzQUVEIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjNEY0NkU1Ii8+PC9saW5lYXJHcmFkaWVudD48L2RlZnM+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iOCIgZmlsbD0idXJsKCNnKSIvPjxjaXJjbGUgY3g9IjE2IiBjeT0iMTYiIHI9IjkiIGZpbGw9Im5vbmUiIHN0cm9rZT0id2hpdGUiIHN0cm9rZS13aWR0aD0iMiIvPjxjaXJjbGUgY3g9IjE2IiBjeT0iMTYiIHI9IjQiIGZpbGw9IndoaXRlIi8+PC9zdmc+">
<title>QuizFlow Admin · Задачі</title>
<link rel="stylesheet" href="shared/admin-shell.css?v=1">
<style>
.kanban-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start;padding-bottom:32px}
.kb-col{background:#F4F6FB;border-radius:16px;min-height:200px;display:flex;flex-direction:column;overflow:hidden}
.kb-col-head{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid #E3E8F2}
.kb-col-head .col-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.kb-col-head h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#0B1437;flex:1}
.kb-col-head .col-count{font-family:"Geist Mono",monospace;font-size:11px;font-weight:700;background:#fff;border:1px solid #E3E8F2;padding:2px 8px;border-radius:999px;color:#5B6A8F}
.kb-col-body{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:80px;transition:background .15s}
.kb-col-body.drag-over{background:#EEF2FB}
.kb-add-btn{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:10px;background:transparent;border:1.5px dashed #CDD6E8;color:#8691AC;font-size:13px;font-weight:600;cursor:pointer;font-family:Manrope,sans-serif;transition:all .15s;margin:2px 10px 10px}
.kb-add-btn:hover{background:#fff;border-color:#1E3A8A;color:#1E3A8A}
.kb-add-btn svg{width:14px;height:14px}
.kb-card{background:#fff;border:1px solid #E3E8F2;border-radius:12px;padding:12px 14px;cursor:grab;transition:box-shadow .15s,transform .15s,border-color .15s;user-select:none;position:relative}
.kb-card:hover{border-color:#CDD6E8;box-shadow:0 4px 12px rgba(11,20,55,.07)}
.kb-card.dragging{opacity:.5;transform:scale(.97);cursor:grabbing}
.card-type{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-bottom:7px}
.card-type.bug{background:#FEE2E2;color:#B91C1C}
.card-type.task{background:#EDE9FE;color:#6D28D9}
.card-title{font-size:13.5px;font-weight:700;color:#0B1437;margin:0 0 8px;line-height:1.4}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:#8691AC;font-family:"Geist Mono",monospace}
.card-meta-item{display:flex;align-items:center;gap:4px}
.card-meta-item svg{width:11px;height:11px;flex-shrink:0}
.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid #F4F6FB}
.card-assignee{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#5B6A8F;font-weight:600}
.assignee-av{width:22px;height:22px;border-radius:50%;background:#1E3A8A;color:#fff;display:grid;place-items:center;font-size:9px;font-weight:800;flex-shrink:0}
.card-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s}
.kb-card:hover .card-actions{opacity:1}
.card-act-btn{width:22px;height:22px;border-radius:6px;border:none;background:transparent;cursor:pointer;color:#8691AC;display:grid;place-items:center;transition:all .12s;padding:0}
.card-act-btn:hover{background:#F4F6FB;color:#0B1437}
.card-act-btn.del:hover{background:#FEE2E2;color:#B91C1C}
.card-act-btn svg{width:13px;height:13px}
.card-date{font-size:10.5px;font-family:"Geist Mono",monospace;padding:2px 7px;border-radius:5px;font-weight:700}
.card-date.done{background:#DCFCE7;color:#15803D}
.card-date.overdue{background:#FEE2E2;color:#B91C1C}
.card-date.pending{background:#F4F6FB;color:#8691AC}
.col-new{border:1px solid #FEE2E2}
.col-new .kb-col-head{border-bottom-color:#FEE2E2;background:#FFF5F5}
.col-new .col-dot{background:#EF4444}
.col-progress{border:1px solid #FEF3C7}
.col-progress .kb-col-head{border-bottom-color:#FEF3C7;background:#FFFBEB}
.col-progress .col-dot{background:#F59E0B}
.col-done{border:1px solid #DCFCE7}
.col-done .kb-col-head{border-bottom-color:#DCFCE7;background:#F0FDF4}
.col-done .col-dot{background:#10B981}
.task-modal-bg{position:fixed;inset:0;background:rgba(11,20,55,.4);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.task-modal-bg.open{display:flex}
.task-modal{background:#fff;border-radius:18px;padding:28px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(11,20,55,.15)}
.task-modal h3{margin:0 0 18px;font-size:17px;font-weight:800;color:#0B1437}
.task-modal .field{margin-bottom:14px}
.task-modal label{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#5B6A8F;margin-bottom:6px}
.task-modal input,.task-modal textarea,.task-modal select{width:100%;padding:10px 12px;border:1.5px solid #E3E8F2;border-radius:10px;font-family:Manrope,sans-serif;font-size:14px;color:#0B1437;outline:none;transition:border-color .15s;box-sizing:border-box}
.task-modal input:focus,.task-modal textarea:focus,.task-modal select:focus{border-color:#1E3A8A}
.task-modal textarea{min-height:80px;resize:vertical}
.task-modal .modal-btns{display:flex;gap:10px;margin-top:20px}
.task-modal .modal-btn{flex:1;padding:11px;border-radius:10px;font-family:Manrope,sans-serif;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .12s}
.task-modal .modal-btn.cancel{background:#F4F6FB;color:#5B6A8F;border:1px solid #E3E8F2}
.task-modal .modal-btn.cancel:hover{background:#EEF2FB}
.task-modal .modal-btn.save{background:#1E3A8A;color:#fff}
.task-modal .modal-btn.save:hover{background:#152C6E}
</style>
</head>
<body>
<div id="admin-root"></div>

<div class="task-modal-bg" id="task-modal-bg">
  <div class="task-modal">
    <h3 id="modal-title">Нова задача</h3>
    <div class="field"><label>Назва задачі</label><input id="t-name" type="text" placeholder="Опишіть задачу..."></div>
    <div class="field"><label>Відповідальний</label><input id="t-assignee" type="text" placeholder="Ім'я або нікнейм"></div>
    <div class="field"><label>Дедлайн</label><input id="t-deadline" type="date"></div>
    <div class="field"><label>Колонка</label><select id="t-col"><option value="new">Нові</option><option value="in_progress">В роботі</option><option value="done">Виконано</option></select></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeTaskModal()">Скасувати</button>
      <button class="modal-btn save" onclick="saveTask()">Зберегти</button>
    </div>
  </div>
</div>

<script type="module">
import { initAdminShell, esc, formatTimeAgo, toast, hideLoader } from "./shared/admin-shell.js?v=2";
import { getDatabase, ref, update, remove, onValue, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const content = `
  <div class="page-head">
    <div><h1>Задачі</h1><p id="kb-sub">Помилки та завдання команди</p></div>
    <div style="display:flex;gap:10px">
      <button class="tb-btn" onclick="openTaskModal('new')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Нова задача
      </button>
    </div>
  </div>
  <div class="kanban-wrap">
    <div class="kb-col col-new">
      <div class="kb-col-head"><span class="col-dot"></span><h2>Нові</h2><span class="col-count" id="cnt-new">0</span></div>
      <div class="kb-col-body" id="body-new" data-col="new"></div>
      <button class="kb-add-btn" onclick="openTaskModal('new')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Додати задачу</button>
    </div>
    <div class="kb-col col-progress">
      <div class="kb-col-head"><span class="col-dot"></span><h2>В роботі</h2><span class="col-count" id="cnt-prog">0</span></div>
      <div class="kb-col-body" id="body-in_progress" data-col="in_progress"></div>
      <button class="kb-add-btn" onclick="openTaskModal('in_progress')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Додати задачу</button>
    </div>
    <div class="kb-col col-done">
      <div class="kb-col-head"><span class="col-dot"></span><h2>Виконано</h2><span class="col-count" id="cnt-done">0</span></div>
      <div class="kb-col-body" id="body-done" data-col="done"></div>
      <button class="kb-add-btn" onclick="openTaskModal('done')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Додати задачу</button>
    </div>
  </div>
`;

const { _user } = await initAdminShell({ activeId:"problems", crumbs:["Задачі"], content, topbarRight:"" });
const db = getDatabase();
let allItems = {};
let dragId = null;

function subscribe() {
  onValue(ref(db, "bugReports"), snap => {
    const bugs = snap.exists() ? snap.val() : {};
    Object.keys(allItems).filter(id => allItems[id].type === "bug").forEach(id => delete allItems[id]);
    Object.entries(bugs).forEach(([id, b]) => {
      const col = b.status === "in_progress" ? "in_progress" : b.status === "resolved" ? "done" : "new";
      allItems[id] = { ...b, id, type:"bug", col };
    });
    renderAll();
    hideLoader();
  });
  onValue(ref(db, "adminTasks"), snap => {
    const tasks = snap.exists() ? snap.val() : {};
    Object.keys(allItems).filter(id => allItems[id].type === "task").forEach(id => delete allItems[id]);
    Object.entries(tasks).forEach(([id, t]) => { allItems[id] = { ...t, id, type:"task" }; });
    renderAll();
  });
}

function renderAll() {
  const cols = { new:[], in_progress:[], done:[] };
  Object.values(allItems).forEach(item => { const c=item.col||"new"; if(cols[c]) cols[c].push(item); });
  Object.entries(cols).forEach(([colId, items]) => {
    const body = document.getElementById("body-"+colId);
    if (!body) return;
    items.sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
    body.innerHTML = items.map(renderCard).join("");
    body.querySelectorAll(".kb-card").forEach(attachDrag);
  });
  document.getElementById("cnt-new").textContent = cols.new.length;
  document.getElementById("cnt-prog").textContent = cols.in_progress.length;
  document.getElementById("cnt-done").textContent = cols.done.length;
  const kb = document.getElementById("kb-sub");
  if (kb) kb.textContent = Object.keys(allItems).length + " задач · " + cols.new.length + " нових";
}

function renderCard(item) {
  const isBug = item.type === "bug";
  const typeBadge = isBug ? `<span class="card-type bug">Помилка</span>` : `<span class="card-type task">Задача</span>`;
  const meta = [];
  if (item.userName) meta.push(`<span class="card-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>${esc(item.userName)}</span>`);
  if (item.page) meta.push(`<span class="card-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l2 2"/></svg>${esc(item.page)}</span>`);
  if (item.createdAt) meta.push(`<span class="card-meta-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></svg>${formatTimeAgo(item.createdAt)}</span>`);
  let dateHtml = "";
  if (item.deadline) {
    const dl = new Date(item.deadline), now = new Date();
    const cls = item.col==="done" ? "done" : dl < now ? "overdue" : "pending";
    dateHtml = `<span class="card-date ${cls}">${dl.toLocaleDateString("uk-UA",{day:"2-digit",month:"short"})}</span>`;
  } else if (item.col==="done" && item.completedAt) {
    const d = new Date(item.completedAt);
    dateHtml = `<span class="card-date done">Вик. ${d.toLocaleDateString("uk-UA",{day:"2-digit",month:"short"})}</span>`;
  }
  const assignee = item.assignee ? `<div class="card-assignee"><div class="assignee-av">${item.assignee.slice(0,2).toUpperCase()}</div>${esc(item.assignee)}</div>` : `<div></div>`;
  const editBtn = !isBug ? `<button class="card-act-btn" onclick="editCard('${item.id}')" title="Редагувати"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>` : "";
  return `<div class="kb-card" id="card-${item.id}" draggable="true" data-id="${item.id}">${typeBadge}<p class="card-title">${esc(item.message||item.title||"—")}</p>${meta.length?`<div class="card-meta">${meta.join("")}</div>`:""}<div class="card-footer">${assignee}<div style="display:flex;align-items:center;gap:6px">${dateHtml}<div class="card-actions">${editBtn}<button class="card-act-btn del" onclick="deleteCard('${item.id}')" title="Видалити"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button></div></div></div></div>`;
}

function attachDrag(card) {
  card.addEventListener("dragstart", e => { dragId=card.dataset.id; card.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; });
  card.addEventListener("dragend", () => { card.classList.remove("dragging"); document.querySelectorAll(".kb-col-body").forEach(b=>b.classList.remove("drag-over")); });
}

document.addEventListener("dragover", e => {
  const col = e.target.closest(".kb-col-body"); if(!col) return;
  e.preventDefault();
  document.querySelectorAll(".kb-col-body").forEach(b=>b.classList.remove("drag-over"));
  col.classList.add("drag-over");
});

document.addEventListener("drop", async e => {
  const col = e.target.closest(".kb-col-body"); if(!col||!dragId) return;
  e.preventDefault(); col.classList.remove("drag-over");
  const newCol = col.dataset.col;
  const item = allItems[dragId];
  if (!item || item.col===newCol) { dragId=null; return; }
  item.col = newCol;
  if (item.type==="bug") {
    const sm={new:"new",in_progress:"in_progress",done:"resolved"};
    await update(ref(db,`bugReports/${dragId}`),{status:sm[newCol]});
  } else {
    const upd = {col:newCol};
    if (newCol==="done") upd.completedAt=Date.now();
    await update(ref(db,`adminTasks/${dragId}`),upd);
  }
  dragId=null; toast("Переміщено");
});

let editingId=null;
window.openTaskModal=(colId="new")=>{
  editingId=null;
  document.getElementById("modal-title").textContent="Нова задача";
  document.getElementById("t-name").value="";
  document.getElementById("t-assignee").value="";
  document.getElementById("t-deadline").value="";
  document.getElementById("t-col").value=colId;
  document.getElementById("task-modal-bg").classList.add("open");
  setTimeout(()=>document.getElementById("t-name").focus(),50);
};
window.editCard=(id)=>{
  const item=allItems[id]; if(!item||item.type==="bug") return;
  editingId=id;
  document.getElementById("modal-title").textContent="Редагувати задачу";
  document.getElementById("t-name").value=item.title||item.message||"";
  document.getElementById("t-assignee").value=item.assignee||"";
  document.getElementById("t-deadline").value=item.deadline||"";
  document.getElementById("t-col").value=item.col||"new";
  document.getElementById("task-modal-bg").classList.add("open");
};
window.closeTaskModal=()=>{ document.getElementById("task-modal-bg").classList.remove("open"); editingId=null; };
window.saveTask=async()=>{
  const title=document.getElementById("t-name").value.trim(); if(!title){document.getElementById("t-name").focus();return;}
  const data={title,assignee:document.getElementById("t-assignee").value.trim()||null,deadline:document.getElementById("t-deadline").value||null,col:document.getElementById("t-col").value,type:"task",createdAt:editingId?(allItems[editingId]?.createdAt||Date.now()):Date.now()};
  if(editingId){await update(ref(db,`adminTasks/${editingId}`),data);toast("Збережено");}
  else{await push(ref(db,"adminTasks"),data);toast("Задачу додано");}
  closeTaskModal();
};
window.deleteCard=async(id)=>{
  const item=allItems[id]; if(!item) return;
  if(!confirm("Видалити цю задачу?")) return;
  if(item.type==="bug") await remove(ref(db,`bugReports/${id}`));
  else await remove(ref(db,`adminTasks/${id}`));
  toast("Видалено");
};
document.getElementById("task-modal-bg").addEventListener("click",e=>{if(e.target===e.currentTarget)closeTaskModal();});
subscribe();
</script>
</body>
</html>
