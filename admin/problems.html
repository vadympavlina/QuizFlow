<style>
/* ═══ Плитки-фільтри ═══ */
.pb-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0 16px}
.pb-tile{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);cursor:pointer;font:inherit;color:inherit;text-align:left;transition:border-color .15s,box-shadow .15s,transform .15s}
.pb-tile:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.pb-tile.on{border-color:#A78BFA;box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.pb-tile .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.pb-tile .ico svg{width:19px;height:19px}
.pb-tile.red .ico{background:#FEE2E2;color:#B91C1C}.pb-tile.amber .ico{background:#FEF3C7;color:#B45309}
.pb-tile.rose .ico{background:#FFE4E6;color:#BE123C}.pb-tile.green .ico{background:#DCFCE7;color:#15803D}
.pb-tile .v{display:block;font-family:"Geist Mono",monospace;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1}
.pb-tile .l{display:block;font-size:12px;color:var(--ink-500);font-weight:600;margin-top:4px}
.pb-tile.rose.hot{border-color:#FDA4AF;background:#FFF7F8}
@media (max-width:1180px){.pb-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ═══ Панель фільтрів ═══ */
.pb-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.pb-search{position:relative;flex:0 1 300px;min-width:200px}
.pb-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-400);pointer-events:none}
.pb-search input{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px 0 34px;font:inherit;font-size:13px;color:var(--ink-900);outline:none;background:#fff;transition:border-color .15s,box-shadow .15s}
.pb-search input:focus{border-color:#A78BFA;box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.seg{display:inline-flex;background:#EEEBF8;border-radius:10px;padding:3px;gap:2px}
.seg button{height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-500);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button:hover:not(.on){color:var(--ink-900)}
.seg button.on{background:#fff;color:var(--ink-900);box-shadow:0 1px 3px rgba(11,20,55,.1)}
.seg button i{font-style:normal;font-family:"Geist Mono",monospace;font-size:11px;opacity:.6}
.chip-t{height:38px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;font-weight:700;color:var(--ink-700);cursor:pointer}
.chip-t.on{background:#F5F3FF;border-color:#C4B5FD;color:#5B21B6}
.pb-bar .grow{flex:1}
.pb-reset{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:700;color:#6D28D9;cursor:pointer;padding:6px 8px;border-radius:8px}
.pb-reset:hover{background:#F5F3FF}

/* ═══ Kanban ═══ */
.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start;padding-bottom:40px}
.kb-col{border-radius:18px;background:#F7F8FC;border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;transition:border-color .15s,background .15s}
.kb-col.over{border-color:#A78BFA;background:#F5F3FF}
.kb-head{display:flex;align-items:center;gap:9px;padding:14px 16px 10px}
.kb-head b{font-size:13px;font-weight:800;flex:1}
.kb-head .pip{width:9px;height:9px;border-radius:50%;background:var(--c)}
.kb-head .n{font-family:"Geist Mono",monospace;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink-500)}
.kb-add{border:0;background:transparent;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--ink-400);cursor:pointer}
.kb-add:hover{background:#fff;color:#6D28D9}
.kb-body{padding:4px 10px 12px;display:flex;flex-direction:column;gap:8px;min-height:90px}
.kb-empty{padding:22px 12px;text-align:center;font-size:12.5px;color:var(--ink-400);border:1.5px dashed #DCE1EC;border-radius:12px}
.kb-more{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:700;color:#6D28D9;cursor:pointer;padding:8px;border-radius:9px}
.kb-more:hover{background:#fff}

.pcard{position:relative;background:#fff;border:1px solid #E6EAF3;border-radius:14px;padding:12px 13px;cursor:pointer;box-shadow:0 1px 2px rgba(11,20,55,.04);transition:box-shadow .15s,border-color .15s,transform .15s;outline:none}
.pcard:hover,.pcard:focus-visible{border-color:#C9CFEA;box-shadow:0 6px 18px -8px rgba(11,20,55,.2)}
.pcard:focus-visible{box-shadow:0 0 0 3px rgba(124,58,237,.25)}
.pcard.dragging{opacity:.4}
.pcard.late{border-left:3px solid #E11D48}
.c-top{display:flex;align-items:center;gap:6px;margin-bottom:7px;padding-right:26px}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px}
.b-bug{background:#FEE2E2;color:#B91C1C}.b-idea{background:#DCFCE7;color:#15803D}.b-task{background:#EDE9FE;color:#6D28D9}
.prio{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--ink-500)}
.prio::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--p)}
.c-menu{position:absolute;top:8px;right:8px;width:26px;height:26px;border:0;border-radius:7px;background:transparent;color:var(--ink-400);cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .12s}
.pcard:hover .c-menu,.pcard:focus-within .c-menu,.c-menu.open{opacity:1}
.c-menu:hover{background:#F4F6FB;color:var(--ink-900)}
.c-title{font-size:13.5px;font-weight:700;color:var(--ink-900);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.c-meta{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:8px;font-size:11.5px;color:var(--ink-400);font-weight:600}
.c-meta span{display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-meta svg{flex:0 0 auto}
.c-ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid #F1F3F9}
.who{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-500);min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:#fff;flex:0 0 auto}
.av.none{background:#EEF1F7;color:var(--ink-400)}
.dl{font-family:"Geist Mono",monospace;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.dl.ok{background:#EEF1F7;color:var(--ink-500)}.dl.soon{background:#FEF3C7;color:#92400E}.dl.late{background:#FFE4E6;color:#BE123C}.dl.done{background:#DCFCE7;color:#15803D}
@media (max-width:1000px){.kb{grid-template-columns:1fr}}

/* ═══ Меню картки ═══ */
.pop{position:fixed;z-index:300;min-width:200px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 12px 32px rgba(11,20,55,.16);animation:popIn .12s ease}
@keyframes popIn{from{opacity:0;transform:translateY(-4px)}}
.pop-h{padding:6px 10px 4px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-400)}
.pop button{width:100%;display:flex;align-items:center;gap:9px;padding:8px 10px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--ink-900);cursor:pointer;text-align:left}
.pop button:hover,.pop button.kb{background:#F4F6FB}
.pop button:disabled{opacity:.4;cursor:default;background:transparent}
.pop button.danger{color:#B91C1C}.pop button.danger:hover{background:#FEE2E2}
.pop hr{border:0;border-top:1px solid #F1F3F9;margin:4px 0}
.pop .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* ═══ Модалка деталей ═══ */
.modal.wide{max-width:640px}
.it-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.it-id{font-family:"Geist Mono",monospace;font-size:11.5px;color:var(--ink-400)}
.it-msg{padding:12px 14px;border-radius:12px;background:#F7F8FC;border:1px solid var(--line);font-size:14px;line-height:1.6;color:var(--ink-900);white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto}
.it-rep{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line)}
.it-rep .av{width:34px;height:34px;font-size:12px}
.it-rep b{display:block;font-size:13.5px}
.it-rep span{font-size:12px;color:var(--ink-500)}
.it-rep .pg{margin-left:auto;font-family:"Geist Mono",monospace;font-size:11.5px;color:var(--ink-500);background:#F4F6FB;padding:3px 8px;border-radius:7px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-family:"Manrope",sans-serif;font-size:14px;color:var(--ink-900);outline:none;transition:border-color .15s,box-shadow .15s;box-sizing:border-box}
.field-input:focus{border-color:#A78BFA;box-shadow:0 0 0 3px rgba(124,58,237,.12)}
textarea.field-input{resize:vertical;min-height:72px;line-height:1.5}
.seg.full{display:flex}.seg.full button{flex:1;justify-content:center}
.seg button .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.mod-err{background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.18);border-radius:8px;padding:9px 12px;color:#B91C1C;font-size:12.5px;font-weight:600}
.mod-err:empty{display:none}
.modal-f .spacer{flex:1}
.modal-f .hint{font-size:11.5px;color:var(--ink-400);font-family:"Geist Mono",monospace;align-self:center}

/* Дропдаун «Відповідальний» */
.dd{position:relative}
.dd-btn{width:100%;height:42px;display:flex;align-items:center;gap:9px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:14px;color:var(--ink-900);cursor:pointer;text-align:left}
.dd-btn:hover,.dd-btn.open{border-color:#A78BFA}
.dd-btn .ph{color:var(--ink-400)}
.dd-btn .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn svg{color:var(--ink-400);flex:0 0 auto}
.dd-pop{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:5;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(11,20,55,.14);padding:5px}
.dd-pop input{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;font-size:13px;outline:none;margin-bottom:4px;box-sizing:border-box}
.dd-pop input:focus{border-color:#A78BFA}
.dd-list{max-height:210px;overflow:auto}
.dd-it{width:100%;display:flex;align-items:center;gap:9px;padding:7px 9px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left;color:var(--ink-900)}
.dd-it:hover,.dd-it.on{background:#F5F3FF}
.dd-it small{display:block;font-size:11px;color:var(--ink-400);font-weight:500}
.dd-empty{padding:12px;text-align:center;font-size:12.5px;color:var(--ink-400)}
</style>
</head>
<body>
<script src="shared/admin-nav.js?v=1"></script>
<div id="admin-root"></div>

<!-- Деталі / редагування -->
<div class="modal-bd" id="m-item">
  <div class="modal wide">
    <div class="modal-h"><h3 id="it-title">Задача</h3>
      <button class="close" type="button" data-close aria-label="Закрити"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
    <form class="modal-b" id="it-form" novalidate></form>
    <div class="modal-f">
      <button class="tb-btn danger" type="button" id="it-del">Видалити</button>

      <span class="hint">Ctrl + Enter — зберегти</span>

<!-- Підтвердження -->
<div class="modal-bd" id="m-confirm" style="z-index:170">

</div>

<script type="module">
import { initAdminShell, esc, formatTimeAgo, toast, hideLoader, openModal, closeModal, db, ref, update, remove, onValue, get } from "./shared/admin-shell.js?v=5";
import { push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ─── Довідники ─────────────────────────────────────────────────────────
const COLS = [
  { id: "new",         label: "Нові",     c: "#EF4444" },
  { id: "in_progress", label: "В роботі", c: "#F59E0B" },
  { id: "done",        label: "Виконано", c: "#10B981" },
];
const BUG_STATUS = { new: "new", in_progress: "in_progress", done: "resolved" };
const PRIO = { low: { label: "Низький", c: "#94A3B8" }, normal: { label: "Звичайний", c: "#3B82F6" }, high: { label: "Високий", c: "#E11D48" } };
const KIND = { bug: { label: "Помилка", cls: "b-bug" }, idea: { label: "Ідея", cls: "b-idea" }, task: { label: "Задача", cls: "b-task" } };
const DONE_DAYS = 30;
const AV = ["#6D28D9","#0F766E","#1E40AF","#B45309","#BE185D","#0369A1","#15803D","#9A3412"];
const avColor = s => { let h = 0; for (const ch of String(s || "?")) h = (h * 31 + ch.charCodeAt(0)) | 0; return AV[Math.abs(h) % AV.length]; };
const initials = s => String(s || "?").trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase() || "?";
const I = {
  plus: '<path d="M12 5v14M5 12h14"/>', dots: '<circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/>',
  user: '<path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>', page: '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>', me: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0112 0v1"/>', edit: '<path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4z"/>',
  trash: '<path d="M3 6h18M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>', down: '<path d="M6 9l6 6 6-6"/>',
  bug: '<path d="M8 2l1.88 1.88M14.12 3.88L16 2M9 7.13v-1a3 3 0 116 0v1"/><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 014-4h4a4 4 0 014 4v3c0 3.3-2.7 6-6 6zM12 20v-9M6.53 9C4.6 8.8 3 7.1 3 5M6 13H2M3 21c0-2.1 1.7-3.9 3.8-4M20.97 5c0 2.1-1.6 3.8-3.5 4M22 13h-4M17.2 17c2.1.1 3.8 1.9 3.8 4"/>',
  play: '<circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/>', alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5M12 16h.01"/>', check: '<path d="M20 6L9 17l-5-5"/>',
};
const ic = (n, s = 14, w = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const dayStart = () => new Date().setHours(0, 0, 0, 0);
const dlState = it => {
  if (!it.deadline) return null;
  if (it.col === "done") return "done";
  const d = new Date(it.deadline + "T23:59:59").getTime(), now = Date.now();
  return d < now ? "late" : d - now < 3 * 864e5 ? "soon" : "ok";
};
const isLate = it => dlState(it) === "late";

// ─── Сторінка ──────────────────────────────────────────────────────────
const content = `
  <div class="page-head">
    <div><h1>Проблеми й задачі</h1><p id="pb-sub">Завантаження…</p></div>
    <div class="actions"><button class="tb-btn primary" type="button" data-act="new">${ic("plus", 14, 2.5)}Нова задача</button></div>
  </div>
  <div class="pb-tiles">
    <button class="pb-tile red" data-focus="new" type="button"><span class="ico">${ic("bug", 19)}</span><span><span class="v" id="t-new">0</span><span class="l">Нові</span></span></button>
    <button class="pb-tile amber" data-focus="in_progress" type="button"><span class="ico">${ic("play", 19)}</span><span><span class="v" id="t-prog">0</span><span class="l">В роботі</span></span></button>
    <button class="pb-tile rose" data-focus="late" type="button" id="tile-late"><span class="ico">${ic("alert", 19)}</span><span><span class="v" id="t-late">0</span><span class="l">Прострочені</span></span></button>
    <button class="pb-tile green" data-focus="done7" type="button"><span class="ico">${ic("check", 19, 2.4)}</span><span><span class="v" id="t-done">0</span><span class="l">Виконано за тиждень</span></span></button>
  </div>
  <div class="pb-bar">
    <div class="pb-search">${ic("search", 14, 2.2)}<input type="search" id="pb-q" placeholder="Пошук: текст, автор, сторінка" autocomplete="off"></div>
    <div class="seg" id="pb-kind">
      <button type="button" data-k="" class="on">Усі <i id="k-all">0</i></button>
      <button type="button" data-k="bug">Помилки <i id="k-bug">0</i></button>
      <button type="button" data-k="idea">Ідеї <i id="k-idea">0</i></button>
      <button type="button" data-k="task">Задачі <i id="k-task">0</i></button>
    </div>
    <button type="button" class="chip-t" id="pb-mine">${ic("me", 14)}Лише мої</button>
    <button type="button" class="pb-reset" id="pb-reset" hidden>Скинути фільтри</button>
  </div>
  <div class="kb" id="kb">${COLS.map(c => `
    <section class="kb-col" data-col="${c.id}" aria-label="${c.label}">
      <div class="kb-head"><span class="pip" style="--c:${c.c}"></span><b>${c.label}</b><span class="n" id="n-${c.id}">0</span>
        <button class="kb-add" type="button" data-act="new" data-col="${c.id}" title="Нова задача в «${c.label}»">${ic("plus", 15, 2.4)}</button></div>
      <div class="kb-body" id="b-${c.id}"></div>
    </section>`).join("")}
  </div>`;

const { _user } = await initAdminShell({ activeId: "problems", crumbs: ["Проблеми"], content, topbarRight: "" });
const ME = { id: _user?.id, name: [_user?.name, _user?.surname].filter(Boolean).join(" ") || _user?.email || "Адмін" };

// ─── Стан ──────────────────────────────────────────────────────────────
const S = { bugs: {}, tasks: {}, users: {}, q: "", kind: "", mine: false, focus: "", allDone: false, loaded: { b: false, t: false } };
let staff = [];

try {
  const snap = await get(ref(db, "users"));
  S.users = snap.exists() ? snap.val() : {};
  staff = Object.entries(S.users).filter(([, u]) => u && (u.role === "admin" || u.role === "manager") && !u.blocked)
    .map(([id, u]) => ({ id, name: [u.name, u.surname].filter(Boolean).join(" ") || u.email || id, role: u.role, email: u.email || "" }))
    .sort((a, b) => a.name.localeCompare(b.name, "uk"));
} catch {}
const userName = uid => { const u = S.users[uid]; return u ? ([u.name, u.surname].filter(Boolean).join(" ") || u.email || "") : ""; };

// Нормалізований елемент: і звіт викладача, і задача адміна
function normBug(id, b){
  return { id, src: "bug", kind: b.reportType === "improvement" ? "idea" : "bug",
    title: b.message || b.title || "—", text: b.message || "", col: b.status === "in_progress" ? "in_progress" : b.status === "resolved" ? "done" : "new",
    createdAt: b.createdAt || 0, doneAt: b.resolvedAt || 0, page: b.page && b.page !== "—" ? b.page : "",
    authorId: b.uid && b.uid !== "—" ? b.uid : "", authorName: (b.userName && b.userName !== "—" ? b.userName : "") || userName(b.uid),
    assignee: b.assignee || "", assigneeId: b.assigneeId || "", deadline: b.deadline || "", priority: b.priority || "normal", note: b.note || "" };
}
function normTask(id, t){
  return { id, src: "task", kind: "task", title: t.title || "—", text: t.description || "", col: t.col || "new",
    createdAt: t.createdAt || 0, doneAt: t.completedAt || 0, authorName: t.createdByName || "", authorId: t.createdBy || "",
    assignee: t.assignee || "", assigneeId: t.assigneeId || "", deadline: t.deadline || "", priority: t.priority || "normal", note: "" };
}
const all = () => [...Object.values(S.bugs), ...Object.values(S.tasks)];
const byId = id => S.bugs[id] || S.tasks[id];

onValue(ref(db, "bugReports"), snap => {
  S.bugs = {}; Object.entries(snap.val() || {}).forEach(([id, b]) => { if (b) S.bugs[id] = normBug(id, b); });
  S.loaded.b = true; renderSoon();
});
onValue(ref(db, "adminTasks"), snap => {
  S.tasks = {}; Object.entries(snap.val() || {}).forEach(([id, t]) => { if (t) S.tasks[id] = normTask(id, t); });
  S.loaded.t = true; renderSoon();
});

// ─── Рендер ────────────────────────────────────────────────────────────
let _raf = 0;
function renderSoon(){ if (!_raf) _raf = requestAnimationFrame(() => { _raf = 0; render(); }); }
const isMine = it => (it.assigneeId && it.assigneeId === ME.id) || (!it.assigneeId && it.assignee && it.assignee === ME.name);
function render(){
  if (!S.loaded.b || !S.loaded.t) return;
  const items = all(), week = Date.now() - 7 * 864e5;
  const cnt = { new: 0, in_progress: 0, late: 0, done7: 0 };
  for (const it of items){
    if (it.col === "new") cnt.new++; else if (it.col === "in_progress") cnt.in_progress++;
    if (isLate(it)) cnt.late++;
    if (it.col === "done" && (it.doneAt || it.createdAt) >= week) cnt.done7++;
  }
  const T = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  T("t-new", cnt.new); T("t-prog", cnt.in_progress); T("t-late", cnt.late); T("t-done", cnt.done7);
  document.getElementById("tile-late")?.classList.toggle("hot", cnt.late > 0);
  const open = cnt.new + cnt.in_progress;
  T("pb-sub", open ? `${open} відкритих · ${cnt.new} нових${cnt.late ? ` · ${cnt.late} прострочено` : ""}` : "Відкритих проблем немає 🎉");

  // Фільтри
  const words = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const scoped = items.filter(it =>
    (!S.mine || isMine(it)) &&
    (!words.length || words.every(w => `${it.title} ${it.text} ${it.authorName} ${it.page} ${it.assignee} ${it.note}`.toLowerCase().includes(w))) &&
    (!S.focus || (S.focus === "late" ? isLate(it) : S.focus === "done7" ? it.col === "done" && (it.doneAt || it.createdAt) >= week : it.col === S.focus)));
  const kc = { "": scoped.length, bug: 0, idea: 0, task: 0 };
  scoped.forEach(it => kc[it.kind]++);
  T("k-all", kc[""]); T("k-bug", kc.bug); T("k-idea", kc.idea); T("k-task", kc.task);
  const list = S.kind ? scoped.filter(it => it.kind === S.kind) : scoped;
  document.querySelectorAll("#pb-kind button").forEach(b => b.classList.toggle("on", b.dataset.k === S.kind));
  document.querySelectorAll(".pb-tile").forEach(b => b.classList.toggle("on", b.dataset.focus === S.focus));
  document.getElementById("pb-mine")?.classList.toggle("on", S.mine);
  const filtered = !!(words.length || S.kind || S.mine || S.focus);
  document.getElementById("pb-reset").hidden = !filtered;

  const prioRank = { high: 0, normal: 1, low: 2 };
  for (const c of COLS){
    let arr = list.filter(it => it.col === c.id);
    if (c.id === "done") arr.sort((a, b) => (b.doneAt || b.createdAt) - (a.doneAt || a.createdAt));
    else arr.sort((a, b) => (isLate(b) - isLate(a)) || (prioRank[a.priority] - prioRank[b.priority]) || (b.createdAt - a.createdAt));
    T("n-" + c.id, arr.length);
    let hidden = 0;
    if (c.id === "done" && !S.allDone && !filtered){
      const cut = Date.now() - DONE_DAYS * 864e5;
      const recent = arr.filter(it => (it.doneAt || it.createdAt) >= cut);
      hidden = arr.length - recent.length; arr = recent;
    }
    const body = document.getElementById("b-" + c.id);
    body.innerHTML = (arr.length ? arr.map(cardHtml).join("") : `<div class="kb-empty">${filtered ? "Нічого не знайдено" : c.id === "done" ? "Тут з'являться виконані" : "Порожньо"}</div>`)
      + (hidden ? `<button class="kb-more" type="button" data-act="all-done">Показати старіші (${hidden})</button>` : "");
  }
  hideLoader();
}

function cardHtml(it){
  const k = KIND[it.kind], dl = dlState(it);
  const dlTxt = it.deadline ? new Date(it.deadline + "T00:00:00").toLocaleDateString("uk-UA", { day: "numeric", month: "short" }) : "";
  const who = it.assignee
    ? `<div class="who"><span class="av" style="background:${avColor(it.assignee)}">${esc(initials(it.assignee))}</span><span>${esc(it.assignee)}</span></div>`
    : `<div class="who"><span class="av none">${ic("user", 12)}</span><span>Не призначено</span></div>`;
  return `<article class="pcard${dl === "late" ? " late" : ""}" draggable="true" tabindex="0" data-id="${esc(it.id)}" aria-label="${esc(k.label)}: ${esc(it.title.slice(0, 80))}">
    <div class="c-top"><span class="badge ${k.cls}">${k.label}</span>${it.priority !== "normal" ? `<span class="prio" style="--p:${PRIO[it.priority]?.c}">${PRIO[it.priority]?.label}</span>` : ""}</div>
    <button class="c-menu" type="button" data-menu="${esc(it.id)}" aria-label="Дії">${ic("dots", 15)}</button>
    <div class="c-title">${esc(it.title)}</div>
    <div class="c-meta">
      ${it.authorName ? `<span title="Автор">${ic("user", 11)}${esc(it.authorName)}</span>` : ""}
      ${it.page ? `<span title="Сторінка">${ic("page", 11)}${esc(it.page)}</span>` : ""}
      <span title="${it.createdAt ? new Date(it.createdAt).toLocaleString("uk-UA") : ""}">${ic("clock", 11)}${formatTimeAgo(it.createdAt)}</span>
    </div>
    <div class="c-ft">${who}${dl ? `<span class="dl ${dl}">${dl === "late" ? "Прострочено · " : ""}${dlTxt}</span>` : it.col === "done" && it.doneAt ? `<span class="dl done">✓ ${new Date(it.doneAt).toLocaleDateString("uk-UA", { day: "numeric", month: "short" })}</span>` : ""}</div>
  </article>`;
}

// ─── Зміни в базі ──────────────────────────────────────────────────────
const pathOf = it => it.src === "bug" ? `bugReports/${it.id}` : `adminTasks/${it.id}`;
async function moveTo(id, col){
  const it = byId(id); if (!it || it.col === col) return;
  const upd = it.src === "bug" ? { status: BUG_STATUS[col], resolvedAt: col === "done" ? Date.now() : null } : { col, completedAt: col === "done" ? Date.now() : null };
  const prev = it.col;
  it.col = col; renderSoon();                    // миттєво, база підтвердить
  try {
    await update(ref(db, pathOf(it)), upd);
    toast(`Переміщено в «${COLS.find(c => c.id === col).label}»`);
  } catch (e){ it.col = prev; renderSoon(); toast("Не вдалося перемістити: " + e.message, "err"); }
}
async function assign(id, person){
  const it = byId(id); if (!it) return;
  try { await update(ref(db, pathOf(it)), { assignee: person?.name || null, assigneeId: person?.id || null }); toast(person ? `Призначено: ${person.name}` : "Призначення знято"); }
  catch (e){ toast("Помилка: " + e.message, "err"); }
}
function askDelete(id){
  const it = byId(id); if (!it) return;
  document.getElementById("cf-title").textContent = it.src === "bug" ? "Видалити звіт?" : "Видалити задачу?";
  document.getElementById("cf-text").innerHTML = `«${esc(it.title.slice(0, 140))}${it.title.length > 140 ? "…" : ""}» буде видалено назавжди.`;
  document.getElementById("cf-ok").onclick = async () => {
    closeModal("m-confirm");
    try { await remove(ref(db, pathOf(it))); closeModal("m-item"); toast("Видалено"); } catch (e){ toast("Помилка: " + e.message, "err"); }
  };
  openModal("m-confirm");
}

// ─── Меню картки ───────────────────────────────────────────────────────
let _pop = null;
function closePop(){ if (_pop){ _pop.el.remove(); _pop.btn?.classList.remove("open"); _pop = null; } }
function openMenu(btn, id){
  closePop();
  const it = byId(id); if (!it) return;
  const el = document.createElement("div"); el.className = "pop"; el.setAttribute("role", "menu");
  el.innerHTML = `<div class="pop-h">Перемістити</div>
    ${COLS.map(c => `<button type="button" data-mv="${c.id}" ${c.id === it.col ? "disabled" : ""}><span class="dot" style="--c:${c.c}"></span>${c.label}</button>`).join("")}
    <hr>
    ${isMine(it) ? `<button type="button" data-do="unassign">${ic("user")}Зняти з себе</button>` : `<button type="button" data-do="me">${ic("me")}Призначити мені</button>`}
    <button type="button" data-do="open">${ic("edit")}Відкрити</button>
    <button type="button" class="danger" data-do="del">${ic("trash")}Видалити</button>`;
  document.body.appendChild(el);
  const r = btn.getBoundingClientRect(), pr = el.getBoundingClientRect();
  el.style.left = Math.max(8, Math.min(r.right - pr.width, innerWidth - pr.width - 8)) + "px";
  el.style.top = (r.bottom + 6 + pr.height > innerHeight ? Math.max(8, r.top - pr.height - 6) : r.bottom + 6) + "px";
  btn.classList.add("open");
  _pop = { el, btn, id };
  el.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    closePop();
    if (b.dataset.mv) return moveTo(id, b.dataset.mv);
    const d = b.dataset.do;
    if (d === "me") assign(id, ME); else if (d === "unassign") assign(id, null);
    else if (d === "open") openItem(id); else if (d === "del") askDelete(id);
  });
  el.querySelector("button:not([disabled])")?.focus();
}
addEventListener("resize", closePop);
addEventListener("scroll", closePop, true);

// ─── Деталі / редагування ──────────────────────────────────────────────
let _edit = null;   // { id|null, src, col, assignee, assigneeId, priority }
function openItem(id, col = "new"){
  const it = id ? byId(id) : null;
  if (id && !it) return;
  const src = it ? it.src : "task";
  _edit = { id, src, col: it ? it.col : col, assignee: it?.assignee || "", assigneeId: it?.assigneeId || "", priority: it?.priority || "normal" };
  const k = KIND[it ? it.kind : "task"];
  document.getElementById("it-title").innerHTML = it ? `<span class="it-head"><span class="badge ${k.cls}">${k.label}</span><span class="it-id">#${esc(it.id.slice(-6))}</span></span>` : "Нова задача";
  document.getElementById("it-del").hidden = !it;
  const reporter = it?.src === "bug" ? (() => {
    const u = S.users[it.authorId] || {};
    const nm = it.authorName || "Невідомий викладач";
    return `<div class="it-rep"><span class="av" style="background:${avColor(nm)}">${esc(initials(nm))}</span><div><b>${esc(nm)}</b><span>${esc(u.email || "")}${u.email ? " · " : ""}${it.createdAt ? new Date(it.createdAt).toLocaleString("uk-UA", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : ""}</span></div>${it.page ? `<span class="pg" title="Сторінка, з якої надіслано">${esc(it.page)}</span>` : ""}</div>`;
  })() : "";
  document.getElementById("it-form").innerHTML = `
    ${reporter}
    ${src === "bug"
      ? `<div class="field"><span class="field-l">Повідомлення</span><div class="it-msg">${esc(it.text || it.title)}</div></div>`
      : `<div class="field"><label class="field-l" for="f-title">Що треба зробити *</label><textarea class="field-input" id="f-title" rows="2" maxlength="300" placeholder="Коротко й конкретно">${esc(it?.title === "—" ? "" : it?.title || "")}</textarea></div>
         <div class="field"><label class="field-l" for="f-text">Деталі</label><textarea class="field-input" id="f-text" rows="3" maxlength="3000" placeholder="Контекст, посилання, критерії готовності">${esc(it?.text || "")}</textarea></div>`}
    <div class="field"><span class="field-l">Статус</span>
      <div class="seg full" id="f-col">${COLS.map(c => `<button type="button" data-v="${c.id}" class="${c.id === _edit.col ? "on" : ""}"><span class="dot" style="--c:${c.c}"></span>${c.label}</button>`).join("")}</div></div>
    <div class="row2">
      <div class="field"><span class="field-l">Відповідальний</span><div class="dd" id="f-as"></div></div>
      <div class="field"><label class="field-l" for="f-dl">Дедлайн</label><input class="field-input" type="date" id="f-dl" value="${esc(it?.deadline || "")}"></div>
    </div>
    <div class="field"><span class="field-l">Пріоритет</span>
      <div class="seg full" id="f-prio">${Object.entries(PRIO).map(([v, p]) => `<button type="button" data-v="${v}" class="${v === _edit.priority ? "on" : ""}"><span class="dot" style="--c:${p.c}"></span>${p.label}</button>`).join("")}</div></div>
    ${src === "bug" ? `<div class="field"><label class="field-l" for="f-note">Нотатка адміністратора</label><textarea class="field-input" id="f-note" rows="2" maxlength="2000" placeholder="Що з'ясували, що зроблено">${esc(it?.note || "")}</textarea><span class="field-h">Бачать лише адміністратори</span></div>` : ""}
    <div class="mod-err" id="f-err"></div>
    <button type="submit" hidden></button>`;
  mountAssignee();
  document.querySelectorAll("#f-col button").forEach(b => b.onclick = () => { _edit.col = b.dataset.v; document.querySelectorAll("#f-col button").forEach(x => x.classList.toggle("on", x === b)); });
  document.querySelectorAll("#f-prio button").forEach(b => b.onclick = () => { _edit.priority = b.dataset.v; document.querySelectorAll("#f-prio button").forEach(x => x.classList.toggle("on", x === b)); });
  openModal("m-item");
  if (!it) setTimeout(() => document.getElementById("f-title")?.focus(), 70);
}

// Дропдаун відповідального (без стандартного <select>)
function mountAssignee(){
  const box = document.getElementById("f-as");
  const paint = () => {
    box.innerHTML = `<button type="button" class="dd-btn" aria-haspopup="listbox">${_edit.assignee
      ? `<span class="av" style="background:${avColor(_edit.assignee)}">${esc(initials(_edit.assignee))}</span><span class="name">${esc(_edit.assignee)}</span>`
      : `<span class="av none">${ic("user", 12)}</span><span class="name ph">Не призначено</span>`}${ic("down", 15, 2.2)}</button>`;
    box.firstChild.onclick = toggle;
  };
  const toggle = () => {
    const open = box.querySelector(".dd-pop");
    if (open){ open.remove(); box.firstChild.classList.remove("open"); return; }
    box.firstChild.classList.add("open");
    const pop = document.createElement("div"); pop.className = "dd-pop";
    pop.innerHTML = `${staff.length > 6 ? `<input type="text" placeholder="Пошук…" autocomplete="off">` : ""}<div class="dd-list"></div>`;
    box.appendChild(pop);
    const list = q => {
      const f = (q || "").toLowerCase();
      const opts = [{ id: "", name: "", label: "Не призначено" }, ...(ME.id && !staff.some(s => s.id === ME.id) ? [{ id: ME.id, name: ME.name, role: "admin" }] : []), ...staff]
        .filter(s => !f || (s.name || s.label).toLowerCase().includes(f));
      pop.querySelector(".dd-list").innerHTML = opts.length ? opts.map(s => `<button type="button" class="dd-it${(s.id || "") === (_edit.assigneeId || "") && (s.name || "") === (_edit.assignee || "") ? " on" : ""}" data-id="${esc(s.id)}" data-name="${esc(s.name)}">
          ${s.name ? `<span class="av" style="background:${avColor(s.name)}">${esc(initials(s.name))}</span>` : `<span class="av none">${ic("user", 12)}</span>`}
          <span>${esc(s.name || s.label)}${s.id === ME.id ? " (я)" : ""}${s.role ? `<small>${s.role === "admin" ? "адміністратор" : "менеджер"}</small>` : ""}</span></button>`).join("")
        : `<div class="dd-empty">Нікого не знайдено</div>`;
    };
    list("");
    pop.querySelector("input")?.addEventListener("input", e => list(e.target.value));
    pop.addEventListener("click", e => {
      const b = e.target.closest(".dd-it"); if (!b) return;
      _edit.assignee = b.dataset.name; _edit.assigneeId = b.dataset.id;
      paint();
    });
    (pop.querySelector("input") || pop.querySelector(".dd-it"))?.focus();
  };
  paint();
}

async function saveItem(){
  if (!_edit) return;
  const err = document.getElementById("f-err"); err.textContent = "";
  const dl = document.getElementById("f-dl").value || null;
  const common = { assignee: _edit.assignee || null, assigneeId: _edit.assigneeId || null, deadline: dl, priority: _edit.priority };
  const btn = document.getElementById("it-save"); btn.disabled = true;
  try {
    if (_edit.src === "bug"){
      const it = byId(_edit.id);
      const upd = { ...common, note: document.getElementById("f-note").value.trim() || null };
      if (it.col !== _edit.col){ upd.status = BUG_STATUS[_edit.col]; upd.resolvedAt = _edit.col === "done" ? Date.now() : null; }
      await update(ref(db, `bugReports/${_edit.id}`), upd);
    } else {
      const title = document.getElementById("f-title").value.trim();
      if (!title){ err.textContent = "Опишіть задачу"; document.getElementById("f-title").focus(); return; }
      const data = { ...common, title, description: document.getElementById("f-text").value.trim() || null, col: _edit.col };
      if (_edit.id){
        const it = byId(_edit.id);
        if (it.col !== _edit.col) data.completedAt = _edit.col === "done" ? Date.now() : null;   // статус не скидається при редагуванні
        await update(ref(db, `adminTasks/${_edit.id}`), data);
      } else {
        await push(ref(db, "adminTasks"), { ...data, type: "task", createdAt: Date.now(), createdBy: ME.id || null, createdByName: ME.name, completedAt: _edit.col === "done" ? Date.now() : null });
      }
    }
    closeModal("m-item");
    toast(_edit?.id ? "Збережено" : "Задачу додано");
    _edit = null;
  } catch (e){ err.textContent = "Не вдалося зберегти: " + e.message; }
  finally { btn.disabled = false; }
}
document.getElementById("it-save").addEventListener("click", saveItem);
document.getElementById("it-form").addEventListener("submit", e => { e.preventDefault(); saveItem(); });
document.getElementById("it-del").addEventListener("click", () => _edit?.id && askDelete(_edit.id));
document.getElementById("m-item").addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); saveItem(); } });

// ─── Події ─────────────────────────────────────────────────────────────
document.addEventListener("click", e => {
  if (_pop && !_pop.el.contains(e.target) && !e.target.closest("[data-menu]")) closePop();
  const ddOpen = document.querySelector(".dd-pop");
  if (ddOpen && !e.target.closest(".dd")){ ddOpen.remove(); document.querySelector(".dd-btn.open")?.classList.remove("open"); }
  const close = e.target.closest("[data-close]"); if (close){ closeModal(close.closest(".modal-bd").id); return; }
  if (e.target.classList?.contains("modal-bd")){ closeModal(e.target.id); return; }
  const menu = e.target.closest("[data-menu]"); if (menu){ e.stopPropagation(); _pop?.id === menu.dataset.menu ? closePop() : openMenu(menu, menu.dataset.menu); return; }
  const act = e.target.closest("[data-act]");
  if (act){
    if (act.dataset.act === "new") openItem(null, act.dataset.col || "new");
    if (act.dataset.act === "all-done"){ S.allDone = true; render(); }
    return;
  }
  const tile = e.target.closest(".pb-tile"); if (tile){ S.focus = S.focus === tile.dataset.focus ? "" : tile.dataset.focus; render(); return; }
  const kind = e.target.closest("#pb-kind button"); if (kind){ S.kind = kind.dataset.k; render(); return; }
  if (e.target.closest("#pb-mine")){ S.mine = !S.mine; render(); return; }
  if (e.target.closest("#pb-reset")){ S.q = ""; S.kind = ""; S.mine = false; S.focus = ""; document.getElementById("pb-q").value = ""; render(); return; }
  const card = e.target.closest(".pcard"); if (card) openItem(card.dataset.id);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    if (_pop){ closePop(); return; }
    const dd = document.querySelector(".dd-pop"); if (dd){ dd.remove(); document.querySelector(".dd-btn.open")?.focus(); return; }
    const top = [...document.querySelectorAll(".modal-bd.on")].pop(); if (top){ e.preventDefault(); closeModal(top.id); }
    return;
  }
  const card = e.target.closest?.(".pcard");
  if (card && e.target === card){
    if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openItem(card.dataset.id); }
    else if (e.key === "ArrowRight" || e.key === "ArrowLeft"){
      const it = byId(card.dataset.id), i = COLS.findIndex(c => c.id === it.col) + (e.key === "ArrowRight" ? 1 : -1);
      if (COLS[i]) moveTo(it.id, COLS[i].id);
    }
  }
  if (e.key === "/" && !e.target.closest("input,textarea") && !document.querySelector(".modal-bd.on")){ e.preventDefault(); document.getElementById("pb-q").focus(); }
});
let _qT = 0;
document.getElementById("pb-q").addEventListener("input", e => { clearTimeout(_qT); _qT = setTimeout(() => { S.q = e.target.value; render(); }, 120); });

// Перетягування між колонками
let _drag = null;
const kb = document.getElementById("kb");
kb.addEventListener("dragstart", e => { const c = e.target.closest(".pcard"); if (!c) return; _drag = c.dataset.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", _drag); closePop(); });
kb.addEventListener("dragend", () => { _drag = null; document.querySelectorAll(".dragging").forEach(c => c.classList.remove("dragging")); document.querySelectorAll(".kb-col.over").forEach(c => c.classList.remove("over")); });
kb.addEventListener("dragover", e => {
  const col = e.target.closest(".kb-col"); if (!col || !_drag) return;
  e.preventDefault();
  document.querySelectorAll(".kb-col.over").forEach(c => c !== col && c.classList.remove("over"));
  col.classList.add("over");
});
kb.addEventListener("dragleave", e => { const col = e.target.closest(".kb-col"); if (col && !col.contains(e.relatedTarget)) col.classList.remove("over"); });
kb.addEventListener("drop", e => {
  const col = e.target.closest(".kb-col"); if (!col || !_drag) return;
  e.preventDefault(); col.classList.remove("over");
  moveTo(_drag, col.dataset.col); _drag = null;
});
setInterval(() => { if (document.visibilityState === "visible" && !document.querySelector(".modal-bd.on")) render(); }, 60000);
</script>
</body>
