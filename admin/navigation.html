<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuizFlow Admin — Навігація</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ── Layout ── */
.nav-layout{display:grid; grid-template-columns:1fr 360px; gap:16px; align-items:flex-start}
@media(max-width:1200px){.nav-layout{grid-template-columns:1fr}}

/* ── Section block ── */
.ns-block{
  background:#fff; border:1px solid var(--line); border-radius:16px;
  margin-bottom:12px; overflow:visible;
}
.ns-head{
  display:flex; align-items:center; gap:10px;
  padding:12px 14px; border-bottom:1px solid var(--line);
  background:#FAFBFE; border-radius:16px 16px 0 0;
}
.ns-head .drag-sec{
  cursor:grab; color:var(--ink-400); display:grid; place-items:center;
  padding:2px;
}
.ns-head .drag-sec:active{cursor:grabbing}
.ns-head input.sec-name{
  flex:1; border:0; background:transparent; font:inherit;
  font-size:13.5px; font-weight:700; color:var(--ink-900); outline:none;
  font-family:"Manrope",sans-serif;
}
.ns-head input.sec-name:focus{
  background:#fff; border:1.5px solid #7C3AED; border-radius:7px;
  padding:3px 8px; margin:-3px -8px;
  box-shadow:0 0 0 3px rgba(124,58,237,.1);
}
.ns-head .sec-actions{display:flex; align-items:center; gap:4px; margin-left:auto}
.ns-head .sec-btn{
  width:28px; height:28px; border-radius:7px;
  border:1px solid var(--line); background:#fff;
  color:var(--ink-500); cursor:pointer;
  display:grid; place-items:center; padding:0;
  transition:all .12s;
}
.ns-head .sec-btn:hover{background:#F4F6FB; border-color:var(--line-strong); color:var(--ink-700)}
.ns-head .sec-btn.danger:hover{background:#FEE2E2; border-color:#FCA5A5; color:#B91C1C}
.ns-head .sec-btn svg{width:13px; height:13px}

/* ── Nav items in section ── */
.ns-items{padding:6px; display:flex; flex-direction:column; gap:4px; min-height:50px}
.ns-items.drag-over{background:rgba(124,58,237,.04); border-radius:0 0 12px 12px}

.ni-row{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:10px;
  border:1.5px solid var(--line); background:#fff;
  transition:all .15s; position:relative;
}
.ni-row:hover{border-color:var(--line-strong)}
.ni-row.dragging{opacity:.4}
.ni-row.drag-target{border-color:#7C3AED; background:#F5F3FF}
.ni-row.protected{background:linear-gradient(135deg, rgba(124,58,237,.04), #fff)}

.ni-drag{
  cursor:grab; color:var(--ink-300);
  display:grid; place-items:center; padding:2px; flex:0 0 auto;
}
.ni-drag:active{cursor:grabbing}
.ni-drag svg{width:13px; height:13px}

.ni-icon-pick{
  width:36px; height:36px; border-radius:9px; flex:0 0 auto;
  border:1.5px solid var(--line); background:#FAFBFE;
  display:grid; place-items:center; cursor:pointer;
  transition:all .15s; color:var(--ink-700);
  position:relative;
}
.ni-icon-pick:hover{border-color:#7C3AED; background:#F5F3FF; color:#6D28D9}
.ni-icon-pick svg{width:16px; height:16px}

.ni-name{
  flex:1; border:0; background:transparent; font:inherit;
  font-size:13.5px; font-weight:600; color:var(--ink-900); outline:none;
  font-family:"Manrope",sans-serif;
}
.ni-name:focus{
  background:#fff; border:1.5px solid #7C3AED; border-radius:7px;
  padding:3px 8px; margin:-3px -8px;
  box-shadow:0 0 0 3px rgba(124,58,237,.1);
}

.ni-file{
  width:130px; border:1px solid var(--line); border-radius:8px;
  padding:5px 9px; font:inherit; font-size:12px; font-family:"Geist Mono",monospace;
  color:var(--ink-700); outline:none; background:#FAFBFE;
  transition:all .15s;
}
.ni-file:focus{border-color:#7C3AED; box-shadow:0 0 0 2px rgba(124,58,237,.1); background:#fff}

.ni-toggle{position:relative; display:inline-block; width:36px; height:20px; flex:0 0 auto}
.ni-toggle input{display:none}
.ni-toggle-sl{
  position:absolute; inset:0; cursor:pointer;
  background:#E3E8F2; border-radius:99px; transition:background .18s;
}
.ni-toggle-sl::before{
  content:""; position:absolute; top:2px; left:2px;
  width:16px; height:16px; border-radius:50%; background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.18); transition:transform .18s;
}
.ni-toggle input:checked + .ni-toggle-sl{background:linear-gradient(135deg, #7C3AED, #4F46E5)}
.ni-toggle input:checked + .ni-toggle-sl::before{transform:translateX(16px)}
.ni-toggle input:disabled + .ni-toggle-sl{opacity:.5; cursor:not-allowed}

.ni-del{
  width:28px; height:28px; border-radius:7px;
  border:1px solid var(--line); background:#fff;
  color:var(--ink-400); cursor:pointer;
  display:grid; place-items:center; padding:0; flex:0 0 auto;
  transition:all .12s;
}
.ni-del:hover:not(:disabled){background:#FEE2E2; border-color:#FCA5A5; color:#B91C1C}
.ni-del:disabled{opacity:.3; cursor:not-allowed}
.ni-del svg{width:13px; height:13px}

.ni-protected-tag{
  font-size:10px; color:#6D28D9; font-weight:700; letter-spacing:.04em;
  background:#EDE9FE; padding:2px 6px; border-radius:4px;
  text-transform:uppercase;
}

.ni-roles-btn{
  display:flex; align-items:center; gap:5px; flex:0 0 auto;
  height:30px; padding:0 9px; border-radius:8px;
  border:1.5px solid var(--line); background:#FAFBFE; color:var(--ink-500);
  font:inherit; font-size:11.5px; font-weight:700; cursor:pointer;
  transition:all .15s;
}
.ni-roles-btn:hover:not(:disabled){border-color:#7C3AED; background:#F5F3FF; color:#6D28D9}
.ni-roles-btn:disabled{opacity:.35; cursor:not-allowed}
.ni-roles-btn svg{width:13px; height:13px; flex:0 0 auto}
.ni-roles-btn.restricted{border-color:#7C3AED; background:#F5F3FF; color:#6D28D9}
.ni-roles-dots{display:flex; gap:2px}
.ni-roles-dots i{width:7px; height:7px; border-radius:50%; display:block}

.role-pick-list{padding:14px 16px; display:flex; flex-direction:column; gap:2px; max-height:320px; overflow-y:auto}
.role-pick-row{
  display:flex; align-items:center; gap:10px; padding:9px 8px; border-radius:9px; cursor:pointer;
  font-size:13.5px; font-weight:600; color:var(--ink-900); transition:background .12s;
}
.role-pick-row:hover{background:#FAFBFE}
.role-pick-row input{width:16px; height:16px; accent-color:#7C3AED; flex:0 0 auto}
.role-pick-dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto}
.role-pick-empty{padding:20px 16px; text-align:center; color:var(--ink-500); font-size:12.5px; line-height:1.6}
.role-pick-empty a{color:#7C3AED; font-weight:700}
.role-pick-hint{padding:11px 16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-500); line-height:1.5}

/* ── Add item button ── */
.ns-add-btn{
  margin:4px 6px 10px;
  width:calc(100% - 12px);
  padding:8px; border-radius:9px;
  border:1.5px dashed var(--line-strong); background:transparent;
  color:var(--ink-500); font:inherit; font-size:13px; font-weight:600;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  transition:all .15s; font-family:"Manrope",sans-serif;
}
.ns-add-btn:hover{border-color:#7C3AED; background:#F5F3FF; color:#6D28D9}
.ns-add-btn svg{width:13px; height:13px}

/* ── Add section button ── */
.add-sec-btn{
  width:100%; padding:11px; border-radius:12px;
  border:1.5px dashed var(--line-strong); background:#fff;
  color:var(--ink-500); font:inherit; font-size:13.5px; font-weight:600;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px;
  transition:all .15s; font-family:"Manrope",sans-serif;
  margin-top:4px;
}
.add-sec-btn:hover{border-color:#7C3AED; background:#F5F3FF; color:#6D28D9}
.add-sec-btn svg{width:14px; height:14px}

/* ── Preview card ── */
.preview-card{
  background:#fff; border:1px solid var(--line); border-radius:16px;
  position:sticky; top:82px;
}
.preview-head{padding:14px 16px; border-bottom:1px solid var(--line)}
.preview-head h3{margin:0; font-size:14px; font-weight:800}
.preview-head p{margin:4px 0 0; font-size:12px; color:var(--ink-500)}

.sb-preview{
  background:linear-gradient(180deg, #050817 0%, #0A0F2C 60%, #0E1638 100%);
  border-radius:0 0 14px 14px;
  padding:12px 10px;
  min-height:400px;
}
.sbp-brand{display:flex; align-items:center; gap:8px; padding:4px 6px 10px; margin-bottom:6px}
.sbp-mark{
  width:28px; height:28px; border-radius:8px;
  background:linear-gradient(135deg, #7C3AED, #4F46E5);
  display:grid; place-items:center; flex:0 0 auto;
}
.sbp-name{font-size:13px; font-weight:800; color:#fff}
.sbp-name em{font-style:normal; color:#A78BFA}

.sbp-sec-lbl{
  font-size:9px; text-transform:uppercase; letter-spacing:.1em;
  color:#7889B5; font-weight:700; padding:8px 8px 3px;
}
.sbp-item{
  display:flex; align-items:center; gap:7px;
  padding:7px 8px; border-radius:7px; margin-bottom:1px;
  color:#C5CDE5; font-size:12px; font-weight:500;
  transition:background .1s;
}
.sbp-item.disabled{opacity:.35}
.sbp-item svg{width:14px; height:14px; flex:0 0 auto; color:#8895BD}

/* ── Icon picker modal ── */
.modal-bd{
  position:fixed; inset:0; z-index:150;
  background:rgba(11,20,55,.55); backdrop-filter:blur(4px);
  display:none; align-items:center; justify-content:center; padding:20px;
}
.modal-bd.on{display:flex}
.modal{
  background:#fff; border-radius:18px; box-shadow:0 18px 40px rgba(11,20,55,.25);
  width:100%; max-width:560px; max-height:80vh; overflow:auto;
  display:flex; flex-direction:column;
}
.modal-h{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px; border-bottom:1px solid var(--line);
  position:sticky; top:0; background:#fff; z-index:1;
}
.modal-h h3{margin:0; font-size:16px; font-weight:800}
.modal-h .close{
  width:30px; height:30px; border-radius:7px; border:1px solid var(--line);
  background:#fff; cursor:pointer; display:grid; place-items:center; color:var(--ink-500);
}
.modal-h .close:hover{background:#F4F6FB}

.icon-cats{display:flex; gap:4px; padding:12px 16px; flex-wrap:wrap; border-bottom:1px solid var(--line)}
.icon-cat-btn{
  padding:5px 11px; border-radius:7px; border:1px solid var(--line); background:#fff;
  font:inherit; font-size:12px; font-weight:600; color:var(--ink-500);
  cursor:pointer; transition:all .12s;
}
.icon-cat-btn:hover{border-color:var(--line-strong)}
.icon-cat-btn.on{background:#7C3AED; border-color:#7C3AED; color:#fff}

.icon-grid{
  display:grid; grid-template-columns:repeat(8, 1fr); gap:4px;
  padding:14px 16px;
}
.icon-opt{
  width:100%; aspect-ratio:1; border-radius:9px;
  border:1.5px solid transparent; background:#FAFBFE;
  display:grid; place-items:center; cursor:pointer;
  color:var(--ink-700); transition:all .12s;
}
.icon-opt:hover{border-color:var(--line-strong); background:#EDE9FE; color:#6D28D9}
.icon-opt.selected{border-color:#7C3AED; background:#EDE9FE; color:#6D28D9}
.icon-opt svg{width:18px; height:18px}
</style>
</head>

</div>

// ─── Helpers ──────────────────────────────────────────────────────────────
function svgIcon(iconId, size=16){
  for (const cat of Object.values(ICON_CATS)){
    const found = cat.find(i => i.id === iconId);
    if (found) return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${found.svg}</svg>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>`;
}

function deepClone(obj){ return JSON.parse(JSON.stringify(obj)); }

// ─── Icon picker ──────────────────────────────────────────────────────────
function buildIconPicker(){
  const catsEl = document.getElementById("icon-cats");
  const gridEl = document.getElementById("icon-grid");

  function renderCats(){
    catsEl.innerHTML = Object.keys(ICON_CATS).map(cat =>
      `<button class="icon-cat-btn${cat===_activeCat?" on":""}" data-cat="${esc(cat)}">${esc(cat)}</button>`
    ).join("");
    catsEl.querySelectorAll(".icon-cat-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        _activeCat = btn.dataset.cat;
        renderCats();
        renderGrid();
      });
    });
  }

  function renderGrid(){
    const icons = ICON_CATS[_activeCat] || [];
    gridEl.innerHTML = icons.map(ic =>
      `<button class="icon-opt" data-icon="${ic.id}" title="${ic.id}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ic.svg}</svg>
      </button>`
    ).join("");
    gridEl.querySelectorAll(".icon-opt").forEach(btn => {
      btn.addEventListener("click", () => {
        if (!_iconPickerTarget) return;
        const { secIdx, itemIdx } = _iconPickerTarget;
        navData[secIdx].items[itemIdx].icon = btn.dataset.icon;
        _iconPickerTarget = null;
        document.getElementById("m-icon-picker").classList.remove("on");
        renderEditor();
        renderPreview();
      });
    });
  }

  renderCats();
  renderGrid();

  document.getElementById("icon-picker-close").addEventListener("click", () => {
    document.getElementById("m-icon-picker").classList.remove("on");
    _iconPickerTarget = null;
  });
  document.getElementById("m-icon-picker").addEventListener("click", e => {
    if (e.target === document.getElementById("m-icon-picker")){
      document.getElementById("m-icon-picker").classList.remove("on");
      _iconPickerTarget = null;
    }
  });
}

  try { allRoles = await dbGet("roles") || {}; }

function buildRolePicker(){
  document.getElementById("role-picker-close").addEventListener("click", closeRolePicker);
  document.getElementById("m-role-picker").addEventListener("click", e => {
    if (e.target === document.getElementById("m-role-picker")) closeRolePicker();
  });
}

function closeRolePicker(){
  document.getElementById("m-role-picker").classList.remove("on");
  _rolePickerTarget = null;
  renderEditor();
  renderPreview();
}

function renderRolePickList(){
  const listEl = document.getElementById("role-pick-list");
  const ids = Object.keys(allRoles).sort((a,b) => (allRoles[a].name||"").localeCompare(allRoles[b].name||"", "uk"));
  if (!ids.length){
    listEl.innerHTML = `<div class="role-pick-empty">Ще немає жодної створеної ролі.<br><a href="roles.html">Створити на сторінці «Ролі»</a></div>`;
    return;
  }
  const { secIdx, itemIdx } = _rolePickerTarget;
  const current = navData[secIdx].items[itemIdx].roleIds || [];
  listEl.innerHTML = ids.map(id => {
    const r = allRoles[id];
    return `<label class="role-pick-row">
      <input type="checkbox" value="${id}" ${current.includes(id) ? "checked" : ""}>
      <span class="role-pick-dot" style="background:${esc(r.color || '#7C3AED')}"></span>
      <span>${esc(r.name || "—")}</span>
    </label>`;
  }).join("");
  listEl.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener("change", () => {
      const item = navData[secIdx].items[itemIdx];
      let roleIds = item.roleIds ? [...item.roleIds] : [];
      if (cb.checked) { if (!roleIds.includes(cb.value)) roleIds.push(cb.value); }
      else { roleIds = roleIds.filter(id => id !== cb.value); }
      item.roleIds = roleIds;
    });
  });
}

// ─── Drag & Drop ─────────────────────────────────────────────────────────
function initDragDrop(){
  let dragType = null, dragSecIdx = null, dragItemIdx = null;

  document.querySelectorAll("[data-drag-type]").forEach(el => {
    el.addEventListener("dragstart", e => {
      dragType    = el.dataset.dragType;
      dragSecIdx  = parseInt(el.dataset.secIdx);
      dragItemIdx = el.dataset.itemIdx !== undefined ? parseInt(el.dataset.itemIdx) : null;
      e.dataTransfer.effectAllowed = "move";
      setTimeout(() => {
        if (dragType === "item"){
          const row = el.closest(".ni-row");
          if (row) row.classList.add("dragging");
        }
      }, 0);
    });
    el.addEventListener("dragend", () => {
      document.querySelectorAll(".dragging,.drag-target,.drag-over").forEach(el => {
        el.classList.remove("dragging","drag-target","drag-over");
      });
    });
  });

  // Section drop zones
  document.querySelectorAll(".ns-block").forEach(block => {
    block.addEventListener("dragover", e => {
      if (dragType !== "section") return;
      e.preventDefault();
      block.classList.add("drag-target");
    });
    block.addEventListener("dragleave", () => block.classList.remove("drag-target"));
    block.addEventListener("drop", e => {
      e.preventDefault();
      block.classList.remove("drag-target");
      if (dragType !== "section") return;
      const toIdx = parseInt(block.dataset.secIdx);
      if (dragSecIdx === toIdx) return;
      const moved = navData.splice(dragSecIdx, 1)[0];
      navData.splice(toIdx, 0, moved);
      renderEditor();
      renderPreview();
    });
  });

  // Item drop zones
  document.querySelectorAll(".ns-items").forEach(zone => {
    const zoneSec = parseInt(zone.dataset.secIdx);
    zone.addEventListener("dragover", e => {
      if (dragType !== "item") return;
      e.preventDefault();
      zone.classList.add("drag-over");
    });
    zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
    zone.addEventListener("drop", e => {
      e.preventDefault();
      zone.classList.remove("drag-over");
      if (dragType !== "item") return;

      const [movedItem] = navData[dragSecIdx].items.splice(dragItemIdx, 1);
      navData[zoneSec].items.push(movedItem);
      renderEditor();
      renderPreview();
    });
  });

  document.querySelectorAll(".ni-row").forEach(row => {
    const rowSec  = parseInt(row.dataset.secIdx);
    const rowItem = parseInt(row.dataset.itemIdx);
    row.addEventListener("dragover", e => {
      if (dragType !== "item") return;
      e.preventDefault();
      row.classList.add("drag-target");
    });
    row.addEventListener("dragleave", () => row.classList.remove("drag-target"));
    row.addEventListener("drop", e => {
      e.preventDefault();
      row.classList.remove("drag-target");
      if (dragType !== "item") return;
      if (dragSecIdx === rowSec && dragItemIdx === rowItem) return;

      const [movedItem] = navData[dragSecIdx].items.splice(dragItemIdx, 1);
      // Adjust index if same section and item was before
      let insertAt = rowItem;
      if (dragSecIdx === rowSec && dragItemIdx < rowItem) insertAt--;
      navData[rowSec].items.splice(insertAt, 0, movedItem);
      renderEditor();
      renderPreview();
    });
  });
}

// ─── Load / Save ──────────────────────────────────────────────────────────
async function loadNav(){
  try {
    const saved = await dbGet("settings/navigation");
    if (saved && Array.isArray(saved) && saved.length > 0){
      navData = saved;
    } else {
      navData = deepClone(DEFAULT_NAV);
    }
  } catch(e) {
    navData = deepClone(DEFAULT_NAV);
  }
  renderEditor();
  renderPreview();
}

async function saveNav(){
  const btn = document.getElementById("btn-save-nav");
  btn.disabled = true;

  // Validate
  for (const sec of navData){
    if (!sec.label.trim()){ toast("Назва секції не може бути порожньою"); btn.disabled=false; return; }
    for (const item of sec.items){
      if (!item.label.trim()){ toast("Назва пункту не може бути порожньою"); btn.disabled=false; return; }
      if (!item.protected && !item.file.trim()){ toast(`Вкажіть файл для пункту «${item.label}»`); btn.disabled=false; return; }
    }
  }

  try {
    await dbSet("settings/navigation", navData);
    await dbSet("settings/navigation_ts", Date.now());
    toast("Навігацію збережено — набуде чинності після перезавантаження сторінки");
  } catch(e){
    toast("Помилка: " + e.message);
  } finally {
    btn.disabled = false;
  }
}

async function resetNav(){
  if (!confirm("Скинути навігацію до стандартної? Всі зміни будуть втрачені.")) return;
  navData = deepClone(DEFAULT_NAV);
  try {
    await dbSet("settings/navigation", navData);
    await dbSet("settings/navigation_ts", Date.now());
    renderEditor();
    renderPreview();
    toast("Скинуто до стандартної навігації");
  } catch(e){
    toast("Помилка: " + e.message);
  }
}

    Зберегти
  </button>
`;

await initAdminShell({
  activeId: "navigation",
  crumbs: ["Навігація"],
  content,
  topbarRight
});

// Page-head
const contentEl = document.getElementById("admin-content");
if (contentEl){
  const pageHead = document.createElement("div");
  pageHead.className = "page-head";
  pageHead.innerHTML = `<div><h1>Навігація</h1><p>Редагуйте sidebar — перетягуйте пункти, вмикайте/вимикайте, змінюйте назви та іконки</p></div>`;
  contentEl.insertBefore(pageHead, contentEl.firstChild);
}

document.getElementById("btn-save-nav").addEventListener("click", saveNav);
document.getElementById("btn-reset-nav").addEventListener("click", resetNav);

buildIconPicker();
buildRolePicker();

try {
  await loadRoles();
  await loadNav();
} catch(e) {
  console.error("[navigation] load failed:", e);
}
hideLoader();
