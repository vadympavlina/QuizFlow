<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%237C3AED'/><stop offset='1' stop-color='%234F46E5'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><path d='M6 24V14M12 24V8M18 24V18M24 24V12' stroke='white' stroke-width='2.4' stroke-linecap='round'/><path d='M5 26h22' stroke='white' stroke-width='2.4' stroke-linecap='round'/></svg>">
<title>QuizFlow Admin — Статистика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/admin-shell.css?v=7">
<style>
.row-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.row-mix{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px}
@media (max-width:1280px){.row-mix{grid-template-columns:1fr}}
@media (max-width:1000px){.row-2{grid-template-columns:1fr}}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-500);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#F3EEFF;color:#6D28D9}
.st-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.st-bar .hint{font-size:12.5px;color:var(--ink-500)}
.kpi-grid.five{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1280px){.kpi-grid.five{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1023px){.kpi-grid.five{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi .kpi-v{font-size:28px}
.kpi-l i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.delta{font-family:"Geist Mono",monospace;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#EEF2FB;color:var(--ink-500);white-space:nowrap}
.delta.up{background:#DCFCE7;color:#15803D}.delta.down{background:#FEE2E2;color:#B91C1C}
.card-h{flex-wrap:wrap;gap:8px}
/* Теплова карта: день × година */
.heat{display:grid;grid-template-columns:28px repeat(24,minmax(0,1fr));gap:3px;align-items:center}
.heat .d{font:600 11px "Geist Mono",monospace;color:var(--ink-400)}
.heat .h{font:600 9.5px "Geist Mono",monospace;color:var(--ink-400);text-align:center}
.heat .c{height:22px;border-radius:4px;background:#F1F4FA;outline:none}
.heat .c:hover,.heat .c:focus-visible{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #7C3AED}
.heat-legend{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:12px;font-size:11.5px;color:var(--ink-500)}
.heat-legend span.cells{display:flex;gap:3px}
.heat-legend span.cells i{width:14px;height:14px;border-radius:4px}
.heat-scroll{overflow-x:auto}
.heat-scroll .heat{min-width:560px}
/* Таблиця */
.tbl-top{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.tbl-top .search-input{flex:1;max-width:320px}
.tbl-top .search-input .input{width:100%}
.tbl-top .meta{margin-left:auto;font-size:12px;color:var(--ink-500);font-family:"Geist Mono",monospace}
.tbl-wrap{overflow-x:auto}
#stats-body td{white-space:nowrap}
.cell-name{display:flex;align-items:center;gap:11px;min-width:0}
.cell-name .nm{font-weight:700;color:var(--ink-900)}
.cell-name .lg{font-size:11px;color:var(--ink-400);font-family:"Geist Mono",monospace;margin-top:2px}
.num{font-family:"Geist Mono",monospace;font-weight:700}
.num small{font-weight:500;color:var(--ink-400);margin-left:4px;font-size:11px}
.muted{color:var(--ink-300)}
.empty-mini{padding:40px 20px;text-align:center;color:var(--ink-500);font-size:13px}
</style>
</head>
<body>

<div id="admin-loader"><div class="spin"></div></div>
<script src="shared/admin-nav.js?v=4"></script>
<div id="admin-root"></div>
<div id="admin-modals"></div>
<div id="admin-toast" class="toast"></div>

<script type="module">
import { initAdminShell, loadAllTeachers, cachedTeachers, esc, hideLoader, formatTimeAgo } from "./shared/admin-shell.js?v=8";
import { bars, rank, bindTips, C } from "./shared/admin-charts.js?v=1";

const DAY = 864e5;
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b >= 2 && b <= 4 ? f[1] : f[2]; };
const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fullName = u => [u.surname, u.name].filter(Boolean).join(" ") || u.email || "—";
const I = p => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICO = {
  doc: I('<path d="M14 3v5h5"/><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M9 13h6M9 17h4"/>'),
  game: I('<rect x="2" y="6" width="20" height="12" rx="4"/><path d="M7 10v4M5 12h4"/><circle cx="15.5" cy="11" r="1" fill="currentColor"/><circle cx="18" cy="13.5" r="1" fill="currentColor"/>'),
  users: I('<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15 20c0-2.6 2-4.8 4.5-5"/>'),
  star: I('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>'),
  team: I('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>'),
};

const content = `
  <div class="page-head"><div><h1>Статистика</h1><p>Як платформою користуються: ігри наживо, тести, викладачі, час активності</p></div></div>
  <div class="st-bar">
    <div class="seg" id="period-seg" role="tablist" aria-label="Період">
      <button type="button" data-p="7">7 днів</button>
      <button type="button" data-p="30" class="on">30 днів</button>
      <button type="button" data-p="90">90 днів</button>
    </div>
    <span class="hint" id="period-hint"></span>
  </div>

  <div class="kpi-grid five" id="kpi-grid"></div>

  <div class="row-mix">
    <section class="card">
      <div class="card-h"><div><h3>Динаміка активності</h3><div class="sub" id="dyn-sub">Спроби тестів і участь учнів в іграх</div></div></div>
      <div id="ch-dyn"></div>
    </section>
    <section class="card">
      <div class="card-h"><div><h3>Найактивніші викладачі</h3><div class="sub">Спроби тестів + учасники ігор за період</div></div></div>
      <div id="ch-top"></div>
    </section>
  </div>

  <div class="row-2">
    <section class="card">
      <div class="card-h"><div><h3>Розподіл оцінок</h3><div class="sub" id="gr-sub">Оцінені спроби тестів, шкала 1–12</div></div></div>
      <div id="ch-grades"></div>
    </section>
    <section class="card">
      <div class="card-h"><div><h3>Популярні ігри</h3><div class="sub">Які вікторини запускали найчастіше</div></div></div>
      <div id="ch-games"></div>
    </section>
  </div>

  <section class="card">
    <div class="card-h"><div><h3>Коли учні найактивніші</h3><div class="sub">Спроби тестів і учасники ігор за днем тижня та годиною</div></div><span class="pill" id="heat-pill">—</span></div>
    <div class="heat-scroll"><div class="heat" id="heat"></div></div>
    <div class="heat-legend">менше<span class="cells" id="heat-cells"></span>більше</div>
  </section>

  <section class="card" style="padding:0">
    <div class="card-h" style="padding:18px 18px 0"><div><h3>Деталізація по викладачах</h3><div class="sub">Тести, спроби, ігри, студенти, посилання — за весь час</div></div></div>
    <div class="tbl-top">
      <div class="search-input">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="st-search" type="search" placeholder="Пошук: прізвище, ім'я, email…" autocomplete="off" aria-label="Пошук викладача">
      </div>
      <span class="meta" id="st-meta">—</span>
    </div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Викладач</th><th>Тести</th><th>Спроби</th><th>Ігри</th><th>Учасники ігор</th><th>Студенти</th><th>Посилання</th><th>Остання активність</th></tr></thead>
      <tbody id="stats-body"></tbody>
    </table></div>
  </section>
`;

const topbarRight = `
  <button class="tb-btn" id="btn-refresh" type="button">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-13.7 5.7L4 16"/><path d="M4 20v-4h4"/></svg>
    Оновити
  </button>`;

await initAdminShell({ activeId: "stats", crumbs: ["Статистика"], content, topbarRight });

let P = 30;
let D = { users: [], stats: {}, attempts: [], games: [] };
try { const v = +localStorage.getItem("qf_adm_stats_p"); if ([7, 30, 90].includes(v)) P = v; } catch {}
document.querySelectorAll("#period-seg button").forEach(b => b.classList.toggle("on", +b.dataset.p === P));

function apply(r){ D = { users: r._users, stats: r._stats, attempts: r._allAttempts, games: r._allGames || [] }; renderAll(); }
async function load(){ apply(await loadAllTeachers()); }

// ─── Періоди ───
const inRange = (t, from, to) => t && t >= from && t < to;
function ranges(){
  const to = dayStart(Date.now()) + DAY, from = to - P * DAY;
  return { from, to, pFrom: from - P * DAY };
}
function delta(cur, prev){
  if (!prev && !cur) return `<span class="delta">=</span>`;
  if (!prev) return `<span class="delta up">нове</span>`;
  const d = Math.round((cur - prev) / prev * 100);
  return `<span class="delta ${d > 0 ? "up" : d < 0 ? "down" : ""}" title="Порівняно з попередніми ${P} днями">${d > 0 ? "+" : ""}${d}%</span>`;
}

function renderKpis(){
  const { from, to, pFrom } = ranges();
  const at = D.attempts.filter(a => inRange(a.createdAt, from, to)), atP = D.attempts.filter(a => inRange(a.createdAt, pFrom, from));
  const gm = D.games.filter(g => inRange(g.playedAt, from, to)), gmP = D.games.filter(g => inRange(g.playedAt, pFrom, from));
  const pl = gm.reduce((s, g) => s + g.players, 0), plP = gmP.reduce((s, g) => s + g.players, 0);
  const gr = at.filter(a => a.grade12 != null && a.status !== "in_progress").map(a => +a.grade12);
  const avg = gr.length ? gr.reduce((s, x) => s + x, 0) / gr.length : null;
  const act = new Set([...at.map(a => a.teacherId), ...gm.map(g => g.teacherId)]).size;
  const K = [
    { k: "blue", ico: ICO.doc, v: at.length, l: `<i style="background:${C.tests}"></i>Спроби тестів`, s: `${delta(at.length, atP.length)} ${atP.length} раніше` },
    { k: "pink", ico: ICO.game, v: gm.length, l: `<i style="background:${C.games}"></i>Ігри наживо`, s: `${delta(gm.length, gmP.length)} ${gmP.length} раніше` },
    { k: "violet", ico: ICO.team, v: pl, l: "Учасники ігор", s: `${delta(pl, plP)} ${gm.length ? `≈ ${Math.round(pl / gm.length)} на гру` : "ігор не було"}` },
    { k: "amber", ico: ICO.star, v: avg != null ? avg.toFixed(1) : "—", l: "Середня оцінка", s: gr.length ? `${gr.length} ${plural(gr.length, ["оцінена спроба", "оцінені спроби", "оцінених спроб"])}` : "оцінок не було" },
    { k: "green", ico: ICO.users, v: act, l: "Активні викладачі", s: `з ${D.users.length} у системі` },
  ];
  document.getElementById("kpi-grid").innerHTML = K.map(k => `<div class="kpi ${k.k}">
      <div class="kpi-row" style="gap:12px"><div class="kpi-ico">${k.ico}</div><div class="kpi-v">${k.v}</div></div>
      <div class="kpi-l">${k.l}</div><div class="kpi-s">${k.s}</div></div>`).join("");
  const f = d => new Date(d).toLocaleDateString("uk-UA", { day: "numeric", month: "short" });
  document.getElementById("period-hint").textContent = `${f(from)} — ${f(to - 1)} · зміни порівняно з попередніми ${P} днями`;
}

// По днях (7/30) або по тижнях (90)
function buckets(){
  const { from, to } = ranges();
  const step = P > 30 ? 7 * DAY : DAY, n = Math.ceil((to - from) / step);
  const lbl = [], full = [];
  for (let i = 0; i < n; i++){
    const d = new Date(from + i * step);
    lbl.push(P > 30 ? `${d.getDate()}.${String(d.getMonth() + 1).padStart(2, "0")}` : P <= 7 ? ["Нд", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"][d.getDay()] : `${d.getDate()}.${String(d.getMonth() + 1).padStart(2, "0")}`);
    full.push(P > 30 ? `Тиждень з ${d.toLocaleDateString("uk-UA", { day: "numeric", month: "long" })}` : d.toLocaleDateString("uk-UA", { weekday: "short", day: "numeric", month: "long" }));
  }
  const idx = t => Math.floor((t - from) / step);
  const t = new Array(n).fill(0), g = new Array(n).fill(0);
  D.attempts.forEach(a => { if (inRange(a.createdAt, from, to)) t[idx(a.createdAt)]++; });
  D.games.forEach(x => { if (inRange(x.playedAt, from, to)) g[idx(x.playedAt)] += x.players; });
  return { lbl, full, t, g };
}

function renderDyn(){
  const b = buckets();
  document.getElementById("dyn-sub").textContent = `Спроби тестів і участь учнів в іграх — ${P > 30 ? "по тижнях" : "по днях"}`;
  bars(document.getElementById("ch-dyn"), { labels: b.lbl, full: b.full, highlightLast: true, height: 230,
    series: [{ name: "Спроби тестів", color: C.tests, values: b.t }, { name: "Участь в іграх", color: C.games, values: b.g }] });
}

function renderTop(){
  const { from, to } = ranges();
  const m = new Map();
  D.attempts.forEach(a => { if (!inRange(a.createdAt, from, to)) return; const e = m.get(a.teacherId) || { t: 0, g: 0 }; e.t++; m.set(a.teacherId, e); });
  D.games.forEach(x => { if (!inRange(x.playedAt, from, to)) return; const e = m.get(x.teacherId) || { t: 0, g: 0 }; e.g += x.players; m.set(x.teacherId, e); });
  const U = new Map(D.users.map(u => [u.id, u]));
  const rows = [...m].map(([id, e]) => ({ label: U.get(id) ? fullName(U.get(id)) : "—", sub: `${e.t} ${plural(e.t, ["спроба", "спроби", "спроб"])} · ${e.g} ${plural(e.g, ["гравець", "гравці", "гравців"])}`, value: e.t + e.g }))
    .sort((a, b) => b.value - a.value).slice(0, 7);
  rank(document.getElementById("ch-top"), rows, { unit: "Активність учнів", color: C.violet, empty: "За цей період активності не було" });
}

function renderGrades(){
  const { from, to } = ranges();
  const gr = D.attempts.filter(a => inRange(a.createdAt, from, to) && a.grade12 != null && a.status !== "in_progress").map(a => Math.round(+a.grade12)).filter(g => g >= 1 && g <= 12);
  const v = Array.from({ length: 12 }, (_, i) => gr.filter(g => g === i + 1).length);
  document.getElementById("gr-sub").textContent = gr.length ? `${gr.length} ${plural(gr.length, ["оцінка", "оцінки", "оцінок"])} · шкала 1–12` : "Оцінених спроб за період немає";
  bars(document.getElementById("ch-grades"), { labels: v.map((_, i) => String(i + 1)), full: v.map((_, i) => `Оцінка ${i + 1}`), height: 180,
    series: [{ name: "Спроб", color: C.tests, values: v }] });
}

function renderGames(){
  const { from, to } = ranges();
  const m = new Map();
  D.games.forEach(g => { if (!inRange(g.playedAt, from, to)) return; const e = m.get(g.title) || { n: 0, p: 0, who: new Set() }; e.n++; e.p += g.players; e.who.add(g.teacherId); m.set(g.title, e); });
  const rows = [...m].map(([t, e]) => ({ label: t, sub: `${e.p} ${plural(e.p, ["учасник", "учасники", "учасників"])} · ${e.who.size} ${plural(e.who.size, ["викладач", "викладачі", "викладачів"])}`, value: e.n }))
    .sort((a, b) => b.value - a.value).slice(0, 6);
  rank(document.getElementById("ch-games"), rows, { unit: "Запусків", color: C.games, empty: "За цей період ігор не було" });
}

function renderHeat(){
  const { from, to } = ranges();
  const grid = Array.from({ length: 7 }, () => new Array(24).fill(0));
  const add = (t, w) => { if (!inRange(t, from, to)) return; const d = new Date(t); grid[(d.getDay() + 6) % 7][d.getHours()] += w; };
  D.attempts.forEach(a => add(a.createdAt, 1));
  D.games.forEach(g => add(g.playedAt, g.players));
  const max = Math.max(0, ...grid.flat());
  // Послідовна шкала одного відтінку: світлий → темний
  const RAMP = ["#F1F4FA", "#E4DBFD", "#C4B5FD", "#9F7AEA", "#7C3AED", "#5B21B6"];
  const lvl = v => !v || !max ? 0 : Math.min(5, 1 + Math.floor(v / max * 4.999));
  const DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"], DF = ["понеділок", "вівторок", "середа", "четвер", "пʼятниця", "субота", "неділя"];
  let h = `<span></span>` + Array.from({ length: 24 }, (_, i) => `<span class="h">${i % 3 === 0 ? String(i).padStart(2, "0") : ""}</span>`).join("");
  grid.forEach((row, di) => {
    h += `<span class="d">${DAYS[di]}</span>` + row.map((v, hr) => `<span class="c" tabindex="-1" style="background:${RAMP[lvl(v)]}" data-tip="${esc(`<div class="h">${DF[di]}, ${String(hr).padStart(2, "0")}:00–${String(hr + 1).padStart(2, "0")}:00</div><div class="r">Активність учнів<b>${v}</b></div>`)}"></span>`).join("");
  });
  const el = document.getElementById("heat"); el.innerHTML = h; bindTips(el);
  document.getElementById("heat-cells").innerHTML = RAMP.map(c => `<i style="background:${c}"></i>`).join("");
  let bd = 0, bh = 0; grid.forEach((r, d) => r.forEach((v, hr) => { if (v > grid[bd][bh]) { bd = d; bh = hr; } }));
  document.getElementById("heat-pill").textContent = max ? `пік: ${DAYS[bd]}, ${String(bh).padStart(2, "0")}:00` : "ще немає даних";
}

function renderTable(){
  const q = (document.getElementById("st-search").value || "").trim().toLowerCase();
  const S = D.stats;
  let list = [...D.users].sort((a, b) => ((S[b.id]?.attempts || 0) + (S[b.id]?.gamePlayers || 0)) - ((S[a.id]?.attempts || 0) + (S[a.id]?.gamePlayers || 0)));
  if (q) list = list.filter(u => [fullName(u), u.login, u.email].join(" ").toLowerCase().includes(q));
  document.getElementById("st-meta").textContent = `${list.length} / ${D.users.length}`;
  const tb = document.getElementById("stats-body");
  if (!list.length){ tb.innerHTML = `<tr><td colspan="8" class="empty-mini">Нічого не знайдено</td></tr>`; return; }
  const PAL = ["", "b", "g", "o", "r"];
  const n = (v, extra) => v ? `<span class="num">${v}${extra ? `<small>${extra}</small>` : ""}</span>` : `<span class="num muted">0</span>`;
  tb.innerHTML = list.map(u => {
    const s = S[u.id] || {}, name = fullName(u);
    const ini = (((u.surname || "")[0] || "") + ((u.name || "")[0] || "") || name.slice(0, 2)).toUpperCase();
    const recent = s.lastAct && Date.now() - s.lastAct < DAY;
    return `<tr${u.blocked ? ' style="opacity:.55"' : ""}>
      <td><div class="cell-name"><div class="avatar ${PAL[(name.charCodeAt(0) || 0) % PAL.length]}">${esc(ini)}</div><div><div class="nm">${esc(name)}</div><div class="lg">${esc(u.login ? "@" + u.login : u.email || "")}</div></div></div></td>
      <td>${n(s.tests, s.activeTests ? s.activeTests + " акт." : "")}</td>
      <td>${n(s.attempts, s.weekAttempts ? "+" + s.weekAttempts + " за тижд." : "")}</td>
      <td>${n(s.games, s.weekGames ? "+" + s.weekGames + " за тижд." : "")}</td>
      <td>${n(s.gamePlayers)}</td>
      <td>${n(s.students)}</td>
      <td>${n(s.links)}</td>
      <td style="font:600 12px 'Geist Mono',monospace;color:${recent ? "#15803D" : "var(--ink-500)"}">${s.lastAct ? esc(formatTimeAgo(s.lastAct)) : "—"}</td>
    </tr>`;
  }).join("");
}

function renderPeriod(){ renderKpis(); renderDyn(); renderTop(); renderGrades(); renderGames(); renderHeat(); }
function renderAll(){ renderPeriod(); renderTable(); }

document.getElementById("period-seg").addEventListener("click", e => {
  const b = e.target.closest("button[data-p]"); if (!b) return;
  P = +b.dataset.p;
  try { localStorage.setItem("qf_adm_stats_p", P); } catch {}
  document.querySelectorAll("#period-seg button").forEach(x => x.classList.toggle("on", x === b));
  renderPeriod();
});
document.getElementById("st-search").addEventListener("input", renderTable);
let _rsT, _rsW = innerWidth;
addEventListener("resize", () => { clearTimeout(_rsT); _rsT = setTimeout(() => { if (Math.abs(innerWidth - _rsW) < 40) return; _rsW = innerWidth; renderDyn(); renderGrades(); }, 200); });
document.getElementById("btn-refresh").addEventListener("click", async () => {
  const btn = document.getElementById("btn-refresh");
  btn.disabled = true; btn.style.opacity = "0.5";
  try { await load(); } catch (e) { console.error(e); }
  btn.disabled = false; btn.style.opacity = "";
});

const _cached = cachedTeachers();
if (_cached){ apply(_cached); hideLoader(); }
try {
  await load();
} catch (e) {
  console.error("[stats] Initial load failed:", e);
  const root = document.getElementById("admin-content");
  if (root){
    const box = document.createElement("div");
    box.className = "card"; box.style.cssText = "padding:40px 24px;text-align:center";
    box.innerHTML = `<div style="font-size:16px;font-weight:800;margin-bottom:6px">Не вдалося завантажити статистику</div>
      <div style="font-size:13px;color:var(--ink-500);margin-bottom:14px">${esc(e.message || "Невідома помилка")}</div>
      <button class="tb-btn primary" onclick="location.reload()">Спробувати знову</button>`;
    root.appendChild(box);
  }
}
hideLoader();
</script>
</body>
</html>
