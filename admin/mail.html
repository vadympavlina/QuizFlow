<style>
.field-input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-family:"Manrope",sans-serif;font-size:14px;color:var(--ink-900);outline:none;transition:border-color .15s,box-shadow .15s}
.field-input:focus{border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.12)}
textarea.field-input{resize:vertical;min-height:220px;line-height:1.55}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field-l{font-size:12.5px;font-weight:700;color:var(--ink-700)}
.field-h{font-size:11.5px;color:var(--ink-400);line-height:1.5}
.field-h code{font:500 11px "Geist Mono",monospace;background:#F1F4FA;padding:1px 5px;border-radius:5px;color:var(--ink-700)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;min-width:0}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15px;font-weight:800;margin:0;color:var(--ink-900)}
.card-h p{font-size:12.5px;color:var(--ink-500);margin:2px 0 0}
.card-b{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.card-f{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 18px;flex-wrap:wrap}
.ml-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:700 13px "Manrope",sans-serif;color:var(--ink-700);cursor:pointer}
.chips button i{width:8px;height:8px;border-radius:50%}
.chips button.on{border-color:var(--ink-900);box-shadow:inset 0 0 0 1px var(--ink-900);color:var(--ink-900)}
.chips.sm button{padding:6px 10px;font-size:12.5px}
.ml-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:#F7F8FC;border:1px solid var(--line);font-size:12.5px;color:var(--ink-500)}
.ml-sum b{font:700 13px "Geist Mono",monospace;color:var(--ink-900)}
.ml-sum .big{font-size:13.5px;color:var(--ink-900);font-weight:800}
.ml-sum .sep{width:4px;height:4px;border-radius:50%;background:var(--ink-300,#CBD5E1)}
.ml-sum button{margin-left:auto;border:0;background:none;font:700 12.5px "Manrope",sans-serif;color:#6D28D9;cursor:pointer;padding:2px 0}
.ml-who{display:flex;flex-wrap:wrap;gap:6px;max-height:160px;overflow:auto}
.ml-who span{font-size:12px;padding:4px 9px;border-radius:8px;background:#F1F4FA;color:var(--ink-700)}
.ml-who span.off{background:#FEF2F2;color:#B91C1C;text-decoration:line-through}
.pk{margin-top:8px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.pk-top{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--line);background:#FAFBFE;flex-wrap:wrap}
.pk-top .search-input{flex:1;min-width:180px}
.pk-top .search-input .input{width:100%;padding-top:9px;padding-bottom:9px}
.pk-n{font-size:12.5px;color:var(--ink-500);white-space:nowrap}
.pk-n b{font-family:"Geist Mono",monospace;color:var(--ink-900)}
.pk-n button{border:0;background:none;font:700 12.5px "Manrope",sans-serif;color:#6D28D9;cursor:pointer;padding:0 0 0 6px}
.pk-list{max-height:300px;overflow:auto}
.pk-it{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;font:inherit;color:inherit;cursor:pointer}
.pk-it:last-child{border-bottom:0}
.pk-it:hover{background:#F7F8FC}
.pk-it[aria-checked="true"]{background:#F5F3FF}
.pk-it:disabled{cursor:not-allowed;opacity:.6;background:#fff}
.pk-it:focus-visible{outline:2px solid #7C3AED;outline-offset:-2px}
.pk-cb{width:18px;height:18px;border-radius:6px;border:1.5px solid #C9D1E4;display:grid;place-items:center;flex:0 0 auto;background:#fff;color:#fff}
.pk-it[aria-checked="true"] .pk-cb{background:#7C3AED;border-color:#7C3AED}
.pk-i{flex:1;min-width:0}
.pk-i b{display:block;font-size:13.5px;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-i span{display:block;font-size:12px;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:0 0 auto;background:#F1F4FA;color:var(--ink-500)}
.pk-tag.warn{background:#FEF2F2;color:#B91C1C}
.pk-empty{padding:22px;text-align:center;font-size:13px;color:var(--ink-500)}
.ml-row{display:flex;align-items:center;gap:10px}
.ml-btn{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:10px}
.toggle-sw{position:relative;display:inline-block;width:40px;height:23px;flex:0 0 auto}
.toggle-sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.toggle-sl{position:absolute;inset:0;background:#E3E8F2;border-radius:99px;transition:background .2s}
.toggle-sl::before{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .2s}
.toggle-sw input:checked + .toggle-sl{background:linear-gradient(135deg,#7C3AED,#4F46E5)}
.toggle-sw input:checked + .toggle-sl::before{transform:translateX(17px)}
.toggle-sw input:focus-visible + .toggle-sl{box-shadow:0 0 0 3px rgba(124,58,237,.3)}
.ai{border:1px solid #D9E3FF;background:linear-gradient(180deg,#F5F8FF,#fff);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ai-h{display:flex;align-items:center;gap:10px}
.ai-h .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#E6EDFF;color:#2D5BE3;flex:0 0 auto}
.ai-h b{font-size:13.5px;color:var(--ink-900);display:block}
.ai-h span{font-size:12px;color:var(--ink-500)}
.ai textarea.field-input{min-height:84px}
.ai-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ai-f .chips{margin-right:auto}
.ai-st{font-size:12.5px;line-height:1.5;padding:9px 11px;border-radius:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ai-st.ok{background:#F0FDF4;border:1px solid #BBF7D0;color:#15803D}
.ai-st.err{background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C}
.ai-st.wait{background:#F4F6FB;border:1px solid var(--line);color:var(--ink-500)}
.ai-st span{flex:1;min-width:0}
.ai-st button{border:0;background:none;font:700 12.5px "Manrope",sans-serif;color:inherit;text-decoration:underline;cursor:pointer;padding:0}
.ai-off{font-size:12.5px;color:var(--ink-500)}
.ai-off a{color:#6D28D9;font-weight:700}
.pv{position:sticky;top:84px}
.pv-meta{padding:12px 20px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-500);line-height:1.6}
.pv-meta b{color:var(--ink-900)}
.pv iframe{display:block;width:100%;height:620px;border:0;border-radius:0 0 18px 18px;background:#F1F4FA}
.pv-empty{height:620px;display:grid;place-items:center;text-align:center;color:var(--ink-400);font-size:13px;padding:20px;background:#F7F8FC;border-radius:0 0 18px 18px}
.pv-err{margin:12px 20px 0;padding:10px 12px;border-radius:12px;background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;font-size:12.5px;font-weight:700}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;font-size:12.5px;line-height:1.5}
.note svg{flex:0 0 auto;margin-top:2px}
.hist{margin-top:18px}
.hi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 20px;border-bottom:1px solid var(--line);align-items:center}
.hi:last-child{border-bottom:0}
.hi b{font-size:14px;color:var(--ink-900);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi .m{font-size:12px;color:var(--ink-500);margin-top:3px}
.hi .r{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:#DCFCE7;color:#15803D}.pill.err{background:#FEE2E2;color:#B91C1C}.pill.mute{background:#F1F4FA;color:var(--ink-500)}
.empty{padding:36px 20px;text-align:center;color:var(--ink-500);font-size:13px}
.empty b{display:block;font-size:15px;color:var(--ink-900);margin-bottom:4px}
.setup{max-width:720px}
.setup ol{margin:0;padding-left:20px;font-size:13px;color:var(--ink-700);line-height:1.7}
.setup code{font:500 12px "Geist Mono",monospace;background:#F1F4FA;padding:1px 6px;border-radius:6px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.res{padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.55}
.res.ok{background:#F0FDF4;border:1px solid #BBF7D0;color:#15803D}
.res.err{background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C}
.res b{font-family:"Geist Mono",monospace}
@media (max-width:1023px){ .ml-grid{grid-template-columns:1fr} .pv{position:static} .pv iframe,.pv-empty{height:480px} }
@media (max-width:640px){ .card-h,.card-b{padding-left:14px;padding-right:14px} .card-f{padding:0 14px 14px} .card-f .tb-btn{flex:1;justify-content:center} .ml-btn{grid-template-columns:1fr} .hi{grid-template-columns:1fr;padding:12px 14px} .hi .r{justify-content:flex-start} }

<body>

<div id="admin-loader"><div class="spin"></div></div>
<script src="shared/admin-nav.js?v=6"></script>
<div id="admin-root"></div>
<div id="admin-toast" class="toast" role="status" aria-live="polite"></div>

<div class="modal-bd" id="m-send">
  <div class="modal" style="max-width:460px">
    <div class="modal-h"><span class="mh-ico blue" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></span>
      <h3>Надіслати розсилку?</h3>
      <button class="close" type="button" onclick="closeModal('m-send')" aria-label="Закрити"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-b"><div style="font-size:13.5px;color:var(--ink-500);line-height:1.6" id="sd-t"></div><div class="res" id="sd-res" hidden></div></div>
    <div class="modal-f"><button class="tb-btn" type="button" onclick="closeModal('m-send')" id="sd-cancel">Скасувати</button><button class="tb-btn primary" type="button" id="sd-ok">Надіслати</button></div>
  </div>
</div>

<script type="module">
import { logAction, initAdminShell, dbGet, dbSet, db, ref, push, set, openModal, closeModal, toast, esc, hideLoader, mailApi, mailWorkerUrl, setMailWorkerUrl } from "./shared/admin-shell.js?v=13";
import { callAIRaw } from "../shared/ai-call.js?v=1";
import { trackAI, tokensOf } from "../shared/ai-usage.js?v=3";

const SVG = (p, s = 14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = {
  send: SVG('<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>'),
  flask: SVG('<path d="M9 3h6"/><path d="M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7 15h10"/>'),
  gear: SVG('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>'),
  spark: SVG('<path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/>', 16),
  info: SVG('<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/>', 15),
};
const fmt = t => t ? new Date(t).toLocaleString("uk-UA", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b >= 2 && b <= 4 ? f[1] : f[2]; };
const EMAIL_RE = /^[^\s@<>()",;]+@[^\s@<>()",;]+\.[^\s@<>()",;]{2,}$/;
const DRAFT_KEY = "qf_mail_draft";
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const content = `
  <div class="page-head"><div><h1>Розсилки</h1><p>Листи викладачам з адреси сервісу. У кожному листі є посилання «Відписатися»</p></div></div>
  <div id="ml-root"><div class="empty">Завантаження…</div></div>
`;
const topbarRight = `<button class="tb-btn" type="button" id="btn-setup">${IC.gear} Воркер пошти</button>`;
const { _user } = await initAdminShell({ activeId: "mail", crumbs: ["Розсилки"], content, topbarRight });

let users = {}, roles = {}, log = {}, unsub = new Set(), workerUrl = "", workerStatus = null;
let draft = Object.assign({ audience: "all", roles: [], picks: [], subject: "", body: "", aiPrompt: "", aiTone: "friendly", btnOn: false, btnLabel: "Відкрити QuizFlow", btnUrl: "https://quizflow.space/" }, lsGet(DRAFT_KEY) || {});
let showWho = false, setupOpen = false, pickQ = "";
let aiCfg = null, aiBusy = false, aiUndo = null, aiMsg = null;   // aiMsg: { kind: ok|err|wait, text }
const root = document.getElementById("ml-root");

// ─── Отримувачі ──────────────────────────────────────────────────────────
const nameOf = u => [u.surname, u.name].filter(Boolean).join(" ") || u.email || "Без імені";
const AUD = [["all", "Усі викладачі"], ["active", "Активні за 30 днів"], ["roles", "За роллю"], ["pick", "Окремі викладачі"]];
function audience(){
  const monthAgo = Date.now() - 30 * 864e5;
  // Окремо обраних шукаємо серед усіх акаунтів (зокрема адмінів), решту — серед викладачів
  const pool = Object.entries(users).filter(([id, u]) => u && typeof u === "object" && (draft.audience === "pick" ? draft.picks.includes(id) : u.role === "teacher")).map(([id, u]) => ({ id, ...u }))
    .filter(u => draft.audience === "all" || draft.audience === "pick" ? true
      : draft.audience === "active" ? (u.lastLogin || 0) >= monthAgo
      : draft.roles.some(r => u.customRoleIds?.[r]));
  const out = { send: [], unsub: [], noEmail: [], blocked: [] };
  pool.forEach(u => {
    if (u.blocked === true) out.blocked.push(u);
    else if (!EMAIL_RE.test(String(u.email || ""))) out.noEmail.push(u);
    else if (unsub.has(u.id)) out.unsub.push(u);
    else out.send.push(u);
  });
  return out;
}
function audLabel(){
  if (draft.audience === "pick"){
    const names = draft.picks.map(id => users[id]).filter(Boolean).map(nameOf);
    return names.length <= 3 ? names.join(", ") : `${names.slice(0, 3).join(", ")} та ще ${names.length - 3}`;
  }
  if (draft.audience !== "roles") return AUD.find(a => a[0] === draft.audience)[1];
  return "Ролі: " + draft.roles.map(r => roles[r]?.name).filter(Boolean).join(", ");
}

// Вибір окремих людей: пошук за ім'ям, прізвищем чи email
const CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
function pickable(){
  return Object.entries(users).filter(([, u]) => u && typeof u === "object" && (u.role === "teacher" || u.role === "admin"))
    .map(([id, u]) => ({ id, ...u })).sort((a, b) => nameOf(a).localeCompare(nameOf(b), "uk"));
}
function pickState(u){
  if (u.blocked === true) return ["Заблоковано", "warn", true];
  if (!EMAIL_RE.test(String(u.email || ""))) return ["Без email", "warn", true];
  if (unsub.has(u.id)) return ["Відписався", "warn", true];
  if (u.role === "admin") return ["Адмін", "", false];
  return null;
}
function pickListHtml(){
  const q = pickQ.trim().toLowerCase();
  const list = pickable().filter(u => !q || [nameOf(u), u.email, u.login].some(x => String(x || "").toLowerCase().includes(q)));
  if (!list.length) return `<div class="pk-empty">${q ? "Нікого не знайдено" : "Викладачів ще немає"}</div>`;
  return list.map(u => {
    const st = pickState(u), on = draft.picks.includes(u.id);
    return `<button type="button" class="pk-it" role="checkbox" aria-checked="${on}" data-pick="${esc(u.id)}" ${st?.[2] && !on ? "disabled" : ""}>
      <span class="pk-cb">${on ? CHECK : ""}</span>
      <span class="pk-i"><b>${esc(nameOf(u))}</b><span>${esc(u.email || "email не вказано")}</span></span>
      ${st ? `<span class="pk-tag ${st[1]}">${st[0]}</span>` : ""}
    </button>`;
  }).join("");
}
function pickerHtml(){
  const n = draft.picks.length;
  return `<div class="pk">

const AI_SYSTEM = `Ти пишеш листи від імені команди QuizFlow для викладачів, які користуються сервісом. Пиши ВИКЛЮЧНО українською.

- Жодних емодзі. Жодних вигаданих фактів, дат, цифр чи посилань: лише те, що є в запиті, або розділи сайту вище.

- Кнопка: якщо листу потрібна одна головна дія — дай кнопку з коротким написом (2–3 слова) і https-посиланням; інакше button = null.

const stripEmoji = t => String(t || "").replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}\u{FE0F}\u{200D}]/gu, "").replace(/[ \t]+\n/g, "\n");
function parseAI(text){
  const raw = String(text || "").replace(/^```(?:json)?\s*|```\s*$/g, "").trim();
  const a = raw.indexOf("{"), b = raw.lastIndexOf("}");
  let o; try { o = JSON.parse(raw.slice(a, b + 1)); } catch { throw new Error("AI відповів у незрозумілому форматі, спробуйте ще раз"); }
  const subject = stripEmoji(o.subject).replace(/^["«]|["»]$/g, "").trim().slice(0, 150);
  const body = stripEmoji(o.body).trim().slice(0, 20000);
  if (!subject || !body) throw new Error("AI не написав тему або текст, спробуйте уточнити запит");
  const u = String(o.button?.url || "").trim();
  const button = /^https:\/\/\S+$/.test(u) ? { label: stripEmoji(o.button.label).trim().slice(0, 40) || "Відкрити", url: u } : null;
  return { subject, body, button };
}

    const r = await mailApi("/broadcast", { ...m, uids: a.send.map(u => u.id) });
    const skipped = Object.values(r.skipped || {}).reduce((s, x) => s + x, 0);
    const entry = { at: Date.now(), by: _user.id, byName: [_user.name, _user.surname].filter(Boolean).join(" ") || _user.email || "", subject: m.subject, audience: audLabel(), sent: r.sent || 0, failed: r.failed || 0, skipped };
    const key = push(ref(db, "mailLog")).key;
    await set(ref(db, `mailLog/${key}`), entry).catch(() => {});
    log[key] = entry;
    logAction("mail.broadcast", { type: "mail", id: key, label: m.subject }, `${entry.sent} надіслано${entry.failed ? `, ${entry.failed} помилок` : ""}`);
    res.hidden = false;
    res.className = "res " + (r.failed ? "err" : "ok");
    res.innerHTML = `Надіслано: <b>${r.sent}</b>${r.failed ? ` · не вдалося: <b>${r.failed}</b>` : ""}${skipped ? ` · пропущено: <b>${skipped}</b>` : ""}${r.errors?.length ? `<br>${r.errors.map(esc).join("<br>")}` : ""}`;
    btn.hidden = true; document.getElementById("sd-cancel").textContent = "Готово";
    if (!r.failed){ draft.subject = ""; draft.body = ""; lsSet(DRAFT_KEY, draft); }
    render();
  } catch (err){
    res.hidden = false; res.className = "res err"; res.textContent = err.message;
    btn.disabled = false; btn.textContent = "Спробувати ще";
  } finally { _sending = false; }
});

// ─── Події ───────────────────────────────────────────────────────────────
root.addEventListener("input", e => {
  if (!e.target.closest(".ml-grid")) return;
  readForm();
  if (e.target.id === "ai-prompt") return;
  if (e.target.id === "pk-q"){ pickQ = e.target.value; document.getElementById("pk-list").innerHTML = pickListHtml(); return; }
  if (e.target.id === "f-subj") document.getElementById("pv-subj").textContent = draft.subject || "—";
  schedulePreview();
});
root.addEventListener("change", e => { if (e.target.id === "f-btn"){ readForm(); draft.btnOn = e.target.checked; lsSet(DRAFT_KEY, draft); render(); } });
root.addEventListener("keydown", e => { if (e.target.id === "st-url" && e.key === "Enter") checkWorker(); });
root.addEventListener("click", e => {
  const au = e.target.closest("[data-aud]"); if (au){ readForm(); draft.audience = au.dataset.aud; lsSet(DRAFT_KEY, draft); return render(); }
  const ro = e.target.closest("[data-role]"); if (ro){ readForm(); const id = ro.dataset.role; draft.roles = draft.roles.includes(id) ? draft.roles.filter(x => x !== id) : [...draft.roles, id]; lsSet(DRAFT_KEY, draft); return render(); }
  const pk = e.target.closest("[data-pick]");
  if (pk){
    readForm(); const id = pk.dataset.pick;
    draft.picks = draft.picks.includes(id) ? draft.picks.filter(x => x !== id) : [...draft.picks, id];
    lsSet(DRAFT_KEY, draft);
    const top = document.getElementById("pk-list")?.scrollTop || 0;
    render();
    const l = document.getElementById("pk-list"); if (l) l.scrollTop = top;
    document.querySelector(`[data-pick="${CSS.escape(id)}"]`)?.focus({ preventScroll: true });
    return;
  }
  const tn = e.target.closest("[data-tone]"); if (tn){ readForm(); draft.aiTone = tn.dataset.tone; lsSet(DRAFT_KEY, draft); return render(); }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "ai-new") return aiWrite("new");
  if (act === "ai-edit") return aiWrite("edit");
  if (act === "ai-undo"){ if (aiUndo){ Object.assign(draft, aiUndo); aiUndo = null; aiMsg = null; lsSet(DRAFT_KEY, draft); render(); } return; }
  if (act === "pick-clear"){ readForm(); draft.picks = []; lsSet(DRAFT_KEY, draft); return render(); }
  if (act === "who"){ readForm(); showWho = !showWho; return render(); }
  if (act === "test") return sendTest(b);
  if (act === "send") return askSend();
  if (act === "setup-check") return checkWorker();
  if (act === "setup-close"){ setupOpen = false; return render(); }
});
document.getElementById("btn-setup").addEventListener("click", () => { readForm(); setupOpen = true; render(); });
document.querySelectorAll(".modal-bd").forEach(m => m.addEventListener("click", e => { if (e.target === m && !_sending) closeModal(m.id); }));
document.addEventListener("keydown", e => { if (e.key === "Escape" && !_sending){ const o = [...document.querySelectorAll(".modal-bd.on")]; if (o.length) closeModal(o[o.length - 1].id); } });

// ─── Завантаження ────────────────────────────────────────────────────────
try {
  const [u, r, l, url, ai] = await Promise.all([dbGet("users"), dbGet("roles").catch(() => null), dbGet("mailLog").catch(() => null), mailWorkerUrl(true), dbGet("settings/ai").catch(() => null)]);
  users = u || {}; roles = r || {}; log = l || {}; workerUrl = url || ""; aiCfg = ai || {};
} catch (e){ toast("Не вдалося завантажити: " + e.message, "err"); }
if (workerUrl){
  try { workerStatus = await mailApi("/status"); unsub = new Set(workerStatus.unsubscribed || []); }
  catch (e){ toast("Воркер пошти: " + e.message, "err"); }
}
if (draft.audience === "roles") draft.roles = draft.roles.filter(id => roles[id]);
draft.picks = (draft.picks || []).filter(id => users[id]);
// Перехід з картки викладача: mail?to=uid[,uid]
{
  const to = (new URLSearchParams(location.search).get("to") || "").split(",").map(s => s.trim()).filter(id => users[id]);
  if (to.length){ draft.audience = "pick"; draft.picks = to; lsSet(DRAFT_KEY, draft); history.replaceState(null, "", location.pathname); }
}
render();
hideLoader();
</script>
