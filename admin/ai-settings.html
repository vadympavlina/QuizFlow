<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%237C3AED'/><stop offset='1' stop-color='%234F46E5'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><path d='M16 6l2 6 6 2-6 2-2 6-2-6-6-2 6-2z' fill='white'/></svg>">
<title>QuizFlow Admin — AI Налаштування</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/admin-shell.css?v=4">
<style>
.ai-sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 -4px}
.ai-sec-h h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.ai-sec-h p{margin:2px 0 0;font-size:12.5px;color:var(--ink-500)}

/* Провайдери */
.row-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:1180px){.row-2{grid-template-columns:1fr}}
.prov{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.prov-head{display:flex;align-items:center;gap:12px}
.prov-mark{width:44px;height:44px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;color:#fff}
.prov-mark.groq{background:linear-gradient(135deg,#F59E0B,#D97706);box-shadow:0 8px 18px -8px rgba(245,158,11,.6)}
.prov-mark.gemini{background:linear-gradient(135deg,#34D399,#059669);box-shadow:0 8px 18px -8px rgba(16,185,129,.6)}
.prov-name{font-weight:800;font-size:16px;letter-spacing:-.01em}
.prov-link{font-size:11.5px;color:#6D28D9;text-decoration:none;font-family:"Geist Mono",monospace;display:inline-flex;align-items:center;gap:4px;margin-top:2px}
.prov-link:hover{text-decoration:underline}
.prov-state{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:#F1F4FA;color:var(--ink-500);white-space:nowrap}
.prov-state::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.prov-state.ok{background:#DCFCE7;color:#15803D}
.prov-state.set{background:#EDE9FE;color:#6D28D9}
.prov-state.bad{background:#FEE2E2;color:#B91C1C}
.prov-state.busy::before{animation:aiBlink .8s infinite}
@keyframes aiBlink{50%{opacity:.25}}

.lbl{font-size:11px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.07em;font-weight:800;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.lbl .hint{text-transform:none;letter-spacing:0;font-weight:600;font-size:11.5px;color:var(--ink-400)}
.key-row{display:flex;gap:8px}
.key-wrap{position:relative;flex:1;display:flex}
.key-input{width:100%;padding:11px 44px 11px 12px;border-radius:11px;border:1.5px solid var(--line);background:#FAFBFE;font-family:"Geist Mono",monospace;font-size:13px;color:var(--ink-900);outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.key-input:focus{border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.12);background:#fff}
.key-input.warn{border-color:#F59E0B}
.key-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;border:0;background:transparent;cursor:pointer;color:var(--ink-400);display:grid;place-items:center}
.key-eye:hover{background:#F1F4FA;color:var(--ink-700)}
.key-eye svg{width:16px;height:16px}
.key-msg{font-size:11.5px;margin-top:6px;color:var(--ink-500);min-height:15px}
.key-msg.bad{color:#B91C1C}.key-msg.warn{color:#B45309}.key-msg.ok{color:#15803D}

.models{display:flex;flex-direction:column;gap:6px}
.model{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line);cursor:pointer;transition:border-color .15s,background .15s;background:#fff}
.model:hover{border-color:var(--line-strong)}
.model:has(input:checked){border-color:#7C3AED;background:#F7F4FF}
.model:has(input:focus-visible){box-shadow:0 0 0 3px rgba(124,58,237,.18)}
.model input{accent-color:#7C3AED;margin:0;flex:0 0 auto;cursor:pointer}
.model .nm{font-weight:700;font-size:12.5px;font-family:"Geist Mono",monospace;color:var(--ink-900)}
.model:has(input:checked) .nm{color:#6D28D9}
.model .desc{font-size:11.5px;color:var(--ink-500);margin-top:1px}
.model .tag{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:#DCFCE7;color:#15803D;white-space:nowrap}
.model .tag.gray{background:#F1F4FA;color:var(--ink-500)}
.model-custom{display:flex;gap:8px;align-items:center}
.model-custom select,.model-custom input{flex:1;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);font:inherit;font-size:12.5px;font-family:"Geist Mono",monospace;background:#fff;color:var(--ink-900);outline:none;min-width:0}
.model-custom select:focus,.model-custom input:focus{border-color:#7C3AED}

/* Функції */
.feat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:1180px){.feat-grid{grid-template-columns:1fr}}
.feat{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,opacity .15s}
.feat.off{background:#FAFBFE}
.feat.off .feat-body{opacity:.45;pointer-events:none}
.feat-h{display:flex;align-items:flex-start;gap:12px}
.feat-ico{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center}
.feat-ico svg{width:18px;height:18px}
.feat-ico.violet{background:#EDE9FE;color:#6D28D9}.feat-ico.blue{background:#DBEAFE;color:#1D4ED8}
.feat-ico.amber{background:#FEF3C7;color:#B45309}.feat-ico.green{background:#DCFCE7;color:#15803D}
.feat-t{flex:1;min-width:0}
.feat-name{font-weight:800;font-size:14px}
.feat-desc{font-size:12px;color:var(--ink-500);margin-top:2px;line-height:1.4}
.feat-where{font-size:11px;color:var(--ink-400);margin-top:4px;font-family:"Geist Mono",monospace}
.feat-body{display:flex;flex-direction:column;gap:8px}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:#F1F4FA;border-radius:10px;padding:3px;gap:3px}
.seg2 button{border:0;background:transparent;border-radius:8px;padding:8px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-500);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s}
.seg2 button:hover{color:var(--ink-900)}
.seg2 button[aria-pressed="true"]{background:#fff;color:var(--ink-900);box-shadow:0 1px 3px rgba(15,30,71,.12)}
.seg2 .pdot{width:7px;height:7px;border-radius:50%}
.seg2 [data-prov="groq"] .pdot{background:#F59E0B}.seg2 [data-prov="gemini"] .pdot{background:#10B981}
.feat-note{font-size:11.5px;color:#B45309;display:flex;gap:6px;align-items:flex-start;line-height:1.4}
.feat-note svg{flex:0 0 auto;width:13px;height:13px;margin-top:1px}
.feat-model{font-size:11.5px;color:var(--ink-400)}
.feat-model b{font-family:"Geist Mono",monospace;color:var(--ink-700);font-weight:600}

.toggle-sw{position:relative;display:inline-block;width:40px;height:23px;flex:0 0 auto}
.toggle-sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.toggle-sl{position:absolute;inset:0;background:#DDE3EE;border-radius:99px;transition:background .2s}
.toggle-sl::before{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.toggle-sw input:checked + .toggle-sl{background:linear-gradient(135deg,#7C3AED,#4F46E5)}
.toggle-sw input:checked + .toggle-sl::before{transform:translateX(17px)}
.toggle-sw input:focus-visible + .toggle-sl{box-shadow:0 0 0 3px rgba(124,58,237,.25)}

/* Індивідуальні перевизначення */
.ovr{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.ovr-ico{width:38px;height:38px;border-radius:11px;background:#EDE9FE;color:#6D28D9;display:grid;place-items:center;flex:0 0 auto}
.ovr-ico svg{width:19px;height:19px}
.ovr-t{flex:1;font-size:13px;color:var(--ink-700)}
.ovr-t b{color:var(--ink-900)}
.ovr-names{font-size:12px;color:var(--ink-500);margin-top:2px}
.ovr a{font-size:12.5px;font-weight:700;color:#6D28D9;text-decoration:none;white-space:nowrap}
.ovr a:hover{text-decoration:underline}

.sec-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;font-size:12.5px;line-height:1.5}
.sec-note svg{flex:0 0 auto;margin-top:1px}

/* Панель незбережених змін */
.save-bar{position:sticky;bottom:16px;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-radius:14px;background:#1A1040;color:#fff;box-shadow:0 18px 40px -12px rgba(20,11,58,.55);transform:translateY(calc(100% + 30px));opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.32,.72,0,1),opacity .2s}
.save-bar.on{transform:none;opacity:1;pointer-events:auto}
.save-bar .t{flex:1;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.save-bar .t::before{content:"";width:8px;height:8px;border-radius:50%;background:#FBBF24}
.save-bar .k{font-size:11.5px;opacity:.6;font-family:"Geist Mono",monospace}
.save-bar .tb-btn{height:36px}
.save-bar .tb-btn.ghost{color:#E9E4FF}
.save-bar .tb-btn.ghost:hover{background:rgba(255,255,255,.1);color:#fff}
</style>
</head>
<body>

<div id="admin-loader"><div class="spin"></div></div>
<script src="shared/admin-nav.js?v=1"></script>
<div id="admin-root"></div>
<div id="admin-modals"></div>
<div id="admin-toast" class="toast" role="status" aria-live="polite"></div>

<script type="module">
import { initAdminShell, dbGet, dbUpd, toast, esc, hideLoader } from "./shared/admin-shell.js?v=5";

const SVG = (p, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = {
  eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff: '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>',
  ext: '<path d="M14 4h6v6"/><path d="M20 4l-9 9"/>',
  warn: '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>',
  users: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15 20c0-2.6 2-4.8 4.5-5"/>',
};

// Актуальні моделі. Збережена модель, якої немає в списку, не губиться — показується як «своя».
const PROVIDERS = {
  groq: {
    name: "Groq", link: "https://console.groq.com/keys", host: "console.groq.com", prefix: "gsk_", placeholder: "gsk_…",
    mark: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
    models: [
      { id: "llama-3.3-70b-versatile", desc: "Найкраща якість українською", tag: "Рекомендовано" },
      { id: "openai/gpt-oss-120b", desc: "Сильне міркування, довші відповіді" },
      { id: "llama-3.1-8b-instant", desc: "Найшвидша й найдешевша", tag: "Швидка" },
    ],
  },
  gemini: {
    name: "Google Gemini", link: "https://aistudio.google.com/apikey", host: "aistudio.google.com", prefix: "AIza", placeholder: "AIza…",
    mark: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>',
    models: [
      { id: "gemini-2.5-flash", desc: "Баланс швидкості та якості", tag: "Рекомендовано" },
      { id: "gemini-2.5-flash-lite", desc: "Найшвидша й найдешевша", tag: "Швидка" },
      { id: "gemini-2.5-pro", desc: "Найточніша, повільніша" },
    ],
  },
};
const FEATURES = [
  { id: "comments", flag: "aiComments", name: "Коментар студенту", desc: "Коротка оцінка й порада після проходження тесту", where: "сторінка тесту → результат", ico: "violet",
    svg: '<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>' },
  { id: "analysis", flag: "aiAnalysis", name: "Персональний розбір помилок", desc: "Що саме не так і що повторити", where: "результат тесту · спроби викладача", ico: "blue",
    svg: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>' },
  { id: "generation", flag: "aiGeneration", name: "Генерація питань", desc: "Створення та перефразування питань", where: "конструктор тестів", ico: "amber",
    svg: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>' },
  { id: "textcheck", flag: "aiTextCheck", name: "Перевірка текстових відповідей", desc: "AI-оцінка відкритих і числових відповідей", where: "сторінка тесту → перевірка", ico: "green",
    svg: '<path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>' },
];

const provCard = p => {
  const P = PROVIDERS[p];
  return `<section class="prov" data-prov="${p}">
    <div class="prov-head">
      <div class="prov-mark ${p}">${P.mark}</div>
      <div>
        <div class="prov-name">${P.name}</div>
        <a href="${P.link}" target="_blank" rel="noopener" class="prov-link">${P.host} ${SVG(IC.ext, 2.4).replace("<svg", '<svg width="9" height="9"')}</a>
      </div>
      <span class="prov-state" id="st-${p}">Не налаштовано</span>
    </div>
    <div>
      <div class="lbl"><label for="key-${p}">API-ключ</label><span class="hint">зберігається в settings/ai</span></div>
      <div class="key-row">
        <div class="key-wrap">
          <input class="key-input" type="password" id="key-${p}" placeholder="${P.placeholder}" autocomplete="off" spellcheck="false" data-lpignore="true">
          <button type="button" class="key-eye" data-eye="${p}" aria-label="Показати ключ" title="Показати / сховати">${SVG(IC.eye)}</button>
        </div>
        <button type="button" class="tb-btn" data-test="${p}">Перевірити</button>
      </div>
      <div class="key-msg" id="msg-${p}"></div>
    </div>
    <div>
      <div class="lbl"><span>Модель</span><span class="hint" id="mcount-${p}"></span></div>
      <div class="models" id="models-${p}" role="radiogroup" aria-label="Модель ${P.name}"></div>
    </div>
  </section>`;
};

const content = `
  <div class="page-head">
    <div>
      <h1>AI-налаштування</h1>
      <p>Ключі, моделі та функції штучного інтелекту для всієї платформи</p>
    </div>
  </div>

  <div class="ai-sec-h"><div><h2>Провайдери</h2><p>Достатньо одного. Якщо ключ для обраного провайдера відсутній, функція використає інший.</p></div></div>
  <div class="row-2">${provCard("groq")}${provCard("gemini")}</div>

  <div class="ai-sec-h"><div><h2>Функції</h2><p>Що вмикати та через який провайдер працює кожна функція</p></div></div>
  <div class="feat-grid" id="feat-grid"></div>

  <div class="ovr" id="ovr" hidden>
    <div class="ovr-ico">${SVG(IC.users)}</div>
    <div class="ovr-t"><div id="ovr-t"></div><div class="ovr-names" id="ovr-names"></div></div>
    <a href="teachers">До викладачів →</a>
  </div>

  <div class="sec-note">
    ${SVG(IC.warn).replace("<svg", '<svg width="16" height="16"')}
    <span>Запити до AI йдуть прямо з браузера, тому ключі доступні сторінкам тесту. Використовуйте окремі ключі з лімітами витрат і за потреби перевипускайте їх у консолі провайдера.</span>
  </div>

  <div class="save-bar" id="save-bar" role="region" aria-label="Незбережені зміни">
    <span class="t">Є незбережені зміни</span>
    <span class="k">Ctrl + S</span>
    <button type="button" class="tb-btn ghost" id="btn-discard">Скасувати</button>
    <button type="button" class="tb-btn primary" id="btn-save-bar">Зберегти</button>
  </div>
`;

const topbarRight = `
  <button class="tb-btn primary" id="btn-save-ai" type="button" disabled>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    Зберегти
  </button>`;

await initAdminShell({ activeId: "ai", crumbs: ["AI-налаштування"], content, topbarRight });

// ─── Стан ────────────────────────────────────────────────────────────────
const DEF = { groqKey: "", geminiKey: "", groqModel: "llama-3.3-70b-versatile", geminiModel: "gemini-2.5-flash",
  flags: { comments: true, analysis: true, generation: true, textcheck: true },
  prov: { comments: "groq", analysis: "groq", generation: "groq", textcheck: "groq" } };
let saved = structuredClone(DEF), cur = structuredClone(DEF);
const fetched = { groq: null, gemini: null };  // моделі, отримані при перевірці ключа
const tested = { groq: null, gemini: null };   // true / false / null
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const keyOf = p => cur[p + "Key"].trim();

// ─── Рендер ──────────────────────────────────────────────────────────────
function renderModels(p){
  const P = PROVIDERS[p], sel = cur[p + "Model"];
  const known = P.models.map(m => m.id);
  const extra = (fetched[p] || []).filter(id => !known.includes(id));
  const isCustom = sel && !known.includes(sel);
  document.getElementById("models-" + p).innerHTML = P.models.map(m => `
    <label class="model"><input type="radio" name="model-${p}" value="${esc(m.id)}" ${sel === m.id ? "checked" : ""}>
      <span><div class="nm">${esc(m.id)}</div><div class="desc">${esc(m.desc)}</div></span>
      ${m.tag ? `<span class="tag${m.tag === "Швидка" ? " gray" : ""}">${m.tag}</span>` : ""}</label>`).join("") + `
    <label class="model"><input type="radio" name="model-${p}" value="__custom" ${isCustom ? "checked" : ""}>
      <span style="flex:1;min-width:0"><div class="nm">Інша модель</div>
        <div class="model-custom" style="margin-top:6px">
          ${extra.length
            ? `<select data-custom="${p}" aria-label="Інша модель"><option value="">— оберіть із доступних (${extra.length}) —</option>${extra.map(id => `<option ${id === sel ? "selected" : ""}>${esc(id)}</option>`).join("")}</select>`
            : `<input data-custom="${p}" placeholder="${p === "groq" ? "наприклад, qwen/qwen3-32b" : "наприклад, gemini-2.5-pro"}" value="${isCustom ? esc(sel) : ""}" aria-label="Назва моделі">`}
        </div></span></label>`;
  document.getElementById("mcount-" + p).textContent = fetched[p] ? `доступно ${fetched[p].length}` : "";
}

function renderProvState(p){
  const el = document.getElementById("st-" + p), key = keyOf(p);
  el.className = "prov-state";
  if (!key){ el.textContent = "Не налаштовано"; return; }
  if (tested[p] === "busy"){ el.classList.add("busy", "set"); el.textContent = "Перевірка…"; return; }
  if (tested[p] === true){ el.classList.add("ok"); el.textContent = "Працює"; return; }
  if (tested[p] === false){ el.classList.add("bad"); el.textContent = "Помилка"; return; }
  el.classList.add("set"); el.textContent = "Ключ додано";
}

function keyHint(p){
  const key = keyOf(p), P = PROVIDERS[p], msg = document.getElementById("msg-" + p), inp = document.getElementById("key-" + p);
  const wrong = key && !key.startsWith(P.prefix);
  inp.classList.toggle("warn", !!wrong);
  if (tested[p] === true || tested[p] === false || tested[p] === "busy") return;
  msg.className = "key-msg" + (wrong ? " warn" : "");
  msg.textContent = wrong ? `Ключі ${P.name} зазвичай починаються з «${P.prefix}» — перевірте, чи не сплутано` : key ? `Ключ …${key.slice(-4)}` : "";
}

function renderFeatures(){
  document.getElementById("feat-grid").innerHTML = FEATURES.map(f => {
    const on = cur.flags[f.id], chosen = cur.prov[f.id];
    const other = chosen === "groq" ? "gemini" : "groq";
    const eff = keyOf(chosen) ? chosen : keyOf(other) ? other : null;
    const note = on && !keyOf(chosen)
      ? (eff ? `Немає ключа ${PROVIDERS[chosen].name} — буде використано ${PROVIDERS[eff].name}` : "Немає жодного ключа — функція не працюватиме")
      : "";
    return `<article class="feat${on ? "" : " off"}" data-feat="${f.id}">
      <div class="feat-h">
        <div class="feat-ico ${f.ico}">${SVG(f.svg)}</div>
        <div class="feat-t"><div class="feat-name">${f.name}</div><div class="feat-desc">${f.desc}</div><div class="feat-where">${f.where}</div></div>
        <label class="toggle-sw" title="${on ? "Вимкнути" : "Увімкнути"}"><input type="checkbox" data-flag="${f.id}" ${on ? "checked" : ""} aria-label="${f.name}"><span class="toggle-sl"></span></label>
      </div>
      <div class="feat-body">
        <div class="seg2" role="group" aria-label="Провайдер">
          ${["groq", "gemini"].map(p => `<button type="button" data-prov="${p}" aria-pressed="${chosen === p}"><span class="pdot"></span>${p === "groq" ? "Groq" : "Gemini"}</button>`).join("")}
        </div>
        ${note ? `<div class="feat-note">${SVG(IC.warn)}${note}</div>` : eff ? `<div class="feat-model">Модель: <b>${esc(cur[eff + "Model"])}</b></div>` : ""}
      </div>
    </article>`;
  }).join("");
}

function renderDirty(){
  const dirty = !same(cur, saved);
  document.getElementById("save-bar").classList.toggle("on", dirty);
  document.getElementById("btn-save-ai").disabled = !dirty;
}

function renderAll(){
  ["groq", "gemini"].forEach(p => {
    document.getElementById("key-" + p).value = cur[p + "Key"];
    renderModels(p); renderProvState(p); keyHint(p);
  });
  renderFeatures(); renderDirty();
}

// ─── Події ───────────────────────────────────────────────────────────────
const root = document.getElementById("admin-content");
root.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "key-groq" || t.id === "key-gemini"){
    const p = t.id.slice(4);
    cur[p + "Key"] = t.value;
    tested[p] = null; fetched[p] = fetched[p];
    renderProvState(p); keyHint(p); renderFeatures();
  } else if (t.matches("input[data-custom]")){
    const p = t.dataset.custom;
    document.querySelector(`input[name="model-${p}"][value="__custom"]`).checked = true;
    cur[p + "Model"] = t.value.trim();
    renderFeatures();
  }
  renderDirty();
});
root.addEventListener("change", e => {
  const t = e.target;
  if (t.name?.startsWith("model-")){
    const p = t.name.slice(6);
    if (t.value === "__custom"){
      const c = document.querySelector(`[data-custom="${p}"]`);
      cur[p + "Model"] = c?.value.trim() || cur[p + "Model"];
      setTimeout(() => c?.focus(), 0);
    } else cur[p + "Model"] = t.value;
    renderModels(p); renderFeatures();
  } else if (t.matches("select[data-custom]")){
    const p = t.dataset.custom;
    if (t.value){ cur[p + "Model"] = t.value; renderModels(p); renderFeatures(); }
  } else if (t.dataset.flag){
    cur.flags[t.dataset.flag] = t.checked; renderFeatures();
  }
  renderDirty();
});
root.addEventListener("click", e => {
  const eye = e.target.closest("[data-eye]");
  if (eye){
    const inp = document.getElementById("key-" + eye.dataset.eye), show = inp.type === "password";
    inp.type = show ? "text" : "password";
    eye.innerHTML = SVG(show ? IC.eyeOff : IC.eye);
    eye.setAttribute("aria-label", show ? "Сховати ключ" : "Показати ключ");
    return;
  }
  const test = e.target.closest("[data-test]");
  if (test) return testProvider(test.dataset.test, test);
  const pb = e.target.closest(".seg2 [data-prov]");
  if (pb){
    cur.prov[pb.closest("[data-feat]").dataset.feat] = pb.dataset.prov;
    renderFeatures(); renderDirty();
  }
});

// ─── Перевірка ключа: список моделей + короткий запит до обраної моделі ─────
async function testProvider(p, btn){
  const key = keyOf(p), msg = document.getElementById("msg-" + p);
  if (!key){ msg.className = "key-msg bad"; msg.textContent = "Спершу вставте ключ"; document.getElementById("key-" + p).focus(); return; }
  const model = cur[p + "Model"];
  tested[p] = "busy"; renderProvState(p); btn.disabled = true;
  msg.className = "key-msg"; msg.textContent = "Перевіряємо ключ і модель…";
  const t0 = performance.now();
  try {
    let ids = [];
    if (p === "groq"){
      const r = await fetch("https://api.groq.com/openai/v1/models", { headers: { Authorization: "Bearer " + key } });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error?.message || `HTTP ${r.status}`);
      ids = (d.data || []).filter(m => m.active !== false && !/whisper|tts|guard|distil/i.test(m.id)).map(m => m.id).sort();
      const c = await fetch("https://api.groq.com/openai/v1/chat/completions", { method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
        body: JSON.stringify({ model, messages: [{ role: "user", content: "Відповідай одним словом: так" }], max_tokens: 5 }) });
      const cd = await c.json().catch(() => ({}));
      if (!c.ok) throw new Error(`модель «${model}»: ` + (cd.error?.message || `HTTP ${c.status}`));
    } else {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=${encodeURIComponent(key)}`);
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error?.message || `HTTP ${r.status}`);
      ids = (d.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent") && /gemini/i.test(m.name) && !/embedding|image|tts|audio/i.test(m.name))
        .map(m => m.name.replace(/^models\//, "")).sort();
      const c = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`, { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: "Відповідай одним словом: так" }] }], generationConfig: { maxOutputTokens: 16, ...(/flash/i.test(model) ? { thinkingConfig: { thinkingBudget: 0 } } : {}) } }) });
      const cd = await c.json().catch(() => ({}));
      if (!c.ok) throw new Error(`модель «${model}»: ` + (cd.error?.message || `HTTP ${c.status}`));
    }
    fetched[p] = ids;
    tested[p] = true;
    msg.className = "key-msg ok";
    msg.textContent = `Ключ дійсний · модель ${model} відповіла за ${Math.round(performance.now() - t0)} мс`;
    renderModels(p);
  } catch (e){
    tested[p] = false;
    msg.className = "key-msg bad";
    msg.textContent = "Не вдалося: " + (e.message === "Failed to fetch" ? "немає з'єднання з провайдером" : e.message);
  } finally {
    btn.disabled = false; renderProvState(p); renderFeatures();
  }
}

// ─── Завантаження / збереження ─────────────────────────────────────────────
function fromDb(s){
  const x = structuredClone(DEF);
  if (!s) return x;
  x.groqKey = s.groqApiKey || (s.provider !== "gemini" ? s.apiKey : "") || "";
  x.geminiKey = s.geminiApiKey || "";
  x.groqModel = s.groqModel || s.model || DEF.groqModel;
  x.geminiModel = s.geminiModel || DEF.geminiModel;
  FEATURES.forEach(f => { x.flags[f.id] = s[f.flag] !== false; x.prov[f.id] = s.featProviders?.[f.id] === "gemini" ? "gemini" : "groq"; });
  return x;
}

async function save(){
  const anyOn = Object.values(cur.flags).some(Boolean);
  const gk = keyOf("groq"), mk = keyOf("gemini");
  if (anyOn && !gk && !mk){ toast("Додайте хоча б один API-ключ або вимкніть усі функції", "err"); return; }
  for (const p of ["groq", "gemini"]) if (!cur[p + "Model"].trim()){ toast(`Вкажіть модель ${PROVIDERS[p].name}`, "err"); return; }
  const btns = [document.getElementById("btn-save-ai"), document.getElementById("btn-save-bar")];
  btns.forEach(b => b.disabled = true);
  try {
    await dbUpd("settings/ai", {
      groqApiKey: gk, geminiApiKey: mk,
      groqModel: cur.groqModel.trim(), geminiModel: cur.geminiModel.trim(),
      // Сумісність зі старими читачами налаштувань
      apiKey: gk || mk, model: gk ? cur.groqModel.trim() : cur.geminiModel.trim(), provider: gk ? "groq" : "gemini",
      aiComments: cur.flags.comments, aiAnalysis: cur.flags.analysis, aiGeneration: cur.flags.generation, aiTextCheck: cur.flags.textcheck,
      featProviders: { ...cur.prov }, updatedAt: Date.now(),
    });
    cur.groqKey = gk; cur.geminiKey = mk;
    saved = structuredClone(cur);
    renderAll();
    toast("Налаштування AI збережено — діють одразу для всіх");
  } catch (e){
    toast("Помилка збереження: " + e.message, "err");
  } finally {
    renderDirty();
    document.getElementById("btn-save-bar").disabled = false;
  }
}
document.getElementById("btn-save-ai").addEventListener("click", save);
document.getElementById("btn-save-bar").addEventListener("click", save);
document.getElementById("btn-discard").addEventListener("click", () => { cur = structuredClone(saved); tested.groq = tested.gemini = null; renderAll(); });
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); if (!same(cur, saved)) save(); }
});
addEventListener("beforeunload", e => { if (!same(cur, saved)){ e.preventDefault(); e.returnValue = ""; } });

// Викладачі з індивідуальними налаштуваннями (перекривають глобальні)
function renderOverrides(users){
  const list = Object.values(users || {}).filter(u => u && u.aiSettings);
  const box = document.getElementById("ovr");
  box.hidden = !list.length;
  if (!list.length) return;
  const n = list.length, one = n % 10 === 1 && n % 100 !== 11;
  document.getElementById("ovr-t").innerHTML = `<b>${n}</b> ${one ? "викладач має" : "викладачів мають"} індивідуальні AI-налаштування — вони перекривають перемикачі функцій вище`;
  const names = list.map(u => [u.surname, u.name].filter(Boolean).join(" ") || u.email).filter(Boolean);
  document.getElementById("ovr-names").textContent = names.slice(0, 4).join(", ") + (names.length > 4 ? ` та ще ${names.length - 4}` : "");
}

try {
  const [s, users] = await Promise.all([dbGet("settings/ai"), dbGet("users").catch(() => null)]);
  saved = fromDb(s); cur = structuredClone(saved);
  renderAll();
  renderOverrides(users);
} catch (e) {
  console.error("[ai-settings] load failed:", e);
  renderAll();
  toast("Не вдалося завантажити налаштування: " + e.message, "err");
}
hideLoader();
</script>
