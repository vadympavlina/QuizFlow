/* ═══════════════════════════════════════════════════════════════════════
   СТОРІНКА «ТЕСТИ» — стилі під #sec-tests
   Не зачіпає меню, модалки й інші сторінки (скоупинг через #sec-tests ...)
   ═══════════════════════════════════════════════════════════════════════ */
#sec-tests{
  --ink-900:#0B1437; --ink-700:#24335A; --ink-500:#5B6A8F; --ink-400:#8691AC;
  --line:#E3E8F2; --line-strong:#CDD6E8;
  --nav-600:#1E3A8A; --nav-accent:#3B82F6; --nav-soft:#93C5FD;
  --good:#16A34A; --warn:#F59E0B; --bad:#DC2626;
  --t-bg:#F4F6FB; --t-bg-2:#ECF0F8;
  font-family:'Manrope',system-ui,sans-serif;
  color:var(--ink-900);
}
#sec-tests.on{ display:flex; flex-direction:column; gap:20px; }

/* Page title */
#sec-tests .t-page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0;flex-wrap:wrap}
#sec-tests .t-page-title h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0;color:var(--ink-900);font-family:'Manrope',sans-serif}
#sec-tests .t-page-title p{margin:4px 0 0;color:var(--ink-500);font-size:14px}
#sec-tests .t-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Topbar buttons (override styles.css defaults only within sec-tests) */
#sec-tests .t-btn{background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-family:'Manrope',sans-serif;font-weight:500;font-size:13px;color:var(--ink-700);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s;white-space:nowrap;height:36px;line-height:1}
#sec-tests .t-btn:hover{border-color:var(--line-strong);color:var(--ink-900)}
#sec-tests .t-btn.primary{background:var(--nav-600);border-color:var(--nav-600);color:#fff;box-shadow:0 6px 14px -8px rgba(30,58,138,.8)}
#sec-tests .t-btn.primary:hover{background:#1E40AF;border-color:#1E40AF;color:#fff}
#sec-tests .t-btn.ghost{background:transparent;border-color:transparent;color:var(--ink-500)}
#sec-tests .t-btn.ghost:hover{background:#EEF2FB;color:var(--ink-900)}
#sec-tests .t-btn svg{width:14px;height:14px;flex:0 0 auto}
#sec-tests .t-btn .t-mini-badge{background:var(--t-bg-2);color:var(--ink-500);padding:1px 7px;border-radius:10px;font-size:11px;margin-left:3px;font-family:'Geist Mono',monospace;font-weight:600}

/* Card (override global .card padding:20px) */
#sec-tests .t-card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0}
#sec-tests .t-card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}


/* Search input (inside card header) */
#sec-tests .t-search{position:relative}
#sec-tests .t-search .t-search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-400);pointer-events:none;display:flex;align-items:center}
#sec-tests .t-input,#sec-tests .t-select{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-family:'Manrope',sans-serif;font-size:13px;color:var(--ink-900);outline:none;height:34px}
#sec-tests .t-input:focus,#sec-tests .t-select:focus{border-color:var(--nav-accent)}

/* Tabs (status filter) */

/* View toggle (grid/list) */
#sec-tests .t-view{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:2px}
#sec-tests .t-view button{background:transparent;border:0;padding:6px 8px;border-radius:8px;color:var(--ink-500);cursor:pointer;display:grid;place-items:center;transition:all .12s}
#sec-tests .t-view button:hover:not(.on){color:var(--ink-700)}
#sec-tests .t-view button.on{background:var(--t-bg-2);color:var(--ink-900)}

/* Pills */

/* Section labels inside card */
#sec-tests .t-section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-400);padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:baseline;font-family:'Manrope',sans-serif}
#sec-tests .t-section-label .t-n{font-family:'Geist Mono',monospace;font-weight:500;color:var(--ink-400)}

/* Mono + muted */
#sec-tests .t-mono{font-family:'Geist Mono',monospace;font-variant-numeric:tabular-nums}
#sec-tests .t-muted{color:var(--ink-400)}


/* "New folder" empty tile */

/* Quiz card (inside folder) */
#sec-tests .t-quiz-card{
  background:#fff; border:1px solid var(--line); border-radius:16px;
  padding:16px; display:flex; flex-direction:column; gap:12px;
  transition:border-color .15s, transform .12s, box-shadow .15s;
  position:relative;
}
#sec-tests .t-quiz-card:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:0 10px 30px -18px rgba(30,58,138,.2)}
#sec-tests .t-qc-cover{
  height:100px; border-radius:10px; display:flex; align-items:flex-end; padding:10px;
  position:relative; overflow:hidden; cursor:pointer;
}
#sec-tests .t-qc-cover::before{content:"";position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.2)}
#sec-tests .t-qc-cover::after{content:"";position:absolute;bottom:-14px;left:30%;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.1)}
#sec-tests .t-qc-code{font-family:'Geist Mono',monospace;font-weight:700;font-size:22px;color:rgba(255,255,255,.92);letter-spacing:-.02em;position:relative;text-shadow:0 1px 2px rgba(0,0,0,.1)}
#sec-tests .t-qc-title{font-weight:700;font-size:15px;letter-spacing:-.005em;line-height:1.35;color:var(--ink-900);cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:41px}
#sec-tests .t-qc-meta{display:flex;gap:12px;font-size:12px;color:var(--ink-500);margin-top:4px;flex-wrap:wrap}
#sec-tests .t-qc-meta span{display:inline-flex;align-items:center;gap:4px}
#sec-tests .t-qc-meta svg{width:12px;height:12px}
#sec-tests .t-qc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
#sec-tests .t-qc-date{font-size:12px;color:var(--ink-400)}
#sec-tests .t-qc-foot-actions{display:flex;gap:6px}
#sec-tests .t-menu-btn{background:transparent;border:1px solid var(--line);color:var(--ink-500);cursor:pointer;padding:5px 7px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;transition:all .12s}
#sec-tests .t-menu-btn:hover{background:#F1F5FB;color:var(--ink-900);border-color:var(--line-strong)}
#sec-tests .t-edit-btn{display:inline-flex;align-items:center;gap:5px;padding:0 11px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:500;cursor:pointer;color:var(--ink-700);transition:all .12s}
#sec-tests .t-edit-btn:hover{border-color:var(--nav-accent);color:var(--nav-600)}
#sec-tests .t-edit-btn svg{width:12px;height:12px}

/* Popup menu for test card — контролюється через inline style.display з G._toggleTestMenu */
#sec-tests .t-tmenu{display:none;position:absolute;bottom:calc(100% + 4px);right:0;min-width:180px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(11,20,55,.12);z-index:150;overflow:hidden}
#sec-tests .t-tmenu-item{display:flex;align-items:center;gap:9px;padding:10px 14px;font-size:13px;cursor:pointer;color:var(--ink-700);transition:background .12s;font-family:'Manrope',sans-serif}
#sec-tests .t-tmenu-item:hover{background:#F1F5FB;color:var(--ink-900)}
#sec-tests .t-tmenu-item svg{width:13px;height:13px;flex:0 0 auto}
#sec-tests .t-tmenu-item.d{color:#B91C1C}
#sec-tests .t-tmenu-item.d:hover{background:#FEE2E2}
#sec-tests .t-tmenu-sep{height:1px;background:var(--line);margin:2px 0}

/* List view table */
#sec-tests .t-tile{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-family:'Geist Mono',monospace;font-weight:800;font-size:11px;color:rgba(255,255,255,.95);letter-spacing:-.02em;position:relative;overflow:hidden;flex:0 0 auto}
#sec-tests .t-tile::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(255,255,255,.25),transparent 60%)}

/* Empty states */
#sec-tests .t-empty{padding:56px 24px;text-align:center;color:var(--ink-500)}
#sec-tests .t-empty .t-empty-ico{width:56px;height:56px;margin:0 auto 14px;border-radius:14px;background:#EEF2FB;display:grid;place-items:center;color:var(--nav-600)}
#sec-tests .t-empty .t-empty-title{font-size:15px;font-weight:700;color:var(--ink-900);margin-bottom:4px;font-family:'Manrope',sans-serif}
#sec-tests .t-empty .t-empty-hint{font-size:13px;margin-bottom:18px}

/* ── Нове: тулбар, хлібні крихти, плаваюче меню, кнопки-картки ── */
#sec-tests .t-top{display:flex;flex-direction:column;gap:12px}
#sec-tests .t-dot{width:10px;height:10px;border-radius:3px;display:inline-block}
#sec-tests .t-btn.danger{color:#B91C1C}
#sec-tests .t-btn.danger:hover{background:#FEE2E2;color:#991B1B}
#sec-tests .t-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#sec-tests .t-toolbar .t-search{flex:1;min-width:240px;max-width:460px}
#sec-tests .t-toolbar .t-input{width:100%;padding-left:34px;padding-right:32px;height:38px;font-size:13.5px}
#sec-tests .t-search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--ink-400);cursor:pointer;font-size:16px;line-height:1}
#sec-tests .t-search-clear:hover{background:#EEF2FB;color:var(--ink-900)}
#sec-tests .t-toolbar [hidden]{display:none!important}
#sec-tests .t-toolbar .t-select{height:38px;cursor:pointer}
#sec-tests .t-toolbar .t-spacer{flex:1}
#sec-tests .t-quizzes-grid{padding:4px 18px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
#sec-tests .t-card + .t-card{margin-top:0}
#sec-tests .t-card.flat{background:none;border:0;border-radius:0;overflow:visible}
#sec-tests .t-card.flat .t-quizzes-grid{padding:0}
#tc{display:flex;flex-direction:column;gap:16px}
/* Кнопки, що виглядають як частина картки */
#sec-tests .t-qc-cover,#sec-tests .t-qc-title,#sec-tests .t-row-title{font:inherit;border:0;text-align:left;width:100%;cursor:pointer}
#sec-tests .t-qc-title{background:none;padding:0;font-weight:700;font-size:15px;color:var(--ink-900)}
#sec-tests .t-qc-title:hover,#sec-tests .t-row-title:hover{color:var(--nav-600)}
#sec-tests .t-row-title{background:none;padding:0;font-weight:600;font-size:14px;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px;display:block}
#sec-tests .t-row-sub{font-size:12px;color:var(--ink-400);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
#sec-tests .t-qc-folder{display:inline-flex;align-items:center;gap:5px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sec-tests .t-qc-folder::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--fc);flex:0 0 auto}
#sec-tests .t-menu-btn svg{width:15px;height:15px}
#sec-tests .t-menu-btn[aria-expanded="true"]{background:#EEF2FB;color:var(--ink-900)}
#sec-tests .t-qc-folder{font-weight:500}
#sec-tests .t-empty .t-empty-ico svg{width:26px;height:26px}
#sec-archive .t-card{background:#fff;border:1px solid #E3E8F2;border-radius:16px;overflow:hidden}
#sec-archive .t-btn{background:#fff;border:1px solid #E3E8F2;padding:0 12px;height:32px;border-radius:9px;font:500 12.5px 'Manrope',sans-serif;color:#24335A;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
#sec-archive .t-btn:hover{border-color:#CDD6E8}
#sec-archive .t-btn.danger{color:#B91C1C;border-color:transparent;background:transparent}
#sec-archive .t-btn.danger:hover{background:#FEE2E2}
#sec-archive .t-btn svg{width:13px;height:13px}
#sec-archive .t-dtable{width:100%;border-collapse:separate;border-spacing:0}
#sec-archive .t-dtable th,#sec-archive .t-dtable td{padding:12px 18px;text-align:left;font:13px 'Manrope',sans-serif;border-bottom:1px solid #E3E8F2}
#sec-archive .t-dtable th{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#8691AC;background:#FAFBFE}
#sec-archive .t-dtable tbody tr:last-child td{border-bottom:0}
#sec-archive .t-tile{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font:800 11px 'Geist Mono',monospace;color:#fff;flex:0 0 auto}
#sec-archive .t-row-title{font-weight:600;font-size:14px;color:#0B1437;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
#sec-archive .t-row-sub{font-size:12px;color:#8691AC;margin-top:2px}
#sec-archive .t-muted{color:#8691AC}
#sec-archive .t-mono{font-family:'Geist Mono',monospace}
#sec-archive .t-empty{padding:56px 24px;text-align:center;color:#5B6A8F}
#sec-archive .t-empty-ico{width:56px;height:56px;margin:0 auto 14px;border-radius:14px;background:#EEF2FB;display:grid;place-items:center;color:#1E3A8A}
#sec-archive .t-empty-ico svg{width:26px;height:26px}
#sec-archive .t-empty-title{font:700 15px 'Manrope',sans-serif;color:#0B1437;margin-bottom:4px}
/* Сортування (.cd-*) у тулбарі — висота як у решти контролів */
#sec-tests #cd-tsort .cd-btn{height:38px;border-radius:10px;border-width:1px;border-color:var(--line);font-family:'Manrope',sans-serif;font-weight:600;color:var(--ink-700)}
#sec-tests #cd-tsort .cd-btn:hover,#sec-tests #cd-tsort .cd-btn.active{border-color:var(--nav-accent);color:var(--nav-600)}
#sec-tests #cd-tsort .cd-menu{left:auto;right:0;min-width:210px;z-index:60}
#sec-tests #cd-tsort .cd-item{font-family:'Manrope',sans-serif}
/* Нещодавні — компактні «чіпи» зверху для швидкого вибору */

/* ── Компактний список тестів: один тест — один рядок ── */
#sec-tests .t-list{display:flex;flex-direction:column}
#sec-tests .t-lrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid #EEF1F7;transition:background .12s}
#sec-tests .t-lrow:last-child{border-bottom:0}
#sec-tests .t-lrow:hover{background:#FAFBFE}
#sec-tests .t-lrow .t-tile{width:40px;height:40px;border-radius:11px;font-size:11px}
#sec-tests .t-lm{min-width:0}
#sec-tests .t-lm .t-row-title{max-width:100%;font-size:14.5px;font-weight:700}
#sec-tests .t-lm .t-row-sub{display:flex;align-items:center;gap:7px;max-width:100%;font-size:12px}
#sec-tests .t-lr-dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
#sec-tests .t-la{display:flex;gap:6px;justify-content:flex-end}
#sec-tests .t-lb{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink-700);font:600 12.5px 'Manrope',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:border-color .15s,background .15s,color .15s}
#sec-tests .t-lb:hover{border-color:var(--nav-accent);color:var(--nav-600)}
#sec-tests .t-lb svg{width:13px;height:13px;flex:0 0 auto}
#sec-tests .t-lb.primary{background:var(--nav-600);border-color:var(--nav-600);color:#fff}
#sec-tests .t-lb.primary:hover{background:#1E40AF;border-color:#1E40AF;color:#fff}
#sec-tests .t-lb.icon,#sec-tests .t-lb.edit{width:32px;padding:0}
#sec-tests .t-lb.icon svg,#sec-tests .t-lb.edit svg{width:15px;height:15px}
#sec-tests .t-lb .t-lb-t{display:none}
#sec-tests .t-lb[aria-expanded="true"]{background:#EEF2FB}
/* Телефон: кнопки на всю ширину під рядком */
@media (max-width:560px){
  #sec-tests .t-lrow{grid-template-columns:40px minmax(0,1fr);padding:12px 14px;row-gap:8px}
  #sec-tests .t-la{grid-column:1 / -1}
  #sec-tests .t-lb{flex:1;height:40px}
  #sec-tests .t-lb.edit{width:auto}
  #sec-tests .t-lb.edit .t-lb-t{display:inline}
  #sec-tests .t-lb.icon{flex:0 0 44px}
}

/* ── Рейка папок (ліворуч) + тести (праворуч) ── */
#sec-tests .t-split{display:grid;grid-template-columns:236px minmax(0,1fr);gap:22px;align-items:start}
#sec-tests .t-split.no-rail{grid-template-columns:minmax(0,1fr)}
#sec-tests .t-right{min-width:0;display:flex;flex-direction:column;gap:16px}
#sec-tests .t-rail{position:sticky;top:88px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;max-height:calc(100vh - 190px);overflow-y:auto}
#sec-tests .t-rail[hidden]{display:none}
#sec-tests .t-rail-h{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 8px 10px;font:700 11px 'Manrope',sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-400)}
#sec-tests .t-rail-add{width:28px;height:28px;border:0;border-radius:50%;background:#EEF2FB;color:var(--nav-600);cursor:pointer;display:grid;place-items:center;padding:0;transition:background .15s,color .15s}
#sec-tests .t-rail-add:hover{background:var(--nav-600);color:#fff}
#sec-tests .t-rail-add svg{width:14px;height:14px}
#sec-tests .t-rail-list{display:flex;flex-direction:column;gap:2px}
#sec-tests .t-rr{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:12px;background:transparent;color:var(--ink-700);font:600 13.5px 'Manrope',sans-serif;cursor:pointer;text-align:left;transition:background .15s,color .15s}
#sec-tests .t-rr:hover{background:#F1F5FB;color:var(--ink-900)}
#sec-tests .t-rr.on{background:#E8EEFF;color:var(--nav-600);font-weight:700}
#sec-tests .t-rr-ico{width:18px;height:18px;display:grid;place-items:center;flex:0 0 auto;color:var(--ink-500)}
#sec-tests .t-rr.on .t-rr-ico{color:var(--nav-600)}
#sec-tests .t-rr-ico svg{width:17px;height:17px}
#sec-tests .t-rr-dot{width:12px;height:12px;border-radius:4px;flex:0 0 auto;margin:0 3px}
#sec-tests .t-rr-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sec-tests .t-rr-n{font:600 11.5px 'Geist Mono',monospace;color:var(--ink-400);flex:0 0 auto}
#sec-tests .t-rr.on .t-rr-n{color:var(--nav-600)}
#sec-tests .t-scope{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:34px}
#sec-tests .t-scope-t{display:flex;align-items:baseline;gap:10px;min-width:0}
#sec-tests .t-scope-t h2{margin:0;font:800 19px 'Manrope',sans-serif;letter-spacing:-.015em;color:var(--ink-900);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sec-tests .t-scope-t .t-n{font:500 12px 'Geist Mono',monospace;color:var(--ink-400);white-space:nowrap}
#sec-tests .t-scope-a{display:flex;gap:6px}
/* Комп'ютер: картка на всю висоту вікна. Сторінка не прокручується, а список папок і список тестів
   гортаються окремо; заголовок, пошук і фільтри лишаються на місці. */
@media (min-width:1100px){
  .main:has(#sec-tests.on){ height:calc(100vh - var(--qtb-h) - var(--card-gap)); min-height:0; overflow:hidden; display:flex; flex-direction:column; padding-bottom:24px }
  #sec-tests.on{ flex:1; min-height:0 }
  #sec-tests .t-split{ flex:1; min-height:0; align-items:stretch }
  #sec-tests .t-rail{ position:static; top:auto; max-height:none; height:100%; scrollbar-width:thin }
  #sec-tests .t-right{ min-height:0; height:100% }
  #sec-tests #tc{ flex:1; min-height:0 }
  #sec-tests #tc > .t-scope{ flex:0 0 auto }
  #sec-tests #tc > .t-card:has(.t-list), #sec-tests #tc > .t-card.flat{ flex:1; min-height:0; overflow-y:auto; scrollbar-width:thin }
}
/* Вужчі екрани: папки — рядок чіпів над списком */
@media (max-width:1100px){
  #sec-tests .t-split{grid-template-columns:minmax(0,1fr);gap:14px}
  #sec-tests .t-rail{position:static;max-height:none;overflow:visible;background:none;border:0;padding:0;margin:0 -2px}
  #sec-tests .t-rail-h{display:none}
  #sec-tests .t-rail-list{flex-direction:row;gap:8px;overflow-x:auto;padding:2px;scrollbar-width:none}
  #sec-tests .t-rail-list::-webkit-scrollbar{display:none}
  #sec-tests .t-rr{width:auto;flex:0 0 auto;min-height:40px;border-radius:999px;background:#fff;border:1px solid var(--line);padding:0 14px}
  #sec-tests .t-rr.on{background:var(--nav-600);border-color:var(--nav-600);color:#fff}
  #sec-tests .t-rr.on .t-rr-ico,#sec-tests .t-rr.on .t-rr-n{color:rgba(255,255,255,.85)}
  #sec-tests .t-rr-name{max-width:180px;flex:0 1 auto}
  /* Назву вибраної папки видно в чіпі — у заголовку лишаємо лише дії */
  #sec-tests .t-scope-t{display:none}
  #sec-tests .t-scope:not(:has(.t-scope-a)){display:none}
  #sec-tests .t-scope-a{margin-left:auto}
}

/* Плаваюче меню дій (одне на сторінку, живе в body) */
.t-float-menu{position:fixed;z-index:300;min-width:236px;max-width:300px;background:#fff;border:1px solid #E3E8F2;border-radius:14px;box-shadow:0 16px 40px -12px rgba(11,20,55,.28);padding:6px;font-family:'Manrope',sans-serif;animation:tfmIn .12s ease-out}
@keyframes tfmIn{from{opacity:0;transform:translateY(-4px)}}
.t-fm-head{padding:8px 10px 6px;font-size:11.5px;font-weight:700;color:#8691AC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-fm-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:9px;font:500 13.5px 'Manrope',sans-serif;color:#24335A;cursor:pointer;text-align:left}
.t-fm-item svg{width:15px;height:15px;flex:0 0 auto;color:#5B6A8F}
.t-fm-item:hover,.t-fm-item:focus-visible{background:#F1F5FB;color:#0B1437;outline:none}
.t-fm-item.d,.t-fm-item.d svg{color:#B91C1C}
.t-fm-item.d:hover,.t-fm-item.d:focus-visible{background:#FEE2E2}
.t-fm-sep{height:1px;background:#E3E8F2;margin:5px 4px}

/* Responsive */
.t-hl{outline:2px solid #3B82F6;outline-offset:3px;border-radius:14px;transition:outline-color .6s}
@media (max-width:560px){
  #sec-tests .t-quizzes-grid{padding:4px 12px 12px;grid-template-columns:1fr}
}
/* ── Телефон: читабельність і зручні для пальця цілі (аудит WCAG 2.1 AA) ── */
@media (max-width:1023px){
}
</style>
</head>
<body>


<!-- Initial loader -->
<div id="app-loader" style="position:fixed;inset:0;background:#f0f3fa;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .25s ease">
  <div style="width:44px;height:44px;border:3.5px solid rgba(45,91,227,.15);border-top-color:#2d5be3;border-radius:50%;animation:appSpin .8s linear infinite"></div>
  <div style="font-size:13px;color:#6b7280;margin-top:12px;font-family:'Manrope',sans-serif">Завантаження...</div>
</div>
<style>@keyframes appSpin{to{transform:rotate(360deg)}}</style>

<script src="shared/nav.js?v=23"></script>
<main class="main">

  <!-- TESTS (новий дизайн) -->
  <div class="sec on" id="sec-tests">

    <!-- Заголовок сторінки + CTA -->
    <div class="t-page-title">
      <div>
        <h1>Тести</h1>
        <p id="t-subtitle">Ваші тести</p>
      </div>
      <div class="t-actions">
        <button class="t-btn ghost" data-qtb="ghost" onclick="showSec('archive')" title="Архівовані тести">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="5" rx="2"/><path d="M4 9v9a2 2 0 002 2h12a2 2 0 002-2V9"/><line x1="10" y1="13" x2="14" y2="13"/></svg>
          Архів <span class="t-mini-badge" id="nb-archive">0</span>
        </button>
        <button class="t-btn" data-act="new-folder" data-qtb>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/><path d="M12 11v6M9 14h6"/></svg>
          Нова папка
        </button>
        <button class="t-btn primary" data-act="add-test" data-id="" id="t-new-test" data-qtb="primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Новий тест
        </button>
      </div>
    </div>

    <!-- Ліворуч — папки (рейка), праворуч — тулбар і тести. Тулбар статичний:
         поле пошуку не перестворюється під час введення і не втрачає фокус. -->
    <div class="t-split no-rail" id="t-split">
    <aside class="t-rail" id="t-rail" aria-label="Папки" hidden></aside>
    <div class="t-right">
    <div class="t-top">
      <div class="t-toolbar" id="t-toolbar">
        <div class="t-search">
          <span class="t-search-ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
          <input class="t-input" id="srch" type="search" placeholder="Пошук тестів…" autocomplete="off" aria-label="Пошук тестів">
          <button class="t-search-clear" id="srch-clear" type="button" aria-label="Очистити пошук" hidden>×</button>
        </div>
        <span class="t-spacer"></span>
        <!-- Сортування: кастомний дропдаун, як на інших сторінках (.cd-*) -->
        <div class="cd-wrap" id="cd-tsort" data-tests-only hidden>
          <button class="cd-btn" type="button" onclick="G.toggleDrop('cd-tsort');this.setAttribute('aria-expanded',this.classList.contains('active'))" aria-haspopup="listbox" aria-expanded="false">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
            <span class="cd-label" id="cd-tsort-label">Спершу нові</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="cd-menu" id="cd-tsort-menu" role="listbox" aria-label="Сортування">
            <div class="cd-item" role="option" data-sort="new">Спершу нові</div>
            <div class="cd-item" role="option" data-sort="act">За активністю</div>
            <div class="cd-item" role="option" data-sort="name">За назвою (А–Я)</div>
            <div class="cd-item" role="option" data-sort="old">Спершу старі</div>
          </div>
        </div>
        <div class="t-view" role="group" aria-label="Вигляд" data-tests-only hidden>
          <button data-view="grid" title="Сітка" aria-label="Сітка"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
          <button data-view="list" title="Список" aria-label="Список"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        </div>
      </div>
    </div>

    <!-- Сюди renderTests() рендерить тести вибраної папки -->
    <div id="tc"></div>
    </div>
    </div>

  </div>

  <!-- ARCHIVE (залишаю оригінальну структуру — окрема задача на redesign) -->
  <div class="sec" id="sec-archive">
    <div class="ph">
      <div>
        <div style="display:flex;align-items:center;gap:10px">
          <button onclick="showSec('tests')" style="display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:10px;border:1.5px solid var(--border);background:white;font-size:13px;cursor:pointer;color:var(--muted)"
            onmouseover="this.style.borderColor='var(--primary)';this.style.color='var(--primary)'"
            onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>Тести
          </button>
          <div class="pt">Архів тестів</div>
        </div>
        <div class="ps">Завершені та неактивні тести</div>
      </div>
    </div>
    <div id="archive-body">
      <div class="empty" style="padding:60px 20px"><div class="ei"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5" rx="1"/><line x1="10" y1="12" x2="14" y2="12"/></svg></div><div class="et">Архів порожній</div></div>
    </div>
  </div>

</main>

<div id="modals-root"></div>

<script type="module">
// ─── Ініціалізація (паралельне завантаження — як в оригіналі) ───
const { initApp } = await import("./shared/app.js?v=32");
const featuresP = import("./shared/features.js?v=45");

window.showSec = function(name){
  if (name === "tests"){
    document.querySelectorAll(".sec").forEach(s => s.classList.remove("on"));
    document.getElementById("sec-tests")?.classList.add("on");
    return;
  }
  if (name === "archive"){
    document.querySelectorAll(".sec").forEach(s => s.classList.remove("on"));
    document.getElementById("sec-archive")?.classList.add("on");
    if (window.G?.renderArchive) try { window.G.renderArchive(); } catch(e){}
    return;
  }
  const sec = document.getElementById("sec-" + name);
  if (sec){
    document.querySelectorAll(".sec").forEach(s => s.classList.remove("on"));
    sec.classList.add("on");
    return;
  }
  const pageMap = {
    dashboard:"./", tests:"tests", attempts:"attempts",
    links:"links", analytics:"analytics", gradebook:"gradebook",
    students:"students", notifications:"notifications",
    suspicious:"suspicious", online:"online", news:"news"
  };
  if (pageMap[name]) location.href = pageMap[name];
};

await initApp("tests");
await featuresP;
await window.initFeatures();

if (window.renderAll) window.renderAll();
// tests?new=1 — одразу форма нового тесту (напр. з кроку «Створіть перший тест» у знайомстві)
if (new URLSearchParams(location.search).get("new") === "1" && window.G?.openTestInFolder){
  history.replaceState(null, "", location.pathname);
  setTimeout(() => window.G.openTestInFolder(null), 300);
}

// tests?hl=ID — підсвітити тест (напр. надісланий колегою, зі сповіщень)
const _hl = new URLSearchParams(location.search).get("hl");
if (_hl) {
  history.replaceState(null, "", location.pathname);
  setTimeout(() => {
    const t = (window.tests || []).find(x => x.id === _hl);
    if (!t) { window.toast?.("Тест не знайдено — можливо, його вже видалено", "err"); return; }
    window.G?.setFF?.(t.folderId || "none");
    requestAnimationFrame(() => {
      const el = document.querySelector(`.t-quiz-card[data-id="${CSS.escape(_hl)}"], .t-lrow[data-id="${CSS.escape(_hl)}"]`);
      if (!el) return;
      el.scrollIntoView({ block: "center", behavior: "smooth" });
      el.classList.add("t-hl");
      setTimeout(() => el.classList.remove("t-hl"), 2600);
    });
  }, 300);
}

requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    if (window.appReady) window.appReady();
  });
});

</script>
</body>
</html>
